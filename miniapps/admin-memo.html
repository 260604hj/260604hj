<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#15171c;
        --muted:#8a8f98;
        --line:#e4e6e9;
        --paper:#ffffff;
    }
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    [hidden]{ display:none !important; }

    body{
        font-family:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        color:var(--ink);
        background:var(--paper);
        -webkit-font-smoothing:antialiased;
        padding:48px 24px;
    }

    .wrap{ width:100%; max-width:520px; margin:0 auto; }

    .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
    .top a, .top button{ color:var(--muted); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; }
    .top a:hover, .top button:hover{ color:var(--ink); }
    .who{ display:flex; gap:10px; align-items:center; }

    h1{
        margin-top:14px;
        font-weight:300;
        font-size:34px;
        letter-spacing:-0.02em;
    }

    form{ margin-top:28px; }
    input, textarea{
        display:block; width:100%;
        border:1px solid var(--line); border-radius:0;
        padding:12px 16px;
        font:inherit; font-size:16px; line-height:1.6; color:inherit;
        outline:none;
    }
    input + input{ border-top:0; }
    textarea{ padding:14px 16px; resize:vertical; }
    input:focus, textarea:focus{ border-color:var(--ink); }
    input + input:focus{ border-top:1px solid var(--ink); margin-top:-1px; }
    .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    button[type=submit], .ghost{
        border:1px solid var(--ink); background:var(--ink); color:#fff;
        padding:10px 22px; font:inherit; font-size:14px; cursor:pointer;
    }
    .ghost{ background:var(--paper); color:var(--ink); }
    button[type=submit]:disabled, .ghost:disabled{ opacity:.4; cursor:default; }

    #summary{ margin-top:24px; border:1px solid var(--line); padding:14px 16px; }
    #summaryText{ font-size:15px; line-height:1.7; white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }

    #status{ margin-top:14px; font-size:13px; color:#b3261e; }
    #status:empty{ display:none; }

    #list{ list-style:none; margin-top:28px; border-top:1px solid var(--line); }
    #list li{ padding:16px 0; border-bottom:1px solid var(--line); }
    .text{ font-size:15px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
    .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; min-height:22px; }
    .time{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .del{
        border:0; background:none; color:var(--muted);
        font-size:18px; line-height:1; padding:2px 6px; cursor:pointer;
    }
    .del:hover{ color:var(--ink); }
    .acts{ display:flex; align-items:center; gap:6px; }
    .pub{
        border:1px solid var(--line); background:none; color:var(--muted);
        font:inherit; font-size:12px; padding:3px 9px; cursor:pointer;
    }
    .pub.on{ border-color:var(--ink); color:var(--ink); }
</style>
</head>
<body>
<main class="wrap">
    <div class="top">
        <a href="../admin.html" id="back">←</a>
        <span class="who" id="who" hidden>
            <span id="email"></span>
            <span id="noRole" hidden>읽기 전용</span>
            <button type="button" id="logout">로그아웃</button>
        </span>
    </div>

    <h1>Text</h1>

    <div id="summary" hidden>
        <p id="summaryText"></p>
        <p class="time" id="summaryMeta" style="margin-top:8px"></p>
    </div>

    <form id="form" hidden>
        <textarea id="input" rows="3" maxlength="2000" placeholder="메모"></textarea>
        <div class="row">
            <button type="button" class="ghost" id="summarize">요약</button>
            <button type="submit" id="save">저장</button>
        </div>
    </form>

    <p id="status"></p>
    <ul id="list"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
    // Supabase 대시보드 > Connect 에서 복사
    // KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
    const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

    // Admin: 로그인한 사람 (admin.html 에서 로그인). Visitor(?mode=visitor): 로그인 없이 공개된 글만 보기
    const MODE = new URLSearchParams(location.search).get('mode') === 'visitor' ? 'visitor' : 'admin';

    const $ = id => document.getElementById(id);
    const form = $('form'), input = $('input'), saveBtn = $('save'), back = $('back');
    const who = $('who'), emailEl = $('email'), noRole = $('noRole'), logout = $('logout');
    const statusEl = $('status'), list = $('list');
    const summarizeBtn = $('summarize'), summaryBox = $('summary'), summaryText = $('summaryText'), summaryMeta = $('summaryMeta');

    let db = null;
    let currentUser = null;
    let isAdmin = false;

    // 읽기: Admin 은 모든 글, Visitor 는 공개된 글만 (서버 규칙도 같게 막음)
    async function load() {
        let query = db.from('admin_memos');
        query = MODE === 'visitor'
            ? query.select('id, content, created_at').eq('is_public', true)
            : query.select('id, content, created_at, is_public');
        const { data, error } = await query.order('created_at', { ascending: false });
        if (error) return fail(error);
        render(data);
    }

    // 공개/비공개 바꾸기: 서버 규칙상 관리자만
    async function setPublic(id, value) {
        const { error } = await db.from('admin_memos').update({ is_public: value }).eq('id', id);
        if (error) return fail(error);
        statusEl.textContent = '';
        load();
    }

    // 쓰기: 서버가 로그인 정보를 보고 관리자 명단에 있을 때만 허용
    async function add(content) {
        saveBtn.disabled = true;
        const { error } = await db.from('admin_memos').insert({ content });
        saveBtn.disabled = false;
        if (error) return fail(error);
        statusEl.textContent = '';
        input.value = '';
        load();
    }

    // 지우기: 쓰기와 같은 규칙
    async function remove(id) {
        if (!confirm('삭제할까요?')) return;
        const { error } = await db.from('admin_memos').delete().eq('id', id);
        if (error) return fail(error);
        statusEl.textContent = '';
        load();
    }

    // 가장 최근 요약 읽기: 누구나 가능
    async function loadSummary() {
        const { data, error } = await db
            .from('memo_summaries')
            .select('content, model, created_at')
            .order('created_at', { ascending: false })
            .limit(1);
        if (error) return console.error(error);
        showSummary(data[0]);
    }

    function showSummary(row) {
        summaryBox.hidden = !row;
        if (!row) return;
        summaryText.textContent = row.content;
        summaryMeta.textContent = `요약 ${formatTime(row.created_at)}` + (row.model ? ` · ${row.model}` : '');
    }

    // 요약 만들기: Supabase 서버 함수(summarize)에 부탁 → 함수가 관리자인지 확인하고
    // Gemini 에게 요약을 받아 memo_summaries 에 저장한 뒤 돌려줌
    // Gemini API 키는 서버 함수 안에만 있어서 이 페이지에는 없음
    async function summarize() {
        summarizeBtn.disabled = true;
        summarizeBtn.textContent = '요약 중';
        const { data, error } = await db.functions.invoke('summarize');
        summarizeBtn.disabled = false;
        summarizeBtn.textContent = '요약';
        if (error) {
            let message = error.message;
            try {
                const body = await error.context.json();
                if (body.error) message = body.error;
            } catch (_) {}
            return fail({ message });
        }
        statusEl.textContent = '';
        showSummary(data);
    }

    // Admin 모드: 로그인 안 했으면 Admin 입구로. 했으면 관리자 명단에 내가 있는지 확인
    // 화면을 숨기는 건 겉모습일 뿐, 실제로 막는 건 서버 규칙
    async function applyUser(user) {
        if (!user) return location.replace('../admin.html');
        currentUser = user;
        const { data, error } = await db.from('admins').select('user_id').eq('user_id', user.id);
        if (error) fail(error);
        isAdmin = !error && data.length > 0;

        who.hidden = false;
        emailEl.textContent = user.email;
        noRole.hidden = isAdmin;
        form.hidden = !isAdmin;
        load();
        loadSummary();
    }

    function render(rows) {
        list.replaceChildren(...rows.map(row => {
            const li = document.createElement('li');

            const text = document.createElement('p');
            text.className = 'text';
            text.textContent = row.content;

            const meta = document.createElement('div');
            meta.className = 'meta';

            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = formatTime(row.created_at);
            meta.append(time);

            if (MODE === 'admin' && isAdmin) {
                const acts = document.createElement('span');
                acts.className = 'acts';

                const pub = document.createElement('button');
                pub.type = 'button';
                pub.className = 'pub' + (row.is_public ? ' on' : '');
                pub.textContent = row.is_public ? '공개' : '비공개';
                pub.setAttribute('aria-pressed', row.is_public);
                pub.onclick = () => setPublic(row.id, !row.is_public);

                const del = document.createElement('button');
                del.className = 'del';
                del.type = 'button';
                del.textContent = '×';
                del.setAttribute('aria-label', '삭제');
                del.onclick = () => remove(row.id);

                acts.append(pub, del);
                meta.append(acts);
            }

            li.append(text, meta);
            return li;
        }));
    }

    function formatTime(iso) {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function fail(error) {
        console.error(error);
        statusEl.textContent = error.message || String(error);
    }

    function start() {
        // Visitor: 로그인 없이 공개된 글만 읽기
        if (MODE === 'visitor') {
            back.href = '../visitor.html';
            db.channel('admin_memos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'admin_memos' }, load)
                .subscribe();
            load();
            return;
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const content = input.value.trim();
            if (content) add(content);
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) form.requestSubmit();
        });

        logout.onclick = () => db.auth.signOut();
        summarizeBtn.onclick = summarize;

        // 페이지를 열 때(INITIAL_SESSION), 로그인·로그아웃 할 때 호출됨
        // setTimeout: 이 콜백 안에서 바로 다른 Supabase 요청을 기다리면 멈출 수 있어서 한 박자 뒤에 실행
        db.auth.onAuthStateChange((event, session) => {
            if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) {
                setTimeout(() => applyUser(session ? session.user : null), 0);
            }
        });

        db.channel('admin_memos')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'admin_memos' }, () => currentUser && load())
            .subscribe();

        // 누가 새 요약을 만들면 열려 있는 모든 화면의 맨 위 요약이 바뀜
        db.channel('memo_summaries')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'memo_summaries' }, () => currentUser && loadSummary())
            .subscribe();
    }

    if (SUPABASE_URL && SUPABASE_KEY) {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        start();
    } else {
        statusEl.textContent = 'SUPABASE_URL, SUPABASE_KEY 미설정';
    }
</script>
</body>
</html>
