<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아스키 만화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#15171c;
        --muted:#8a8f98;
        --line:#e4e6e9;
        --paper:#ffffff;
        --mono:ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    }
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    [hidden]{ display:none !important; }

    body{
        font-family:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        color:var(--ink);
        background:var(--paper);
        -webkit-font-smoothing:antialiased;
        padding:48px 24px;
    }

    .wrap{ width:100%; max-width:520px; margin:0 auto; }

    .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
    .top a, .top button{ color:var(--muted); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; }
    .top a:hover, .top button:hover{ color:var(--ink); }
    .who{ display:flex; gap:10px; align-items:center; }

    h1{
        margin-top:14px;
        font-weight:300;
        font-size:34px;
        letter-spacing:-0.02em;
    }

    form{ margin-top:28px; }
    input, textarea{
        display:block; width:100%;
        border:1px solid var(--line); border-radius:0;
        padding:12px 16px;
        font:inherit; font-size:16px; line-height:1.6; color:inherit;
        outline:none;
    }
    input + input{ border-top:0; }
    textarea{ padding:14px 16px; resize:vertical; }
    input:focus, textarea:focus{ border-color:var(--ink); }
    input + input:focus{ border-top:1px solid var(--ink); margin-top:-1px; }

    .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    .pri, .ghost{
        border:1px solid var(--ink); background:var(--ink); color:#fff;
        padding:10px 22px; font:inherit; font-size:14px; cursor:pointer;
    }
    .ghost{ background:var(--paper); color:var(--ink); }
    .pri:disabled, .ghost:disabled{ opacity:.4; cursor:default; }

    #status{ margin-top:14px; font-size:13px; color:#b3261e; }
    #status:empty{ display:none; }

    #viewer{ margin-top:32px; }
    #comicTitle{ font-size:18px; font-weight:500; letter-spacing:-0.01em; }
    /* 슬라이드 = 내려받는 이미지 그대로 (1080 x 1080 정사각형) */
    #slide{
        display:block; width:100%; aspect-ratio:1 / 1; margin-top:12px;
        border:1px solid var(--line); touch-action:pan-y; user-select:none;
    }
    .controls{ display:flex; align-items:center; gap:8px; margin-top:12px; }
    .controls .ghost{ padding:10px 14px; }
    .nav{
        border:1px solid var(--line); background:var(--paper); color:var(--ink);
        width:40px; height:40px; font-size:20px; line-height:1; cursor:pointer;
    }
    .nav:disabled{ opacity:.3; cursor:default; }
    #counter{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; text-align:center; }
    .controls .spacer{ flex:1; }
    #model{ margin-top:10px; font-size:12px; color:var(--muted); }

    #history{ margin-top:40px; }
    #history h2{ font-size:13px; font-weight:500; color:var(--muted); }
    #comicList{ list-style:none; margin-top:10px; border-top:1px solid var(--line); }
    #comicList li{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
    .open{
        flex:1; min-width:0; text-align:left; background:none; border:0;
        padding:12px 0; font:inherit; color:inherit; cursor:pointer;
    }
    .open .t{ display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .open.on .t{ font-weight:500; }
    .open .m{ display:block; margin-top:2px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .del{
        border:0; background:none; color:var(--muted);
        font-size:18px; line-height:1; padding:2px 6px; cursor:pointer;
    }
    .del:hover{ color:var(--ink); }
</style>
</head>
<body>
<main class="wrap">
    <div class="top">
        <a href="../index.html">←</a>
        <span class="who" id="who" hidden>
            <span id="email"></span>
            <button type="button" id="logout">로그아웃</button>
        </span>
    </div>

    <h1>아스키 만화</h1>

    <form id="loginForm" hidden>
        <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" required>
        <div class="row"><button type="submit" class="pri" id="loginBtn">로그인</button></div>
    </form>

    <form id="form" hidden>
        <textarea id="plot" rows="2" maxlength="300" placeholder="줄거리 한두 문장"></textarea>
        <div class="row"><button type="submit" class="pri" id="make">만들기</button></div>
    </form>

    <p id="status"></p>

    <section id="viewer" hidden>
        <h2 id="comicTitle"></h2>
        <canvas id="slide" width="1080" height="1080" role="img"></canvas>
        <div class="controls">
            <button type="button" class="nav" id="prev" aria-label="이전">‹</button>
            <span id="counter"></span>
            <button type="button" class="nav" id="next" aria-label="다음">›</button>
            <span class="spacer"></span>
            <button type="button" class="ghost" id="download" disabled>내려받기</button>
            <button type="button" class="ghost" id="play">재생</button>
        </div>
        <p id="model"></p>
    </section>

    <section id="history" hidden>
        <h2>지난 만화</h2>
        <ul id="comicList"></ul>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
    // Supabase 대시보드 > Connect 에서 복사
    // KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
    const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

    const SLIDE_MS = 3000;

    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm'), loginEmail = $('loginEmail'), loginPassword = $('loginPassword'), loginBtn = $('loginBtn');
    const who = $('who'), emailEl = $('email'), logout = $('logout');
    const form = $('form'), plotInput = $('plot'), makeBtn = $('make'), statusEl = $('status');
    const viewer = $('viewer'), comicTitle = $('comicTitle'), slide = $('slide'), downloadBtn = $('download');
    const sctx = slide.getContext('2d');
    const prevBtn = $('prev'), nextBtn = $('next'), counter = $('counter'), playBtn = $('play'), modelEl = $('model');
    const historyEl = $('history'), comicList = $('comicList');

    let db = null;
    let currentUser = null;
    let comic = null;       // { title, panels: [{ art, caption, caption_en }], model }
    let layout = null;      // 이 만화의 그림 칸 크기와 글자 크기 (8컷 모두 같게)
    let images = null;      // 내려받기용 PNG 8장 (미리 만들어 둠)
    let openId = null;      // 지금 보고 있는 저장된 만화
    let index = 0;
    let timer = null;

    // ── 만들기: Supabase 서버 함수(ascii-comic)에 부탁 → 함수가 로그인 확인 후 Gemini 에게 8컷을 받아 돌려줌 ──
    // Gemini API 키는 서버 함수 안에만 있어서 이 페이지에는 없음
    async function make(plot) {
        stop();
        makeBtn.disabled = true;
        makeBtn.textContent = '만드는 중';
        const { data, error } = await db.functions.invoke('ascii-comic', { body: { plot } });
        makeBtn.disabled = false;
        makeBtn.textContent = '만들기';
        if (error) {
            let message = error.message;
            try {
                const body = await error.context.json();
                if (body.error) message = body.error;
            } catch (_) {}
            return fail({ message });
        }
        statusEl.textContent = '';
        comic = data;
        openId = null;
        openComic();
        viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        saveComic(plot, data);
    }

    // ── 저장: 그림은 글자 그대로(텍스트) 저장. 작성자는 서버가 로그인 정보로 채움 ──
    async function saveComic(plot, data) {
        const { data: row, error } = await db
            .from('comics')
            .insert({ plot, title: data.title, panels: data.panels, model: data.model })
            .select('id')
            .single();
        if (error) return fail({ message: `저장하지 못했습니다: ${error.message}` });
        openId = row.id;
        loadList();
    }

    // 목록: 제목, 작성자, 시각만 (그림은 누를 때 가져옴)
    async function loadList() {
        const { data, error } = await db
            .from('comics')
            .select('id, title, user_id, author_email, created_at')
            .order('created_at', { ascending: false })
            .limit(30);
        if (error) return fail(error);
        renderList(data);
    }

    async function openSaved(id) {
        const { data, error } = await db.from('comics').select('title, panels, model').eq('id', id).single();
        if (error) return fail(error);
        statusEl.textContent = '';
        comic = data;
        openId = id;
        openComic();
        loadList();
        viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 지우기: 서버 규칙상 내 만화만 지워짐
    async function removeComic(id) {
        if (!confirm('삭제할까요?')) return;
        const { error } = await db.from('comics').delete().eq('id', id);
        if (error) return fail(error);
        if (openId === id) {
            stop();
            comic = null;
            openId = null;
            viewer.hidden = true;
        }
        loadList();
    }

    function renderList(rows) {
        historyEl.hidden = rows.length === 0;
        comicList.replaceChildren(...rows.map(row => {
            const li = document.createElement('li');

            const open = document.createElement('button');
            open.type = 'button';
            open.className = 'open' + (row.id === openId ? ' on' : '');
            const title = document.createElement('span');
            title.className = 't';
            title.textContent = row.title || '제목 없음';
            const meta = document.createElement('span');
            meta.className = 'm';
            const name = (row.author_email || '').split('@')[0];
            meta.textContent = (name ? name + ' · ' : '') + formatTime(row.created_at);
            open.append(title, meta);
            open.onclick = () => openSaved(row.id);
            li.append(open);

            if (currentUser && row.user_id === currentUser.id) {
                const del = document.createElement('button');
                del.className = 'del';
                del.type = 'button';
                del.textContent = '×';
                del.setAttribute('aria-label', '삭제');
                del.onclick = () => removeComic(row.id);
                li.append(del);
            }
            return li;
        }));
    }

    function formatTime(iso) {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    async function openComic() {
        stop();
        images = null;
        downloadBtn.disabled = true;
        comicTitle.textContent = comic.title;
        modelEl.textContent = comic.model || '';
        viewer.hidden = false;
        await loadFonts(comic.panels);
        layout = makeLayout(comic.panels);
        show(0);
        prepareImages();
    }

    // ── 정사각형 이미지 그리기 (화면의 슬라이드 = 내려받는 이미지) ──
    const SIZE = 1080, MARGIN = 72, INK = '#15171c', MUTED = '#8a8f98';
    const ART_FONT = '"Roboto Mono", monospace', KO_FONT = '"Noto Sans KR", sans-serif', EN_FONT = 'Inter, sans-serif';
    const KO_SIZE = 46, EN_SIZE = 34, KO_LH = 1.45, EN_LH = 1.4, CAPTION_GAP = 14;

    // 캔버스는 웹 글꼴이 준비되기 전에 그리면 기본 글꼴로 그려져서, 필요한 글자를 먼저 불러옴
    async function loadFonts(panels) {
        await Promise.all([
            document.fonts.load(`400 ${KO_SIZE}px "Noto Sans KR"`, panels.map(p => p.caption).join('') || '가'),
            document.fonts.load(`400 ${EN_SIZE}px Inter`, panels.map(p => p.caption_en || '').join('') + '0123456789/'),
            document.fonts.load('400 40px "Roboto Mono"', panels.map(p => p.art).join('') || '0'),
        ]).catch(() => {});
    }

    // 띄어쓰기 단위로 줄바꿈, 한 덩어리가 너무 길면 글자 단위로
    function wrapText(ctx, text, maxWidth) {
        const lines = [];
        let line = '';
        for (const word of text.split(/\s+/).filter(Boolean)) {
            const test = line ? line + ' ' + word : word;
            if (!line || ctx.measureText(test).width <= maxWidth) line = test;
            else { lines.push(line); line = word; }
        }
        if (line) lines.push(line);
        return lines.flatMap(l => {
            if (ctx.measureText(l).width <= maxWidth) return [l];
            const parts = [];
            let part = '';
            for (const ch of l) {
                if (part && ctx.measureText(part + ch).width > maxWidth) { parts.push(part); part = ''; }
                part += ch;
            }
            return part ? [...parts, part] : parts;
        });
    }

    function captionLines(ctx, panel) {
        const width = SIZE - MARGIN * 2;
        ctx.font = `400 ${KO_SIZE}px ${KO_FONT}`;
        const ko = wrapText(ctx, panel.caption || '', width);
        ctx.font = `400 ${EN_SIZE}px ${EN_FONT}`;
        const en = panel.caption_en ? wrapText(ctx, panel.caption_en, width) : [];
        const height = ko.length * KO_SIZE * KO_LH + (en.length ? CAPTION_GAP + en.length * EN_SIZE * EN_LH : 0);
        return { ko, en, height };
    }

    // 8컷 모두 같은 크기로: 대사가 가장 긴 컷에 맞춰 그림 칸을 정하고, 36자 x 14줄이 들어가는 글자 크기로
    function makeLayout(panels) {
        const captionH = Math.max(...panels.map(p => captionLines(sctx, p).height));
        const captionTop = SIZE - MARGIN - captionH;
        const box = { x: MARGIN, y: MARGIN + 40, w: SIZE - MARGIN * 2, h: captionTop - 48 - (MARGIN + 40) };
        sctx.font = `400 100px ${ART_FONT}`;
        const charW = sctx.measureText('0').width / 100;
        const fontSize = Math.min(box.w / (36 * charW), box.h / (14 * 1.15));
        return { box, captionTop, fontSize, charW };
    }

    function drawSlide(ctx, panel, i, total) {
        const { box, captionTop, fontSize, charW } = layout;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        // 쪽수
        ctx.fillStyle = MUTED;
        ctx.font = `400 28px ${EN_FONT}`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText(`${i + 1}/${total}`, SIZE - MARGIN, MARGIN - 20);

        // 그림: 한 덩어리로 그림 칸 가운데에
        const lines = dedent(panel.art).split('\n');
        const lineH = fontSize * 1.15;
        const cols = Math.max(0, ...lines.map(l => l.length));
        const x0 = box.x + (box.w - cols * charW * fontSize) / 2;
        const y0 = box.y + (box.h - lines.length * lineH) / 2;
        ctx.fillStyle = INK;
        ctx.textAlign = 'left';
        ctx.font = `400 ${fontSize}px ${ART_FONT}`;
        lines.forEach((l, r) => ctx.fillText(l, x0, y0 + r * lineH));

        // 대사: 한국어, 그 아래 영어 자막. 대사 칸 안에서 세로 가운데
        const { ko, en, height } = captionLines(ctx, panel);
        ctx.textAlign = 'center';
        let y = captionTop + (SIZE - MARGIN - captionTop - height) / 2;
        ctx.fillStyle = INK;
        ctx.font = `400 ${KO_SIZE}px ${KO_FONT}`;
        for (const l of ko) { ctx.fillText(l, SIZE / 2, y); y += KO_SIZE * KO_LH; }
        if (en.length) {
            y += CAPTION_GAP;
            ctx.fillStyle = MUTED;
            ctx.font = `400 ${EN_SIZE}px ${EN_FONT}`;
            for (const l of en) { ctx.fillText(l, SIZE / 2, y); y += EN_SIZE * EN_LH; }
        }
    }

    // ── 내려받기 ──
    function fileBase() {
        return (comic.title || '').replace(/[\\/:*?"<>|]/g, '').trim() || 'ascii-comic';
    }

    // 폰에서 공유 창을 바로 띄울 수 있게 PNG 8장을 미리 만들어 둠
    async function prepareImages() {
        const target = comic;
        const off = document.createElement('canvas');
        off.width = off.height = SIZE;
        const octx = off.getContext('2d');
        const files = [];
        for (let i = 0; i < target.panels.length; i++) {
            drawSlide(octx, target.panels[i], i, target.panels.length);
            const blob = await new Promise(resolve => off.toBlob(resolve, 'image/png'));
            if (comic !== target) return;
            files.push(new File([blob], `${fileBase()}_${String(i + 1).padStart(2, '0')}.png`, { type: 'image/png' }));
        }
        images = files;
        downloadBtn.disabled = false;
    }

    // 폰: 공유 창 (사진첩 저장, 인스타로 바로 보내기). PC: zip 파일 하나로
    async function download() {
        if (!images) return;
        const phone = matchMedia('(pointer: coarse)').matches;
        if (phone && navigator.canShare && navigator.canShare({ files: images })) {
            try {
                await navigator.share({ files: images, title: comic.title });
            } catch (e) {
                if (e.name !== 'AbortError') fail(e);
            }
            return;
        }
        downloadBtn.disabled = true;
        downloadBtn.textContent = '준비 중';
        try {
            await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js');
            const zip = new JSZip();
            for (const file of images) zip.file(file.name, file);
            saveBlob(await zip.generateAsync({ type: 'blob' }), `${fileBase()}.zip`);
        } catch (e) {
            fail(e);
        }
        downloadBtn.disabled = false;
        downloadBtn.textContent = '내려받기';
    }

    const loadedScripts = {};
    function loadScript(src) {
        return loadedScripts[src] ??= new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error('zip 라이브러리를 불러오지 못했습니다.'));
            document.head.append(s);
        });
    }

    function saveBlob(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // 모든 줄 앞에 공통으로 붙은 빈칸을 걷어냄 → 그림이 정확히 가운데에 옴
    function dedent(art) {
        const lines = art.split('\n');
        const indents = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
        const cut = indents.length ? Math.min(...indents) : 0;
        return lines.map(l => l.slice(cut)).join('\n');
    }

    // ── 슬라이드쇼 (서버와 상관없이 브라우저 안에서만) ──
    function show(i) {
        index = Math.max(0, Math.min(comic.panels.length - 1, i));
        const panel = comic.panels[index];
        drawSlide(sctx, panel, index, comic.panels.length);
        slide.setAttribute('aria-label', [panel.caption, panel.caption_en].filter(Boolean).join(' / '));
        counter.textContent = `${index + 1} / ${comic.panels.length}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === comic.panels.length - 1;
    }

    function play() {
        if (index === comic.panels.length - 1) show(0);
        playBtn.textContent = '정지';
        timer = setInterval(() => {
            if (index === comic.panels.length - 1) return stop();
            show(index + 1);
        }, SLIDE_MS);
    }

    function stop() {
        clearInterval(timer);
        timer = null;
        playBtn.textContent = '재생';
    }

    function go(step) {
        stop();
        show(index + step);
    }

    // 로그인: 성공하면 브라우저에 세션이 저장되고 onAuthStateChange 가 호출됨
    async function signIn(email, password) {
        loginBtn.disabled = true;
        const { error } = await db.auth.signInWithPassword({ email, password });
        loginBtn.disabled = false;
        loginPassword.value = '';
        if (error) return fail(error);
        statusEl.textContent = '';
    }

    // 로그인 안 했으면 로그인 칸만, 했으면 줄거리 입력칸과 지난 만화
    function applyUser(user) {
        currentUser = user;
        loginForm.hidden = !!user;
        who.hidden = !user;
        emailEl.textContent = user ? user.email : '';
        form.hidden = !user;
        if (user) {
            loadList();
        } else {
            stop();
            comic = null;
            openId = null;
            viewer.hidden = true;
            historyEl.hidden = true;
            comicList.replaceChildren();
        }
    }

    function fail(error) {
        console.error(error);
        statusEl.textContent = error.message || String(error);
    }

    function start() {
        form.addEventListener('submit', e => {
            e.preventDefault();
            const plot = plotInput.value.trim();
            if (plot) make(plot);
        });
        plotInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) form.requestSubmit();
        });

        prevBtn.onclick = () => go(-1);
        nextBtn.onclick = () => go(1);
        playBtn.onclick = () => (timer ? stop() : play());
        downloadBtn.onclick = download;

        // 키보드 ← →
        document.addEventListener('keydown', e => {
            if (!comic || viewer.hidden || e.target === plotInput) return;
            if (e.key === 'ArrowLeft') go(-1);
            if (e.key === 'ArrowRight') go(1);
        });

        // 옆으로 밀어서 넘기기
        let startX = null;
        slide.addEventListener('pointerdown', e => { startX = e.clientX; });
        slide.addEventListener('pointerup', e => {
            if (startX === null || !comic) return;
            const dx = e.clientX - startX;
            startX = null;
            if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
        });

        loginForm.addEventListener('submit', e => {
            e.preventDefault();
            signIn(loginEmail.value.trim(), loginPassword.value);
        });
        logout.onclick = () => db.auth.signOut();

        // 페이지를 열 때(INITIAL_SESSION), 로그인·로그아웃 할 때 호출됨
        // setTimeout: 이 콜백 안에서 바로 다른 Supabase 요청을 기다리면 멈출 수 있어서 한 박자 뒤에 실행
        db.auth.onAuthStateChange((event, session) => {
            if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) {
                setTimeout(() => applyUser(session ? session.user : null), 0);
            }
        });

        // 누가 만화를 만들거나 지우면 열려 있는 모든 화면의 목록에 반영
        db.channel('comics')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'comics' }, () => currentUser && loadList())
            .subscribe();
    }

    if (SUPABASE_URL && SUPABASE_KEY) {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        start();
    } else {
        statusEl.textContent = 'SUPABASE_URL, SUPABASE_KEY 미설정';
    }
</script>
</body>
</html>
