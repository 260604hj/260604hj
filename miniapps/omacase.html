<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오마카세</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:      #EFEAE1;   /* 종이 흰색 */
    --ink-dim:  #8C867C;   /* 흐린 글씨 */
    --ink-faint:#4A463F;
    --bg:       #000000;
    --line:     #2A2722;
    --pad-top:   env(safe-area-inset-top, 0px);
    --pad-bot:   env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; touch-action:none; }

  /* ── 오시나가키: 왼쪽 위 차림표 ───────────────────────── */
  .osinagaki{
    position:fixed; z-index:5;
    top:calc(var(--pad-top) + 22px); left:22px;
    max-width:min(60vw, 320px);
    pointer-events:none;
    opacity:0; transition:opacity .5s ease;
  }
  .osinagaki.on{ opacity:1; }
  .osinagaki .dish{
    font-family:"Gowun Batang", serif;
    font-size:19px; line-height:1.35; letter-spacing:.02em;
    margin:0;
  }
  .osinagaki .left{
    display:flex; gap:6px; align-items:center;
    margin-top:11px; height:8px;
  }
  .pip{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink); opacity:.85;
    transition:transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .pip.gone{
    background:transparent;
    box-shadow:inset 0 0 0 1px var(--ink-faint);
    transform:scale(.72);
  }

  /* ── 아래쪽 주문 ────────────────────────────────────── */
  .composer{
    position:fixed; z-index:5;
    left:50%; transform:translateX(-50%);
    bottom:calc(var(--pad-bot) + 30px);
    width:min(540px, 84vw);
    text-align:center;
    transition:opacity .45s ease;
  }
  .composer.hidden{ opacity:0; pointer-events:none; }
  .composer .ask{
    font-family:"Gowun Batang", serif;
    font-size:15px; color:var(--ink-dim);
    margin:0 0 14px;
  }
  .composer input{
    width:100%; background:transparent; border:0;
    border-bottom:1px solid var(--line);
    padding:9px 2px; text-align:center;
    font-family:"IBM Plex Sans KR", sans-serif;
    font-size:17px; font-weight:300; color:var(--ink);
    outline:none; transition:border-color .25s ease;
  }
  .composer input:focus{ border-bottom-color:var(--ink-dim); }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:200; }
  .composer .hint{
    margin:12px 0 0; font-size:12px; font-weight:200; color:var(--ink-faint);
    min-height:16px;
  }
  .composer .hint.warn{ color:#B9855A; }

  /* ── 준비 중 표시 ───────────────────────────────────── */
  .plating{
    position:fixed; inset:0; z-index:4;
    display:none; place-items:center;
    font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim);
    pointer-events:none;
  }
  .plating.on{ display:grid; }
  .plating span{ animation:breathe 1.9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── 구상 과정 ──────────────────────────────────────── */
  .process{
    position:fixed; z-index:5;
    left:22px; bottom:calc(var(--pad-bot) + 26px);
    width:min(62vw, 400px);
    pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  .process.on{ opacity:1; }
  .process .plan{
    font-family:"Gowun Batang", serif;
    font-size:14px; line-height:1.6; color:var(--ink-dim);
    margin:0 0 12px; min-height:1.6em;
  }
  .process .log{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.85; color:var(--ink-faint);
    white-space:pre;
  }
  .process .log div{ display:flex; gap:7px; align-items:center; }
  .process .swatch{
    display:inline-block; width:7px; height:7px; flex:none; border-radius:1px;
  }

  /* ── 뒤로 가기 ─────────────────────────────────────── */
  .back{
    position:fixed; z-index:6;
    top:calc(var(--pad-top) + 22px); right:22px;
    font-size:13px; color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--ink-dim); }

  :focus-visible{ outline:1px solid var(--ink-dim); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="osinagaki" id="osinagaki">
  <p class="dish" id="dishName"></p>
  <div class="left" id="pips"></div>
</div>

<a class="back" href="../visitor.html">←</a>

<div class="plating" id="plating"><span>주문을 받았습니다</span></div>

<div class="process" id="process">
  <p class="plan" id="plan"></p>
  <div class="log" id="log"></div>
</div>

<div class="composer" id="composer">
  <p class="ask" id="ask">오늘은 무엇을 드시겠습니까</p>
  <input id="orderInput" type="text" autocomplete="off" placeholder="예: 연어 초밥, 마르게리타 피자, 딸기 빙수" />
  <p class="hint" id="hint">입력하고 엔터</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   1. 서버 연결
   ══════════════════════════════════════════════════════════ */

// Supabase 대시보드 > Connect 에서 복사
// KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

// Gemini 키는 Edge Function(omacase) 안에만 있고, 브라우저에는 오지 않습니다.
const KITCHEN = `${SUPABASE_URL}/functions/v1/omacase`;

/* ══════════════════════════════════════════════════════════
   2. 화면 준비
   ══════════════════════════════════════════════════════════ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// 접시와 음식이 모두 들어가는 묶음. 드래그하면 이것만 돈다.
const table = new THREE.Group();
scene.add(table);

let frustum = 30;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
camera.position.set(60, 52, 60);
camera.lookAt(0, 0, 0);
resizeCamera();

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(34, 56, 26);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -26;
key.shadow.camera.right = 26;
key.shadow.camera.top = 26;
key.shadow.camera.bottom = -26;
key.shadow.camera.near = 1;
key.shadow.camera.far = 160;
key.shadow.bias = -0.0009;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdfe6ef, 0.5);
fill.position.set(-30, 22, -18);
scene.add(fill);

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 0.7));

/* ── 모양 만들기 ──────────────────────────────────────── */

const UNIT = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  sphere:   new THREE.SphereGeometry(0.5, 28, 18),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 30),
  cone:     new THREE.ConeGeometry(0.5, 1, 26),
  capsule:  new THREE.CapsuleGeometry(0.3, 0.4, 6, 18),
  torus:    new THREE.TorusGeometry(0.35, 0.15, 14, 34)
};
// 캡슐과 도넛은 쓰기 편한 방향으로 미리 돌려 둡니다.
UNIT.capsule.computeBoundingBox();
(() => {
  const b = UNIT.capsule.boundingBox, s = new THREE.Vector3();
  b.getSize(s);
  UNIT.capsule.scale(1 / s.x, 1 / s.y, 1 / s.z);   // 1×1×1 로 정규화
})();
UNIT.torus.rotateX(-Math.PI / 2);                   // 접시에 눕힌 고리

const toRad = (d) => (d || 0) * Math.PI / 180;
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isHex = (c) => /^#[0-9a-fA-F]{6}$/.test(String(c ?? '').trim());

function safeColor(hex, fallback = '#CCCCCC') {
  return new THREE.Color(isHex(hex) ? hex : fallback);
}

const growing = [];   // 방금 놓여서 커지는 중인 조각

function buildPart(p) {
  const geo = UNIT[p.shape] || UNIT.box;
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: safeColor(p.color),
    roughness: 0.78,
    metalness: 0.0
  }));

  const s = Array.isArray(p.size) ? p.size : [];
  const to = new THREE.Vector3(
    clamp(num(s[0], 1), 0.05, 24),
    clamp(num(s[1], 1), 0.05, 24),
    clamp(num(s[2], 1), 0.05, 24)
  );

  const q = Array.isArray(p.pos) ? p.pos : [];
  mesh.position.set(num(q[0], 0), Math.max(0, num(q[1], 0)), num(q[2], 0));

  const r = Array.isArray(p.rot) ? p.rot : [];
  mesh.rotation.set(toRad(num(r[0], 0)), toRad(num(r[1], 0)), toRad(num(r[2], 0)));

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // 놓이는 순간이 보이게, 작은 점에서 제 크기로 부풀립니다.
  mesh.scale.set(0.001, 0.001, 0.001);
  growing.push({ mesh, t: 0, to });
  return mesh;
}

function disposeDeep(obj) {
  obj.traverse((o) => { if (o.isMesh) o.material?.dispose(); });
}

function resizeCamera() {
  const a = innerWidth / innerHeight;
  const h = frustum / 2;
  const wHalf = a >= 1 ? h * a : h;          // 세로 화면에서도 접시가 안 잘리게
  const vHalf = a >= 1 ? h : h / a;
  camera.left = -wHalf; camera.right = wHalf;
  camera.top = vHalf;  camera.bottom = -vHalf;
  camera.updateProjectionMatrix();
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  resizeCamera();
});

/* ══════════════════════════════════════════════════════════
   3. 접시 쌓기 — 글이 오는 대로 한 조각씩
   ══════════════════════════════════════════════════════════ */

let plateMesh = null;
const bites = [];         // 아직 남은 음식 묶음
const eating = [];        // 사라지는 중인 묶음
let groups = [];          // 만들어 둔 묶음 (items 순서)
let partsDone = [];       // 묶음마다 몇 조각까지 놓았는지

function resetPlate() {
  [...table.children].forEach((c) => { disposeDeep(c); table.remove(c); });
  bites.length = 0;
  eating.length = 0;
  growing.length = 0;
  groups = [];
  partsDone = [];
  plateMesh = null;
}

function buildPlate(plate) {
  const shape = ['circle', 'ellipse', 'square'].includes(plate.shape) ? plate.shape : 'circle';
  const w = clamp(num(plate.width, 20), 10, 40);
  const d = shape === 'circle' ? w : clamp(num(plate.depth, w), 10, 40);

  const geo = shape === 'square'
    ? new THREE.BoxGeometry(1, 1, 1)
    : new THREE.CylinderGeometry(0.5, 0.46, 1, 72);
  plateMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: safeColor(plate.color, '#F2F0EC'),
    roughness: 0.62,
    metalness: 0.0
  }));
  plateMesh.scale.set(w, 0.9, d);
  plateMesh.position.y = -0.45;      // 윗면이 정확히 y = 0
  plateMesh.receiveShadow = true;
  plateMesh.castShadow = true;
  table.add(plateMesh);

  frustum = Math.max(w, d) * 1.5;
  resizeCamera();
  table.rotation.y = 0;
  return { shape, w, d };
}

// 한 조각이 다 왔는지 (쓰는 중인 마지막 조각은 아직 놓지 않습니다)
function partReady(p) {
  return !!p && typeof p.shape === 'string' && typeof p.color === 'string'
    && Array.isArray(p.size) && p.size.length === 3
    && Array.isArray(p.pos) && p.pos.length === 3;
}

// 반쯤 온 spec 을 화면에 반영. final 이면 마지막 조각까지 놓습니다.
function growPlate(spec, final) {
  if (!spec) return;
  if (!plateMesh && spec.plate && typeof spec.plate.width === 'number') {
    const p = buildPlate(spec.plate);
    log(`접시 · ${p.shape} ${Math.round(p.w)}×${Math.round(p.d)}`, spec.plate.color);
  }
  if (!plateMesh) return;

  const items = Array.isArray(spec.items) ? spec.items : [];
  items.forEach((item, i) => {
    const parts = Array.isArray(item?.parts) ? item.parts : [];
    if (!groups[i]) {
      if (!item?.name && !parts.length) return;
      groups[i] = new THREE.Group();
      partsDone[i] = 0;
      table.add(groups[i]);
      log(String(item?.name ?? '한 점').slice(0, 20));
    }
    parts.forEach((p, j) => {
      if (j < partsDone[i]) return;
      // 마지막 묶음의 마지막 조각은 아직 쓰는 중일 수 있습니다.
      if (!final && i === items.length - 1 && j === parts.length - 1) return;
      if (!partReady(p)) return;
      groups[i].add(buildPart(p));
      partsDone[i] = j + 1;
      const s = p.size.map((n) => Math.round(num(n, 0) * 10) / 10).join('×');
      log(`  ${p.shape} ${s}`, p.color);
    });
  });
}

// 다 왔으면 묶음마다 원점을 제자리로 옮깁니다.
// 이렇게 해야 먹을 때 접시 가운데로 빨려가지 않고 제자리에서 사라집니다.
function finishPlate() {
  bites.length = 0;
  groups.forEach((g) => {
    if (!g) return;
    if (!g.children.length) { table.remove(g); return; }
    const box = new THREE.Box3().setFromObject(g);
    const c = box.getCenter(new THREE.Vector3());
    g.children.forEach((m) => { m.position.x -= c.x; m.position.z -= c.z; });
    g.position.set(c.x, 0, c.z);
    g.userData = { home: g.position.clone() };
    bites.push(g);
  });
}

/* ══════════════════════════════════════════════════════════
   4. 먹기
   ══════════════════════════════════════════════════════════ */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const el = {
  osinagaki: document.getElementById('osinagaki'),
  dishName:  document.getElementById('dishName'),
  pips:      document.getElementById('pips'),
  composer:  document.getElementById('composer'),
  ask:       document.getElementById('ask'),
  input:     document.getElementById('orderInput'),
  hint:      document.getElementById('hint'),
  plating:   document.getElementById('plating'),
  process:   document.getElementById('process'),
  plan:      document.getElementById('plan'),
  logBox:    document.getElementById('log')
};

function drawPips(total, left) {
  el.pips.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const s = document.createElement('i');
    s.className = 'pip' + (i < total - left ? ' gone' : '');
    el.pips.appendChild(s);
  }
}

let servedTotal = 0;

function eat(group) {
  const i = bites.indexOf(group);
  if (i < 0) return;
  bites.splice(i, 1);

  eating.push({ g: group, t: 0 });
  drawPips(servedTotal, bites.length);

  if (bites.length === 0) {
    setTimeout(finishCourse, 620);
  }
}

function finishCourse() {
  el.dishName.textContent = '잘 드셨습니다';
  el.ask.textContent = '다음은 무엇으로 하시겠습니까';
  el.input.value = '';
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  el.composer.classList.remove('hidden');
}

/* 드래그는 회전, 짧게 누르면 먹기 */
let dragging = false, moved = 0, lastX = 0, spin = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; spin = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  moved += Math.abs(dx);
  spin = dx * 0.006;
  table.rotation.y += spin;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;                 // 돌린 것이지 누른 것이 아님
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bites, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o.parent && o.parent !== table) o = o.parent;
  eat(o);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor =
    raycaster.intersectObjects(bites, true).length ? 'pointer' : 'default';
});

/* ══════════════════════════════════════════════════════════
   5. 구상 과정 보이기
   ══════════════════════════════════════════════════════════ */

const LOG_LINES = 7;

function clearProcess() {
  el.plan.textContent = '';
  el.logBox.innerHTML = '';
  el.process.classList.remove('on');
}

function log(text, color) {
  const line = document.createElement('div');
  if (isHex(color)) {
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = color;
    line.appendChild(dot);
  }
  line.appendChild(document.createTextNode(text));
  el.logBox.appendChild(line);
  while (el.logBox.children.length > LOG_LINES) el.logBox.firstChild.remove();
  const all = [...el.logBox.children];
  all.forEach((c, i) => { c.style.opacity = 0.3 + 0.7 * ((i + 1) / all.length); });
}

/* ══════════════════════════════════════════════════════════
   6. 반쯤 온 JSON 읽기
   ══════════════════════════════════════════════════════════ */

// 아직 닫히지 않은 괄호를 임시로 닫아 봅니다. 글자를 쓰는 중이면 null.
function closeUp(src) {
  const stack = [];
  let inStr = false, esc = false;
  for (const c of src) {
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === '{') stack.push('}');
    else if (c === '[') stack.push(']');
    else if (c === '}' || c === ']') stack.pop();
  }
  if (inStr) return null;
  return src + stack.reverse().join('');
}

// 지금까지 온 만큼만 읽어 낸 객체 (뒤에서부터 잘라 가며 말이 되는 지점을 찾음)
function parsePartial(text) {
  for (let end = text.length; end > 0; end--) {
    const c = text[end - 1];
    if (c !== '}' && c !== ']' && c !== '"' && !/[0-9a-z]/.test(c)) continue;
    const cand = closeUp(text.slice(0, end));
    if (cand === null) continue;
    try { return JSON.parse(cand); } catch { /* 더 앞으로 */ }
  }
  return null;
}

// 아직 닫히지 않은 plan 문장도 쓰이는 대로 보여 줍니다.
function peekPlan(text) {
  const m = text.match(/"plan"\s*:\s*"((?:[^"\\]|\\.)*)/);
  if (!m) return null;
  try { return JSON.parse(`"${m[1].replace(/\\$/, '')}"`); } catch { return null; }
}

/* ══════════════════════════════════════════════════════════
   7. 주문 → 주방 → 접시
   ══════════════════════════════════════════════════════════ */

async function askKitchen(order, onText) {
  const res = await fetch(KITCHEN, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({ order })
  });

  if (!res.ok || !res.body) {
    const body = await res.json().catch(() => null);
    throw new Error(body?.error || `주방에서 응답이 없습니다 (${res.status})`);
  }

  // 함수가 아직 한 번에 보내는 예전 방식이면, 받은 JSON 을 그대로 씁니다.
  if (!(res.headers.get('content-type') || '').includes('text/event-stream')) {
    const whole = await res.text();
    if (!whole.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
    onText(whole);
    return whole;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', text = '';

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let msg;
      try { msg = JSON.parse(line.slice(5)); } catch { continue; }
      if (msg.error) throw new Error(msg.error);
      if (msg.t) { text += msg.t; onText(text); }
    }
  }
  if (!text.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
  return text;
}

let busy = false;

async function order(text) {
  if (busy) return;
  const q = text.trim();
  if (!q) return;

  busy = true;
  el.composer.classList.add('hidden');
  el.osinagaki.classList.remove('on');
  el.plating.classList.add('on');
  clearProcess();
  resetPlate();

  let shownPlan = '';

  // 글자가 올 때마다: 구상은 글로, 접시와 음식은 그 자리에서 3D 로
  const onText = (all) => {
    el.plating.classList.remove('on');
    el.process.classList.add('on');

    const plan = peekPlan(all);
    if (plan && plan !== shownPlan) { shownPlan = plan; el.plan.textContent = plan; }

    const spec = parsePartial(all);
    if (spec?.dish && el.dishName.textContent !== spec.dish) {
      el.dishName.textContent = spec.dish;
      el.osinagaki.classList.add('on');
    }
    growPlate(spec, false);
  };

  try {
    const raw = await askKitchen(q, onText);
    const spec = parsePartial(raw);
    growPlate(spec, true);
    finishPlate();
    if (!bites.length) throw new Error('이 주문은 담아내지 못했습니다. 다르게 말씀해 주세요');

    servedTotal = bites.length;
    el.dishName.textContent = spec.dish || q;
    drawPips(servedTotal, servedTotal);
    el.osinagaki.classList.add('on');
    setTimeout(() => el.process.classList.remove('on'), 1600);
  } catch (err) {
    resetPlate();
    clearProcess();
    el.osinagaki.classList.remove('on');
    el.dishName.textContent = '';
    el.hint.textContent = err.message || '무언가 잘못되었습니다';
    el.hint.classList.add('warn');
    el.composer.classList.remove('hidden');
    el.input.focus();
  } finally {
    el.plating.classList.remove('on');
    busy = false;
  }
}

el.input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  order(el.input.value);
});

el.input.focus();

/* ══════════════════════════════════════════════════════════
   8. 그리기
   ══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // 손을 뗀 뒤 남은 회전이 천천히 멎습니다.
  if (!dragging && Math.abs(spin) > 0.00002) {
    table.rotation.y += spin;
    spin *= 0.92;
  }

  // 막 놓인 조각: 작은 점에서 제 크기로 부풀어 오릅니다.
  for (let i = growing.length - 1; i >= 0; i--) {
    const g = growing[i];
    g.t += dt / 0.28;
    const k = Math.min(1, g.t);
    const ease = 1 - Math.pow(1 - k, 3);
    g.mesh.scale.set(
      Math.max(0.001, g.to.x * ease),
      Math.max(0.001, g.to.y * ease),
      Math.max(0.001, g.to.z * ease)
    );
    if (k >= 1) growing.splice(i, 1);
  }

  // 먹히는 중인 음식: 살짝 떠올랐다가 작아지며 사라집니다.
  for (let i = eating.length - 1; i >= 0; i--) {
    const e = eating[i];
    e.t += dt / 0.42;
    const k = Math.min(1, e.t);
    const ease = 1 - Math.pow(1 - k, 3);
    e.g.position.y = e.g.userData.home.y + ease * 5.5;
    e.g.rotation.y = ease * 1.2;
    const s = Math.max(0.001, 1 - ease);
    e.g.scale.setScalar(s);
    if (k >= 1) {
      disposeDeep(e.g);
      table.remove(e.g);
      eating.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
