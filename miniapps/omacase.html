<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오마카세</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:      #EFEAE1;   /* 종이 흰색 */
    --ink-dim:  #8C867C;   /* 흐린 글씨 */
    --ink-faint:#4A463F;
    --bg:       #000000;
    --line:     #2A2722;
    --pad-top:   env(safe-area-inset-top, 0px);
    --pad-bot:   env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; touch-action:none; }

  /* ── 오시나가키: 왼쪽 위 차림표 ───────────────────────── */
  .osinagaki{
    position:fixed; z-index:5;
    top:calc(var(--pad-top) + 22px); left:22px;
    max-width:min(60vw, 320px);
    pointer-events:none;
    opacity:0; transition:opacity .5s ease;
  }
  .osinagaki.on{ opacity:1; }
  .osinagaki .dish{
    font-family:"Gowun Batang", serif;
    font-size:19px; line-height:1.35; letter-spacing:.02em;
    margin:0;
  }
  .osinagaki .left{
    display:flex; gap:6px; align-items:center;
    margin-top:11px; height:8px;
  }
  .pip{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink); opacity:.85;
    transition:transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .pip.gone{
    background:transparent;
    box-shadow:inset 0 0 0 1px var(--ink-faint);
    transform:scale(.72);
  }

  /* ── 아래쪽 주문 ────────────────────────────────────── */
  .composer{
    position:fixed; z-index:5;
    left:50%; transform:translateX(-50%);
    bottom:calc(var(--pad-bot) + 30px);
    width:min(540px, 84vw);
    text-align:center;
    transition:opacity .45s ease;
  }
  .composer.hidden{ opacity:0; pointer-events:none; }
  .composer .ask{
    font-family:"Gowun Batang", serif;
    font-size:15px; color:var(--ink-dim);
    margin:0 0 14px;
  }
  .composer input{
    width:100%; background:transparent; border:0;
    border-bottom:1px solid var(--line);
    padding:9px 2px; text-align:center;
    font-family:"IBM Plex Sans KR", sans-serif;
    font-size:17px; font-weight:300; color:var(--ink);
    outline:none; transition:border-color .25s ease;
  }
  .composer input:focus{ border-bottom-color:var(--ink-dim); }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:200; }
  .composer .hint{
    margin:12px 0 0; font-size:12px; font-weight:200; color:var(--ink-faint);
    min-height:16px;
  }
  .composer .hint.warn{ color:#B9855A; }

  /* ── 준비 중 표시 ───────────────────────────────────── */
  .plating{
    position:fixed; inset:0; z-index:4;
    display:none; place-items:center;
    font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim);
    pointer-events:none;
  }
  .plating.on{ display:grid; }
  .plating span{ animation:breathe 1.9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── 구상 과정 ──────────────────────────────────────── */
  .process{
    position:fixed; z-index:5;
    left:22px; bottom:calc(var(--pad-bot) + 26px);
    width:min(56vw, 370px);
    pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  .process.on{ opacity:1; }
  .process .steps{ margin-bottom:13px; }
  .process .step{
    display:flex; gap:10px; align-items:baseline;
    font-size:13px; line-height:1.55; margin-bottom:3px;
    color:var(--ink-faint);
    opacity:.45; transition:opacity .4s ease, color .4s ease;
  }
  .process .step.on{ opacity:1; color:var(--ink-dim); }
  .process .step b{
    flex:none; width:34px;
    font-weight:400; font-size:11px; letter-spacing:.08em;
    color:var(--ink-faint);
  }
  .process .step.on b{ color:var(--ink-dim); }
  .process .step span{ font-family:"Gowun Batang", serif; }
  .process .log{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.85; color:var(--ink-faint);
    white-space:pre;
    max-height:34vh; overflow-y:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 20%);
            mask-image:linear-gradient(to bottom, transparent, #000 20%);
  }
  .process .log::-webkit-scrollbar{ display:none; }
  .process.done{ opacity:.3; }
  .process .log div{ display:flex; gap:7px; align-items:center; }
  .process .swatch{
    display:inline-block; width:7px; height:7px; flex:none; border-radius:1px;
  }

  /* ── 뒤로 가기 ─────────────────────────────────────── */
  .back{
    position:fixed; z-index:6;
    top:calc(var(--pad-top) + 22px); right:22px;
    font-size:13px; color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--ink-dim); }

  :focus-visible{ outline:1px solid var(--ink-dim); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="osinagaki" id="osinagaki">
  <p class="dish" id="dishName"></p>
  <div class="left" id="pips"></div>
</div>

<a class="back" href="../visitor.html">←</a>

<div class="plating" id="plating"><span>주문을 받았습니다</span></div>

<div class="process" id="process">
  <div class="steps">
    <div class="step" id="step1"><b>형상</b><span>…</span></div>
    <div class="step" id="step2"><b>그릇</b><span>…</span></div>
    <div class="step" id="step3"><b>담기</b><span>…</span></div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="composer" id="composer">
  <p class="ask" id="ask">오늘은 무엇을 드시겠습니까</p>
  <input id="orderInput" type="text" autocomplete="off" placeholder="예: 연어 초밥, 마르게리타 피자, 딸기 빙수" />
  <p class="hint" id="hint">입력하고 엔터</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   1. 서버 연결
   ══════════════════════════════════════════════════════════ */

// Supabase 대시보드 > Connect 에서 복사
// KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

// Gemini 키는 Edge Function(omacase) 안에만 있고, 브라우저에는 오지 않습니다.
// 서버는 "무슨 그릇에 어떻게 담는가" 만 보내고, 그릇 모양과 자리 계산은 여기서 합니다.
const KITCHEN = `${SUPABASE_URL}/functions/v1/omacase`;

/* ══════════════════════════════════════════════════════════
   2. 화면 준비
   ══════════════════════════════════════════════════════════ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// 그릇과 음식이 모두 들어가는 묶음. 드래그하면 이것만 돈다.
const table = new THREE.Group();
scene.add(table);

let frustum = 30;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

// 카메라가 그릇 둘레를 돕니다. azim 은 좌우, polar 는 위아래(0 이면 바로 위에서 내려다봄)
const ORBIT = { dist: 110, azim: Math.PI / 4, polar: 0.96, min: 0.14, max: 1.36 };
const camTarget = new THREE.Vector3(0, 0, 0);

function orbit() {
  const { dist, azim, polar } = ORBIT;
  camera.position.set(
    camTarget.x + dist * Math.sin(polar) * Math.cos(azim),
    camTarget.y + dist * Math.cos(polar),
    camTarget.z + dist * Math.sin(polar) * Math.sin(azim)
  );
  camera.lookAt(camTarget);
}
orbit();
resizeCamera();

const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(34, 56, 26);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -26;
keyLight.shadow.camera.right = 26;
keyLight.shadow.camera.top = 26;
keyLight.shadow.camera.bottom = -26;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 160;
keyLight.shadow.bias = -0.0009;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe6ef, 0.5);
fillLight.position.set(-30, 22, -18);
scene.add(fillLight);

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 0.7));

function resizeCamera() {
  const a = innerWidth / innerHeight;
  const h = frustum / 2;
  const wHalf = a >= 1 ? h * a : h;          // 세로 화면에서도 그릇이 안 잘리게
  const vHalf = a >= 1 ? h : h / a;
  camera.left = -wHalf; camera.right = wHalf;
  camera.top = vHalf;  camera.bottom = -vHalf;
  camera.updateProjectionMatrix();
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  resizeCamera();
});

/* ══════════════════════════════════════════════════════════
   3. 기본 도형
   ══════════════════════════════════════════════════════════ */

const UNIT = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  sphere:   new THREE.SphereGeometry(0.5, 28, 18),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 30),
  cone:     new THREE.ConeGeometry(0.5, 1, 26),
  capsule:  new THREE.CapsuleGeometry(0.3, 0.4, 6, 18),
  torus:    new THREE.TorusGeometry(0.35, 0.15, 14, 34)
};
UNIT.capsule.computeBoundingBox();
(() => {
  const b = UNIT.capsule.boundingBox, s = new THREE.Vector3();
  b.getSize(s);
  UNIT.capsule.scale(1 / s.x, 1 / s.y, 1 / s.z);   // 1×1×1 로 정규화
})();
UNIT.torus.rotateX(-Math.PI / 2);                   // 눕힌 고리

const toRad = (d) => (d || 0) * Math.PI / 180;
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isHex = (c) => /^#[0-9a-fA-F]{6}$/.test(String(c ?? '').trim());
const pick = (...c) => c.find(isHex) ?? '#CCCCCC';

// 두 색이 사실상 같은 색인지
function near(a, b) {
  const x = safeColor(a), y = safeColor(b);
  return Math.abs(x.r - y.r) + Math.abs(x.g - y.g) + Math.abs(x.b - y.b) < 0.22;
}

function safeColor(hex, fallback = '#CCCCCC') {
  return new THREE.Color(isHex(hex) ? hex : fallback);
}

function foodMat(color) {
  return new THREE.MeshStandardMaterial({ color: safeColor(color), roughness: 0.78, metalness: 0 });
}

const growing = [];   // 방금 놓여서 커지는 중인 조각

// 한 조각. 놓이는 순간이 보이도록 작은 점에서 제 크기로 부풀립니다.
function part(shape, color, size, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const mesh = new THREE.Mesh(UNIT[shape] || UNIT.box, foodMat(color));
  const to = new THREE.Vector3(
    clamp(num(size[0], 1), 0.05, 26),
    clamp(num(size[1], 1), 0.05, 26),
    clamp(num(size[2], 1), 0.05, 26)
  );
  mesh.position.set(num(pos[0], 0), num(pos[1], 0), num(pos[2], 0));
  mesh.rotation.set(toRad(num(rot[0], 0)), toRad(num(rot[1], 0)), toRad(num(rot[2], 0)));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.scale.set(0.001, 0.001, 0.001);
  growing.push({ mesh, t: 0, to });
  return mesh;
}

function disposeDeep(obj) {
  obj.traverse((o) => { if (o.isMesh) o.material?.dispose(); });
}

/* ══════════════════════════════════════════════════════════
   4. 그릇 — 이름만 오면 모양은 여기서 만듭니다
   ══════════════════════════════════════════════════════════ */

// 바닥에서 테두리까지 이어지는 곡면 하나로 사발을 만듭니다.
function hollow(size, height, color, opts = {}) {
  const R = size / 2, N = 16, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(R * Math.sin(t * Math.PI / 2) * 0.99, height * (1 - Math.cos(t * Math.PI / 2))));
  }
  const mesh = new THREE.Mesh(
    new THREE.LatheGeometry(pts, 56),
    new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'),
      roughness: 0.55, metalness: 0, side: THREE.DoubleSide, ...opts
    })
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function slab(color, size, pos) {
  const mesh = new THREE.Mesh(UNIT.box, new THREE.MeshStandardMaterial({
    color: safeColor(color, '#B08050'), roughness: 0.7, metalness: 0
  }));
  mesh.scale.set(...size);
  mesh.position.set(...pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// 각 그릇: obj(3D), y0(음식이 놓이는 높이), r(음식을 놓을 수 있는 반경), depth(그릇 깊이)
const VESSELS = {
  flat_plate(size, color) {
    const m = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    m.scale.set(size, 1.2, size);
    m.position.y = -0.6;
    m.castShadow = true; m.receiveShadow = true;
    return { obj: m, y0: 0, r: size / 2 - 1.8, rz: size / 2 - 1.8, depth: 0 };
  },
  rimmed_plate(size, color) {
    const g = new THREE.Group();
    const base = VESSELS.flat_plate(size * 0.97, color).obj;
    g.add(base);
    const rimGeo = new THREE.TorusGeometry(size / 2 - 0.6, 0.62, 14, 64);
    rimGeo.rotateX(-Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    rim.castShadow = true; rim.receiveShadow = true;
    g.add(rim);
    return { obj: g, y0: 0.2, r: size / 2 - 2.6, rz: size / 2 - 2.6, depth: 0.8 };
  },
  bowl(size, color) {
    const h = size * 0.40;
    return { obj: hollow(size, h, color), y0: h * 0.34, r: size / 2 * 0.62, depth: h };
  },
  deep_bowl(size, color) {
    const h = size * 0.62;
    return { obj: hollow(size, h, color), y0: h * 0.5, r: size / 2 * 0.56, depth: h };
  },
  stone_pot(size, color) {
    const h = size * 0.46;
    const g = new THREE.Group();
    g.add(hollow(size, h, color || '#3A3632'));
    const foot = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#3A3632'), roughness: 0.85, metalness: 0
    }));
    foot.scale.set(size * 0.55, 1.1, size * 0.55);
    foot.position.y = -0.55;
    foot.castShadow = true; foot.receiveShadow = true;
    g.add(foot);
    return { obj: g, y0: h * 0.42, r: size / 2 * 0.58, depth: h };
  },
  board(size, color) {
    const d = size * 0.72;
    const g = new THREE.Group();
    g.add(slab(color || '#B08050', [size, 1.5, d], [0, -0.75, 0]));
    return { obj: g, y0: 0, r: size / 2 - 1.8, rz: d / 2 - 1.6, depth: 0 };
  },
  basket(size, color) {
    const h = size * 0.34;
    const g = new THREE.Group();
    g.add(hollow(size, h, color || '#C8A66B'));
    const lip = new THREE.TorusGeometry(size / 2 * 0.99, 0.45, 12, 52);
    lip.rotateX(-Math.PI / 2);
    const rim = new THREE.Mesh(lip, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#C8A66B'), roughness: 0.85, metalness: 0
    }));
    rim.position.y = h;
    rim.castShadow = true; rim.receiveShadow = true;
    g.add(rim);
    return { obj: g, y0: h * 0.42, r: size / 2 * 0.64, depth: h };
  },
  glass(size, color) {
    const h = size * 1.15;
    const obj = hollow(size, h, color || '#CFE0E6', { transparent: true, opacity: 0.42, roughness: 0.1 });
    obj.castShadow = false;
    return { obj, y0: h * 0.42, r: size / 2 * 0.58, depth: h };
  }
};

/* ══════════════════════════════════════════════════════════
   4-2. 알갱이 — 밥·얼음처럼 작은 알이 모인 것
   ══════════════════════════════════════════════════════════ */

// 알갱이 하나의 모양. 낱개로 수백 개를 그리면 무거우므로 한 번에 그립니다(InstancedMesh).
const GRAIN_GEO = {
  rice:  new THREE.CapsuleGeometry(0.16, 0.26, 3, 7),
  ice:   new THREE.IcosahedronGeometry(0.24, 0),
  crumb: new THREE.BoxGeometry(0.3, 0.22, 0.28),
  smooth: null
};
const GRAIN_SIZE = { rice: 1, ice: 1.15, crumb: 1 };

// 흩어진 값이지만 주문마다 같은 모습이 나오도록, 난수 대신 규칙으로 흩뿌립니다.
function scatterPoint(i, n) {
  const k = Math.sqrt((i + 0.5) / n);          // 가운데가 촘촘하지 않게
  const a = i * 2.39996;                        // 해바라기 각도
  return { k, a };
}

// 덩어리 돔 + 알갱이 껍질. 바닥이 y = 0 인 묶음을 돌려줍니다.
function grainMound(kind, color, R, H, count) {
  const g = new THREE.Group();
  const shade = new THREE.Color(safeColor(color)).multiplyScalar(0.88);

  // 저층부는 덩어리 하나로 (알갱이를 속까지 채우면 무겁습니다)
  const dome = new THREE.Mesh(UNIT.sphere, new THREE.MeshStandardMaterial({
    color: shade, roughness: 0.9, metalness: 0
  }));
  dome.scale.set(R * 2, H * 1.9, R * 2);
  dome.position.y = -H * 0.02;
  dome.castShadow = true;
  dome.receiveShadow = true;
  g.add(dome);

  const geo = GRAIN_GEO[kind] || GRAIN_GEO.rice;
  const grains = new THREE.InstancedMesh(
    geo,
    new THREE.MeshStandardMaterial({ color: safeColor(color), roughness: 0.82, metalness: 0 }),
    count
  );
  grains.castShadow = true;
  grains.receiveShadow = true;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), sc = new THREE.Vector3();
  const tint = new THREE.Color();
  const size = (GRAIN_SIZE[kind] || 1) * clamp(R / 7, 0.75, 1.4);

  for (let i = 0; i < count; i++) {
    const { k, a } = scatterPoint(i, count);
    const rr = R * 0.985 * k;
    const surface = H * 0.95 * Math.sqrt(Math.max(0, 1 - k * k));   // 돔 표면 높이
    const wob = Math.sin(i * 12.9898) * 0.5;                        // 들쭉날쭉하게
    pos.set(Math.cos(a) * rr, surface + wob * 0.22 * size, Math.sin(a) * rr);
    e.set(i * 1.7, a + i * 0.31, Math.sin(i * 7.1) * 0.9);
    q.setFromEuler(e);
    sc.setScalar(size * (0.85 + 0.3 * (0.5 + 0.5 * Math.sin(i * 3.7))));
    m.compose(pos, q, sc);
    grains.setMatrixAt(i, m);
    tint.copy(safeColor(color)).multiplyScalar(0.92 + 0.13 * (0.5 + 0.5 * Math.cos(i * 2.1)));
    grains.setColorAt(i, tint);
  }
  grains.instanceMatrix.needsUpdate = true;
  if (grains.instanceColor) grains.instanceColor.needsUpdate = true;
  g.add(grains);

  g.userData.top = H;
  return g;
}

/* ══════════════════════════════════════════════════════════
   5. 놓는 자리 — 배치 이름만 오면 좌표는 여기서 계산
   ══════════════════════════════════════════════════════════ */

const spread = (n, f) => Array.from({ length: n }, (_, i) => f(i));

const ARRANGE = {
  row: (n, rx) => {
    const step = (2 * rx) / n;
    return spread(n, (i) => ({ x: (i - (n - 1) / 2) * step, z: 0 }));
  },
  grid: (n, rx, rz) => {
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    const sx = (2 * rx) / cols, sz = (2 * rz) / rows;
    return spread(n, (i) => ({
      x: ((i % cols) - (cols - 1) / 2) * sx,
      z: (Math.floor(i / cols) - (rows - 1) / 2) * sz
    }));
  },
  ring: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.68, z: Math.sin(a) * rz * 0.68, ry: -a };
  }),
  fan: (n, rx, rz) => spread(n, (i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const a = (-0.5 + t) * Math.PI;
    return { x: Math.cos(a) * rx * 0.66, z: Math.sin(a) * rz * 0.5 + rz * 0.2, ry: -a + Math.PI / 2 };
  }),
  mound: (n, rx, rz) => spread(n, (i) => {
    if (i === n - 1) return { x: 0, z: 0, y: 1.9 };
    const a = (i / Math.max(n - 1, 1)) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.46, z: Math.sin(a) * rz * 0.46, ry: -a };
  }),
  stack: (n) => spread(n, (i) => ({
    x: Math.sin(i * 1.1) * 0.5, z: Math.cos(i * 1.1) * 0.5, y: i * 1.6, ry: i * 0.5
  })),
  scatter: (n, rx, rz) => spread(n, (i) => {
    const a = i * 2.39996, k = Math.sqrt((i + 0.6) / n);        // 해바라기 배열
    return { x: Math.cos(a) * rx * 0.82 * k, z: Math.sin(a) * rz * 0.82 * k, ry: a };
  }),
  submerged: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.62, z: Math.sin(a) * rz * 0.62, y: -0.55, ry: -a };
  })
};

// 자리끼리 너무 가까우면 한 입 크기를 줄여서 겹치지 않게 합니다.
const BITE = 4.4;
function fitScale(slots, how) {
  if (how === 'mound' || how === 'stack' || slots.length < 2) return 1;
  let min = Infinity;
  for (let i = 0; i < slots.length; i++) {
    for (let j = i + 1; j < slots.length; j++) {
      const dx = num(slots[i].x, 0) - num(slots[j].x, 0);
      const dz = num(slots[i].z, 0) - num(slots[j].z, 0);
      min = Math.min(min, Math.hypot(dx, dz));
    }
  }
  return clamp(min / BITE, 0.5, 1.15);
}

/* ══════════════════════════════════════════════════════════
   6. 한 입 — 형태 이름만 오면 모양은 여기서 만듭니다
   ══════════════════════════════════════════════════════════ */

const FORMS = {
  nigiri: (b, t) => [
    part('box', b, [3.4, 1.5, 2.1], [0, 0.75, 0]),
    part('box', t, [3.8, 0.55, 2.3], [0, 1.72, 0], [0, 0, 3])
  ],
  dumpling: (b, t) => [
    part('sphere', b, [3.2, 2.1, 2.4], [0, 1.05, 0]),
    part('sphere', t, [0.8, 0.8, 0.8], [-1.0, 1.9, 0]),
    part('sphere', t, [0.8, 0.8, 0.8], [0, 2.05, 0]),
    part('sphere', t, [0.8, 0.8, 0.8], [1.0, 1.9, 0])
  ],
  roll: (b, t) => [
    part('cylinder', t, [2.9, 2.2, 2.9], [0, 1.1, 0]),
    part('cylinder', b, [2.2, 2.3, 2.2], [0, 1.18, 0])
  ],
  slice: (b, t) => [
    part('box', b, [3.7, 0.85, 2.7], [0, 0.55, 0], [-9, 0, 0]),
    part('box', t, [3.4, 0.28, 2.4], [0, 1.05, 0], [-9, 0, 0])
  ],
  cube: (b, t) => [
    part('box', b, [2.5, 2.3, 2.5], [0, 1.15, 0], [0, 14, 0]),
    part('box', t, [2.3, 0.3, 2.3], [0, 2.35, 0], [0, 14, 0])
  ],
  ball: (b, t) => [
    part('sphere', b, [2.7, 2.7, 2.7], [0, 1.35, 0]),
    part('sphere', t, [1.0, 0.7, 1.0], [0, 2.5, 0])
  ],
  grains: (b, t) => [],            // 아래 buildBite 에서 따로 만듭니다
  scoop: (b, t) => [
    part('sphere', b, [3.1, 2.5, 3.1], [0, 1.05, 0]),
    part('sphere', t, [1.3, 1.0, 1.3], [0.3, 2.1, 0.2])
  ],
  noodle_nest: (b, t) => [
    part('torus', b, [3.6, 1.1, 3.6], [0, 0.55, 0]),
    part('torus', b, [2.9, 1.0, 2.9], [0.2, 1.3, 0.1], [0, 34, 0]),
    part('sphere', t, [1.5, 0.7, 1.5], [0, 1.9, 0])
  ],
  skewer: (b, t) => [
    part('cylinder', '#C9A268', [0.32, 7.2, 0.32], [0.6, 0.45, 0], [0, 0, 90]),
    part('sphere', b, [1.9, 1.9, 1.9], [-1.9, 1.1, 0]),
    part('sphere', t, [1.9, 1.9, 1.9], [0, 1.1, 0]),
    part('sphere', b, [1.9, 1.9, 1.9], [1.9, 1.1, 0])
  ],
  heap: (b, t) => [
    part('cone', b, [3.3, 2.7, 3.3], [0, 1.35, 0]),
    part('sphere', t, [1.1, 1.1, 1.1], [0, 2.6, 0])
  ],
  ring: (b, t) => [
    part('torus', b, [3.3, 1.2, 3.3], [0, 0.6, 0]),
    part('torus', t, [3.3, 0.4, 3.3], [0, 1.1, 0])
  ],
  sheet: (b, t) => [
    part('box', b, [3.8, 0.32, 3.1], [0, 0.3, 0], [-6, 0, 5]),
    part('box', t, [3.0, 0.2, 2.4], [0, 0.5, 0], [-6, 0, 5])
  ]
};

const TOPPING = {
  dot:   (c, x, y) => part('sphere', c, [0.55, 0.55, 0.55], [x, y, 0.2]),
  stick: (c, x, y) => part('capsule', c, [1.7, 0.3, 0.3], [x, y, -0.2], [0, 25, 0]),
  flake: (c, x, y) => part('box', c, [0.9, 0.14, 0.7], [x, y, 0.1], [0, 30, 8])
};

// 한 입 묶음 만들기. 바닥이 y = 0 인 채로 돌려주고, 자리는 부르는 쪽이 정합니다.
function buildBite(bite) {
  const g = new THREE.Group();
  const base = pick(bite.base_color, '#D9D2C5');
  const top = pick(bite.top_color, bite.base_color, '#D9D2C5');
  let form = FORMS[bite.form] ? bite.form : (Array.isArray(bite.parts) && bite.parts.length ? 'custom' : 'scoop');
  // 한 술 뜬 밥·얼음을 둥근 덩어리로 그리면 쌀알 하나처럼 보입니다.
  // 바닥과 같은 색으로 퍼 담은 것만 알갱이 더미로 바꿉니다 (나물·고기 더미는 그대로).
  if (form === 'scoop' && vessel?.bedColor && near(base, vessel.bedColor)) form = 'grains';

  if (form === 'grains') {
    const kind = vessel?.bedKind === 'ice' ? 'ice' : (vessel?.bedKind === 'crumb' ? 'crumb' : 'rice');
    g.add(grainMound(kind, base, 1.7, 1.3, 46));
    if (isHex(bite.top_color)) g.add(part('sphere', top, [1.1, 0.8, 1.1], [0.2, 1.5, 0.1]));
  } else if (form === 'custom') {
    (bite.parts || []).slice(0, 5).forEach((p) => {
      const s = Array.isArray(p?.size) ? p.size : [2, 2, 2];
      const pos = Array.isArray(p?.pos) ? p.pos : [0, num(s[1], 2) / 2, 0];
      g.add(part(p?.shape, pick(p?.color, base), s, [num(pos[0], 0), Math.max(0, num(pos[1], 0)), num(pos[2], 0)], p?.rot));
    });
  } else {
    FORMS[form](base, top).forEach((m) => g.add(m));
  }
  if (!g.children.length) FORMS.scoop(base, top).forEach((m) => g.add(m));

  // 고명은 맨 위에
  const tops = Array.isArray(bite.toppings) ? bite.toppings.slice(0, 3) : [];
  if (tops.length) {
    const y = new THREE.Box3().setFromObject(g).max.y + 0.15;
    tops.forEach((t, i) => {
      const make = TOPPING[t?.kind] || TOPPING.dot;
      g.add(make(pick(t?.color, top), (i - (tops.length - 1) / 2) * 1.1, y));
    });
  }

  g.scale.setScalar(clamp(num(bite.scale, 1), 0.6, 1.5) * (vessel?.fit ?? 1));
  g.userData.form = form;
  return g;
}

/* ══════════════════════════════════════════════════════════
   7. 담기
   ══════════════════════════════════════════════════════════ */

let vessel = null;       // 지금 그릇
let slots = [];          // 한 입씩 놓을 자리
const bites = [];        // 아직 남은 음식
const eating = [];       // 사라지는 중인 음식
let placed = 0;          // 몇 입까지 놓았는지

function resetPlate() {
  [...table.children].forEach((c) => { disposeDeep(c); table.remove(c); });
  bites.length = 0;
  eating.length = 0;
  growing.length = 0;
  vessel = null;
  slots = [];
  placed = 0;
}

function buildVessel(serving, matter) {
  const kind = VESSELS[serving.vessel] ? serving.vessel
    : (MATTER_VESSEL[matter] || 'flat_plate');
  const size = clamp(num(serving.size, 20), 10, 34);
  vessel = VESSELS[kind](size, serving.color);
  vessel.kind = kind;
  vessel.size = size;
  vessel.matter = matter;
  table.add(vessel.obj);

  // 국물·소스
  const liquid = serving.liquid;
  if (liquid && isHex(liquid.color) && vessel.depth > 0.5) {
    const level = clamp(num(liquid.level, 0.5), 0.1, 0.95);
    const disc = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(liquid.color), roughness: 0.25, metalness: 0
    }));
    const y = vessel.depth * level;
    const rr = Math.min(vessel.size / 2 * 0.98, vessel.r * 1.6);
    disc.scale.set(rr * 2, 0.5, rr * 2);
    disc.position.y = y;
    disc.receiveShadow = true;
    table.add(disc);
    vessel.y0 = y;                                  // 음식은 국물 위에
    log(`국물 ${Math.round(level * 100)}%`, liquid.color);
  }

  // 오목한 그릇은 음식이 놓이는 높이에서의 넓이를 씁니다 (국물이 차오를수록 넓어짐)
  if (vessel.depth > 0.5) {
    const t = clamp(1 - vessel.y0 / vessel.depth, -1, 1);
    vessel.rim = (size / 2) * Math.sqrt(Math.max(0.05, 1 - t * t));   // 음식 높이에서 그릇 안쪽 너비
    vessel.r = vessel.rim * 0.78;
    vessel.rz = vessel.r;
  }

  // 밥·얼음처럼 알갱이가 그릇을 채우는 음식은 바닥을 먼저 깝니다.
  const bed = serving.bed ?? (matter === 'grain' ? { kind: 'rice', color: '#FAF5E9' } : null);
  if (bed && bed.kind !== 'smooth') {
    const bedR = Math.min((vessel.rim ?? vessel.size / 2) * 0.94, Math.max(vessel.r * 1.5, 4));
    const bedH = clamp(vessel.depth > 0.5 ? vessel.depth * 0.42 : bedR * 0.3, 1.4, 6);
    const count = clamp(Math.round(bedR * bedR * 4.2), 90, 460);
    const mound = grainMound(bed.kind, pick(bed.color, '#FAF5E9'), bedR, bedH, count);
    mound.position.y = vessel.y0;
    table.add(mound);
    growing.push({ mesh: mound, t: 0, to: new THREE.Vector3(1, 1, 1) });
    vessel.y0 += bedH * 0.72;                       // 음식은 그 위에
    vessel.r = Math.max(vessel.r, bedR * 0.62);
    vessel.rz = vessel.r;
    vessel.bedKind = bed.kind;
    vessel.bedColor = pick(bed.color, '#FAF5E9');
    log(`${BED_LABEL[bed.kind] ?? bed.kind} ${count}알`, bed.color);
  }

  const how = ARRANGE[serving.arrangement] ? serving.arrangement : 'grid';
  const count = clamp(Math.round(num(serving.count, 6)), 1, 9);
  slots = ARRANGE[how](count, vessel.r, vessel.rz ?? vessel.r);
  vessel.how = how;
  vessel.fit = fitScale(slots, how);

  frustum = Math.max(size, vessel.depth * 2.2) * 1.55;
  camTarget.set(0, vessel.depth * 0.34, 0);
  ORBIT.azim = Math.PI / 4;
  ORBIT.polar = 0.96;
  orbit();
  resizeCamera();

  log(`${VESSEL_LABEL[kind] ?? kind} ${Math.round(size)}cm`, serving.color);
  setStep(3, `${ARRANGE_LABEL[how] ?? how} · ${count}입`);
}

function placeBite(bite) {
  const g = buildBite(bite);
  const slot = slots[placed] || slots[slots.length - 1] || { x: 0, z: 0 };
  g.position.set(num(slot.x, 0), vessel.y0 + num(slot.y, 0), num(slot.z, 0));
  g.rotation.y = num(slot.ry, 0) + (placed % 2 ? 0.2 : -0.15);
  const form = g.userData.form;
  g.userData = { home: g.position.clone(), form };
  table.add(g);
  bites.push(g);
  placed += 1;
  log(`${String(bite.name ?? '한 점').slice(0, 14)} · ${form}`, bite.base_color);
}

// 한 입이 다 왔는지 (쓰는 중인 마지막 입은 아직 놓지 않습니다)
function biteReady(b) {
  return !!b && typeof b.name === 'string' && typeof b.form === 'string';
}

// 자리 수와 실제 입 수가 다르면 다 온 뒤에 다시 배치
function relayout() {
  if (!vessel || !bites.length) return;
  if (slots.length === bites.length) return;
  slots = ARRANGE[vessel.how](bites.length, vessel.r, vessel.rz ?? vessel.r);
  const refit = fitScale(slots, vessel.how) / (vessel.fit || 1);
  vessel.fit = (vessel.fit || 1) * refit;
  bites.forEach((g, i) => {
    g.scale.multiplyScalar(refit);
    const s = slots[i];
    g.position.set(num(s.x, 0), vessel.y0 + num(s.y, 0), num(s.z, 0));
    g.rotation.y = num(s.ry, 0);
    g.userData.home = g.position.clone();
  });
}

// 반쯤 온 spec 을 화면에 반영. final 이면 마지막 입까지 놓습니다.
function grow(spec, final) {
  if (!spec) return;
  // 그릇은 담는 방식(국물·배치·개수)까지 다 온 뒤에 만듭니다. 먼저 만들면 배치를 모릅니다.
  const sv = spec.serving;
  const servingReady = sv && typeof sv.vessel === 'string' && typeof sv.size === 'number'
    && typeof sv.arrangement === 'string' && typeof sv.count === 'number';
  if (!vessel && (servingReady || (final && sv))) buildVessel(sv, spec.matter);
  if (!vessel) return;

  const list = Array.isArray(spec.bites) ? spec.bites : [];
  list.forEach((b, i) => {
    if (i < placed) return;
    if (!final && i === list.length - 1) return;   // 아직 쓰는 중일 수 있음
    if (!biteReady(b)) return;
    placeBite(b);
  });
  if (final) relayout();
}

/* ══════════════════════════════════════════════════════════
   8. 먹기
   ══════════════════════════════════════════════════════════ */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const el = {
  osinagaki: document.getElementById('osinagaki'),
  dishName:  document.getElementById('dishName'),
  pips:      document.getElementById('pips'),
  composer:  document.getElementById('composer'),
  ask:       document.getElementById('ask'),
  input:     document.getElementById('orderInput'),
  hint:      document.getElementById('hint'),
  plating:   document.getElementById('plating'),
  process:   document.getElementById('process'),
  step1:     document.getElementById('step1'),
  step2:     document.getElementById('step2'),
  step3:     document.getElementById('step3'),
  logBox:    document.getElementById('log')
};

function drawPips(total, left) {
  el.pips.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const s = document.createElement('i');
    s.className = 'pip' + (i < total - left ? ' gone' : '');
    el.pips.appendChild(s);
  }
}

let servedTotal = 0;

function eat(group) {
  const i = bites.indexOf(group);
  if (i < 0) return;
  bites.splice(i, 1);

  eating.push({ g: group, t: 0 });
  drawPips(servedTotal, bites.length);

  if (bites.length === 0) setTimeout(finishCourse, 620);
}

function finishCourse() {
  el.dishName.textContent = '잘 드셨습니다';
  el.ask.textContent = '다음은 무엇으로 하시겠습니까';
  el.input.value = '';
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  el.composer.classList.remove('hidden');
}

/* 드래그는 회전, 짧게 누르면 먹기 */
let dragging = false, moved = 0, lastX = 0, lastY = 0, spin = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; spin = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  spin = -dx * 0.006;                                              // 좌우: 놓으면 천천히 멎음
  ORBIT.azim += spin;
  ORBIT.polar = clamp(ORBIT.polar + dy * 0.0045, ORBIT.min, ORBIT.max);   // 위아래
  orbit();
});

renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;                 // 돌린 것이지 누른 것이 아님
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bites, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o.parent && o.parent !== table) o = o.parent;
  eat(o);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor =
    raycaster.intersectObjects(bites, true).length ? 'pointer' : 'default';
});

const LOG_MAX = 80;

const MATTER_LABEL = { drink: '음료', soup: '국물', grain: '알갱이', noodle: '면', object: '덩어리' };
const VESSEL_LABEL = {
  flat_plate: '평접시', rimmed_plate: '테두리 접시', bowl: '사발', deep_bowl: '깊은 면기',
  stone_pot: '돌솥', board: '나무 도마', basket: '바구니', glass: '유리잔'
};
const BED_LABEL = { rice: '밥알', ice: '간 얼음', crumb: '부스러기', smooth: '덩어리' };
const ARRANGE_LABEL = {
  row: '한 줄', grid: '격자', ring: '둥글게', fan: '부채꼴', mound: '수북이',
  stack: '포개기', scatter: '흩뿌리기', submerged: '국물에 잠기게'
};
// 형상이 정해지면 그릇도 대개 정해집니다 (모델이 그릇을 안 고르면 이걸로)
const MATTER_VESSEL = { drink: 'glass', soup: 'deep_bowl', grain: 'bowl', noodle: 'deep_bowl', object: 'flat_plate' };

// 생각하는 순서를 그대로 보여 줍니다: ① 형상 ② 그릇 ③ 담기
function setStep(n, head, tail) {
  const box = el['step' + n];
  if (!box) return;
  box.querySelector('span').textContent = head + (tail ? ` · ${tail}` : '');
  box.classList.add('on');
}

function clearProcess() {
  [1, 2, 3].forEach((n) => {
    el['step' + n].querySelector('span').textContent = '…';
    el['step' + n].classList.remove('on');
  });
  el.logBox.innerHTML = '';
  el.process.classList.remove('on', 'done');
}

function log(text, color) {
  const line = document.createElement('div');
  if (isHex(color)) {
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = color;
    line.appendChild(dot);
  }
  line.appendChild(document.createTextNode(text));
  el.logBox.appendChild(line);
  while (el.logBox.children.length > LOG_MAX) el.logBox.firstChild.remove();
  el.logBox.scrollTop = el.logBox.scrollHeight;   // 쌓이면서 아래로 따라감
}

/* ══════════════════════════════════════════════════════════
   10. 반쯤 온 JSON 읽기
   ══════════════════════════════════════════════════════════ */

// 아직 닫히지 않은 괄호를 임시로 닫아 봅니다. 글자를 쓰는 중이면 null.
function closeUp(src) {
  const stack = [];
  let inStr = false, esc = false;
  for (const c of src) {
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === '{') stack.push('}');
    else if (c === '[') stack.push(']');
    else if (c === '}' || c === ']') stack.pop();
  }
  if (inStr) return null;
  return src + stack.reverse().join('');
}

// 지금까지 온 만큼만 읽어 낸 객체 (뒤에서부터 잘라 가며 말이 되는 지점을 찾음)
function parsePartial(raw) {
  // 스키마 없이 받은 경우 ```json 울타리가 붙어 올 수 있습니다.
  const text = raw.replace(/^[^[{]*/, '');
  for (let end = text.length; end > 0; end--) {
    const c = text[end - 1];
    if (c !== '}' && c !== ']' && c !== '"' && !/[0-9a-z]/.test(c)) continue;
    const cand = closeUp(text.slice(0, end));
    if (cand === null) continue;
    try { return JSON.parse(cand); } catch { /* 더 앞으로 */ }
  }
  return null;
}

// 아직 닫히지 않은 문장도 쓰이는 대로 보여 줍니다. (JSON 이 다 오기 전에 값만 훔쳐봄)
function peekString(text, key) {
  const at = text.indexOf('"' + key + '"');
  if (at < 0) return '';
  const colon = text.indexOf(':', at);
  const open = text.indexOf('"', colon + 1);
  if (colon < 0 || open < 0) return '';
  let out = '';
  for (let i = open + 1; i < text.length; i++) {
    const c = text[i];
    if (c === '"') break;
    if (c !== '\\') { out += c; continue; }
    const n = text[i + 1];
    if (n === undefined) break;
    if (n === 'u') {
      const hex = text.slice(i + 2, i + 6);
      if (hex.length < 4) break;
      out += String.fromCharCode(parseInt(hex, 16));
      i += 5;
      continue;
    }
    out += ({ n: '\n', t: '\t', r: '' })[n] ?? n;
    i += 1;
  }
  return out;
}

// 예전 함수(좌표까지 보내던 방식)의 응답도 받아 줍니다.
function asServing(spec) {
  if (!spec || !Array.isArray(spec.items) || spec.bites) return spec;
  const plate = spec.plate ?? {};
  return {
    dish: spec.dish,
    matter: 'object',
    serving: {
      vessel: plate.shape === 'square' ? 'board' : 'flat_plate',
      size: num(plate.width, 20),
      color: plate.color,
      arrangement: 'scatter',
      count: spec.items.length
    },
    bites: spec.items.map((it) => ({
      name: it?.name, form: 'custom', base_color: it?.parts?.[0]?.color,
      parts: (it?.parts ?? []).map((p) => ({ ...p, pos: undefined }))
    }))
  };
}

/* ══════════════════════════════════════════════════════════
   11. 주문 → 주방 → 그릇
   ══════════════════════════════════════════════════════════ */

async function askKitchen(order, onText) {
  const res = await fetch(KITCHEN, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({ order })
  });

  if (!res.ok || !res.body) {
    const body = await res.json().catch(() => null);
    throw new Error(body?.error || `주방에서 응답이 없습니다 (${res.status})`);
  }

  // 함수가 아직 한 번에 보내는 예전 방식이면, 받은 JSON 을 그대로 씁니다.
  if (!(res.headers.get('content-type') || '').includes('text/event-stream')) {
    const whole = await res.text();
    if (!whole.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
    onText(whole);
    return whole;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', text = '';

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let msg;
      try { msg = JSON.parse(line.slice(5)); } catch { continue; }
      if (msg.error) throw new Error(msg.error);
      if (msg.t) { text += msg.t; onText(text); }
    }
  }
  if (!text.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
  return text;
}

let busy = false;

async function order(text) {
  if (busy) return;
  const q = text.trim();
  if (!q) return;

  busy = true;
  el.composer.classList.add('hidden');
  el.osinagaki.classList.remove('on');
  el.plating.classList.add('on');
  clearProcess();
  resetPlate();

  // 글자가 올 때마다: 구상은 글로, 그릇과 음식은 그 자리에서 3D 로
  const onText = (all) => {
    el.plating.classList.remove('on');
    el.process.classList.add('on');

    const spec = asServing(parsePartial(all));
    if (spec?.dish && el.dishName.textContent !== spec.dish) {
      el.dishName.textContent = spec.dish;
      el.osinagaki.classList.add('on');
    }
    // 생각하는 순서 그대로: ① 무슨 형상인지 ② 그러면 무슨 그릇인지 ③ 어떻게 담는지
    if (spec?.matter) setStep(1, MATTER_LABEL[spec.matter] ?? spec.matter, peekString(all, 'matter_why'));
    if (spec?.serving?.vessel) {
      setStep(2, VESSEL_LABEL[spec.serving.vessel] ?? spec.serving.vessel, peekString(all, 'vessel_why'));
    }
    grow(spec, false);
  };

  try {
    const raw = await askKitchen(q, onText);
    const spec = asServing(parsePartial(raw));
    grow(spec, true);
    if (!bites.length) throw new Error('이 주문은 담아내지 못했습니다. 다르게 말씀해 주세요');

    servedTotal = bites.length;
    el.dishName.textContent = spec.dish || q;
    drawPips(servedTotal, servedTotal);
    el.osinagaki.classList.add('on');
    setTimeout(() => el.process.classList.add('done'), 1600);
  } catch (err) {
    resetPlate();
    clearProcess();
    el.osinagaki.classList.remove('on');
    el.dishName.textContent = '';
    el.hint.textContent = err.message || '무언가 잘못되었습니다';
    el.hint.classList.add('warn');
    el.composer.classList.remove('hidden');
    el.input.focus();
  } finally {
    el.plating.classList.remove('on');
    busy = false;
  }
}

el.input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  order(el.input.value);
});

el.input.focus();

/* ══════════════════════════════════════════════════════════
   12. 그리기
   ══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // 손을 뗀 뒤 남은 회전이 천천히 멎습니다.
  if (!dragging && Math.abs(spin) > 0.00002) {
    ORBIT.azim += spin;
    spin *= 0.92;
    orbit();
  }

  // 막 놓인 조각: 작은 점에서 제 크기로 부풀어 오릅니다.
  for (let i = growing.length - 1; i >= 0; i--) {
    const g = growing[i];
    g.t += dt / 0.28;
    const k = Math.min(1, g.t);
    const ease = 1 - Math.pow(1 - k, 3);
    g.mesh.scale.set(
      Math.max(0.001, g.to.x * ease),
      Math.max(0.001, g.to.y * ease),
      Math.max(0.001, g.to.z * ease)
    );
    if (k >= 1) growing.splice(i, 1);
  }

  // 먹히는 중인 음식: 살짝 떠올랐다가 작아지며 사라집니다.
  for (let i = eating.length - 1; i >= 0; i--) {
    const e = eating[i];
    e.t += dt / 0.42;
    const k = Math.min(1, e.t);
    const ease = 1 - Math.pow(1 - k, 3);
    e.g.position.y = e.g.userData.home.y + ease * 5.5;
    e.g.rotation.y += dt * 2.4;
    e.g.scale.multiplyScalar(Math.max(0.001, 1 - dt * 3.4));
    if (k >= 1) {
      disposeDeep(e.g);
      table.remove(e.g);
      eating.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
