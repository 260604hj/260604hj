<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오마카세</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:      #EFEAE1;
    --ink-dim:  #8C867C;
    --ink-faint:#4A463F;
    --bg:       #000000;
    --line:     #2A2722;
    --pad-top:   env(safe-area-inset-top, 0px);
    --pad-bot:   env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; touch-action:none; }

  /* ── 오시나가키: 왼쪽 위 차림표 ───────────────────────── */
  .osinagaki{
    position:fixed; z-index:5;
    top:calc(var(--pad-top) + 22px); left:22px;
    max-width:min(60vw, 320px);
    pointer-events:none;
    opacity:0; transition:opacity .5s ease;
  }
  .osinagaki.on{ opacity:1; }
  .osinagaki .dish{
    font-family:"Gowun Batang", serif;
    font-size:19px; line-height:1.35; letter-spacing:.02em;
    margin:0;
  }
  .osinagaki .left{
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    margin-top:11px; min-height:8px;
    font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  .pip{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink); opacity:.85;
    transition:transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .pip.gone{
    background:transparent;
    box-shadow:inset 0 0 0 1px var(--ink-faint);
    transform:scale(.72);
  }

  /* ── 아래쪽 주문 ────────────────────────────────────── */
  .composer{
    position:fixed; z-index:5;
    left:50%; transform:translateX(-50%);
    bottom:calc(var(--pad-bot) + 30px);
    width:min(540px, 84vw);
    text-align:center;
    transition:opacity .45s ease;
  }
  .composer.hidden{ opacity:0; pointer-events:none; }
  .composer .ask{
    font-family:"Gowun Batang", serif;
    font-size:15px; color:var(--ink-dim);
    margin:0 0 14px;
  }
  .composer input{
    width:100%; background:transparent; border:0;
    border-bottom:1px solid var(--line);
    padding:9px 2px; text-align:center;
    font-family:"IBM Plex Sans KR", sans-serif;
    font-size:17px; font-weight:300; color:var(--ink);
    outline:none; transition:border-color .25s ease;
  }
  .composer input:focus{ border-bottom-color:var(--ink-dim); }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:200; }
  .composer .hint{
    margin:12px 0 0; font-size:12px; font-weight:200; color:var(--ink-faint);
    min-height:16px;
  }
  .composer .hint.warn{ color:#B9855A; }

  /* ── 준비 중 표시 ───────────────────────────────────── */
  .plating{
    position:fixed; inset:0; z-index:4;
    display:none; place-items:center;
    font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim);
    pointer-events:none;
  }
  .plating.on{ display:grid; }
  .plating span{ animation:breathe 1.9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── 생각하는 과정 ──────────────────────────────────── */
  .process{
    position:fixed; z-index:5;
    left:22px; bottom:calc(var(--pad-bot) + 26px);
    width:min(56vw, 370px);
    pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  .process.on{ opacity:1; }
  .process.done{ opacity:.3; }
  .process .steps{ margin-bottom:13px; }
  .process .step{
    display:flex; gap:10px; align-items:baseline;
    font-size:13px; line-height:1.55; margin-bottom:3px;
    color:var(--ink-faint);
    opacity:.45; transition:opacity .4s ease, color .4s ease;
  }
  .process .step.on{ opacity:1; color:var(--ink-dim); }
  .process .step b{
    flex:none; width:34px;
    font-weight:400; font-size:11px; letter-spacing:.08em;
    color:var(--ink-faint);
  }
  .process .step.on b{ color:var(--ink-dim); }
  .process .step span{ font-family:"Gowun Batang", serif; }
  .process .log{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.85; color:var(--ink-faint);
    white-space:pre;
    max-height:34vh; overflow-y:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 20%);
            mask-image:linear-gradient(to bottom, transparent, #000 20%);
  }
  .process .log::-webkit-scrollbar{ display:none; }
  .process .log div{ display:flex; gap:7px; align-items:center; }
  .process .swatch{
    display:inline-block; width:7px; height:7px; flex:none; border-radius:1px;
  }

  /* ── 뒤로 가기 ─────────────────────────────────────── */
  .back{
    position:fixed; z-index:6;
    top:calc(var(--pad-top) + 22px); right:22px;
    font-size:13px; color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--ink-dim); }

  :focus-visible{ outline:1px solid var(--ink-dim); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="osinagaki" id="osinagaki">
  <p class="dish" id="dishName"></p>
  <div class="left" id="pips"></div>
</div>

<a class="back" href="../visitor.html">←</a>

<div class="plating" id="plating"><span>주문을 받았습니다</span></div>

<div class="process" id="process">
  <div class="steps">
    <div class="step" id="step1"><b>형상</b><span>…</span></div>
    <div class="step" id="step2"><b>그릇</b><span>…</span></div>
    <div class="step" id="step3"><b>층</b><span>…</span></div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="composer" id="composer">
  <p class="ask" id="ask">오늘은 무엇을 드시겠습니까</p>
  <input id="orderInput" type="text" autocomplete="off" placeholder="예: 마르게리타 피자, 돈코츠 라멘, 딸기 빙수" />
  <p class="hint" id="hint">입력하고 엔터</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   1. 서버 연결
   ══════════════════════════════════════════════════════════ */

// Supabase 대시보드 > Connect 에서 복사
// KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

// 서버는 ① 형상 ② 그릇 ③ 층(무엇을 몇 개 어떻게) 만 보냅니다.
// 조각의 모양, 놓이는 자리, 쌓이는 높이는 전부 여기서 만듭니다.
const KITCHEN = `${SUPABASE_URL}/functions/v1/omacase`;

/* ══════════════════════════════════════════════════════════
   2. 화면
   ══════════════════════════════════════════════════════════ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const table = new THREE.Group();     // 그릇과 음식이 모두 들어가는 묶음
scene.add(table);

let frustum = 30;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

// 카메라가 그릇 둘레를 돕니다. azim 좌우, polar 위아래(0 이면 바로 위에서)
const ORBIT = { dist: 110, azim: Math.PI / 4, polar: 0.96, min: 0.14, max: 1.36 };
const camTarget = new THREE.Vector3(0, 0, 0);

function orbit() {
  const { dist, azim, polar } = ORBIT;
  camera.position.set(
    camTarget.x + dist * Math.sin(polar) * Math.cos(azim),
    camTarget.y + dist * Math.cos(polar),
    camTarget.z + dist * Math.sin(polar) * Math.sin(azim)
  );
  camera.lookAt(camTarget);
}

function resizeCamera() {
  const a = innerWidth / innerHeight;
  const h = frustum / 2;
  const wHalf = a >= 1 ? h * a : h;
  const vHalf = a >= 1 ? h : h / a;
  camera.left = -wHalf; camera.right = wHalf;
  camera.top = vHalf;  camera.bottom = -vHalf;
  camera.updateProjectionMatrix();
}
orbit();
resizeCamera();

const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(34, 56, 26);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -26;
keyLight.shadow.camera.right = 26;
keyLight.shadow.camera.top = 26;
keyLight.shadow.camera.bottom = -26;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 160;
keyLight.shadow.bias = -0.0009;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe6ef, 0.5);
fillLight.position.set(-30, 22, -18);
scene.add(fillLight);

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 0.7));

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  resizeCamera();
});

/* ══════════════════════════════════════════════════════════
   3. 기본 도형
   ══════════════════════════════════════════════════════════ */

const UNIT = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  sphere:   new THREE.SphereGeometry(0.5, 26, 16),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 30),
  cone:     new THREE.ConeGeometry(0.5, 1, 24),
  capsule:  new THREE.CapsuleGeometry(0.3, 0.4, 5, 16),
  torus:    new THREE.TorusGeometry(0.35, 0.15, 12, 30),
  wedge:    new THREE.CylinderGeometry(0.5, 0.5, 1, 14, 1, false, 0, Math.PI / 2.6)
};
UNIT.capsule.computeBoundingBox();
(() => {
  const b = UNIT.capsule.boundingBox, s = new THREE.Vector3();
  b.getSize(s);
  UNIT.capsule.scale(1 / s.x, 1 / s.y, 1 / s.z);
})();
UNIT.torus.rotateX(-Math.PI / 2);

const toRad = (d) => (d || 0) * Math.PI / 180;
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isHex = (c) => /^#[0-9a-fA-F]{6}$/.test(String(c ?? '').trim());
const pick = (...c) => c.find(isHex) ?? '#D8B490';

// ref/foodspace.3dm 의 팔레트는 채널이 모두 18 의 배수입니다. 같은 결로 맞춥니다.
function snap18(hex) {
  const v = parseInt(String(hex).slice(1), 16);
  const q = (x) => clamp(Math.round(x / 18) * 18, 0, 252);
  return (q((v >> 16) & 255) << 16) | (q((v >> 8) & 255) << 8) | q(v & 255);
}
function foodColor(hex, fallback) {
  return new THREE.Color(snap18(pick(hex, fallback)));
}
function safeColor(hex, fallback = '#CCCCCC') {
  return new THREE.Color(isHex(hex) ? hex : fallback);
}

const growing = [];   // 방금 놓여서 커지는 중인 것

// 조각 하나. 놓이는 순간이 보이도록 작은 점에서 제 크기로 부풀립니다.
function part(shape, color, size, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const mesh = new THREE.Mesh(UNIT[shape] || UNIT.box, new THREE.MeshStandardMaterial({
    color: foodColor(color), roughness: 0.78, metalness: 0
  }));
  const to = new THREE.Vector3(
    clamp(num(size[0], 1), 0.04, 30),
    clamp(num(size[1], 1), 0.04, 30),
    clamp(num(size[2], 1), 0.04, 30)
  );
  mesh.position.set(num(pos[0], 0), num(pos[1], 0), num(pos[2], 0));
  mesh.rotation.set(toRad(num(rot[0], 0)), toRad(num(rot[1], 0)), toRad(num(rot[2], 0)));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.scale.set(0.001, 0.001, 0.001);
  growing.push({ mesh, t: 0, to });
  return mesh;
}

function disposeDeep(obj) {
  obj.traverse((o) => { if (o.isMesh) o.material?.dispose(); });
}

/* ══════════════════════════════════════════════════════════
   4. 그릇
   ══════════════════════════════════════════════════════════ */

function hollow(size, height, color, opts = {}) {
  const R = size / 2, N = 16, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(R * Math.sin(t * Math.PI / 2) * 0.99, height * (1 - Math.cos(t * Math.PI / 2))));
  }
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(pts, 56), new THREE.MeshStandardMaterial({
    color: safeColor(color, '#F2F0EC'), roughness: 0.55, metalness: 0, side: THREE.DoubleSide, ...opts
  }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function flat(color, size, pos) {
  const mesh = new THREE.Mesh(UNIT.box, new THREE.MeshStandardMaterial({
    color: safeColor(color, '#B08050'), roughness: 0.7, metalness: 0
  }));
  mesh.scale.set(...size);
  mesh.position.set(...pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// obj(3D), y0(음식이 놓이기 시작하는 높이), rx·rz(놓을 수 있는 넓이), depth(그릇 깊이)
const VESSELS = {
  flat_plate(size, color) {
    const m = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    m.scale.set(size, 1.2, size);
    m.position.y = -0.6;
    m.castShadow = true; m.receiveShadow = true;
    return { obj: m, y0: 0, rx: size / 2 - 1.4, rz: size / 2 - 1.4, depth: 0 };
  },
  rimmed_plate(size, color) {
    const g = new THREE.Group();
    g.add(VESSELS.flat_plate(size * 0.97, color).obj);
    const rimGeo = new THREE.TorusGeometry(size / 2 - 0.6, 0.62, 14, 64);
    rimGeo.rotateX(-Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    rim.castShadow = true; rim.receiveShadow = true;
    g.add(rim);
    return { obj: g, y0: 0.2, rx: size / 2 - 2.4, rz: size / 2 - 2.4, depth: 0.8 };
  },
  bowl(size, color) {
    const h = size * 0.40;
    return { obj: hollow(size, h, color), y0: h * 0.30, rx: 0, rz: 0, depth: h };
  },
  deep_bowl(size, color) {
    const h = size * 0.62;
    return { obj: hollow(size, h, color), y0: h * 0.44, rx: 0, rz: 0, depth: h };
  },
  stone_pot(size, color) {
    const h = size * 0.46;
    const g = new THREE.Group();
    g.add(hollow(size, h, color || '#3A3632'));
    const foot = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#3A3632'), roughness: 0.85, metalness: 0
    }));
    foot.scale.set(size * 0.55, 1.1, size * 0.55);
    foot.position.y = -0.55;
    foot.castShadow = true; foot.receiveShadow = true;
    g.add(foot);
    return { obj: g, y0: h * 0.36, rx: 0, rz: 0, depth: h };
  },
  board(size, color) {
    const d = size * 0.74;
    const g = new THREE.Group();
    g.add(flat(color || '#B08050', [size, 1.5, d], [0, -0.75, 0]));
    return { obj: g, y0: 0, rx: size / 2 - 1.4, rz: d / 2 - 1.4, depth: 0 };
  },
  basket(size, color) {
    const h = size * 0.34;
    const g = new THREE.Group();
    g.add(hollow(size, h, color || '#C8A66B'));
    const lipGeo = new THREE.TorusGeometry(size / 2 * 0.99, 0.45, 12, 52);
    lipGeo.rotateX(-Math.PI / 2);
    const lip = new THREE.Mesh(lipGeo, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#C8A66B'), roughness: 0.85, metalness: 0
    }));
    lip.position.y = h;
    lip.castShadow = true; lip.receiveShadow = true;
    g.add(lip);
    return { obj: g, y0: h * 0.34, rx: 0, rz: 0, depth: h };
  },
  glass(size, color) {
    const h = size * 1.2;
    const obj = hollow(size, h, color || '#CFE0E6', { transparent: true, opacity: 0.4, roughness: 0.1 });
    obj.castShadow = false;
    return { obj, y0: h * 0.34, rx: 0, rz: 0, depth: h };
  }
};

/* ══════════════════════════════════════════════════════════
   5. 알갱이 — 밥·간 얼음처럼 작은 알이 모인 것
   ══════════════════════════════════════════════════════════ */

const GRAIN_GEO = {
  grains: new THREE.CapsuleGeometry(0.16, 0.26, 3, 7),
  ice:    new THREE.IcosahedronGeometry(0.24, 0),
  crumb:  new THREE.BoxGeometry(0.3, 0.22, 0.28),
  leaf:   new THREE.SphereGeometry(0.3, 7, 5),
  round:  new THREE.SphereGeometry(0.3, 8, 6)
};

// 난수 대신 규칙으로 흩뿌립니다 (같은 주문이면 같은 모습).
function sunflower(i, n) {
  return { k: Math.sqrt((i + 0.5) / n), a: i * 2.39996 };
}

// 덩어리 돔 위에 알갱이 수백 개를 덮습니다. 속은 채우지 않습니다.
function grainMound(geoKey, color, R, H, count) {
  const g = new THREE.Group();
  const base = foodColor(color);

  const dome = new THREE.Mesh(UNIT.sphere, new THREE.MeshStandardMaterial({
    color: base.clone().multiplyScalar(0.88), roughness: 0.9, metalness: 0
  }));
  dome.scale.set(R * 2, H * 1.9, R * 2);
  dome.position.y = -H * 0.02;
  dome.castShadow = true; dome.receiveShadow = true;
  g.add(dome);

  const grains = new THREE.InstancedMesh(
    GRAIN_GEO[geoKey] || GRAIN_GEO.grains,
    new THREE.MeshStandardMaterial({ color: base, roughness: 0.82, metalness: 0 }),
    count
  );
  grains.castShadow = true; grains.receiveShadow = true;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), sc = new THREE.Vector3(), tint = new THREE.Color();
  const size = clamp(R / 7, 0.75, 1.5);

  for (let i = 0; i < count; i++) {
    const { k, a } = sunflower(i, count);
    const rr = R * 0.985 * k;
    const surface = H * 0.95 * Math.sqrt(Math.max(0, 1 - k * k));
    pos.set(Math.cos(a) * rr, surface + Math.sin(i * 12.9898) * 0.11 * size, Math.sin(a) * rr);
    e.set(i * 1.7, a + i * 0.31, Math.sin(i * 7.1) * 0.9);
    q.setFromEuler(e);
    sc.setScalar(size * (0.85 + 0.3 * (0.5 + 0.5 * Math.sin(i * 3.7))));
    m.compose(pos, q, sc);
    grains.setMatrixAt(i, m);
    tint.copy(base).multiplyScalar(0.92 + 0.13 * (0.5 + 0.5 * Math.cos(i * 2.1)));
    grains.setColorAt(i, tint);
  }
  grains.instanceMatrix.needsUpdate = true;
  if (grains.instanceColor) grains.instanceColor.needsUpdate = true;
  g.add(grains);
  return g;
}

// 고명처럼 작은 것을 여러 자리에 한 번에 뿌립니다.
function sprinkle(geoKey, color, spots, size) {
  const base = foodColor(color);
  const mesh = new THREE.InstancedMesh(
    GRAIN_GEO[geoKey] || GRAIN_GEO.crumb,
    new THREE.MeshStandardMaterial({ color: base, roughness: 0.8, metalness: 0 }),
    spots.length
  );
  mesh.castShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const p = new THREE.Vector3(), sc = new THREE.Vector3(), tint = new THREE.Color();
  spots.forEach((s, i) => {
    p.set(s.x, s.y, s.z);
    e.set(Math.sin(i * 5.3) * 0.5, i * 1.31, Math.cos(i * 2.7) * 0.5);
    q.setFromEuler(e);
    const f = size * (0.8 + 0.4 * (0.5 + 0.5 * Math.sin(i * 4.1)));
    sc.set(f, f * (geoKey === 'leaf' ? 0.35 : 0.8), f * (geoKey === 'leaf' ? 0.6 : 1));
    m.compose(p, q, sc);
    mesh.setMatrixAt(i, m);
    tint.copy(base).multiplyScalar(0.9 + 0.16 * (0.5 + 0.5 * Math.cos(i * 1.7)));
    mesh.setColorAt(i, tint);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

/* ══════════════════════════════════════════════════════════
   6. 조각 — 이름만 오면 모양은 여기서. w 는 그 조각의 폭(cm)
   ══════════════════════════════════════════════════════════ */

const PIECES = {
  disc: (w, c, t) => [
    part('cylinder', c, [w, w * 0.13, w], [0, w * 0.065, 0]),
    part('cylinder', t ?? c, [w * 0.88, w * 0.05, w * 0.88], [0, w * 0.15, 0])
  ],
  sheet: (w, c, t) => [
    part('box', c, [w, w * 0.07, w * 0.86], [0, w * 0.04, 0], [-5, 14, 4])
  ],
  slab: (w, c, t) => [
    part('box', c, [w, w * 0.4, w * 0.72], [0, w * 0.2, 0]),
    part('box', t ?? c, [w * 0.92, w * 0.1, w * 0.66], [0, w * 0.45, 0])
  ],
  wedge: (w, c, t) => [
    part('wedge', c, [w * 1.6, w * 0.22, w * 1.6], [0, w * 0.11, 0]),
    part('wedge', t ?? c, [w * 1.44, w * 0.08, w * 1.44], [0, w * 0.25, 0])
  ],
  round: (w, c, t) => [
    part('sphere', c, [w, w * 0.92, w], [0, w * 0.46, 0]),
    part('sphere', t ?? c, [w * 0.42, w * 0.3, w * 0.42], [0, w * 0.88, 0])
  ],
  dome: (w, c, t) => [
    part('sphere', c, [w, w * 0.78, w], [0, w * 0.3, 0]),
    part('sphere', t ?? c, [w * 0.36, w * 0.26, w * 0.36], [w * 0.1, w * 0.66, 0])
  ],
  rod: (w, c, t) => [
    part('capsule', c, [w, w * 0.38, w * 0.38], [0, w * 0.19, 0], [0, 0, 90])
  ],
  ring: (w, c, t) => [
    part('torus', c, [w, w * 0.34, w], [0, w * 0.17, 0])
  ],
  cone: (w, c, t) => [
    part('cone', c, [w, w * 0.82, w], [0, w * 0.41, 0]),
    part('sphere', t ?? c, [w * 0.3, w * 0.3, w * 0.3], [0, w * 0.8, 0])
  ],
  nest: (w, c, t) => [
    part('torus', c, [w, w * 0.3, w], [0, w * 0.15, 0]),
    part('torus', c, [w * 0.76, w * 0.26, w * 0.76], [w * 0.05, w * 0.32, 0], [0, 34, 0]),
    part('sphere', t ?? c, [w * 0.4, w * 0.2, w * 0.4], [0, w * 0.44, 0])
  ],
  cube: (w, c, t) => [
    part('box', c, [w * 0.86, w * 0.8, w * 0.86], [0, w * 0.4, 0], [0, 14, 0])
  ],
  nigiri: (w, c, t) => [
    part('box', c, [w, w * 0.42, w * 0.62], [0, w * 0.21, 0]),
    part('box', t ?? c, [w * 1.06, w * 0.14, w * 0.68], [0, w * 0.48, 0], [0, 0, 3])
  ],
  roll: (w, c, t) => [
    part('cylinder', t ?? '#242424', [w, w * 0.78, w], [0, w * 0.39, 0]),
    part('cylinder', c, [w * 0.76, w * 0.82, w * 0.76], [0, w * 0.42, 0])
  ],
  leaf: (w, c, t) => [
    part('sphere', c, [w, w * 0.12, w * 0.6], [0, w * 0.06, 0], [0, 24, 7])
  ]
};

// 조각 하나의 높이(폭 대비). 층을 얼마나 올릴지 계산할 때 씁니다.
const PIECE_H = {
  disc: 0.18, sheet: 0.1, slab: 0.5, wedge: 0.3, round: 1, dome: 0.7, rod: 0.4,
  ring: 0.36, cone: 0.9, nest: 0.5, cube: 0.8, nigiri: 0.56, roll: 0.82, leaf: 0.12
};

function buildPiece(form, w, color, topColor) {
  const g = new THREE.Group();
  (PIECES[form] || PIECES.round)(w, color, topColor).forEach((m) => g.add(m));
  return g;
}

/* ══════════════════════════════════════════════════════════
   7. 놓는 자리 — 배치 이름만 오면 좌표는 여기서
   ══════════════════════════════════════════════════════════ */

const spread = (n, f) => Array.from({ length: n }, (_, i) => f(i));

const PATTERNS = {
  row: (n, rx) => spread(n, (i) => ({ x: (i - (n - 1) / 2) * ((2 * rx) / n), z: 0 })),
  grid: (n, rx, rz) => {
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    return spread(n, (i) => ({
      x: ((i % cols) - (cols - 1) / 2) * ((2 * rx) / cols),
      z: (Math.floor(i / cols) - (rows - 1) / 2) * ((2 * rz) / rows)
    }));
  },
  ring: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.7, z: Math.sin(a) * rz * 0.7, ry: -a };
  }),
  fan: (n, rx, rz) => spread(n, (i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const a = (-0.5 + t) * Math.PI;
    return { x: Math.cos(a) * rx * 0.66, z: Math.sin(a) * rz * 0.5 + rz * 0.2, ry: -a + Math.PI / 2 };
  }),
  scatter: (n, rx, rz) => spread(n, (i) => {
    const { k, a } = sunflower(i, n);
    return { x: Math.cos(a) * rx * 0.86 * k, z: Math.sin(a) * rz * 0.86 * k, ry: a };
  }),
  mound: (n, rx, rz) => spread(n, (i) => {
    const { k, a } = sunflower(i, n);
    return { x: Math.cos(a) * rx * 0.6 * k, z: Math.sin(a) * rz * 0.6 * k, y: (1 - k) * 1.8, ry: a };
  }),
  stack: (n) => spread(n, (i) => ({ x: Math.sin(i * 1.1) * 0.6, z: Math.cos(i * 1.1) * 0.6, y: i * 1.1, ry: i * 0.5 })),
  submerged: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.62, z: Math.sin(a) * rz * 0.62, y: -0.5, ry: -a };
  }),
  fill: (n, rx, rz) => spread(n, () => ({ x: 0, z: 0 }))
};

// 자리끼리 너무 가까우면 조각을 줄여 겹치지 않게 합니다.
function fitScale(spots, w, pattern) {
  if (pattern === 'mound' || pattern === 'stack' || pattern === 'fill' || spots.length < 2) return 1;
  let min = Infinity;
  for (let i = 0; i < spots.length; i++) {
    for (let j = i + 1; j < spots.length; j++) {
      min = Math.min(min, Math.hypot(spots[i].x - spots[j].x, spots[i].z - spots[j].z));
    }
  }
  return clamp((min * 1.15) / w, 0.45, 1.2);
}

/* ══════════════════════════════════════════════════════════
   8. 담기 — 바닥부터 한 층씩
   ══════════════════════════════════════════════════════════ */

const ROLE_LABEL = { base: '바닥', body: '몸통', top: '위', accent: '고명' };
const SIZE_RANGE = { base: [6, 30], body: [1.5, 12], top: [0.8, 6], accent: [0.25, 2] };
const COUNT_RANGE = { base: [1, 3], body: [1, 14], top: [1, 30], accent: [4, 90] };
const DEFAULT_SIZE = { base: 18, body: 4, top: 2.2, accent: 0.7 };
const DEFAULT_COUNT = { base: 1, body: 6, top: 12, accent: 30 };

let vessel = null;
let deck = 0;          // 지금까지 쌓인 윗면
let peak = 0;          // 전체에서 가장 높은 곳 (고명은 여기에)
let layersDone = 0;
const bites = [];      // 집어 먹을 수 있는 조각
const eating = [];     // 사라지는 중
let leftovers = null;  // 바닥·고명처럼 집어 먹지 않는 것

function resetPlate() {
  [...table.children].forEach((c) => { disposeDeep(c); table.remove(c); });
  bites.length = 0;
  eating.length = 0;
  growing.length = 0;
  vessel = null;
  leftovers = null;
  deck = peak = 0;
  layersDone = 0;
}

function buildVessel(serving, matter) {
  const kind = VESSELS[serving.vessel] ? serving.vessel : (MATTER_VESSEL[matter] || 'flat_plate');
  const size = clamp(num(serving.size, 22), 9, 34);
  vessel = VESSELS[kind](size, serving.color);
  vessel.kind = kind;
  vessel.size = size;
  table.add(vessel.obj);

  leftovers = new THREE.Group();
  table.add(leftovers);

  // 국물·소스는 그릇 안에 차오르고, 음식은 그 위에서 시작합니다.
  const liquid = serving.liquid;
  if (liquid && isHex(liquid.color) && vessel.depth > 0.5) {
    const level = clamp(num(liquid.level, 0.5), 0.1, 0.95);
    const y = vessel.depth * level;
    const rr = (size / 2) * Math.sqrt(Math.max(0.05, 1 - Math.pow(1 - level, 2))) * 0.96;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(rr, rr * 0.34, Math.max(y, 0.4), 44),
      new THREE.MeshStandardMaterial({
        color: safeColor(liquid.color), roughness: 0.22, metalness: 0,
        transparent: vessel.kind === 'glass', opacity: vessel.kind === 'glass' ? 0.9 : 1
      })
    );
    body.position.y = y / 2;
    body.receiveShadow = true;
    leftovers.add(body);
    vessel.y0 = y;
    log(`국물 ${Math.round(level * 100)}%`, liquid.color);
  }

  // 오목한 그릇은 음식이 놓이는 높이에서의 넓이를 씁니다.
  if (vessel.depth > 0.5) {
    const t = clamp(1 - vessel.y0 / vessel.depth, -1, 1);
    vessel.rim = (size / 2) * Math.sqrt(Math.max(0.05, 1 - t * t));
    vessel.rx = vessel.rz = vessel.rim * 0.8;
  } else {
    vessel.rim = Math.max(vessel.rx, vessel.rz) + 1.4;
  }

  deck = vessel.y0;
  peak = vessel.y0;
  frustum = size * 1.45 + vessel.depth * 0.45;
  camTarget.set(0, vessel.depth * 0.34, 0);
  ORBIT.azim = Math.PI / 4;
  ORBIT.polar = 0.96;
  orbit();
  resizeCamera();

  log(`${VESSEL_LABEL[kind] ?? kind} ${Math.round(size)}cm`, serving.color);
}

// 층 하나를 바닥 위에 올립니다.
function addLayer(layer) {
  const role = ROLE_LABEL[layer.role] ? layer.role : 'top';
  const form = PIECES[layer.form] || layer.form === 'grains' || layer.form === 'crumb'
    ? layer.form : 'round';
  const pattern = PATTERNS[layer.pattern] ? layer.pattern : (role === 'base' ? 'fill' : 'scatter');
  const color = pick(layer.color, '#D8B490');
  const top = isHex(layer.top_color) ? layer.top_color : null;
  const name = String(layer.name ?? ROLE_LABEL[role]).slice(0, 14);

  const [smin, smax] = SIZE_RANGE[role];
  const [cmin, cmax] = COUNT_RANGE[role];
  let w = clamp(num(layer.size, DEFAULT_SIZE[role]), smin, Math.min(smax, vessel.rim * 2));
  let count = clamp(Math.round(num(layer.count, DEFAULT_COUNT[role])), cmin, cmax);
  const y = role === 'accent' ? peak : deck;

  // 알갱이(밥·간 얼음)는 한 덩어리의 무리로
  if (form === 'grains') {
    const R = Math.min(vessel.rim * 0.94, Math.max(w / 2, 3));
    const H = clamp(vessel.depth > 0.5 ? vessel.depth * 0.4 : R * 0.28, 1.2, 6);
    const n = clamp(Math.round(R * R * 4.2), 90, 460);
    const c3 = new THREE.Color(pick(color));
    const mound = grainMound(c3.b > c3.r + 0.02 ? 'ice' : 'grains', color, R, H, n);
    mound.position.y = y;
    leftovers.add(mound);
    growing.push({ mesh: mound, t: 0, to: new THREE.Vector3(1, 1, 1) });
    deck = y + H * 0.72;
    peak = Math.max(peak, y + H);
    vessel.rx = vessel.rz = Math.max(vessel.rx, R * 0.66);
    log(`${ROLE_LABEL[role]} · ${name} 알갱이 ${n}`, color);
    layersDone += 1;
    return;
  }

  // 자리부터 잡고, 겹치면 조각을 줄입니다.
  const rx = role === 'accent' ? vessel.rx * 1.05 : vessel.rx;
  const rz = role === 'accent' ? vessel.rz * 1.05 : vessel.rz;
  const spots = (PATTERNS[pattern] || PATTERNS.scatter)(count, rx, rz);
  if (pattern !== 'fill') w *= fitScale(spots, w, pattern);
  if (pattern === 'fill') w = Math.min(w, vessel.rim * 2 * 0.94);

  // 고명·부스러기는 낱개로 그리지 않고 한 번에 뿌립니다.
  if (form === 'crumb' || role === 'accent') {
    const geoKey = form === 'leaf' ? 'leaf' : (form === 'round' ? 'round' : 'crumb');
    const pts = spots.map((s, i) => ({
      x: s.x, z: s.z,
      y: y + 0.12 + Math.abs(Math.sin(i * 3.3)) * 0.2 + num(s.y, 0)
    }));
    const mesh = sprinkle(geoKey, color, pts, w);
    leftovers.add(mesh);
    growing.push({ mesh, t: 0, to: new THREE.Vector3(1, 1, 1) });
    peak = Math.max(peak, y + w);
    log(`${ROLE_LABEL[role]} · ${name} ${count}개 ${w.toFixed(1)}cm`, color);
    layersDone += 1;
    return;
  }

  const h = (PIECE_H[form] ?? 0.5) * w;
  spots.forEach((s, i) => {
    const g = buildPiece(form, w, color, top);
    g.position.set(num(s.x, 0), y + num(s.y, 0), num(s.z, 0));
    g.rotation.y = num(s.ry, 0) + Math.sin(i * 2.3) * 0.25;
    if (role === 'base') {
      leftovers.add(g);                    // 바닥은 집어 먹지 않습니다
    } else {
      g.userData = { home: g.position.clone(), name };
      table.add(g);
      bites.push(g);
    }
  });

  peak = Math.max(peak, y + h + (pattern === 'mound' ? 1.8 : 0));
  deck = y + h * (role === 'base' ? 1 : 0.5);
  layersDone += 1;
  log(`${ROLE_LABEL[role]} · ${name} ${form} ${count}개 ${w.toFixed(1)}cm`, color);
}

// 반쯤 온 spec 을 화면에 반영. final 이면 마지막 층까지.
function grow(spec, final) {
  if (!spec) return;
  const sv = spec.serving;
  const ready = sv && typeof sv.vessel === 'string' && typeof sv.size === 'number'
    && typeof sv.color === 'string';
  if (!vessel && (ready || (final && sv))) buildVessel(sv, spec.matter);
  if (!vessel) return;

  const list = Array.isArray(spec.layers) ? spec.layers : [];
  list.forEach((layer, i) => {
    if (i < layersDone) return;
    if (!final && i === list.length - 1) return;    // 아직 쓰는 중일 수 있음
    if (!layer || typeof layer.form !== 'string' || typeof layer.pattern !== 'string') return;
    addLayer(layer);
  });
}

/* ══════════════════════════════════════════════════════════
   9. 먹기
   ══════════════════════════════════════════════════════════ */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const el = {
  osinagaki: document.getElementById('osinagaki'),
  dishName:  document.getElementById('dishName'),
  pips:      document.getElementById('pips'),
  composer:  document.getElementById('composer'),
  ask:       document.getElementById('ask'),
  input:     document.getElementById('orderInput'),
  hint:      document.getElementById('hint'),
  plating:   document.getElementById('plating'),
  process:   document.getElementById('process'),
  step1:     document.getElementById('step1'),
  step2:     document.getElementById('step2'),
  step3:     document.getElementById('step3'),
  logBox:    document.getElementById('log')
};

let servedTotal = 0;

function drawPips(total, left) {
  el.pips.innerHTML = '';
  if (total > 14) {
    el.pips.textContent = `${left} / ${total}`;
    return;
  }
  for (let i = 0; i < total; i++) {
    const s = document.createElement('i');
    s.className = 'pip' + (i < total - left ? ' gone' : '');
    el.pips.appendChild(s);
  }
}

function eat(group) {
  const i = bites.indexOf(group);
  if (i < 0) return;
  bites.splice(i, 1);
  eating.push({ g: group, t: 0 });
  drawPips(servedTotal, bites.length);
  if (bites.length === 0) setTimeout(clearPlate, 500);
}

// 집어 먹을 것이 없으면 바닥까지 함께 비웁니다.
function clearPlate() {
  if (leftovers && leftovers.children.length) {
    leftovers.userData = { home: leftovers.position.clone() };
    eating.push({ g: leftovers, t: 0 });
    leftovers = null;
  }
  setTimeout(finishCourse, 620);
}

function finishCourse() {
  el.dishName.textContent = '잘 드셨습니다';
  el.pips.textContent = '';
  el.ask.textContent = '다음은 무엇으로 하시겠습니까';
  el.input.value = '';
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  el.composer.classList.remove('hidden');
}

/* 드래그는 회전(좌우·위아래), 짧게 누르면 먹기 */
let dragging = false, moved = 0, lastX = 0, lastY = 0, spin = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; spin = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  spin = -dx * 0.006;
  ORBIT.azim += spin;
  ORBIT.polar = clamp(ORBIT.polar + dy * 0.0045, ORBIT.min, ORBIT.max);
  orbit();
});

renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bites, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o.parent && o.parent !== table) o = o.parent;
  eat(o);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor =
    raycaster.intersectObjects(bites, true).length ? 'pointer' : 'default';
});

/* ══════════════════════════════════════════════════════════
   10. 생각하는 과정
   ══════════════════════════════════════════════════════════ */

const LOG_MAX = 80;

const MATTER_LABEL = { drink: '음료', soup: '국물', grain: '알갱이', noodle: '면', object: '덩어리' };
const VESSEL_LABEL = {
  flat_plate: '평접시', rimmed_plate: '테두리 접시', bowl: '사발', deep_bowl: '깊은 면기',
  stone_pot: '돌솥', board: '나무 도마', basket: '바구니', glass: '유리잔'
};
// 형상이 정해지면 그릇도 대개 정해집니다 (모델이 그릇을 빠뜨렸을 때)
const MATTER_VESSEL = { drink: 'glass', soup: 'deep_bowl', grain: 'bowl', noodle: 'deep_bowl', object: 'flat_plate' };

function setStep(n, head, tail) {
  const box = el['step' + n];
  if (!box) return;
  box.querySelector('span').textContent = head + (tail ? ` · ${tail}` : '');
  box.classList.add('on');
}

function clearProcess() {
  [1, 2, 3].forEach((n) => {
    el['step' + n].querySelector('span').textContent = '…';
    el['step' + n].classList.remove('on');
  });
  el.logBox.innerHTML = '';
  el.process.classList.remove('on', 'done');
}

function log(text, color) {
  const line = document.createElement('div');
  if (isHex(color)) {
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = color;
    line.appendChild(dot);
  }
  line.appendChild(document.createTextNode(text));
  el.logBox.appendChild(line);
  while (el.logBox.children.length > LOG_MAX) el.logBox.firstChild.remove();
  el.logBox.scrollTop = el.logBox.scrollHeight;
}

/* ══════════════════════════════════════════════════════════
   11. 반쯤 온 JSON 읽기
   ══════════════════════════════════════════════════════════ */

function closeUp(src) {
  const stack = [];
  let inStr = false, esc = false;
  for (const c of src) {
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === '{') stack.push('}');
    else if (c === '[') stack.push(']');
    else if (c === '}' || c === ']') stack.pop();
  }
  if (inStr) return null;
  return src + stack.reverse().join('');
}

function parsePartial(raw) {
  const text = raw.replace(/^[^[{]*/, '');     // ```json 울타리가 붙어 와도
  for (let end = text.length; end > 0; end--) {
    const c = text[end - 1];
    if (c !== '}' && c !== ']' && c !== '"' && !/[0-9a-z]/.test(c)) continue;
    const cand = closeUp(text.slice(0, end));
    if (cand === null) continue;
    try { return JSON.parse(cand); } catch { /* 더 앞으로 */ }
  }
  return null;
}

// 아직 닫히지 않은 문장도 쓰이는 대로 보여 줍니다.
function peekString(text, key) {
  const at = text.indexOf('"' + key + '"');
  if (at < 0) return '';
  const colon = text.indexOf(':', at);
  const open = text.indexOf('"', colon + 1);
  if (colon < 0 || open < 0) return '';
  let out = '';
  for (let i = open + 1; i < text.length; i++) {
    const c = text[i];
    if (c === '"') break;
    if (c !== '\\') { out += c; continue; }
    const n = text[i + 1];
    if (n === undefined) break;
    if (n === 'u') {
      const hex = text.slice(i + 2, i + 6);
      if (hex.length < 4) break;
      out += String.fromCharCode(parseInt(hex, 16));
      i += 5;
      continue;
    }
    out += ({ n: '\n', t: '\t', r: '' })[n] ?? n;
    i += 1;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   12. 주문 → 주방 → 접시
   ══════════════════════════════════════════════════════════ */

async function askKitchen(order, onText) {
  const res = await fetch(KITCHEN, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({ order })
  });

  if (!res.ok || !res.body) {
    const body = await res.json().catch(() => null);
    throw new Error(body?.error || `주방에서 응답이 없습니다 (${res.status})`);
  }

  // 함수가 한 번에 보내는 방식이면 받은 JSON 을 그대로 씁니다.
  if (!(res.headers.get('content-type') || '').includes('text/event-stream')) {
    const whole = await res.text();
    if (!whole.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
    onText(whole);
    return whole;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', text = '';

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let msg;
      try { msg = JSON.parse(line.slice(5)); } catch { continue; }
      if (msg.error) throw new Error(msg.error);
      if (msg.t) { text += msg.t; onText(text); }
    }
  }
  if (!text.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
  return text;
}

let busy = false;

async function order(text) {
  if (busy) return;
  const q = text.trim();
  if (!q) return;

  busy = true;
  el.composer.classList.add('hidden');
  el.osinagaki.classList.remove('on');
  el.plating.classList.add('on');
  el.pips.textContent = '';
  clearProcess();
  resetPlate();

  // 글자가 올 때마다: 생각은 세 단계로, 음식은 바닥부터 한 층씩
  const onText = (all) => {
    el.plating.classList.remove('on');
    el.process.classList.add('on');

    const spec = parsePartial(all);
    if (spec?.dish && el.dishName.textContent !== spec.dish) {
      el.dishName.textContent = spec.dish;
      el.osinagaki.classList.add('on');
    }
    if (spec?.matter) setStep(1, MATTER_LABEL[spec.matter] ?? spec.matter, peekString(all, 'matter_why'));
    if (spec?.serving?.vessel) {
      setStep(2, VESSEL_LABEL[spec.serving.vessel] ?? spec.serving.vessel, peekString(all, 'vessel_why'));
    }
    grow(spec, false);
    if (layersDone) setStep(3, `${layersDone}층째`);
  };

  try {
    const raw = await askKitchen(q, onText);
    const spec = parsePartial(raw);
    grow(spec, true);
    if (!vessel || !layersDone) throw new Error('이 주문은 담아내지 못했습니다. 다르게 말씀해 주세요');

    if (!bites.length && leftovers) {
      leftovers.userData = { home: leftovers.position.clone() };
      bites.push(leftovers);
      leftovers = null;
    }
    setStep(3, `${layersDone}층`, `${bites.length}점`);
    servedTotal = bites.length;
    el.dishName.textContent = spec.dish || q;
    drawPips(servedTotal, servedTotal);
    el.osinagaki.classList.add('on');
    setTimeout(() => el.process.classList.add('done'), 1600);
  } catch (err) {
    resetPlate();
    clearProcess();
    el.osinagaki.classList.remove('on');
    el.dishName.textContent = '';
    el.hint.textContent = err.message || '무언가 잘못되었습니다';
    el.hint.classList.add('warn');
    el.composer.classList.remove('hidden');
    el.input.focus();
  } finally {
    el.plating.classList.remove('on');
    busy = false;
  }
}

el.input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
  order(el.input.value);
});

el.input.focus();

/* ══════════════════════════════════════════════════════════
   13. 그리기
   ══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!dragging && Math.abs(spin) > 0.00002) {
    ORBIT.azim += spin;
    spin *= 0.92;
    orbit();
  }

  // 막 놓인 것: 작은 점에서 제 크기로
  for (let i = growing.length - 1; i >= 0; i--) {
    const g = growing[i];
    g.t += dt / 0.26;
    const k = Math.min(1, g.t);
    const ease = 1 - Math.pow(1 - k, 3);
    g.mesh.scale.set(
      Math.max(0.001, g.to.x * ease),
      Math.max(0.001, g.to.y * ease),
      Math.max(0.001, g.to.z * ease)
    );
    if (k >= 1) growing.splice(i, 1);
  }

  // 먹히는 것: 살짝 떠올랐다가 작아지며 사라집니다.
  for (let i = eating.length - 1; i >= 0; i--) {
    const e = eating[i];
    e.t += dt / 0.42;
    const k = Math.min(1, e.t);
    const ease = 1 - Math.pow(1 - k, 3);
    e.g.position.y = (e.g.userData.home?.y ?? 0) + ease * 5.5;
    e.g.rotation.y += dt * 2.2;
    e.g.scale.multiplyScalar(Math.max(0.001, 1 - dt * 3.4));
    if (k >= 1) {
      disposeDeep(e.g);
      e.g.parent?.remove(e.g);
      eating.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
