<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오마카세</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#EFEAE1; --ink-dim:#8C867C; --ink-faint:#4A463F;
    --bg:#000000; --line:#2A2722;
    --pad-top:env(safe-area-inset-top, 0px);
    --pad-bot:env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; touch-action:none; }

  .sign{
    position:fixed; z-index:5;
    top:calc(var(--pad-top) + 22px); left:22px;
    max-width:min(60vw, 340px); pointer-events:none;
    opacity:0; transition:opacity .5s ease;
  }
  .sign.on{ opacity:1; }
  .sign .dish{
    font-family:"Gowun Batang", serif;
    font-size:19px; line-height:1.35; letter-spacing:-0.02em; margin:0;
  }
  .sign .left{
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    margin-top:11px; min-height:8px;
    font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  .pip{
    width:7px; height:7px; border-radius:50%; background:var(--ink); opacity:.85;
    transition:transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .pip.gone{ background:transparent; box-shadow:inset 0 0 0 1px var(--ink-faint); transform:scale(.72); }

  .composer{
    position:fixed; z-index:5; left:50%; transform:translateX(-50%);
    bottom:calc(var(--pad-bot) + 30px); width:min(540px, 84vw);
    text-align:center; transition:opacity .45s ease;
  }
  .composer.hidden{ opacity:0; pointer-events:none; }
  .composer .ask{ font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim); margin:0 0 14px; }
  .composer input{
    width:100%; background:transparent; border:0; border-bottom:1px solid var(--line);
    padding:10px 2px; text-align:center;
    font-family:"IBM Plex Sans KR", sans-serif; font-size:16px; font-weight:300; color:var(--ink);
    outline:none; transition:border-color .25s ease;
  }
  .composer input:focus{ border-bottom-color:var(--ink-dim); }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:200; }
  .composer button{
    display:block; margin:18px auto 0; min-width:104px; min-height:44px; padding:0 22px;
    background:transparent; color:var(--ink); border:1px solid var(--line);
    font-family:"Gowun Batang", serif; font-size:15px; cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .composer button:hover{ border-color:var(--ink-dim); }
  .composer button:disabled{ color:var(--ink-faint); cursor:default; }
  .composer .hint{ margin:12px 0 0; font-size:12px; font-weight:200; color:var(--ink-faint); min-height:16px; }
  .composer .hint.warn{ color:#B9855A; }

  .plating{
    position:fixed; inset:0; z-index:4; display:none; place-items:center;
    font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim); pointer-events:none;
  }
  .plating.on{ display:grid; }
  .plating span{ animation:breathe 1.9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:1} }

  .process{
    position:fixed; z-index:5; left:22px; bottom:calc(var(--pad-bot) + 26px);
    width:min(56vw, 380px); pointer-events:none; opacity:0; transition:opacity .6s ease;
  }
  .process.on{ opacity:1; }
  .process .steps{ margin-bottom:13px; }
  .process .step{
    display:flex; gap:10px; align-items:baseline;
    font-size:13px; line-height:1.55; margin-bottom:3px;
    color:var(--ink-faint); opacity:.45; transition:opacity .4s ease, color .4s ease;
  }
  .process .step.on{ opacity:1; color:var(--ink-dim); }
  .process .step b{ flex:none; width:34px; font-weight:400; font-size:11px; letter-spacing:.08em; color:var(--ink-faint); }
  .process .step.on b{ color:var(--ink-dim); }
  .process .step span{ font-family:"Gowun Batang", serif; }
  .process .log{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.85; color:var(--ink-faint); white-space:pre;
    max-height:32vh; overflow-y:auto; scrollbar-width:none;
  }
  .process .log::-webkit-scrollbar{ display:none; }
  .process .log div{ display:flex; gap:7px; align-items:center; }
  .process .swatch{ display:inline-block; width:7px; height:7px; flex:none; border-radius:1px; }
  .process .bad{ color:#B9855A; }

  .back{
    position:fixed; z-index:6; top:calc(var(--pad-top) + 22px); right:22px;
    font-size:13px; color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--ink-dim); }

  @media (max-width: 560px){
    .sign{ left:16px; right:16px; max-width:none; top:calc(var(--pad-top) + 16px); }
    .sign .dish{ font-size:17px; }
    .back{ top:calc(var(--pad-top) + 10px); right:10px; padding:10px 12px; }
    .composer{ width:calc(100% - 32px); bottom:calc(var(--pad-bot) + 22px); }
    .composer .ask{ font-size:14px; }
    .process{ left:16px; right:16px; width:auto; bottom:calc(var(--pad-bot) + 18px); }
    .process .step{ font-size:12px; line-height:1.45; }
    .process .step b{ width:28px; font-size:10px; }
    .process .log{ font-size:10px; line-height:1.7; max-height:22vh; }
  }
  @media (max-height: 560px){ .process .log{ max-height:16vh; } }

  :focus-visible{ outline:1px solid var(--ink-dim); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="sign" id="sign">
  <p class="dish" id="dishName"></p>
  <div class="left" id="pips"></div>
</div>

<a class="back" href="../visitor.html">←</a>

<div class="plating" id="plating"><span>차리는 중입니다</span></div>

<div class="composer" id="composer">
  <p class="ask" id="ask">오늘은 무엇을 드시겠습니까</p>
  <input id="orderInput" type="text" autocomplete="off" enterkeyhint="go" maxlength="60"
         placeholder="예: 초밥, 포케, 파스타, 수프, 버거" />
  <button type="button" id="goBtn">주문</button>
  <p class="hint" id="hint">차림표를 읽는 중입니다</p>
</div>

<div class="process" id="process">
  <div class="steps">
    <div class="step" id="step1"><b>차림</b><span>…</span></div>
    <div class="step" id="step2"><b>그릇</b><span>…</span></div>
    <div class="step" id="step3"><b>검증</b><span>…</span></div>
  </div>
  <div class="log" id="log"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   오마카세 — dish_specs.json 을 그대로 읽어 한 상을 짓습니다.

   원본은 Rhino 8 에서 절차적으로 모델링한 파인다이닝 10종
   (miniapps/ref/webapp_handoff 의 PROMPT.md, dish_specs.json).
   스펙은 Rhino Z-up 입니다. 여기서도 Z-up 으로 만들고, 마지막에
   묶음 하나를 -90° 돌려 three.js 의 Y-up 으로 옮깁니다. 1 = 1cm.
   ══════════════════════════════════════════════════════════ */

const SPEC_URL = './dish_specs.json';
let SPEC = null;

/* ── 화면 ────────────────────────────────────────────── */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080a);

// Rhino(Z-up) → three(Y-up)
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

let frustum = 46;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 900);
const ORBIT = { dist: 240, azim: Math.PI / 4, polar: 0.9, min: 0.12, max: 1.45 };
const camTarget = new THREE.Vector3(0, 0, 0);

function orbit() {
  const { dist, azim, polar } = ORBIT;
  camera.position.set(
    camTarget.x + dist * Math.sin(polar) * Math.cos(azim),
    camTarget.y + dist * Math.cos(polar),
    camTarget.z + dist * Math.sin(polar) * Math.sin(azim)
  );
  camera.lookAt(camTarget);
}
function resizeCamera() {
  const a = innerWidth / innerHeight;
  const h = frustum / 2;
  camera.left = -(a >= 1 ? h * a : h);
  camera.right = (a >= 1 ? h * a : h);
  camera.top = (a >= 1 ? h : h / a);
  camera.bottom = -(a >= 1 ? h : h / a);
  camera.updateProjectionMatrix();
}
orbit(); resizeCamera();

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(30, 52, 26);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 180 });
keyLight.shadow.bias = -0.0008;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe6ef, 0.5);
fillLight.position.set(-26, 24, -18);
scene.add(fillLight);
scene.add(new THREE.HemisphereLight(0xffffff, 0x20201e, 0.75));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); resizeCamera(); });

/* ── 값 다루기 ───────────────────────────────────────── */

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isNum = (v) => typeof v === 'number' && isFinite(v);

// 같은 주문 + 같은 씨앗이면 늘 같은 결과 (mulberry32)
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = makeRng(1);
const rnd = (lo, hi) => lo + (hi - lo) * rng();
// 스펙의 값은 숫자이거나 [최소, 최대] 범위입니다.
const val = (v, d = 0) => (Array.isArray(v) ? rnd(v[0], v[1]) : (isNum(v) ? v : d));

function hashSeed(text) {
  let h = 2166136261;
  for (const ch of String(text)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// "rB-1.2", "rim+0.4", "floor+9.0" 같은 식을 풉니다.
function expr(v, vars) {
  if (isNum(v)) return v;
  if (typeof v !== 'string') return undefined;
  const m = v.trim().match(/^([A-Za-z]+)\s*([+-])\s*([\d.]+)$/);
  if (m) {
    const base = vars[m[1]];
    if (!isNum(base)) return undefined;
    return m[2] === '+' ? base + parseFloat(m[3]) : base - parseFloat(m[3]);
  }
  if (isNum(vars[String(v).trim()])) return vars[String(v).trim()];
  const n = parseFloat(v);
  return isFinite(n) ? n : undefined;
}

function tint(hex, jitter) {
  const c = new THREE.Color(hex || '#CCCCCC');
  if (jitter) {
    const j = jitter / 255;
    c.r = clamp(c.r + rnd(-j, j), 0, 1);
    c.g = clamp(c.g + rnd(-j, j), 0, 1);
    c.b = clamp(c.b + rnd(-j, j), 0, 1);
  }
  return c;
}

function matOf(color, gloss = 0.3, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: clamp(1 - gloss * 0.8, 0.05, 1), metalness: 0, ...opts
  });
}

/* ══════════════════════════════════════════════════════════
   프리미티브 — 스펙 primitives 의 변형식을 그대로 옮김
   ══════════════════════════════════════════════════════════ */

// 구를 받아 정점마다 옮깁니다 (Z-up).
function morph(fn, seg = 18, ring = 12) {
  const g = new THREE.SphereGeometry(1, seg, ring);
  g.rotateX(Math.PI / 2);                       // three 의 Y-up 구 → Z-up
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const out = fn(v.x, v.y, v.z);
    p.setXYZ(i, out[0], out[1], out[2]);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  g.computeBoundingBox();
  return g;
}

function latheZ(points, seg = 64) {          // (r,z) → Z 축 회전체
  const g = new THREE.LatheGeometry(points.map((p) => new THREE.Vector2(Math.max(0, p[0]), p[1])), seg);
  g.rotateX(Math.PI / 2);
  g.computeBoundingBox();
  return g;
}

const PRIM = {
  ellipsoid: (s) => morph((x, y, z) => [x * val(s.a, 1), y * val(s.b, 1), z * val(s.c, 1)]),

  roundedBox: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 1);
    const e = clamp(0.62 - 0.12 * val(s.sharpness, 2), 0.28, 0.55);
    const pw = (t) => Math.sign(t) * Math.pow(Math.abs(t), e);
    return morph((x, y, z) => [a * pw(x), b * pw(y), c * pw(z)], 20, 14);
  },

  clampedBlob: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 1);
    const zMin = isNum(s.zMin) ? s.zMin : -c, zMax = isNum(s.zMax) ? s.zMax : c;
    const sh = s.roundedBoxSharpness;
    const e = sh ? clamp(0.62 - 0.12 * sh, 0.28, 0.55) : 1;
    const pw = (t) => (e === 1 ? t : Math.sign(t) * Math.pow(Math.abs(t), e));
    return morph((x, y, z) => [a * pw(x), b * pw(y), clamp(c * z, zMin, zMax)], 20, 14);
  },

  leaf: (s) => {
    const a = val(s.length, 4) / 2, b = val(s.width, 2) / 2, c = val(s.thickness, 0.08) / 2;
    const cup = val(s.cup, 0), bend = val(s.bend, 0), ruffle = val(s.ruffle, 0);
    const phase = rng() * Math.PI * 2;
    return morph((x, y, z) => {
      const u = x, yn = y;
      const taper = Math.max(0.12, 1 - 0.35 * u - 0.5 * u * u);
      return [
        x * a,
        y * taper * b,
        z * c + cup * yn * yn + bend * u * u + ruffle * Math.sin(3.2 * Math.PI * u + phase) * Math.abs(yn)
      ];
    }, 20, 12);
  },

  hemisphere: (s) => {
    const r = val(s.r, 1), zs = val(s.zScale, 1);
    return morph((x, y, z) => [x * r, y * r, Math.max(0, z) * r * zs], 18, 12);
  },

  cylinder: (s) => {
    const r = val(s.r, 1), h = val(s.h, 1);
    const g = new THREE.CylinderGeometry(r, r, h, 22);
    g.rotateX(Math.PI / 2);
    g.computeBoundingBox();
    return g;
  },

  tube: (s) => {                                   // Y 축으로 누운 관 (리가토니)
    const ro = val(s.rOuter, 0.5), ri = val(s.rInner, 0.3), len = val(s.length, 1.5);
    const shape = new THREE.Shape();
    shape.absarc(0, 0, ro, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, Math.min(ri, ro * 0.92), 0, Math.PI * 2, true);
    shape.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(shape, { depth: len, bevelEnabled: false, curveSegments: 16 });
    g.translate(0, 0, -len / 2);
    g.rotateX(Math.PI / 2);                        // 길이축을 Y 로
    g.computeBoundingBox();
    return g;
  },

  vTube: (s) => {                                  // 세로로 선 관 (마키)
    const ro = val(s.rOuter, 1), ri = val(s.rInner, 0.8), h = val(s.h, 1.8);
    const shape = new THREE.Shape();
    shape.absarc(0, 0, ro, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, Math.min(ri, ro * 0.95), 0, Math.PI * 2, true);
    shape.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 18 });
    g.translate(0, 0, -h / 2);
    g.computeBoundingBox();
    return g;
  },

  torus: (s) => {
    const R = val(s.R, 0.5), r = val(s.r, 0.12);
    const g = new THREE.TorusGeometry(R, r, 8, 20);
    g.computeBoundingBox();
    return g;
  },

  crescent: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 1), cv = val(s.curve, 0.3);
    return morph((x, y, z) => [x * a, y * b + cv * x * x, z * c]);
  },

  teardrop: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 1);
    return morph((x, y, z) => [x * a, y * b * (1 - 0.35 * x), z * c]);
  },

  wavyRibbon: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 1);
    const amp = val(s.amp, 0.2), freq = val(s.freq, 2);
    return morph((x, y, z) => [x * a, y * b, z * c + amp * Math.sin(freq * x * a)], 22, 12);
  },

  droopSheet: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 0.1);
    const dx = val(s.droopX ?? s.droop, 0.2), dy = val(s.droopY ?? s.droop, 0.2);
    return morph((x, y, z) => [
      x * a, y * b, z * c - dx * Math.pow(Math.abs(x), 4) - dy * Math.pow(Math.abs(y), 4)
    ], 18, 12);
  },

  ruffledDisk: (s) => {
    const R = val(s.R, 2), c = val(s.c, 0.2);
    const amp = val(s.amp, 0.15), lobes = Math.round(val(s.lobes, 6)), dish = val(s.dish, 0.2);
    return morph((x, y, z) => {
      const r = Math.hypot(x, y), th = Math.atan2(y, x);
      return [x * R, y * R, z * c + amp * Math.sin(lobes * th) * r * r - dish * r * r];
    }, 26, 14);
  },

  triangleChip: (s) => {
    const a = val(s.a, 1), b = val(s.b, 1), c = val(s.c, 0.1);
    return morph((x, y, z) => {
      const ny = y * Math.max(0.08, 1 - x);
      return [x * a, ny * b, z * c + 0.12 * ny * ny];
    }, 18, 10);
  },

  spiralPipe: (s) => {                              // 수프 크림 소용돌이
    const turns = val(s.turns, 2), r0 = val(s.r0, 0.4), r1 = val(s.r1, 2.2), pr = val(s.pipeR, 0.12);
    const pts = [];
    const N = Math.max(24, Math.round(turns * 26));
    for (let i = 0; i <= N; i++) {
      const t = i / N, ang = t * turns * Math.PI * 2, r = r0 + (r1 - r0) * t;
      pts.push(new THREE.Vector3(Math.cos(ang) * r, Math.sin(ang) * r, 0));
    }
    const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, pr, 6, false);
    g.computeBoundingBox();
    return g;
  },

  revolvedShell: (s) => {                            // 부리또 껍질
    const ro = val(s.rOuter, 2.5), len = val(s.length, 6.5);
    const g = new THREE.CylinderGeometry(ro, ro, len, 24);
    g.rotateZ(Math.PI / 2);                          // 길이축 X
    g.computeBoundingBox();
    return g;
  }
};

const primitive = (s) => (PRIM[s.shape] || PRIM.ellipsoid)(s);

/* ══════════════════════════════════════════════════════════
   그릇
   ══════════════════════════════════════════════════════════ */

function smooth(points) {
  const v = points.map((p) => new THREE.Vector2(p[0], p[1]));
  if (v.length < 3) return points.map((p) => [p[0], p[1]]);
  return new THREE.SplineCurve(v).getPoints(Math.max(24, v.length * 9)).map((p) => [p.x, p.y]);
}

function buildBowl(c) {
  const inner = smooth(c.innerProfile);
  const wall = val(c.wall, 0.4);
  const r0 = inner[0][0], z0 = inner[0][1];
  const rim = inner[inner.length - 1];
  const footH = val(c.footH, 0.6), footR = val(c.footR, r0 * 0.8), footW = val(c.footW, 0.5);

  const pts = [[0, z0]];
  inner.forEach((p) => pts.push([p[0], p[1]]));
  for (let i = 1; i <= 6; i++) {                         // 림 반원
    const a = (i / 6) * Math.PI;
    pts.push([rim[0] + (wall / 2) * Math.sin(a), rim[1] + (wall / 2) * (1 - Math.cos(a)) * 0.5]);
  }
  for (let i = inner.length - 1; i >= 0; i--) {          // 바깥 벽
    const p = inner[i], q = inner[Math.max(0, i - 1)];
    const dx = p[0] - q[0], dz = p[1] - q[1];
    const L = Math.hypot(dx, dz) || 1;
    pts.push([p[0] + (dz / L) * wall, p[1] - (dx / L) * wall]);
  }
  pts.push([footR, footH], [Math.max(0.01, footR - 0.15), 0],
    [Math.max(0.01, footR - 0.15 - footW), 0],
    [Math.max(0.01, footR - 0.3 - footW), Math.min(0.25, footH / 2)],
    [0, Math.min(0.25, footH / 2)]);

  const mesh = new THREE.Mesh(latheZ(pts, 72),
    matOf(new THREE.Color(c.color || '#EEEEEE'), val(c.gloss, 0.4), { side: THREE.DoubleSide }));
  mesh.castShadow = true; mesh.receiveShadow = true;

  const zIn = (r) => {
    if (r <= r0) return z0;
    if (r >= rim[0]) return rim[1];
    for (let i = 1; i < inner.length; i++) {
      if (inner[i][0] >= r) {
        const p = inner[i - 1], q = inner[i];
        const t = (r - p[0]) / Math.max(1e-6, q[0] - p[0]);
        return p[1] + (q[1] - p[1]) * t;
      }
    }
    return rim[1];
  };
  const rAt = (z) => {
    if (z <= z0) return r0;
    for (let i = 1; i < inner.length; i++) {
      if (inner[i][1] >= z) {
        const p = inner[i - 1], q = inner[i];
        const t = (z - p[1]) / Math.max(1e-6, q[1] - p[1]);
        return p[0] + (q[0] - p[0]) * t;
      }
    }
    return rim[0];
  };
  return { mesh, zIn, rAt, kind: 'bowl', rim: rim[0], rimZ: rim[1], floor: z0 };
}

function roundedRectShape(w, d, corner) {
  const s = new THREE.Shape();
  const x = w / 2, y = d / 2, r = Math.min(corner, x, y);
  s.moveTo(-x + r, -y);
  s.lineTo(x - r, -y); s.quadraticCurveTo(x, -y, x, -y + r);
  s.lineTo(x, y - r);  s.quadraticCurveTo(x, y, x - r, y);
  s.lineTo(-x + r, y); s.quadraticCurveTo(-x, y, -x, y - r);
  s.lineTo(-x, -y + r); s.quadraticCurveTo(-x, -y, -x + r, -y);
  return s;
}

function buildSlab(c) {
  const w = val(c.w, 20), d = val(c.d, 12), h = val(c.h, 0.8);
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w, d, val(c.corner, 1)),
    { depth: h, bevelEnabled: false, curveSegments: 6 });
  g.computeBoundingBox();
  const mesh = new THREE.Mesh(g, matOf(new THREE.Color(c.color || '#CCCCCC'), val(c.gloss, 0.3)));
  mesh.castShadow = true; mesh.receiveShadow = true;
  return {
    mesh, kind: 'slab', w, d, h, floor: h, rim: Math.min(w, d) / 2, rimZ: h,
    zIn: () => h, rAt: () => Math.min(w, d) / 2,
    inside: (x, y) => Math.abs(x) < w / 2 - 0.4 && Math.abs(y) < d / 2 - 0.4
  };
}

/* ══════════════════════════════════════════════════════════
   높이맵 — 떨어뜨려 쌓기
   ══════════════════════════════════════════════════════════ */

const CELL = 0.15;
const BLOCK = 1e9;

class Field {
  constructor(half) {
    this.hw = half; this.hd = half;
    this.nx = Math.ceil((half * 2) / CELL) + 2;
    this.ny = this.nx;
    this.H = new Float32Array(this.nx * this.ny).fill(BLOCK);
    this.base = new Uint8Array(this.nx * this.ny);
    this.taken = new Uint8Array(this.nx * this.ny);
  }
  ix(x) { return Math.round((x + this.hw) / CELL); }
  iy(y) { return Math.round((y + this.hd) / CELL); }
  at(i, j) { return (i < 0 || j < 0 || i >= this.nx || j >= this.ny) ? BLOCK : this.H[j * this.nx + i]; }
  each(x, y, rx, ry, fn) {
    const i0 = this.ix(x - rx), i1 = this.ix(x + rx), j0 = this.iy(y - ry), j1 = this.iy(y + ry);
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const cx = i * CELL - this.hw, cy = j * CELL - this.hd;
        const u = (cx - x) / Math.max(1e-6, rx), v = (cy - y) / Math.max(1e-6, ry);
        if (u * u + v * v > 1.04) continue;
        if (fn(i, j, cx, cy) === false) return false;
      }
    }
    return true;
  }
}

/* ── 자리 뽑기 ───────────────────────────────────────── */

function sampleRegion(region, vars) {
  if (!region) return [rnd(-2, 2), rnd(-2, 2)];
  const c = region.c || region.at || [0, 0];
  const t = region.type;
  if (t === 'point') {
    const j = val(region.jitter, 0);
    return [c[0] + rnd(-j, j), c[1] + rnd(-j, j)];
  }
  if (t === 'rect') {
    const h = region.h || [val(region.w, 2), val(region.d, 2)];
    return [c[0] + rnd(-h[0], h[0]), c[1] + rnd(-h[1], h[1])];
  }
  if (t === 'annulus' || t === 'sector') {
    const r0 = expr(region.r0, vars) ?? 0;
    const r1 = expr(region.r1, vars) ?? (vars.rimR ?? 5);
    const deg = region.deg || [0, 360];
    const a = rnd(deg[0], deg[1]) * Math.PI / 180;
    const r = Math.sqrt(rnd(r0 * r0, r1 * r1));
    return [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
  }
  const r1 = expr(region.r, vars) ?? (vars.rimR ?? 5);
  const a = rng() * Math.PI * 2;
  const r = Math.sqrt(rng()) * r1;
  return [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
}

/* ══════════════════════════════════════════════════════════
   조각 만들기 (합성 재료 포함)
   ══════════════════════════════════════════════════════════ */

const FISH = { salmon: '#F08E5C', tuna: '#B03A46', yellowtail: '#F0E2C8', shrimp: '#F4B8A0', cucumber: '#8CBF6A' };

function buildPiece(name, ing, override, fishColor) {
  const g = new THREE.Group();
  if (Array.isArray(ing.composite)) {
    const forceColor = override && /^#[0-9a-fA-F]{6}$/.test(override.color || '') ? override.color : null;
    ing.composite.forEach((part, pi) => {
      const spec = { ...part };
      const col = forceColor && (part.color === '$fish' || pi === ing.composite.length - 1)
        ? forceColor
        : (spec.color === '$fish' ? (fishColor || FISH.salmon) : spec.color);
      const m = new THREE.Mesh(primitive(spec), matOf(tint(col, ing.jitter), val(spec.gloss ?? ing.gloss, 0.35)));
      m.position.set(val(spec.offsetX, 0), val(spec.offsetY, 0), val(spec.offsetZ, 0));
      m.castShadow = true; m.receiveShadow = true;
      g.add(m);
    });
  } else {
    const s = { ...ing, ...(override || {}) };
    const list = s.colors || [s.color || '#D8B490'];
    const m = new THREE.Mesh(primitive(s), matOf(tint(list[Math.floor(rng() * list.length)], s.jitter), val(s.gloss, 0.3)));
    if (s.shape === 'hemisphere' && rng() < val(s.flipChance, 0)) m.rotation.x = Math.PI;
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  }
  g.userData.name = name;
  return g;
}

// 아직 화면에 붙이기 전(부모 없음)에 재면 그릇 좌표계의 상자가 나옵니다.
const localBox = (obj) => { obj.updateMatrixWorld(true); return new THREE.Box3().setFromObject(obj); };

/* ══════════════════════════════════════════════════════════
   배치기 — 떨어뜨리고, 걸치면 실패, 성공하면 높이맵 갱신
   ══════════════════════════════════════════════════════════ */

const report = { placed: 0, skipped: 0, floating: 0, overlap: 0, outside: 0 };
let pieces = [];

function dropPiece(group, field, opts) {
  const { x, y, maxTop, onlyOnBase, tiltMax = 0, tiltJitter = 0, yaw = null, nestle = 0 } = opts;

  group.rotation.set(0, 0, isNum(yaw) ? yaw : rng() * Math.PI * 2);
  if (tiltJitter) {
    const a = rng() * Math.PI * 2, t = rnd(0, tiltJitter) * Math.PI / 180;
    group.rotateOnWorldAxis(new THREE.Vector3(Math.cos(a), Math.sin(a), 0), t);
  }
  if (tiltMax > 0) {                                   // 표면 기울기를 따라 눕기
    const rho = 0.4;
    const hx = (field.at(field.ix(x + rho), field.iy(y)) - field.at(field.ix(x - rho), field.iy(y))) / (2 * rho);
    const hy = (field.at(field.ix(x), field.iy(y + rho)) - field.at(field.ix(x), field.iy(y - rho))) / (2 * rho);
    if (isFinite(hx) && isFinite(hy) && (hx || hy)) {
      const slope = Math.atan(Math.hypot(hx, hy));
      const axis = new THREE.Vector3(-hy, hx, 0);
      if (axis.lengthSq() > 1e-6) {
        axis.normalize();
        group.rotateOnWorldAxis(axis, Math.min(slope, tiltMax * Math.PI / 180));
      }
    }
  }

  group.position.set(x, y, 0);
  const box = localBox(group);
  const rx = Math.max(0.05, (box.max.x - box.min.x) / 2);
  const ry = Math.max(0.05, (box.max.y - box.min.y) / 2);
  const zb = box.min.z, zt = box.max.z;

  let support = -1e9, ok = true, touchedBase = false;
  field.each(x, y, rx, ry, (i, j) => {
    const k = j * field.nx + i;
    const h = field.at(i, j);
    if (h >= BLOCK) { ok = false; return false; }
    if (onlyOnBase && field.taken[k]) { ok = false; return false; }
    if (field.base[k]) touchedBase = true;
    support = Math.max(support, h);
    return true;
  });
  if (!ok || support <= -1e8) return null;
  if (onlyOnBase && !touchedBase) return null;

  const dz = support - zb - nestle;
  if (isNum(maxTop) && zt + dz > maxTop) return null;

  group.position.z = dz;
  const top = zt + dz;
  field.each(x, y, rx, ry, (i, j) => {
    const k = j * field.nx + i;
    if (field.H[k] < top) field.H[k] = top;
    field.taken[k] = 1;
    return true;
  });
  box.translate(new THREE.Vector3(0, 0, dz));
  return { top, support, box };
}

function placeItem(item, ing, ctx) {
  const { field, vars, group } = ctx;
  const count = Math.max(1, Math.round(val(item.count, 1)));
  const maxTop = expr(item.maxTop, vars) ?? expr(ctx.maxTop, vars) ?? Infinity;
  let done = 0;

  for (let n = 0; n < count; n++) {
    let ok = false;
    for (let t = 0; t < 40 && !ok; t++) {
      const [x, y] = sampleRegion(item.region, vars);
      const piece = buildPiece(item.ingredient, ing, item.params, item.fish);
      const res = dropPiece(piece, field, {
        x, y, maxTop,
        onlyOnBase: !!item.onlyOnBase,
        tiltMax: val(ing.tiltMax, 0),
        tiltJitter: val(ing.tiltJitter, 0)
      });
      if (!res) { piece.traverse((o) => o.isMesh && o.geometry.dispose()); continue; }
      group.add(piece);
      pieces.push({ obj: piece, box: res.box, support: res.support, name: item.ingredient });
      ok = true; done++;
    }
    if (!ok) report.skipped++;
  }
  report.placed += done;
  const color = ing.colors ? ing.colors[0] : (ing.color || null);
  if (done) log(`${item.ingredient} ×${done}`, color);
  else log(`${item.ingredient} 못 놓음`, color, true);
  return done;
}

/* ══════════════════════════════════════════════════════════
   수저
   ══════════════════════════════════════════════════════════ */

function metalMat(c = '#C4A462', gloss = 0.8) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(c), roughness: clamp(1 - gloss * 0.8, 0.08, 1), metalness: 0.75
  });
}

function sweep(path, widths, thick, material) {
  const g = new THREE.Group();
  for (let i = 0; i < path.length - 1; i++) {
    const [y0, z0] = path[i], [y1, z1] = path[i + 1];
    const len = Math.hypot(y1 - y0, z1 - z0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
    m.scale.set((widths[i] + widths[i + 1]) / 2, len, thick);
    m.position.set(0, (y0 + y1) / 2, (z0 + z1) / 2 + thick / 2);
    m.rotation.x = -Math.atan2(z1 - z0, y1 - y0);
    m.castShadow = true;
    g.add(m);
  }
  return g;
}

function buildCutlery(kind, spec, withRest) {
  const g = new THREE.Group();
  const brass = metalMat();
  const L = val(spec?.length, 19);

  if (['fork', 'knife', 'spoon', 'soupSpoon', 'koreanSpoon'].includes(kind)) {
    g.add(sweep([[3.1, 0.1], [4.8, 0.2], [7, 0.55], [12.5, 0.7], [L, 0.08]],
      [2.0, 1.2, 0.5, 1.0, 0.55], 0.22, brass));
  }
  if (kind === 'fork') {
    (spec?.tineX || [-0.9, -0.3, 0.3, 0.9]).forEach((tx) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, 2.6, 0.18), brass);
      m.position.set(tx, 1.7, 0.2); m.castShadow = true; g.add(m);
    });
    const base = new THREE.Mesh(new THREE.BoxGeometry(val(spec?.headWidth, 2.3), 0.9, 0.2), brass);
    base.position.set(0, 3.1, 0.2); base.castShadow = true; g.add(base);
  }
  if (kind === 'knife') {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(1.5, 8.5, 0.22), brass);
    blade.position.set(0, -1.2, 0.18); blade.castShadow = true; g.add(blade);
  }
  if (['spoon', 'soupSpoon', 'koreanSpoon'].includes(kind)) {
    const wide = kind === 'soupSpoon' ? 2.0 : kind === 'koreanSpoon' ? 1.9 : 1.7;
    const deep = kind === 'koreanSpoon' ? 2.0 : 2.6;
    const bowl = new THREE.Mesh(morph((x, y, z) => [x * wide, y * deep, Math.min(z, 0.15) * 0.45]), brass);
    bowl.position.set(0, 1.2, 0.3); bowl.castShadow = true; g.add(bowl);
  }
  if (kind === 'koreanFlatChopsticks' || kind === 'woodChopsticks') {
    const wood = kind === 'woodChopsticks';
    const m = wood ? matOf(new THREE.Color(spec?.color || '#5C3E2C'), 0.3) : metalMat('#C8CCD0', 0.7);
    const len = val(spec?.length, 21.5), gap = val(spec?.gap, 0.9);
    [-gap / 2, gap / 2].forEach((dx) => {
      const stick = wood
        ? new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.3, len, 8), m)
        : new THREE.Mesh(new THREE.BoxGeometry(0.42, len, 0.18), m);
      if (wood) stick.rotation.x = Math.PI / 2;
      stick.position.set(dx, len / 2 - 2, wood ? 0.3 : 0.1);
      stick.castShadow = true;
      g.add(stick);
    });
    if (wood && withRest) {
      const rest = new THREE.Mesh(morph((x, y, z) => [x * 1.9, y * 0.55, Math.max(0, z) * 0.42]),
        matOf(new THREE.Color(spec?.restColor || '#ECEAE4'), 0.4));
      rest.position.set(0, -1.4, 0);
      rest.castShadow = true; rest.receiveShadow = true;
      g.add(rest);
    }
  }
  return g;
}

const KO = {
  Salad: '샐러드', Poke: '포케', Rice: '덮밥', Pasta: '파스타', Soup: '수프',
  OpenSandwich: '오픈 샌드위치', Pizza: '피자', Sushi: '초밥', Burger: '버거', Burrito: '부리또',
  fork: '포크', knife: '나이프', spoon: '스푼', soupSpoon: '수프 스푼',
  koreanSpoon: '숟가락', koreanFlatChopsticks: '납작 젓가락', woodChopsticks: '나무 젓가락'
};

function layCutlery(list, group) {
  const lanes = SPEC.shared.cutleryLanes || { laneA: 16.8, laneB: 20.3, chopsticks: 19 };
  (list || []).forEach((entry) => {
    const [name, laneRaw] = String(entry).split('@');
    const withRest = name.includes('+rest');
    const kind = name.replace('+rest', '');
    const lane = isFinite(parseFloat(laneRaw)) ? parseFloat(laneRaw) : (lanes[laneRaw] ?? lanes.laneA);
    const g = buildCutlery(kind, SPEC.cutlery[kind], withRest);
    g.position.set(lane, -5, 0.02);
    group.add(g);
    log(`수저 · ${KO[kind] ?? kind}`, '#C4A462');
  });
}

/* ══════════════════════════════════════════════════════════
   한 상 차리기
   ══════════════════════════════════════════════════════════ */

function clearTable() {
  [...world.children].forEach((c) => {
    c.traverse((o) => { if (o.isMesh) { o.geometry?.dispose?.(); o.material?.dispose?.(); } });
    world.remove(c);
  });
  pieces = [];
  Object.assign(report, { placed: 0, skipped: 0, floating: 0, overlap: 0, outside: 0 });
}

function buildMat(group) {
  const m = SPEC.shared.placemat;
  const g = new THREE.ExtrudeGeometry(roundedRectShape(m.w, m.d, m.corner),
    { depth: m.h, bevelEnabled: false, curveSegments: 6 });
  const mesh = new THREE.Mesh(g, matOf(new THREE.Color(m.color), val(m.gloss, 0.25)));
  mesh.position.z = -m.h;                       // 윗면이 z = 0
  mesh.receiveShadow = true;
  group.add(mesh);
}

function buildBase(dish, container, group, field, vars) {
  const b = dish.base;
  if (!b) return container.floor;
  const list = Array.isArray(b) ? b : [b];
  let topZ = container.floor;

  list.forEach((base) => {
    if (base.type === 'domeFill' || base.type === 'flatFill') {
      const level = val(base.level, container.floor + 1);
      const dome = val(base.dome, 0);
      const rB = container.rAt(level);
      const N = 28, pts = [];
      for (let i = 0; i <= N; i++) {
        const r = (rB * i) / N;
        pts.push([r, level + dome * (1 - (r / Math.max(rB, 1e-6)) ** 2)]);
      }
      for (let i = N; i >= 0; i--) {
        const r = (rB * i) / N;
        pts.push([r, container.zIn(r) + 0.01]);
      }
      const mesh = new THREE.Mesh(latheZ(pts, 64),
        matOf(new THREE.Color(base.color), val(base.gloss, 0.3), { side: THREE.DoubleSide }));
      mesh.castShadow = true; mesh.receiveShadow = true;
      group.add(mesh);

      vars.rB = rB; vars.rL = rB; vars.rS = rB;
      vars.level = level; vars.sauce = level; vars.base = level + dome;
      topZ = level + dome;

      const nestle = val(base.nestle, 0.06);
      field.each(0, 0, rB, rB, (i, j, cx, cy) => {
        const r = Math.hypot(cx, cy);
        const k = j * field.nx + i;
        if (field.H[k] < BLOCK) {
          field.H[k] = level + dome * (1 - (r / Math.max(rB, 1e-6)) ** 2) - nestle;
          field.base[k] = 1;
        }
        return true;
      });
      log(`${base.id} · ${base.type}`, base.color);
    } else if (base.type === 'placedPieces') {
      (base.slots || [[0, 0]]).forEach((s) => {
        const piece = buildPiece(base.id, { ...base, colors: [base.color] }, null);
        piece.rotation.z = rnd(-1, 1) * val(base.yawJitterRad, 0.1);
        piece.position.set(s[0], s[1], 0);
        const box = localBox(piece);
        piece.position.z = container.floor - box.min.z;
        group.add(piece);
        const bx = (box.max.x - box.min.x) / 2, by = (box.max.y - box.min.y) / 2;
        const top = container.floor + (box.max.z - box.min.z);
        field.each(s[0], s[1], bx, by, (i, j) => {
          const k = j * field.nx + i;
          field.H[k] = top; field.base[k] = 1;
          return true;
        });
        topZ = Math.max(topZ, top);
      });
      vars.board = container.floor;
      log(`${base.id} ×${(base.slots || []).length}`, base.color);
    } else if (base.type === 'revolvedProfile') {
      const prof = [[9.4, 0.55], [9.8, 1.0], [10.3, 1.28], [10.8, 1.15], [11.05, 0.7], [10.9, 0.25], [10.2, 0]];
      const pts = [[0, container.floor + 0.55]];
      prof.forEach((p) => pts.push([p[0], container.floor + p[1]]));
      pts.push([0, container.floor]);
      const mesh = new THREE.Mesh(latheZ(pts, 72),
        matOf(new THREE.Color(base.color), val(base.gloss, 0.3), { side: THREE.DoubleSide }));
      mesh.castShadow = true; mesh.receiveShadow = true;
      group.add(mesh);
      topZ = container.floor + 0.55;
      vars.crust = topZ;
      field.each(0, 0, 10.2, 10.2, (i, j, cx, cy) => {
        const k = j * field.nx + i;
        if (Math.hypot(cx, cy) <= 10.0 && field.H[k] < BLOCK) { field.H[k] = topZ; field.base[k] = 1; }
        return true;
      });
      log(`${base.id}`, base.color);
    } else if (base.type === 'disk') {
      const r = val(base.r, 9), h = val(base.h, 0.1);
      const mesh = new THREE.Mesh(latheZ([[0, topZ + h], [r, topZ + h], [r, topZ], [0, topZ]], 64),
        matOf(new THREE.Color(base.color), val(base.gloss, 0.5), { side: THREE.DoubleSide }));
      mesh.receiveShadow = true;
      group.add(mesh);
      topZ += h;
      vars.sauce = topZ; vars.rS = r; vars.rB = r;
      field.each(0, 0, r, r, (i, j) => {
        const k = j * field.nx + i;
        if (field.H[k] < BLOCK) { field.H[k] = topZ; field.base[k] = 1; }
        return true;
      });
      log(`${base.id}`, base.color);
    }
  });
  return topZ;
}

function applyFloorRule(dish, field, vars) {
  const rule = String(dish.floorRule || '');
  let R = null;
  const m = /r\s*<\s*([\d.]+)/.exec(rule);
  if (m) R = parseFloat(m[1]);
  if (/rL/.test(rule) && isNum(vars.rL)) R = Math.min(R ?? 1e9, vars.rL - 0.25);
  if (R === null) return;
  field.each(0, 0, field.hw, field.hd, (i, j, cx, cy) => {
    if (Math.hypot(cx, cy) > R) field.H[j * field.nx + i] = BLOCK;
    return true;
  });
}

function buildStack(item, ing, ctx) {
  const layers = ing.layers || [];
  const c = item.center || [0, 0];
  let z = ctx.container.floor;
  layers.forEach((layer) => {
    const piece = buildPiece(layer.id, { ...layer, colors: [layer.color] }, null);
    piece.rotation.z = rng() * Math.PI * 2;
    piece.position.set(c[0] + rnd(-0.15, 0.15), c[1] + rnd(-0.15, 0.15), 0);
    const box = localBox(piece);
    piece.position.z = z - box.min.z;
    box.translate(new THREE.Vector3(0, 0, z - box.min.z));
    ctx.group.add(piece);
    pieces.push({ obj: piece, box, support: z, name: layer.id });
    z += (box.max.z - box.min.z) * 0.92;
    report.placed++;
    log(`${layer.id}`, layer.color);
  });
  return z;
}

function buildSlots(item, ing, ctx) {
  (item.slots || []).forEach((s) => {
    const fish = typeof s[2] === 'string' ? s[2] : null;
    const piece = buildPiece(item.ingredient, ing, item.params, fish ? FISH[fish] : null);
    piece.rotation.z = isNum(s[2]) ? s[2] : rnd(-1, 1) * val(item.yawJitterRad, 0.06);
    const jit = val(item.jitter, 0);
    piece.position.set(s[0] + rnd(-jit, jit), s[1] + rnd(-jit, jit), 0);
    const box = localBox(piece);
    const support = ctx.container.kind === 'slab'
      ? ctx.container.floor
      : ctx.container.zIn(Math.hypot(s[0], s[1]));
    const dz = support - box.min.z;
    piece.position.z = dz;
    box.translate(new THREE.Vector3(0, 0, dz));
    ctx.group.add(piece);
    pieces.push({ obj: piece, box, support, name: item.ingredient });
    const rx = (box.max.x - box.min.x) / 2, ry = (box.max.y - box.min.y) / 2;
    ctx.field.each(piece.position.x, piece.position.y, rx, ry, (i, j) => {
      const k = j * ctx.field.nx + i;
      if (ctx.field.H[k] < box.max.z) ctx.field.H[k] = box.max.z;
      ctx.field.taken[k] = 1;
      return true;
    });
    report.placed++;
  });
  log(`${item.ingredient} ×${(item.slots || []).length}`, ing.colors ? ing.colors[0] : ing.color);
}

function verify(container) {
  pieces.forEach((p, i) => {
    if (p.box.min.z - p.support > 0.05) report.floating++;
    const cx = (p.box.min.x + p.box.max.x) / 2, cy = (p.box.min.y + p.box.max.y) / 2;
    const out = container.kind === 'bowl'
      ? Math.hypot(cx, cy) > container.rim + 0.5
      : (Math.abs(cx) > container.w / 2 + 0.3 || Math.abs(cy) > container.d / 2 + 0.3);
    if (out) report.outside++;
    for (let j = i + 1; j < pieces.length; j++) {
      const q = pieces[j].box;
      const ox = Math.min(p.box.max.x, q.max.x) - Math.max(p.box.min.x, q.min.x);
      const oy = Math.min(p.box.max.y, q.max.y) - Math.max(p.box.min.y, q.min.y);
      const oz = Math.min(p.box.max.z, q.max.z) - Math.max(p.box.min.z, q.min.z);
      if (Math.min(ox, oy, oz) > 0.3) report.overlap++;
    }
  });
}

// 서버가 보낸 손질(ops)을 기본 차림에 적용합니다.
function applyOps(dish, ops) {
  if (!Array.isArray(ops) || !ops.length) return dish;
  const out = JSON.parse(JSON.stringify(dish));
  const find = (key) => out.toppings.findIndex((t) => t.ingredient === key);
  ops.slice(0, 12).forEach((raw) => {
    if (!raw || typeof raw.op !== 'string') return;
    // 모델이 칸 이름을 헷갈려 보내는 일이 잦습니다. 뜻이 통하면 살려 씁니다.
    const op = { ...raw };
    const hex = [raw.color, raw.to, raw.value].find((v) => /^#[0-9a-fA-F]{6}$/.test(String(v ?? '')));
    if (op.op === 'setColor' && hex) op.color = hex;
    if (op.op === 'setCount' && !isNum(op.count)) {
      const n = [raw.count, raw.value, raw.to].map(Number).find((v) => isFinite(v) && v > 0);
      if (isNum(n)) op.count = n; else return;                       // 수가 없으면 건너뜁니다
    }
    if (op.op === 'replace' && !SPEC.ingredients[op.to]) return;
    if (op.op === 'setColor' && !/^#[0-9a-fA-F]{6}$/.test(op.color || '')) return;
    if (!op.ingredient && op.from) op.ingredient = op.from;
    const i = find(op.ingredient ?? op.target);
    if (op.op === 'remove' && i >= 0) { out.toppings.splice(i, 1); log(`빼기 · ${op.ingredient}`); }
    else if (op.op === 'setCount' && i >= 0 && isNum(op.count)) {
      out.toppings[i].count = clamp(Math.round(op.count), 1, 220);
      log(`개수 · ${op.ingredient} ${out.toppings[i].count}`);
    } else if (op.op === 'replace' && i >= 0 && SPEC.ingredients[op.to]) {
      out.toppings[i] = { ...out.toppings[i], ingredient: op.to };
      log(`바꾸기 · ${op.from} → ${op.to}`);
    } else if (op.op === 'add' && SPEC.ingredients[op.ingredient]) {
      out.toppings.push({
        ingredient: op.ingredient,
        count: clamp(Math.round(val(op.count, 6)), 1, 120),
        region: op.region || { type: 'disk', r: 'rB-1' },
        phase: 3
      });
      log(`더하기 · ${op.ingredient}`);
    } else if (op.op === 'setColor' && i >= 0) {
      out.toppings[i].params = { ...(out.toppings[i].params || {}), colors: [op.color], color: op.color };
      log(`색 · ${op.ingredient}`, op.color);
    }
  });
  return out;
}

function buildDish(dishId, seed, ops) {
  const base = SPEC.dishes.find((d) => d.id === dishId);
  if (!base) throw new Error(`모르는 음식: ${dishId}`);
  rng = makeRng(seed);
  clearTable();
  const dish = applyOps(base, ops);

  const group = new THREE.Group();
  world.add(group);
  buildMat(group);

  const c = dish.container;
  const container = c.type === 'roundedSlab' ? buildSlab(c) : buildBowl(c);
  const holder = new THREE.Group();
  holder.position.set((c.center || [0, 0])[0], (c.center || [0, 0])[1], 0);
  holder.add(container.mesh);
  group.add(holder);

  const half = (container.kind === 'slab' ? Math.max(container.w, container.d) / 2 : container.rim) + 1;
  const field = new Field(half);
  field.each(0, 0, half, half, (i, j, cx, cy) => {
    const k = j * field.nx + i;
    if (container.kind === 'slab') field.H[k] = container.inside(cx, cy) ? container.floor : BLOCK;
    else {
      const r = Math.hypot(cx, cy);
      field.H[k] = r < container.rim - 0.15 ? container.zIn(r) : BLOCK;
    }
    return true;
  });

  const vars = {
    floor: container.floor, rim: container.rimZ, rimR: container.rim,
    plate: container.floor, board: container.floor, level: container.floor, sauce: container.floor
  };
  buildBase(dish, container, holder, field, vars);
  applyFloorRule(dish, field, vars);

  log(`${c.style || c.type}`, c.color);
  setStep(2, c.style || c.type,
    container.kind === 'bowl' ? `지름 ${(container.rim * 2).toFixed(0)}cm` : `${container.w}×${container.d}cm`);

  const ctx = { field, vars, group: holder, container, maxTop: dish.maxTop };
  const items = [...(dish.toppings || [])].sort((a, b) => (a.phase ?? 1) - (b.phase ?? 1));
  items.forEach((item) => {
    const ing = SPEC.ingredients[item.ingredient];
    if (!ing) { log(`${item.ingredient} 없음`, null, true); return; }
    if (ing.layers) buildStack(item, ing, ctx);
    else if (item.slots) buildSlots(item, ing, ctx);
    else placeItem(item, ing, ctx);
  });

  layCutlery(dish.cutlery, group);
  verify(container);

  // 매트 전체가 아니라 그릇과 수저에 맞춰 화면을 잡습니다.
  const box = new THREE.Box3();
  group.children.forEach((c) => { if (c !== group.children[0]) box.expandByObject(c); });
  if (box.isEmpty()) box.setFromObject(group);
  const size = new THREE.Vector3(), mid = new THREE.Vector3();
  box.getSize(size); box.getCenter(mid);
  frustum = Math.max(size.x, size.z) * 1.35 + 4;
  camTarget.copy(mid);
  ORBIT.azim = Math.PI / 4; ORBIT.polar = 0.9;
  orbit(); resizeCamera();
  return dish;
}

/* ══════════════════════════════════════════════════════════
   주문 받기
   ══════════════════════════════════════════════════════════ */

const WORDS = {
  Salad: ['샐러드', 'salad', '채소', '야채', '그린'],
  Poke: ['포케', 'poke', '연어덮밥', '하와이'],
  Rice: ['덮밥', '밥', '계란', '비빔', 'rice', '공기', '한식'],
  Pasta: ['파스타', 'pasta', '스파게티', '리가토니', '면', '토마토'],
  Soup: ['수프', '스프', 'soup', '포타주', '국', '호박'],
  OpenSandwich: ['샌드위치', '오픈', 'sandwich', '토스트', '빵', '훈제'],
  Pizza: ['피자', 'pizza', '마르게리타'],
  Sushi: ['초밥', '스시', 'sushi', '니기리', '마키', '김밥', '회'],
  Burger: ['버거', '햄버거', 'burger', '패티'],
  Burrito: ['부리또', '부리토', 'burrito', '타코', '멕시', '칩']
};

function pickDish(order) {
  const q = String(order).toLowerCase().replace(/\s/g, '');
  for (const [id, words] of Object.entries(WORDS)) {
    if (words.some((w) => q.includes(w))) return id;
  }
  return null;
}

/* ── 화면 글자 ───────────────────────────────────────── */

const el = {
  sign: document.getElementById('sign'),
  dishName: document.getElementById('dishName'),
  pips: document.getElementById('pips'),
  composer: document.getElementById('composer'),
  ask: document.getElementById('ask'),
  input: document.getElementById('orderInput'),
  go: document.getElementById('goBtn'),
  hint: document.getElementById('hint'),
  plating: document.getElementById('plating'),
  process: document.getElementById('process'),
  step1: document.getElementById('step1'),
  step2: document.getElementById('step2'),
  step3: document.getElementById('step3'),
  logBox: document.getElementById('log')
};

function setStep(n, head, tail) {
  const b = el['step' + n];
  if (!b) return;
  b.querySelector('span').textContent = head + (tail ? ` · ${tail}` : '');
  b.classList.add('on');
}
function clearProcess() {
  [1, 2, 3].forEach((n) => {
    el['step' + n].querySelector('span').textContent = '…';
    el['step' + n].classList.remove('on');
  });
  el.logBox.innerHTML = '';
  el.process.classList.remove('on');
}
function log(text, color, bad) {
  const line = document.createElement('div');
  if (bad) line.className = 'bad';
  if (color && /^#[0-9a-fA-F]{6}$/.test(color)) {
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = color;
    line.appendChild(dot);
  }
  line.appendChild(document.createTextNode(text));
  el.logBox.appendChild(line);
  while (el.logBox.children.length > 140) el.logBox.firstChild.remove();
  el.logBox.scrollTop = el.logBox.scrollHeight;
}
function warn(text) { el.hint.textContent = text; el.hint.classList.add('warn'); }

/* ── 먹기 ────────────────────────────────────────────── */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const eating = [];
let servedTotal = 0;

function drawPips(total, left) {
  el.pips.innerHTML = '';
  if (total > 14) { el.pips.textContent = `${left} / ${total}`; return; }
  for (let i = 0; i < total; i++) {
    const s = document.createElement('i');
    s.className = 'pip' + (i < total - left ? ' gone' : '');
    el.pips.appendChild(s);
  }
}

function eat(obj) {
  const i = pieces.findIndex((p) => p.obj === obj);
  if (i < 0) return;
  pieces.splice(i, 1);
  obj.userData.home = obj.position.clone();
  eating.push({ g: obj, t: 0 });
  drawPips(servedTotal, pieces.length);
}

let dragging = false, moved = 0, lastX = 0, lastY = 0, spin = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; spin = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  spin = dx * 0.006;
  ORBIT.azim += spin;
  ORBIT.polar = clamp(ORBIT.polar - dy * 0.0045, ORBIT.min, ORBIT.max);
  orbit();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pieces.map((p) => p.obj), true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o.parent && !pieces.some((p) => p.obj === o)) o = o.parent;
  eat(o);
});

/* ── 주방에 묻기 ─────────────────────────────────────── */

const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";
const KITCHEN = `${SUPABASE_URL}/functions/v1/omacase`;

// 서버는 열 가지 차림 중 하나를 고르고, 재료를 바꾸는 손질(ops)만 보냅니다.
async function askKitchen(order) {
  const res = await fetch(KITCHEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ order, dishes: SPEC.dishes.map((d) => d.id) })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    throw new Error(body?.error || `주방에서 응답이 없습니다 (${res.status})`);
  }
  const text = (res.headers.get('content-type') || '').includes('text/event-stream')
    ? (await res.text()).split('\n').filter((l) => l.startsWith('data:'))
      .map((l) => { try { return JSON.parse(l.slice(5)).t || ''; } catch { return ''; } }).join('')
    : await res.text();
  const start = text.indexOf('{');
  if (start < 0) throw new Error('레시피를 읽지 못했습니다');
  return JSON.parse(text.slice(start, text.lastIndexOf('}') + 1));
}

// 손님이 친 말이 이름에는 반드시 남아 있게 (설명은 서버가 쓰되, 비면 이름에서 끌어옵니다)
function keepWords(recipe, order) {
  if (!recipe) return recipe;
  const words = [order, ...String(order).split(/\s+/)].filter((w) => w && w.length >= 2);
  const said = (text) => words.some((w) => String(text || '').includes(w));
  if (!said(recipe.title)) recipe.title = `${order} — ${recipe.title || ''}`.trim();
  if (!recipe.read) recipe.read = `${order}`;
  if (!said(recipe.read) && !said(recipe.why)) recipe.read = `${order} — ${recipe.read}`;
  return recipe;
}

/* ── 주문 → 차림 ─────────────────────────────────────── */

let busy = false;

async function order(text) {
  if (busy) return;
  const q = (text ?? '').trim();
  if (!q) { warn('무엇을 드실지 적어 주세요'); el.input.focus(); return; }
  if (!SPEC) { warn('차림표를 읽는 중입니다'); return; }

  busy = true;
  el.go.disabled = true;
  el.composer.classList.add('hidden');
  el.sign.classList.remove('on');
  el.plating.classList.add('on');
  clearProcess();
  el.process.classList.add('on');
  await new Promise((r) => setTimeout(r, 30));

  let recipe = null;
  try {
    recipe = await askKitchen(q);
    recipe = keepWords(recipe, q);          // 손님이 친 말이 설명에 남아 있는지
  } catch (err) {
    log(`주방 · ${err.message}`, null, true);          // 서버가 없어도 차립니다
  }

  const id = (recipe && SPEC.dishes.some((d) => d.id === recipe.dish)) ? recipe.dish : pickDish(q);
  if (!id) {
    el.plating.classList.remove('on');
    el.go.disabled = false; busy = false;
    warn('초밥 · 포케 · 덮밥 · 파스타 · 수프 · 샌드위치 · 피자 · 버거 · 부리또 · 샐러드');
    el.composer.classList.remove('hidden');
    return;
  }

  try {
    setStep(1, recipe?.title || KO[id] || id, recipe?.read || recipe?.why || q);
    if (recipe?.why) log(`이유 · ${recipe.why}`);
    const t0 = performance.now();
    buildDish(id, hashSeed(q + '|' + Date.now()), recipe?.ops);
    const ms = Math.round(performance.now() - t0);

    servedTotal = pieces.length;
    drawPips(servedTotal, servedTotal);
    el.dishName.textContent = recipe?.title || KO[id] || id;
    el.sign.classList.add('on');
    setStep(3, `겹침 ${report.overlap} · 뜸 ${report.floating} · 밖 ${report.outside}`, `${report.placed}조각 ${ms}ms`);
    log(`조각 ${report.placed} · 건너뜀 ${report.skipped} · ${ms}ms`);
  } catch (err) {
    clearTable();
    warn(err.message || '차리지 못했습니다');
    el.composer.classList.remove('hidden');
  } finally {
    el.plating.classList.remove('on');
    el.go.disabled = false;
    busy = false;
  }
}

el.go.addEventListener('click', () => order(el.input.value));
el.input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  order(el.input.value);
});
el.input.addEventListener('input', () => {
  el.hint.textContent = '입력하고 엔터';
  el.hint.classList.remove('warn');
});

/* ── 그리기 ──────────────────────────────────────────── */

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!dragging && Math.abs(spin) > 0.00002) { ORBIT.azim += spin; spin *= 0.92; orbit(); }
  for (let i = eating.length - 1; i >= 0; i--) {
    const e = eating[i];
    e.t += dt / 0.42;
    const k = Math.min(1, e.t);
    const ease = 1 - Math.pow(1 - k, 3);
    e.g.position.z = (e.g.userData.home?.z ?? 0) + ease * 9;
    e.g.rotation.z += dt * 2.2;
    e.g.scale.multiplyScalar(Math.max(0.001, 1 - dt * 3.4));
    if (k >= 1) {
      e.g.traverse((o) => { if (o.isMesh) { o.geometry?.dispose?.(); o.material?.dispose?.(); } });
      e.g.parent?.remove(e.g);
      eating.splice(i, 1);
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

/* ── 차림표 읽기 ─────────────────────────────────────── */

fetch(SPEC_URL)
  .then((r) => r.json())
  .then((json) => {
    SPEC = json;
    el.hint.textContent = '입력하고 엔터';
    if (!matchMedia('(pointer: coarse)').matches) el.input.focus();
  })
  .catch(() => warn('차림표(dish_specs.json)를 읽지 못했습니다'));

window.__omakase = {
  build: (id, seed = 1) => { buildDish(id, seed); return { ...report, pieces: pieces.length }; },
  report, dishes: () => SPEC.dishes.map((d) => d.id)
};
