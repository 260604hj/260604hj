<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오마카세</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:      #EFEAE1;
    --ink-dim:  #8C867C;
    --ink-faint:#4A463F;
    --bg:       #000000;
    --line:     #2A2722;
    --pad-top:   env(safe-area-inset-top, 0px);
    --pad-bot:   env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; touch-action:none; }

  /* ── 오시나가키: 왼쪽 위 차림표 ───────────────────────── */
  .osinagaki{
    position:fixed; z-index:5;
    top:calc(var(--pad-top) + 22px); left:22px;
    max-width:min(60vw, 320px);
    pointer-events:none;
    opacity:0; transition:opacity .5s ease;
  }
  .osinagaki.on{ opacity:1; }
  .osinagaki .luck{
    font-family:"Gowun Batang", serif;
    font-size:13px; letter-spacing:.04em; color:var(--ink-dim);
    margin:0 0 4px;
  }
  .osinagaki .luck:empty{ display:none; }
  .osinagaki .dish{
    font-family:"Gowun Batang", serif;
    font-size:19px; line-height:1.35; letter-spacing:.02em;
    margin:0;
  }
  .osinagaki .left{
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    margin-top:11px; min-height:8px;
    font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  .pip{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink); opacity:.85;
    transition:transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .pip.gone{
    background:transparent;
    box-shadow:inset 0 0 0 1px var(--ink-faint);
    transform:scale(.72);
  }

  /* ── 아래쪽 주문 ────────────────────────────────────── */
  .composer{
    position:fixed; z-index:5;
    left:50%; transform:translateX(-50%);
    bottom:calc(var(--pad-bot) + 30px);
    width:min(540px, 84vw);
    text-align:center;
    transition:opacity .45s ease;
  }
  .composer.hidden{ opacity:0; pointer-events:none; }
  .composer .ask{
    font-family:"Gowun Batang", serif;
    font-size:15px; color:var(--ink-dim);
    margin:0 0 14px;
  }
  .composer .fields{ display:flex; gap:14px; }
  .composer input{
    flex:1 1 0; min-width:0;
    background:transparent; border:0;
    border-bottom:1px solid var(--line);
    padding:10px 2px; text-align:center;
    font-family:"IBM Plex Sans KR", sans-serif;
    font-size:16px; font-weight:300; color:var(--ink);
    outline:none; transition:border-color .25s ease;
    color-scheme:dark;
  }
  .composer input:focus{ border-bottom-color:var(--ink-dim); }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:200; }
  .composer input[type=date]{ font-variant-numeric:tabular-nums; }
  .composer input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(.55); }
  .composer button{
    display:block; margin:18px auto 0;
    min-width:104px; min-height:44px; padding:0 22px;
    background:transparent; color:var(--ink);
    border:1px solid var(--line); border-radius:0;
    font-family:"Gowun Batang", serif; font-size:15px;
    cursor:pointer; transition:border-color .2s ease, color .2s ease;
  }
  .composer button:hover{ border-color:var(--ink-dim); }
  .composer button:disabled{ color:var(--ink-faint); cursor:default; }
  .composer .hint{
    margin:12px 0 0; font-size:12px; font-weight:200; color:var(--ink-faint);
    min-height:16px;
  }
  .composer .hint.warn{ color:#B9855A; }

  /* ── 준비 중 표시 ───────────────────────────────────── */
  .plating{
    position:fixed; inset:0; z-index:4;
    display:none; place-items:center;
    font-family:"Gowun Batang", serif; font-size:15px; color:var(--ink-dim);
    pointer-events:none;
  }
  .plating.on{ display:grid; }
  .plating span{ animation:breathe 1.9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── 운세 ──────────────────────────────────────────── */
  .fortune{
    position:fixed; inset:0; z-index:8;
    display:none; align-items:center; justify-content:center;
    padding:calc(var(--pad-top) + 28px) 22px calc(var(--pad-bot) + 24px);
    background:rgba(0,0,0,.94);
    overflow-y:auto; overscroll-behavior:contain;
  }
  .fortune.on{ display:flex; }
  .fortune .card{ width:min(440px, 100%); margin:auto 0; }
  .fortune .who{
    font-size:11px; letter-spacing:.14em; color:var(--ink-faint);
    margin:0 0 8px;
  }
  .fortune h2{
    font-family:"Gowun Batang", serif; font-weight:400;
    font-size:26px; line-height:1.3; letter-spacing:-0.01em;
    margin:0 0 26px;
  }
  .fortune section{ margin-bottom:20px; }
  .fortune h3{
    font-size:11px; letter-spacing:.14em; font-weight:400;
    color:var(--ink-faint); margin:0 0 7px;
  }
  .fortune section p{
    font-family:"Gowun Batang", serif;
    font-size:14px; line-height:1.8; color:var(--ink-dim);
    margin:0; word-break:keep-all;
  }
  .fortune button{
    display:block; width:100%; min-height:48px; margin-top:28px;
    background:transparent; color:var(--ink);
    border:1px solid var(--line);
    font-family:"Gowun Batang", serif; font-size:15px;
    cursor:pointer; transition:border-color .2s ease, color .2s ease;
  }
  .fortune button:enabled:hover{ border-color:var(--ink-dim); }
  .fortune button:disabled{ color:var(--ink-faint); cursor:default; }

  /* ── 해석 과정 ──────────────────────────────────────── */
  .process{
    position:fixed; z-index:5;
    left:22px; bottom:calc(var(--pad-bot) + 26px);
    width:min(56vw, 380px);
    pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  .process.on{ opacity:1; }
  .process .steps{ margin-bottom:13px; }
  .process .step{
    display:flex; gap:10px; align-items:baseline;
    font-size:13px; line-height:1.55; margin-bottom:3px;
    color:var(--ink-faint);
    opacity:.45; transition:opacity .4s ease, color .4s ease;
  }
  .process .step.on{ opacity:1; color:var(--ink-dim); }
  .process .step b{
    flex:none; width:34px;
    font-weight:400; font-size:11px; letter-spacing:.08em;
    color:var(--ink-faint);
  }
  .process .step.on b{ color:var(--ink-dim); }
  .process .step span{ font-family:"Gowun Batang", serif; }
  .process .log{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.85; color:var(--ink-faint);
    white-space:pre;
    max-height:36vh; overflow-y:auto; scrollbar-width:none;
  }
  .process .log::-webkit-scrollbar{ display:none; }
  .process .log div{ display:flex; gap:7px; align-items:center; }
  .process .swatch{
    display:inline-block; width:7px; height:7px; flex:none; border-radius:1px;
  }

  /* ── 뒤로 가기 ─────────────────────────────────────── */
  .back{
    position:fixed; z-index:6;
    top:calc(var(--pad-top) + 22px); right:22px;
    font-size:13px; color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--ink-dim); }

  /* ── 좁은 화면 ─────────────────────────────────────── */
  @media (max-width: 560px){
    .fortune{ padding:calc(var(--pad-top) + 22px) 18px calc(var(--pad-bot) + 20px); }
    .fortune h2{ font-size:22px; margin-bottom:20px; }
    .fortune section{ margin-bottom:16px; }
    .fortune section p{ font-size:13.5px; line-height:1.75; }
    .osinagaki{ left:16px; right:16px; max-width:none; top:calc(var(--pad-top) + 16px); }
    .osinagaki .dish{ font-size:17px; }
    .back{ top:calc(var(--pad-top) + 10px); right:10px; padding:10px 12px; }
    .composer{ width:calc(100% - 32px); bottom:calc(var(--pad-bot) + 22px); }
    .composer .ask{ font-size:14px; }
    .composer .fields{ gap:10px; }
    .process{ left:16px; right:16px; width:auto; bottom:calc(var(--pad-bot) + 18px); }
    .process .step{ font-size:12px; line-height:1.45; }
    .process .step b{ width:28px; font-size:10px; }
    .process .log{ font-size:10px; line-height:1.7; max-height:24vh; }
  }
  @media (max-height: 560px){
    .process .log{ max-height:18vh; }
  }

  :focus-visible{ outline:1px solid var(--ink-dim); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="osinagaki" id="osinagaki">
  <p class="luck" id="luck"></p>
  <p class="dish" id="dishName"></p>
  <div class="left" id="pips"></div>
</div>

<a class="back" href="../visitor.html">←</a>

<div class="plating" id="plating"><span>운세를 보고 있습니다</span></div>

<div class="fortune" id="fortune">
  <div class="card">
    <p class="who" id="fWho"></p>
    <h2 id="fLuck"></h2>
    <section><h3>총운</h3><p id="fOverall"></p></section>
    <section><h3>내면운</h3><p id="fInner"></p></section>
    <section><h3>관계운</h3><p id="fRelation"></p></section>
    <button type="button" id="fGo" disabled>차리는 중</button>
  </div>
</div>

<div class="process" id="process">
  <div class="steps">
    <div class="step" id="step1"><b>운세</b><span>…</span></div>
    <div class="step" id="step2"><b>음식</b><span>…</span></div>
    <div class="step" id="step3"><b>그릇</b><span>…</span></div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="composer" id="composer">
  <p class="ask" id="ask">오늘의 운세대로 차려 드립니다</p>
  <div class="fields">
    <input id="nameInput" type="text" autocomplete="name" enterkeyhint="next" placeholder="이름" maxlength="20" />
    <input id="birthInput" type="date" autocomplete="bday" enterkeyhint="go" />
  </div>
  <button type="button" id="goBtn">받기</button>
  <p class="hint" id="hint">이름과 생년월일</p>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   1. 서버 연결

   FOOD NAME → TYPE → VESSEL → COMPONENTS → 3D
   서버는 이름·유형·그릇·구성요소(형태·배치·수식어)만 보냅니다.
   모양, 자리, 높이, 겹침은 전부 여기서 만듭니다.
   ══════════════════════════════════════════════════════════ */

// Supabase 대시보드 > Connect 에서 복사
// KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";
const KITCHEN = `${SUPABASE_URL}/functions/v1/omacase`;

/* ══════════════════════════════════════════════════════════
   2. 화면
   ══════════════════════════════════════════════════════════ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const table = new THREE.Group();
scene.add(table);

let frustum = 30;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

// 카메라가 그릇 둘레를 돕니다. azim 좌우, polar 위아래(0 이면 바로 위에서)
const ORBIT = { dist: 110, azim: Math.PI / 4, polar: 0.96, min: 0.14, max: 1.36 };
const camTarget = new THREE.Vector3(0, 0, 0);

function orbit() {
  const { dist, azim, polar } = ORBIT;
  camera.position.set(
    camTarget.x + dist * Math.sin(polar) * Math.cos(azim),
    camTarget.y + dist * Math.cos(polar),
    camTarget.z + dist * Math.sin(polar) * Math.sin(azim)
  );
  camera.lookAt(camTarget);
}

function resizeCamera() {
  const a = innerWidth / innerHeight;
  const h = frustum / 2;
  camera.left = -(a >= 1 ? h * a : h);
  camera.right = (a >= 1 ? h * a : h);
  camera.top = (a >= 1 ? h : h / a);
  camera.bottom = -(a >= 1 ? h : h / a);
  camera.updateProjectionMatrix();
}
orbit();
resizeCamera();

const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(34, 56, 26);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -26;
keyLight.shadow.camera.right = 26;
keyLight.shadow.camera.top = 26;
keyLight.shadow.camera.bottom = -26;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 160;
keyLight.shadow.bias = -0.0009;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe6ef, 0.5);
fillLight.position.set(-30, 22, -18);
scene.add(fillLight);

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 0.7));

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  resizeCamera();
});

/* ══════════════════════════════════════════════════════════
   3. 기본 도형
   ══════════════════════════════════════════════════════════ */

const UNIT = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  sphere:   new THREE.SphereGeometry(0.5, 24, 14),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 28),
  cone:     new THREE.ConeGeometry(0.5, 1, 22),
  capsule:  new THREE.CapsuleGeometry(0.3, 0.4, 5, 16),
  torus:    new THREE.TorusGeometry(0.35, 0.15, 12, 28),
  tube:     new THREE.CylinderGeometry(0.5, 0.5, 1, 20, 1, true),
  wedge:    new THREE.CylinderGeometry(0.5, 0.5, 1, 14, 1, false, 0, Math.PI / 2.6),
  rock:     new THREE.DodecahedronGeometry(0.5, 0),
  half:     new THREE.SphereGeometry(0.5, 26, 12, 0, Math.PI * 2, 0, Math.PI / 2)
};
UNIT.capsule.computeBoundingBox();
(() => {
  const s = new THREE.Vector3();
  UNIT.capsule.boundingBox.getSize(s);
  UNIT.capsule.scale(1 / s.x, 1 / s.y, 1 / s.z);
})();
UNIT.torus.rotateX(-Math.PI / 2);

const toRad = (d) => (d || 0) * Math.PI / 180;
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isHex = (c) => /^#[0-9a-fA-F]{6}$/.test(String(c ?? '').trim());
const pick = (...c) => c.find(isHex) ?? '#D8B490';
const wobble = (i) => Math.sin(i * 12.9898) * 0.5 + Math.sin(i * 78.233) * 0.5;   // -1~1, 늘 같은 값

// ref/foodspace.3dm 의 팔레트는 채널이 모두 18 의 배수입니다. 같은 결로 맞춥니다.
function snap18(hex) {
  const v = parseInt(String(hex).slice(1), 16);
  const q = (x) => clamp(Math.round(x / 18) * 18, 0, 252);
  return (q((v >> 16) & 255) << 16) | (q((v >> 8) & 255) << 8) | q(v & 255);
}
const foodColor = (hex, fb) => new THREE.Color(snap18(pick(hex, fb)));
const safeColor = (hex, fb = '#CCCCCC') => new THREE.Color(isHex(hex) ? hex : fb);

const growing = [];   // 방금 놓여서 커지는 중인 것

function part(shape, color, size, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const mesh = new THREE.Mesh(UNIT[shape] || UNIT.box, new THREE.MeshStandardMaterial({
    color: color instanceof THREE.Color ? color : foodColor(color),
    roughness: 0.78, metalness: 0,
    side: shape === 'tube' ? THREE.DoubleSide : THREE.FrontSide
  }));
  mesh.position.set(num(pos[0], 0), num(pos[1], 0), num(pos[2], 0));
  mesh.rotation.set(toRad(num(rot[0], 0)), toRad(num(rot[1], 0)), toRad(num(rot[2], 0)));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.to = new THREE.Vector3(
    clamp(num(size[0], 1), 0.03, 40), clamp(num(size[1], 1), 0.03, 40), clamp(num(size[2], 1), 0.03, 40)
  );
  mesh.scale.copy(mesh.userData.to);
  return mesh;
}

// 묶음이 작은 점에서 제 크기로 부풀어 오르게
function popIn(group) {
  group.userData.pop = { t: 0, to: group.scale.clone() };
  group.scale.multiplyScalar(0.001);
  growing.push(group);
  return group;
}

function disposeDeep(obj) {
  obj.traverse((o) => { if (o.isMesh) o.material?.dispose(); });
}

/* ══════════════════════════════════════════════════════════
   4. 그릇
   ══════════════════════════════════════════════════════════ */

const VESSEL_ALIAS = {
  deep_plate: 'rimmed_plate', oval_plate: 'flat_plate', square_plate: 'tray',
  wide_bowl: 'bowl', jar: 'glass', cup: 'cup', small_bowl: 'small_bowl'
};
const VESSEL_LABEL = {
  flat_plate: '평접시', rimmed_plate: '테두리 접시', bowl: '사발', deep_bowl: '깊은 면기',
  small_bowl: '종지', stone_pot: '돌솥', board: '나무 도마', tray: '쟁반', basket: '바구니',
  glass: '유리잔', cup: '잔', leaf: '잎', none: '그릇 없이'
};

function hollow(size, height, color, opts = {}) {
  const R = size / 2, N = 16, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(R * Math.sin(t * Math.PI / 2) * 0.99, height * (1 - Math.cos(t * Math.PI / 2))));
  }
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(pts, 52), new THREE.MeshStandardMaterial({
    color: safeColor(color, '#F2F0EC'), roughness: 0.55, metalness: 0, side: THREE.DoubleSide, ...opts
  }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function slabMesh(color, size, pos) {
  const mesh = new THREE.Mesh(UNIT.box, new THREE.MeshStandardMaterial({
    color: safeColor(color, '#B08050'), roughness: 0.7, metalness: 0
  }));
  mesh.scale.set(...size);
  mesh.position.set(...pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// obj, y0(음식이 시작하는 높이), rx·rz(놓을 수 있는 넓이), depth(깊이)
const VESSELS = {
  flat_plate(size, color) {
    const m = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    m.scale.set(size, 1.2, size);
    m.position.y = -0.6;
    m.castShadow = true; m.receiveShadow = true;
    return { obj: m, y0: 0, rx: size / 2 - 1.4, rz: size / 2 - 1.4, depth: 0 };
  },
  rimmed_plate(size, color) {
    const g = new THREE.Group();
    g.add(VESSELS.flat_plate(size * 0.97, color).obj);
    const rimGeo = new THREE.TorusGeometry(size / 2 - 0.6, 0.62, 12, 56);
    rimGeo.rotateX(-Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#F2F0EC'), roughness: 0.6, metalness: 0
    }));
    rim.castShadow = true; rim.receiveShadow = true;
    g.add(rim);
    return { obj: g, y0: 0.2, rx: size / 2 - 2.4, rz: size / 2 - 2.4, depth: 0.8 };
  },
  bowl: (size, color) => bowlish(size, size * 0.40, color, 0.28),
  deep_bowl: (size, color) => bowlish(size, size * 0.62, color, 0.42),
  small_bowl: (size, color) => bowlish(size * 0.62, size * 0.30, color, 0.3),
  stone_pot(size, color) {
    const v = bowlish(size, size * 0.46, color || '#3A3632', 0.34);
    const g = new THREE.Group();
    g.add(v.obj);
    const foot = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#3A3632'), roughness: 0.85, metalness: 0
    }));
    foot.scale.set(size * 0.55, 1.1, size * 0.55);
    foot.position.y = -0.55;
    foot.castShadow = true; foot.receiveShadow = true;
    g.add(foot);
    v.obj = g;
    return v;
  },
  board(size, color) {
    const d = size * 0.74;
    const g = new THREE.Group();
    g.add(slabMesh(color || '#B08050', [size, 1.5, d], [0, -0.75, 0]));
    return { obj: g, y0: 0, rx: size / 2 - 1.4, rz: d / 2 - 1.4, depth: 0 };
  },
  tray(size, color) {
    const d = size * 0.78;
    const g = new THREE.Group();
    g.add(slabMesh(color || '#7E5A36', [size, 1.1, d], [0, -0.55, 0]));
    [[size / 2, 0, 0.6, d], [-size / 2, 0, 0.6, d], [0, d / 2, size, 0.6], [0, -d / 2, size, 0.6]]
      .forEach(([x, z, w, dd]) => g.add(slabMesh(color || '#7E5A36', [w, 1.4, dd], [x, 0.1, z])));
    return { obj: g, y0: 0.2, rx: size / 2 - 1.8, rz: d / 2 - 1.8, depth: 0.9 };
  },
  basket(size, color) {
    const v = bowlish(size, size * 0.34, color || '#C8A66B', 0.3);
    const g = new THREE.Group();
    g.add(v.obj);
    const lipGeo = new THREE.TorusGeometry(size / 2 * 0.99, 0.45, 10, 46);
    lipGeo.rotateX(-Math.PI / 2);
    const lip = new THREE.Mesh(lipGeo, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#C8A66B'), roughness: 0.85, metalness: 0
    }));
    lip.position.y = size * 0.34;
    lip.castShadow = true; lip.receiveShadow = true;
    g.add(lip);
    v.obj = g;
    return v;
  },
  glass(size, color) {
    const v = bowlish(size, size * 1.2, color || '#CFE0E6', 0.3,
      { transparent: true, opacity: 0.4, roughness: 0.1 });
    v.obj.castShadow = false;
    return v;
  },
  cup(size, color) {
    const v = bowlish(size * 0.8, size * 0.8, color || '#FCFCEA', 0.3);
    return v;
  },
  leaf(size, color) {
    const m = new THREE.Mesh(UNIT.sphere, new THREE.MeshStandardMaterial({
      color: safeColor(color, '#5A9036'), roughness: 0.8, metalness: 0
    }));
    m.scale.set(size, 0.7, size * 0.72);
    m.position.y = -0.2;
    m.receiveShadow = true;
    return { obj: m, y0: 0.15, rx: size / 2 - 1.6, rz: size * 0.36 - 1.6, depth: 0 };
  },
  none(size) {
    return { obj: new THREE.Group(), y0: 0, rx: size / 2, rz: size / 2, depth: 0 };
  }
};

function bowlish(size, height, color, fill, opts) {
  return {
    obj: hollow(size, height, color, opts),
    y0: height * fill,
    rx: 0, rz: 0,                       // 아래에서 담기는 높이에 맞춰 다시 계산
    depth: height
  };
}

/* ══════════════════════════════════════════════════════════
   5. 알갱이와 뿌리기 — 낱개로 그리지 않고 한 번에
   ══════════════════════════════════════════════════════════ */

const GRAIN_GEO = {
  grain: new THREE.CapsuleGeometry(0.16, 0.26, 3, 6),
  ice:   new THREE.IcosahedronGeometry(0.24, 0),
  crumb: new THREE.BoxGeometry(0.3, 0.22, 0.28),
  round: new THREE.SphereGeometry(0.3, 7, 5),
  flake: new THREE.SphereGeometry(0.3, 6, 4)
};

const sunflower = (i, n) => ({ k: Math.sqrt((i + 0.5) / n), a: i * 2.39996 });

function grainMound(geoKey, color, R, H, count) {
  const g = new THREE.Group();
  const base = foodColor(color);

  // 위쪽 반구만 씁니다. 공을 쓰면 아래 절반이 그릇 벽을 뚫고 나옵니다.
  const dome = new THREE.Mesh(UNIT.half, new THREE.MeshStandardMaterial({
    color: base.clone().multiplyScalar(0.88), roughness: 0.9, metalness: 0
  }));
  dome.scale.set(R * 2, H, R * 2);
  dome.castShadow = true; dome.receiveShadow = true;
  g.add(dome);

  const floor = new THREE.Mesh(UNIT.cylinder, new THREE.MeshStandardMaterial({
    color: base.clone().multiplyScalar(0.8), roughness: 0.95, metalness: 0
  }));
  floor.scale.set(R * 2, 0.3, R * 2);
  floor.position.y = 0.14;
  floor.receiveShadow = true;
  g.add(floor);

  const grains = new THREE.InstancedMesh(
    GRAIN_GEO[geoKey] || GRAIN_GEO.grain,
    new THREE.MeshStandardMaterial({ color: base, roughness: 0.82, metalness: 0 }),
    count
  );
  grains.castShadow = true; grains.receiveShadow = true;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), sc = new THREE.Vector3(), tint = new THREE.Color();
  const size = clamp(R / 7, 0.7, 1.5);

  for (let i = 0; i < count; i++) {
    const { k, a } = sunflower(i, count);
    const rr = R * 0.985 * k;
    pos.set(Math.cos(a) * rr, H * 0.95 * Math.sqrt(Math.max(0, 1 - k * k)) + wobble(i) * 0.1 * size, Math.sin(a) * rr);
    e.set(i * 1.7, a + i * 0.31, Math.sin(i * 7.1) * 0.9);
    q.setFromEuler(e);
    sc.setScalar(size * (0.85 + 0.3 * (0.5 + 0.5 * Math.sin(i * 3.7))));
    m.compose(pos, q, sc);
    grains.setMatrixAt(i, m);
    tint.copy(base).multiplyScalar(0.92 + 0.13 * (0.5 + 0.5 * Math.cos(i * 2.1)));
    grains.setColorAt(i, tint);
  }
  grains.instanceMatrix.needsUpdate = true;
  if (grains.instanceColor) grains.instanceColor.needsUpdate = true;
  g.add(grains);
  return g;
}

function sprinkle(geoKey, color, spots, size) {
  const base = foodColor(color);
  const mesh = new THREE.InstancedMesh(
    GRAIN_GEO[geoKey] || GRAIN_GEO.crumb,
    new THREE.MeshStandardMaterial({ color: base, roughness: 0.8, metalness: 0 }),
    spots.length
  );
  mesh.castShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const p = new THREE.Vector3(), sc = new THREE.Vector3(), tint = new THREE.Color();
  spots.forEach((s, i) => {
    p.set(s.x, s.y, s.z);
    e.set(wobble(i) * 0.6, i * 1.31, wobble(i + 3) * 0.6);
    q.setFromEuler(e);
    const f = size * (0.8 + 0.4 * (0.5 + 0.5 * Math.sin(i * 4.1)));
    sc.set(f, f * (geoKey === 'flake' ? 0.3 : 0.8), f * (geoKey === 'flake' ? 0.7 : 1));
    m.compose(p, q, sc);
    mesh.setMatrixAt(i, m);
    tint.copy(base).multiplyScalar(0.9 + 0.16 * (0.5 + 0.5 * Math.cos(i * 1.7)));
    mesh.setColorAt(i, tint);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

/* ══════════════════════════════════════════════════════════
   6. 형태 — 이름만 오면 모양은 여기서. w 는 그 조각의 폭(cm)
   ══════════════════════════════════════════════════════════ */

const FORM_ALIAS = {
  block: 'cuboid', cuboid: 'cuboid', irregular_piece: 'irregular', torus: 'ring',
  noodle: 'nest', strand: 'nest', particle: 'grain', wrap: 'pocket', dome: 'scoop',
  ellipsoid: 'ellipsoid', tube: 'tube', ribbon: 'ribbon', strip: 'strip'
};

const FORMS = {
  sphere:   (w, c, t) => [part('sphere', c, [w, w, w], [0, w / 2, 0])],
  ellipsoid:(w, c, t) => [part('sphere', c, [w, w * 0.68, w * 0.82], [0, w * 0.34, 0])],
  cube:     (w, c, t) => [part('box', c, [w * 0.86, w * 0.86, w * 0.86], [0, w * 0.43, 0], [0, 14, 0])],
  cuboid:   (w, c, t) => [
    part('box', c, [w, w * 0.52, w * 0.66], [0, w * 0.26, 0], [0, 6, 0]),
    t && part('box', t, [w * 0.9, w * 0.08, w * 0.6], [0, w * 0.55, 0])
  ],
  cylinder: (w, c, t) => [
    part('cylinder', c, [w, w * 0.55, w], [0, w * 0.28, 0]),
    t && part('cylinder', t, [w * 0.9, w * 0.08, w * 0.9], [0, w * 0.58, 0])
  ],
  capsule:  (w, c, t) => [
    part('capsule', c, [w, w * 0.44, w * 0.6], [0, w * 0.22, 0], [0, 0, 90]),
    t && part('sheet' in UNIT ? 'box' : 'box', t, [w * 1.02, w * 0.12, w * 0.66], [0, w * 0.48, 0], [0, 0, 3])
  ],
  cone:     (w, c, t) => [part('cone', c, [w, w * 0.9, w], [0, w * 0.45, 0])],
  wedge:    (w, c, t) => [
    part('wedge', c, [w * 1.7, w * 0.3, w * 1.7], [0, w * 0.15, 0]),
    t && part('wedge', t, [w * 1.5, w * 0.1, w * 1.5], [0, w * 0.33, 0])
  ],
  irregular:(w, c, t) => [part('rock', c, [w, w * 0.62, w * 0.88], [0, w * 0.31, 0], [12, 20, 8])],
  sheet:    (w, c, t) => [part('box', c, [w, w * 0.07, w * 0.86], [0, w * 0.04, 0], [-5, 14, 4])],
  disc:     (w, c, t) => [
    part('cylinder', c, [w, w * 0.13, w], [0, w * 0.065, 0]),
    t && part('cylinder', t, [w * 0.88, w * 0.05, w * 0.88], [0, w * 0.15, 0])
  ],
  slice:    (w, c, t) => [
    part('box', c, [w, w * 0.1, w * 0.58], [0, w * 0.05, 0], [0, 0, 6]),
    t && part('box', t, [w * 0.92, w * 0.04, w * 0.5], [0, w * 0.12, 0], [0, 0, 6])
  ],
  strip:    (w, c, t) => [part('box', c, [w, w * 0.12, w * 0.3], [0, w * 0.06, 0], [0, 8, 0])],
  ribbon:   (w, c, t) => [
    part('box', c, [w, w * 0.08, w * 0.26], [0, w * 0.1, 0], [12, 0, 6]),
    part('box', c, [w * 0.8, w * 0.08, w * 0.24], [w * 0.1, w * 0.22, w * 0.06], [-10, 20, -8])
  ],
  flake:    (w, c, t) => [part('sphere', c, [w, w * 0.16, w * 0.7], [0, w * 0.08, 0], [0, 22, 9])],
  stick:    (w, c, t) => [part('box', c, [w, w * 0.22, w * 0.22], [0, w * 0.11, 0], [0, 10, 3])],
  tube:     (w, c, t) => [part('tube', c, [w, w * 0.5, w], [0, w * 0.25, 0], [90, 0, 0])],
  skewer:   (w, c, t) => [
    part('cylinder', '#D8B47E', [w * 0.08, w * 1.35, w * 0.08], [0, w * 0.12, 0], [0, 0, 90]),
    part('sphere', c, [w * 0.38, w * 0.38, w * 0.38], [-w * 0.34, w * 0.24, 0]),
    part('sphere', t ?? c, [w * 0.38, w * 0.38, w * 0.38], [0, w * 0.24, 0]),
    part('sphere', c, [w * 0.38, w * 0.38, w * 0.38], [w * 0.34, w * 0.24, 0])
  ],
  roll:     (w, c, t) => [
    part('cylinder', t ?? '#242424', [w, w * 0.78, w], [0, w * 0.39, 0]),
    part('cylinder', c, [w * 0.76, w * 0.82, w * 0.76], [0, w * 0.42, 0])
  ],
  dumpling: (w, c, t) => [
    part('sphere', c, [w, w * 0.62, w * 0.78], [0, w * 0.31, 0]),
    part('sphere', c, [w * 0.24, w * 0.24, w * 0.24], [-w * 0.3, w * 0.56, 0]),
    part('sphere', c, [w * 0.24, w * 0.24, w * 0.24], [0, w * 0.6, 0]),
    part('sphere', c, [w * 0.24, w * 0.24, w * 0.24], [w * 0.3, w * 0.56, 0])
  ],
  pocket:   (w, c, t) => [
    part('sphere', c, [w, w * 0.6, w * 0.5], [0, w * 0.3, 0], [0, 0, 0]),
    t && part('box', t, [w * 0.7, w * 0.16, w * 0.3], [0, w * 0.5, 0])
  ],
  nest:     (w, c, t) => [
    part('torus', c, [w, w * 0.3, w], [0, w * 0.15, 0]),
    part('torus', c, [w * 0.78, w * 0.26, w * 0.78], [w * 0.05, w * 0.3, 0], [0, 34, 0]),
    part('torus', c, [w * 0.56, w * 0.22, w * 0.56], [-w * 0.04, w * 0.42, w * 0.03], [0, 70, 0]),
    t && part('sphere', t, [w * 0.34, w * 0.2, w * 0.34], [0, w * 0.5, 0])
  ],
  ring:     (w, c, t) => [part('torus', c, [w, w * 0.34, w], [0, w * 0.17, 0])],
  scoop:    (w, c, t) => [
    part('sphere', c, [w, w * 0.85, w], [0, w * 0.36, 0]),
    t && part('sphere', t, [w * 0.34, w * 0.26, w * 0.34], [w * 0.08, w * 0.72, 0])
  ],
  heap:     (w, c, t) => [
    part('cone', c, [w, w * 0.8, w], [0, w * 0.4, 0]),
    t && part('sphere', t, [w * 0.28, w * 0.28, w * 0.28], [0, w * 0.78, 0])
  ]
};

// 조각 하나의 높이(폭 대비)
const FORM_H = {
  sphere: 1, ellipsoid: 0.68, cube: 0.86, cuboid: 0.6, cylinder: 0.62, capsule: 0.5,
  cone: 0.9, wedge: 0.35, irregular: 0.62, sheet: 0.1, disc: 0.18, slice: 0.14,
  strip: 0.16, ribbon: 0.3, flake: 0.16, stick: 0.24, tube: 0.5, skewer: 0.45,
  roll: 0.8, dumpling: 0.64, pocket: 0.6, nest: 0.55, ring: 0.34, scoop: 0.8, heap: 0.85
};

/* ── 수식어: 알아본 형태를 조금 비틀어 그 음식처럼 ───────── */

const MODIFY = {
  flatten:   (g) => g.scale.y *= 0.55,
  compress:  (g) => { g.scale.x *= 0.82; g.scale.z *= 0.82; },
  elongate:  (g) => g.scale.x *= 1.45,
  bulge:     (g) => { g.scale.y *= 1.2; g.scale.x *= 1.06; g.scale.z *= 1.06; },
  taper:     (g) => g.children.forEach((m, i) => { if (i) m.scale.multiplyScalar(0.8); }),
  bend:      (g) => g.children.forEach((m, i) => { m.rotation.z += 0.16 * (i % 2 ? -1 : 1); }),
  curve:     (g) => g.children.forEach((m, i) => { m.rotation.x += 0.14 * (i % 2 ? -1 : 1); }),
  twist:     (g) => g.children.forEach((m, i) => { m.rotation.y += 0.3 * i; }),
  warp:      (g) => g.children.forEach((m, i) => { m.position.x += wobble(i) * 0.1 * g.scale.x; }),
  rough:     (g) => g.children.forEach((m, i) => { m.scale.multiplyScalar(1 + wobble(i) * 0.08); m.rotation.y += wobble(i) * 0.2; }),
  wrinkled:  (g) => MODIFY.rough(g),
  ridged:    (g) => MODIFY.rough(g),
  pleated:   (g) => MODIFY.rough(g),
  crimped:   (g) => MODIFY.rough(g),
  irregular_edge: (g) => g.children.forEach((m, i) => { m.scale.x *= 1 + wobble(i) * 0.12; m.scale.z *= 1 - wobble(i + 1) * 0.1; }),
  torn_edge: (g) => MODIFY.irregular_edge(g),
  folded_edge: (g) => g.children.forEach((m, i) => { if (i === 0) m.rotation.x += 0.2; }),
  scalloped_edge: (g) => MODIFY.irregular_edge(g),
  layered:   (g, w, c) => layerUp(g, w, c, 3),
  stacked:   (g, w, c) => layerUp(g, w, c, 3),
  filled:    (g, w, c, t) => g.add(part('sphere', t ?? c, [w * 0.4, w * 0.3, w * 0.4], [0, w * 0.4, 0])),
  stuffed:   (g, w, c, t) => MODIFY.filled(g, w, c, t),
  sliced:    (g) => { g.scale.z *= 0.6; },
  halved:    (g) => { g.scale.x *= 0.62; },
  quartered: (g) => { g.scale.x *= 0.6; g.scale.z *= 0.6; },
  diced:     (g) => { g.scale.multiplyScalar(0.8); },
  grilled:   (g, w, c) => char(g, w, 2),
  charred:   (g, w, c) => char(g, w, 3),
  baked:     (g) => g.children.forEach((m) => m.material.color.multiplyScalar(0.92)),
  fried:     (g) => g.children.forEach((m) => { m.material.color.lerp(new THREE.Color(0xD8B46C), 0.35); m.material.roughness = 0.95; })
};

// 같은 것을 위로 몇 겹
function layerUp(g, w, c, n) {
  const h = (g.userData.h ?? w * 0.4);
  for (let i = 1; i < n; i++) {
    const m = part('cylinder', c, [w * (1 - i * 0.12), h * 0.5, w * (1 - i * 0.12)], [0, h * (0.6 + i * 0.5), 0]);
    g.add(m);
  }
}

// 구운 자국
function char(g, w, n) {
  const y = (g.userData.h ?? w * 0.4) * 1.02;
  for (let i = 0; i < n; i++) {
    g.add(part('box', '#5A3624', [w * 0.86, w * 0.02, w * 0.07], [0, y, (i - (n - 1) / 2) * w * 0.16], [0, 6, 0]));
  }
}

function buildPiece(formName, w, color, topColor, modifiers) {
  const form = FORMS[formName] ? formName : (FORMS[FORM_ALIAS[formName]] ? FORM_ALIAS[formName] : 'ellipsoid');
  const g = new THREE.Group();
  (FORMS[form](w, color, topColor) || []).filter(Boolean).forEach((m) => g.add(m));
  g.userData.h = (FORM_H[form] ?? 0.5) * w;
  (modifiers || []).slice(0, 3).forEach((mod) => {
    try { MODIFY[mod]?.(g, w, color, topColor); } catch { /* 모양은 못 바꿔도 접시는 나와야 합니다 */ }
  });
  g.userData.form = form;
  return g;
}

/* ══════════════════════════════════════════════════════════
   7. 배치 — 이름만 오면 좌표는 여기서
   ══════════════════════════════════════════════════════════ */

const spread = (n, f) => Array.from({ length: n }, (_, i) => f(i));

const ARRANGE = {
  row: (n, rx) => spread(n, (i) => ({ x: (i - (n - 1) / 2) * ((2 * rx) / n), z: 0 })),
  zigzag: (n, rx, rz) => spread(n, (i) => ({ x: (i - (n - 1) / 2) * ((2 * rx) / n), z: (i % 2 ? 1 : -1) * rz * 0.28 })),
  arc: (n, rx, rz) => spread(n, (i) => {
    const t = n === 1 ? 0.5 : i / (n - 1), a = (-0.42 + 0.84 * t) * Math.PI;
    return { x: Math.cos(a) * rx * 0.72, z: Math.sin(a) * rz * 0.5 + rz * 0.2, ry: -a + Math.PI / 2 };
  }),
  fan: (n, rx, rz) => spread(n, (i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    return { x: (t - 0.5) * rx * 1.3, z: Math.abs(t - 0.5) * rz * 0.5 - rz * 0.1, ry: (t - 0.5) * 1.1 };
  }),
  grid: (n, rx, rz) => {
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    return spread(n, (i) => ({
      x: ((i % cols) - (cols - 1) / 2) * ((2 * rx) / cols),
      z: (Math.floor(i / cols) - (rows - 1) / 2) * ((2 * rz) / rows)
    }));
  },
  ring: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.72, z: Math.sin(a) * rz * 0.72, ry: -a };
  }),
  radial: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.5, z: Math.sin(a) * rz * 0.5, ry: -a };
  }),
  mound: (n, rx, rz) => spread(n, (i) => {
    const { k, a } = sunflower(i, n);
    return { x: Math.cos(a) * rx * 0.55 * k, z: Math.sin(a) * rz * 0.55 * k, y: (1 - k) * 1.6, ry: a };
  }),
  stack: (n) => spread(n, (i) => ({ x: Math.sin(i * 1.1) * 0.5, z: Math.cos(i * 1.1) * 0.5, y: i * 1.05, ry: i * 0.45 })),
  cluster: (n, rx, rz) => spread(n, (i) => {
    const { k, a } = sunflower(i, n);
    return { x: Math.cos(a) * rx * 0.5 * k, z: Math.sin(a) * rz * 0.5 * k, ry: a };
  }),
  scatter: (n, rx, rz) => spread(n, (i) => {
    const { k, a } = sunflower(i, n);
    return { x: Math.cos(a) * rx * 0.86 * k, z: Math.sin(a) * rz * 0.86 * k, ry: a };
  }),
  center: (n, rx, rz) => spread(n, (i) => ({
    x: n === 1 ? 0 : Math.cos(i * 2.4) * rx * 0.2, z: n === 1 ? 0 : Math.sin(i * 2.4) * rz * 0.2, ry: i * 0.6
  })),
  border: (n, rx, rz) => ARRANGE.ring(n, rx * 1.18, rz * 1.18),
  quadrant: (n, rx, rz) => spread(n, (i) => {
    const q = i % 4;
    return { x: (q % 2 ? 1 : -1) * rx * 0.45, z: (q < 2 ? 1 : -1) * rz * 0.45, ry: q * 1.2 };
  }),
  dot: (n, rx, rz) => spread(n, (i) => {
    const a = i * 2.39996;
    return { x: Math.cos(a) * rx * 0.62, z: Math.sin(a) * rz * 0.62 };
  }),
  submerged: (n, rx, rz) => spread(n, (i) => {
    const a = (i / n) * Math.PI * 2;
    return { x: Math.cos(a) * rx * 0.6, z: Math.sin(a) * rz * 0.6, y: -0.5, ry: -a };
  }),
  floating: (n, rx, rz) => ARRANGE.scatter(n, rx * 0.8, rz * 0.8)
};

const ARRANGE_ALIAS = {
  heap: 'mound', pile: 'mound', overlap: 'fan', bundle: 'row', nest: 'center',
  pool: 'center', smear: 'center'
};
const ARRANGE_LABEL = {
  row: '한 줄', zigzag: '지그재그', arc: '호', fan: '부채꼴', grid: '격자', radial: '방사',
  ring: '둥글게', mound: '수북이', stack: '포개기', cluster: '모아서', scatter: '흩뿌리기',
  center: '가운데', border: '가장자리', quadrant: '사분면', dot: '점점이',
  submerged: '잠기게', floating: '떠 있게'
};

function arrangeOf(name) {
  return ARRANGE[name] ? name : (ARRANGE[ARRANGE_ALIAS[name]] ? ARRANGE_ALIAS[name] : 'scatter');
}

// 폭이 hw 인 것이 그릇 안에 들어오도록 자리를 안쪽으로 당깁니다.
// (가장자리에 걸치는 정도는 허용하고, 그릇 밖으로 떨어지는 것만 막습니다)
function fitInside(x, z, hw) {
  const rx = Math.max(0.3, (vessel.limX ?? 10) - hw * 0.8);
  const rz = Math.max(0.3, (vessel.limZ ?? 10) - hw * 0.8);
  const k = Math.hypot(x / rx, z / rz);
  return k > 1 ? { x: x / k, z: z / k } : { x, z };
}

// 다른 구성요소가 이미 쓴 자리면 가까운 빈 곳으로 비켜 놓습니다.
// (초밥 세트처럼 한 점짜리 구성요소가 여럿 올 때 한 자리에 겹치는 것을 막습니다)
function claim(x, z, r, pattern) {
  const spot = { x, z, r };
  if (pattern === 'stack' || pattern === 'mound') { taken.push(spot); return spot; }
  const free = (px, pz) => taken.every((t) => Math.hypot(px - t.x, pz - t.z) >= (t.r + r) * 0.97);
  if (free(x, z)) { taken.push(spot); return spot; }
  for (let step = 1; step <= 48; step++) {
    const rad = r * 0.7 * Math.ceil(step / 8);
    const a = step * 0.86;
    const inside = fitInside(x + Math.cos(a) * rad, z + Math.sin(a) * rad, r * 2);
    const px = inside.x, pz = inside.z;
    if (free(px, pz)) { taken.push({ x: px, z: pz, r }); return { x: px, z: pz }; }
  }
  taken.push(spot);
  return spot;
}

// 자리끼리 너무 가까우면 조각을 줄여 겹치지 않게
function fitScale(spots, w, pattern) {
  if (['mound', 'stack', 'center', 'fan', 'overlap'].includes(pattern) || spots.length < 2) return 1;
  let min = Infinity;
  for (let i = 0; i < spots.length; i++) {
    for (let j = i + 1; j < spots.length; j++) {
      min = Math.min(min, Math.hypot(spots[i].x - spots[j].x, spots[i].z - spots[j].z));
    }
  }
  return clamp((min * 0.94) / w, 0.45, 1.15);
}

   8. 담기
   ══════════════════════════════════════════════════════════ */

// 바닥이 되는 형태: 그 위에 다음 것이 올라갑니다.
const BED_FORMS = ['grain', 'particle', 'pool', 'smear', 'layer', 'nest', 'noodle', 'strand'];
const TYPE_LABEL = {
  piece: '덩어리', slice: '저민 것', wrapped: '싼 것', linear: '길쭉한 것',
  particulate: '알갱이', spread: '펴 바른 것', liquid: '액체', composite: '복합'
};
const TYPE_VESSEL = {
  liquid: 'deep_bowl', linear: 'bowl', particulate: 'bowl', spread: 'flat_plate',
  slice: 'flat_plate', wrapped: 'flat_plate', piece: 'rimmed_plate', composite: 'bowl'
};

let vessel = null;
let solid = [];        // 이미 놓인 조각 { x, z, r, top } — 그 위에 다음 것이 얹힙니다
let hasBase = false;   // 바닥 노릇을 하는 것이 있는지
let cover = 0;         // 지금까지 놓인 것 중 가장 넓은 폭 (나중 것이 이걸 덮지 않게)
let taken = [];        // 이미 무엇이 놓인 자리 { x, z, r }
let beds = [];         // { h(r) } 높이를 돌려주는 바닥들
let placed = 0;        // 몇 번째 구성요소까지 놓았는지
const bites = [];      // 집어 먹을 수 있는 조각
const eating = [];
let leftovers = null;  // 바닥·국물·고명

function resetPlate() {
  [...table.children].forEach((c) => { disposeDeep(c); table.remove(c); });
  bites.length = 0;
  eating.length = 0;
  growing.length = 0;
  beds = [];
  taken = [];
  solid = [];
  hasBase = false;
  cover = 0;
  vessel = null;
  leftovers = null;
  placed = 0;
}

// 그 자리의 표면 높이 (바닥들 중 가장 높은 것)
function surfaceAt(x, z) {
  let y = vessel.y0;
  const r = Math.hypot(x, z);
  beds.forEach((b) => { y = Math.max(y, b.y + b.h(r)); });
  return y;
}

// 폭이 2r 인 것을 여기 놓으면 어디에 앉는가.
// 바닥의 경사와 이미 놓인 조각을 모두 보고, 그중 가장 높은 곳에 얹습니다.
// (그래야 뜨지도 않고, 아래 것을 파고들지도 않습니다)
function ground(x, z, r) {
  let y = surfaceAt(x, z);
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    y = Math.max(y, surfaceAt(x + Math.cos(a) * r * 0.7, z + Math.sin(a) * r * 0.7));
  }
  for (const p of solid) {
    if (Math.hypot(x - p.x, z - p.z) < (r + p.r) * 0.86) y = Math.max(y, p.top);
  }
  return y;
}

function buildVessel(serving, types) {
  const asked = VESSEL_ALIAS[serving.vessel] ?? serving.vessel;
  const kind = VESSELS[asked] ? asked : (TYPE_VESSEL[types?.[0]] || 'rimmed_plate');
  const size = clamp(num(serving.size, 22), 8, 34);
  vessel = VESSELS[kind](size, serving.color);
  vessel.kind = kind;
  vessel.size = size;
  table.add(vessel.obj);

  leftovers = new THREE.Group();
  table.add(leftovers);

  // 그릇을 채운 국물. 음식은 그 위에서 시작합니다.
  const liquid = serving.liquid;
  if (liquid && isHex(liquid.color) && vessel.depth > 2) {
    const level = clamp(num(liquid.level, 0.5), 0.1, 0.95);
    const y = vessel.depth * level;
    const rr = (size / 2) * Math.sqrt(Math.max(0.05, 1 - Math.pow(1 - level, 2))) * 0.96;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(rr, rr * 0.34, Math.max(y, 0.4), 40),
      new THREE.MeshStandardMaterial({
        color: safeColor(liquid.color), roughness: 0.22, metalness: 0,
        transparent: kind === 'glass', opacity: kind === 'glass' ? 0.9 : 1
      })
    );
    body.position.y = y / 2;
    body.receiveShadow = true;
    leftovers.add(body);
    vessel.y0 = y;
    log(`국물 ${Math.round(level * 100)}%`, liquid.color);
  }

  // 오목한 그릇은 음식이 놓이는 높이에서의 넓이를 씁니다. (테두리 접시·쟁반은 해당 없음)
  if (vessel.depth > 2) {
    const t = clamp(1 - vessel.y0 / vessel.depth, -1, 1);
    vessel.rim = (size / 2) * Math.sqrt(Math.max(0.05, 1 - t * t));
    vessel.rx = vessel.rz = vessel.rim * 0.8;
    vessel.limX = vessel.limZ = vessel.rim;          // 그 높이에서 그릇 안쪽 가장자리
  } else {
    vessel.rim = Math.max(vessel.rx, vessel.rz) + 1.4;
    vessel.limX = vessel.rx + 1.4;
    vessel.limZ = vessel.rz + 1.4;
  }

  frustum = size * 1.45 + vessel.depth * 0.45;
  camTarget.set(0, vessel.depth * 0.34, 0);
  ORBIT.azim = Math.PI / 4;
  ORBIT.polar = 0.96;
  orbit();
  resizeCamera();

  log(`${VESSEL_LABEL[kind] ?? kind} ${Math.round(size)}cm`, serving.color);
}

// 구성요소 하나를 접시에 올립니다.
function addComponent(comp) {
  const rawForm = String(comp.form ?? 'ellipsoid');
  const food = String(comp.food ?? '').slice(0, 14);
  const color = pick(comp.color, '#D8B490');
  const top = isHex(comp.top_color) ? comp.top_color : null;
  const pattern = arrangeOf(String(comp.arrangement ?? 'scatter'));
  const isBed = BED_FORMS.includes(rawForm);
  const count = clamp(Math.round(num(comp.count, isBed ? 1 : 6)), 1, 24);
  const mods = Array.isArray(comp.modifiers) ? comp.modifiers : [];
  const lim = Math.min(vessel.limX ?? 10, vessel.limZ ?? 10);
  let w = clamp(num(comp.size, isBed ? lim * 1.4 : 3), 0.3, lim * 1.9);

  // 나중에 오는 것은 이미 놓인 것을 덮지 않아야 합니다.
  // 소스·고명은 더 작게, 그리고 바닥(밥·면·도우) 위에 올라가는 것은 그 바닥 안에서.
  const structural = ['grain', 'particle', 'nest', 'noodle', 'strand'].includes(rawForm);
  if (placed > 0 && !structural) {
    const sauce = rawForm === 'pool' || rawForm === 'smear' || rawForm === 'layer'
      || rawForm === 'crumb' || rawForm === 'flake';
    w = Math.min(w, lim * (sauce ? 0.6 : 0.8));
    // 바닥 위에 올라가는 것만 그 바닥보다 작게. 나란히 놓는 것끼리는 줄이지 않습니다.
    if (cover > 0 && (beds.length || hasBase)) w = Math.min(w, cover * (sauce ? 0.55 : 0.75));
  }

  const note = (extra) => {
    log(`${food || rawForm} · ${rawForm} ${ARRANGE_LABEL[pattern] ?? pattern}${extra}`, color);
    placed += 1;
  };

  // ── 바닥이 되는 것들 ───────────────────────────────
  if (rawForm === 'grain' || rawForm === 'particle') {
    const R = clamp(w / 2, 2, vessel.rim * 0.94);
    // 뾰족한 산이 아니라 봉긋한 무덤. 넓이의 1/3 남짓까지만 올라갑니다.
    const H = clamp(Math.min(R * 0.34, vessel.depth > 2 ? vessel.depth * 0.34 : R * 0.34), 1.0, 4.2);
    const n = clamp(Math.round(R * R * 4.2), 90, 460);
    const c3 = new THREE.Color(pick(color));
    const y = surfaceAt(0, 0);
    const mound = grainMound(c3.b > c3.r + 0.02 ? 'ice' : 'grain', color, R, H, n);
    mound.position.y = y;
    leftovers.add(popIn(mound));
    beds.push({ y, h: (r) => (r > R ? 0 : H * Math.sqrt(Math.max(0, 1 - (r / R) ** 2))) });
    vessel.rx = vessel.rz = Math.max(vessel.rx, R * 0.66);
    cover = Math.max(cover, R * 2);
    hasBase = true;
    return note(` ${n}알`);
  }

  if (rawForm === 'pool' || rawForm === 'smear' || rawForm === 'layer') {
    if (rawForm === 'smear') w = Math.min(w, lim * 1.25);
    const spots = ARRANGE[pattern](count, vessel.rx, vessel.rz);
    const g = new THREE.Group();
    const thick = rawForm === 'layer' ? w * 0.16 : 0.34;
    spots.forEach((s, i) => {
      const put = fitInside(num(s.x, 0), num(s.z, 0), w * (rawForm === 'smear' ? 0.75 : 0.5));
      const m = part('cylinder', color, [w, thick, w * (rawForm === 'smear' ? 0.42 : 1)],
        [put.x, thick / 2, put.z], [0, i * 34, 0]);
      if (rawForm === 'smear') m.scale.x *= 1.5;
      g.add(m);
    });
    const y = surfaceAt(0, 0);
    g.position.y = y;
    leftovers.add(popIn(g));
    const R = w * (rawForm === 'smear' ? 0.9 : 0.55);
    beds.push({ y, h: (r) => (r > R ? 0 : thick) });
    cover = Math.max(cover, w);
    hasBase = true;
    return note(` ${count}개 ${w.toFixed(1)}cm`);
  }

  // ── 고명·부스러기: 낱개로 그리지 않고 한 번에 ─────────
  if (rawForm === 'crumb' || (count > 12 && w < 1.6)) {
    w = Math.min(w, count >= 8 ? 1.2 : 1.8);        // 뿌리는 것은 고명 크기까지만
    const spots = ARRANGE[pattern](count, vessel.rx * 1.02, vessel.rz * 1.02);
    const pts = spots.map((s, i) => {
      const put = fitInside(s.x, s.z, w);
      return { x: put.x, z: put.z, y: ground(put.x, put.z, w * 0.5) + w * 0.4 + Math.abs(wobble(i)) * 0.15 };
    });
    const mesh = sprinkle(rawForm === 'flake' ? 'flake' : 'crumb', color, pts, w);
    leftovers.add(popIn(new THREE.Group().add(mesh)));
    return note(` ${count}개 ${w.toFixed(1)}cm`);
  }

  // ── 집어 먹는 조각들 ──────────────────────────────
  const bed = BED_FORMS.includes(rawForm) || (count === 1 && w > vessel.rim * 1.2);
  const spots = ARRANGE[pattern](count, vessel.rx, vessel.rz);
  if (count > 1) w *= fitScale(spots, w, pattern);

  // 포개는 것은 제 두께만큼 올라가야 합니다
  const pieceH = (FORM_H[FORMS[rawForm] ? rawForm : FORM_ALIAS[rawForm]] ?? 0.5) * w;
  if (pattern === 'stack') spots.forEach((s, i) => { s.y = i * pieceH * 0.86; });

  spots.forEach((s, i) => {
    const g = buildPiece(rawForm, w, color, top, mods);
    const want = fitInside(num(s.x, 0), num(s.z, 0), w * 0.5);
    const put = bed ? want : claim(want.x, want.z, w * 0.56, pattern);
    const inside = fitInside(put.x, put.z, w * 0.5);
    const x = inside.x, z = inside.z;
    const r = w * 0.52;
    const sink = Math.min(0, num(s.y, 0));          // 국물에 잠기는 것만 아래로
    const floor = ground(x, z, r) + sink;
    solid.push({ x, z, r, top: floor + pieceH * 0.92 });
    g.position.set(x, floor, z);
    g.rotation.y = num(s.ry, 0) + wobble(i) * 0.3;
    popIn(g);
    if (bed) {
      leftovers.add(g);
    } else {
      g.userData.home = g.position.clone();
      g.userData.food = food;
      table.add(g);
      bites.push(g);
    }
  });

  // 이 위에 다음 것이 올라갈 수 있게 높이를 기록
  if (rawForm !== 'crumb') cover = Math.max(cover, count === 1 ? w : w * 1.6);
  const h = pattern === 'stack' ? pieceH * count * 0.86 : pieceH;
  // 접시를 넓게 차지한 것이 있으면, 그 뒤에 오는 것은 이걸 덮지 않도록 작게 잡습니다.
  if (bed || pattern === 'stack' || (count === 1 && w > lim * 0.8)) hasBase = true;
  return note(` ${count}개 ${w.toFixed(1)}cm`);
}

function grow(spec, final) {
  if (!spec) return;
  const sv = spec.serving;
  // 국물은 색 다음에 오므로, 그것까지 온 뒤에 그릇을 만듭니다.
  // 먼저 만들면 국물 없는 그릇이 되고, 음식이 국물 아래에 놓입니다.
  const ready = sv && typeof sv.vessel === 'string' && typeof sv.size === 'number'
    && typeof sv.color === 'string' && 'liquid' in sv;
  if (!vessel && (ready || (final && sv))) buildVessel(sv, spec.type);
  if (!vessel) return;

  const list = Array.isArray(spec.components) ? spec.components : [];
  list.forEach((comp, i) => {
    if (i < placed) return;
    if (!final && i === list.length - 1) return;      // 아직 쓰는 중일 수 있음
    if (!comp || typeof comp.form !== 'string' || typeof comp.arrangement !== 'string'
      || typeof comp.size !== 'number') return;
    addComponent(comp);
  });
}

};

let servedTotal = 0;

function drawPips(total, left) {
  el.pips.innerHTML = '';
  if (total > 14) { el.pips.textContent = `${left} / ${total}`; return; }
  for (let i = 0; i < total; i++) {
    const s = document.createElement('i');
    s.className = 'pip' + (i < total - left ? ' gone' : '');
    el.pips.appendChild(s);
  }
}

function eat(group) {
  const i = bites.indexOf(group);
  if (i < 0) return;
  bites.splice(i, 1);
  group.userData.home = group.userData.home ?? group.position.clone();
  eating.push({ g: group, t: 0 });
  drawPips(servedTotal, bites.length);
  if (bites.length === 0) setTimeout(clearPlate, 500);
}

function clearPlate() {
  if (leftovers && leftovers.children.length) {
    leftovers.userData = { home: leftovers.position.clone() };
    eating.push({ g: leftovers, t: 0 });
    leftovers = null;
  }
  setTimeout(finishCourse, 620);
}

function finishCourse() {
  el.dishName.textContent = '잘 드셨습니다';
  el.pips.textContent = '';
  el.ask.textContent = '다른 분의 운세도 봐 드립니다';
  el.hint.textContent = '이름과 생년월일';
  el.hint.classList.remove('warn');
  el.composer.classList.remove('hidden');
}

/* 드래그는 회전(좌우·위아래), 짧게 누르면 먹기 */
let dragging = false, moved = 0, lastX = 0, lastY = 0, spin = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; spin = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  // 끄는 쪽으로 카메라가 따라갑니다
  spin = dx * 0.006;
  ORBIT.azim += spin;
  ORBIT.polar = clamp(ORBIT.polar - dy * 0.0045, ORBIT.min, ORBIT.max);
  orbit();
});

renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bites, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o.parent && o.parent !== table) o = o.parent;
  eat(o);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor =
    raycaster.intersectObjects(bites, true).length ? 'pointer' : 'default';
});

function clearProcess() {

    el['step' + n].classList.remove('on');
  });
  el.logBox.innerHTML = '';
  el.process.classList.remove('on');
}

function log(text, color) {
  const line = document.createElement('div');
  if (isHex(color)) {
    const dot = document.createElement('span');
    dot.className = 'swatch';
    dot.style.background = color;
    line.appendChild(dot);
  }
  line.appendChild(document.createTextNode(text));
  el.logBox.appendChild(line);
  while (el.logBox.children.length > LOG_MAX) el.logBox.firstChild.remove();
  el.logBox.scrollTop = el.logBox.scrollHeight;
}

/* ══════════════════════════════════════════════════════════
   11. 반쯤 온 JSON 읽기
   ══════════════════════════════════════════════════════════ */

function closeUp(src) {
  const stack = [];
  let inStr = false, esc = false;
  for (const c of src) {
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === '{') stack.push('}');
    else if (c === '[') stack.push(']');
    else if (c === '}' || c === ']') stack.pop();
  }
  if (inStr) return null;
  return src + stack.reverse().join('');
}

function parsePartial(raw) {
  const text = raw.replace(/^[^[{]*/, '');
  for (let end = text.length; end > 0; end--) {
    const c = text[end - 1];
    if (c !== '}' && c !== ']' && c !== '"' && !/[0-9a-z]/.test(c)) continue;
    const cand = closeUp(text.slice(0, end));
    if (cand === null) continue;
    try { return JSON.parse(cand); } catch { /* 더 앞으로 */ }
  }
  return null;
}

// 아직 닫히지 않은 문장도 쓰이는 대로
function peekString(text, key) {
  const at = text.indexOf('"' + key + '"');
  if (at < 0) return '';
  const colon = text.indexOf(':', at);
  const open = text.indexOf('"', colon + 1);
  if (colon < 0 || open < 0) return '';
  let out = '';
  for (let i = open + 1; i < text.length; i++) {
    const c = text[i];
    if (c === '"') break;
    if (c !== '\\') { out += c; continue; }
    const n = text[i + 1];
    if (n === undefined) break;
    if (n === 'u') {
      const hex = text.slice(i + 2, i + 6);
      if (hex.length < 4) break;
      out += String.fromCharCode(parseInt(hex, 16));
      i += 5;
      continue;
    }
    out += ({ n: '\n', t: '\t', r: '' })[n] ?? n;
    i += 1;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   12. 주문 → 주방 → 접시
   ══════════════════════════════════════════════════════════ */

async function askKitchen(guest, onText) {
  const res = await fetch(KITCHEN, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify(guest)
  });

  if (!res.ok || !res.body) {
    const body = await res.json().catch(() => null);
    throw new Error(body?.error || `주방에서 응답이 없습니다 (${res.status})`);
  }

  if (!(res.headers.get('content-type') || '').includes('text/event-stream')) {
    const whole = await res.text();
    if (!whole.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
    onText(whole);
    return whole;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', text = '';

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() ?? '';
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let msg;
      try { msg = JSON.parse(line.slice(5)); } catch { continue; }
      if (msg.error) throw new Error(msg.error);
      if (msg.t) { text += msg.t; onText(text); }
    }
  }
  if (!text.trim()) throw new Error('접시가 비어 돌아왔습니다. 다시 주문해 주세요');
  return text;
}

let busy = false;

// 운세를 먼저 보여 주고, 손님이 누르면 그때 접시를 보여 줍니다.
function showFortune(f, name) {
  if (!f) return;
  el.fWho.textContent = name ? `${name} 님의 오늘` : '오늘';
  el.fLuck.textContent = f.luck ?? '';
  el.fOverall.textContent = f.overall ?? '';
  el.fInner.textContent = f.inner ?? '';
  el.fRelation.textContent = f.relation ?? '';
  el.fortune.classList.add('on');
}

function showPlate() {
  el.fortune.classList.remove('on');
  el.osinagaki.classList.add('on');
  el.process.classList.add('on');
}

async function order() {
  if (busy) return;
  const name = el.name.value.trim();
  const birth = el.birth.value;
  if (!name) { warn('이름을 적어 주세요'); el.name.focus(); return; }
  if (!birth) { warn('생년월일을 골라 주세요'); el.birth.focus(); return; }

  busy = true;
  el.go.disabled = true;
  el.fGo.disabled = true;
  el.fGo.textContent = '차리는 중';
  el.composer.classList.add('hidden');
  el.osinagaki.classList.remove('on');
  el.process.classList.remove('on');
  el.plating.classList.add('on');
  el.pips.textContent = '';
  el.luck.textContent = '';
  clearProcess();
  resetPlate();

  const today = new Date().toISOString().slice(0, 10);
  let shownLuck = '', typeLogged = false;

  // 글자가 오는 대로: 운세는 앞 화면에, 접시는 뒤에서 조용히 차려 둡니다.
  const onText = (all) => {
    el.plating.classList.remove('on');

    const spec = parsePartial(all);
    const f = spec?.fortune;
    const luck = f?.luck || peekString(all, 'luck');
    if (luck) {
      showFortune({
        luck,
        overall: f?.overall || peekString(all, 'overall'),
        inner: f?.inner || peekString(all, 'inner'),
        relation: f?.relation || peekString(all, 'relation')
      }, name);
      if (luck !== shownLuck) {
        shownLuck = luck;
        el.luck.textContent = luck;
        setStep(1, luck);
      }
    }
    if (spec?.dish && el.dishName.textContent !== spec.dish) el.dishName.textContent = spec.dish;
    if (spec?.dish) setStep(2, spec.dish, peekString(all, 'dish_why'));
    if (spec?.serving?.vessel) {
      setStep(3, VESSEL_LABEL[VESSEL_ALIAS[spec.serving.vessel] ?? spec.serving.vessel] ?? spec.serving.vessel,
        peekString(all, 'vessel_why'));
    }
    if (Array.isArray(spec?.type) && spec.type.length && !typeLogged) {
      typeLogged = true;
      log(`유형 · ${spec.type.map((t) => TYPE_LABEL[t] ?? t).join(' + ')}`);
    }
    grow(spec, false);
  };

  try {
    const raw = await askKitchen({ name, birth, today }, onText);
    const spec = parsePartial(raw);
    grow(spec, true);
    if (!vessel || !placed) throw new Error('오늘 운세는 담아내지 못했습니다. 다시 받아 주세요');

    if (!bites.length && leftovers) {
      leftovers.userData = { home: leftovers.position.clone() };
      bites.push(leftovers);
      leftovers = null;
    }
    servedTotal = bites.length;
    el.dishName.textContent = spec.dish || '오늘의 한 상';
    if (spec?.fortune) {
      showFortune(spec.fortune, name);
      el.luck.textContent = spec.fortune.luck ?? '';
      setStep(1, spec.fortune.luck ?? '오늘', spec.fortune.overall ?? '');
    }
    drawPips(servedTotal, servedTotal);
    el.fGo.textContent = `${spec?.dish ?? '오늘의 음식'} 보기`;
    el.fGo.disabled = false;
    if (!el.fortune.classList.contains('on')) showPlate();     // 운세가 없으면 바로 접시로
  } catch (err) {
    resetPlate();
    clearProcess();
    el.fortune.classList.remove('on');
    el.osinagaki.classList.remove('on');
    el.dishName.textContent = '';
    el.luck.textContent = '';
    warn(err.message || '무언가 잘못되었습니다');
    el.composer.classList.remove('hidden');
  } finally {
    el.plating.classList.remove('on');
    el.go.disabled = false;
    busy = false;
  }
}

function warn(text) {
  el.hint.textContent = text;
  el.hint.classList.add('warn');
}

el.fGo.addEventListener('click', () => { if (!el.fGo.disabled) showPlate(); });
el.go.addEventListener('click', order);
[el.name, el.birth].forEach((input) => {
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (input === el.name && !el.birth.value) { el.birth.focus(); return; }
    order();
  });
  input.addEventListener('input', () => {
    el.hint.textContent = '이름과 생년월일';
    el.hint.classList.remove('warn');
  });
});

if (!matchMedia('(pointer: coarse)').matches) el.name.focus();   // 폰에서는 자판이 바로 올라오지 않게

/* ══════════════════════════════════════════════════════════
   13. 그리기
   ══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!dragging && Math.abs(spin) > 0.00002) {
    ORBIT.azim += spin;
    spin *= 0.92;
    orbit();
  }

  for (let i = growing.length - 1; i >= 0; i--) {
    const g = growing[i];
    const p = g.userData.pop;
    p.t += dt / 0.26;
    const k = Math.min(1, p.t);
    const ease = 1 - Math.pow(1 - k, 3);
    g.scale.set(
      Math.max(0.001, p.to.x * ease),
      Math.max(0.001, p.to.y * ease),
      Math.max(0.001, p.to.z * ease)
    );
    if (k >= 1) growing.splice(i, 1);
  }

  for (let i = eating.length - 1; i >= 0; i--) {
    const e = eating[i];
    e.t += dt / 0.42;
    const k = Math.min(1, e.t);
    const ease = 1 - Math.pow(1 - k, 3);
    e.g.position.y = (e.g.userData.home?.y ?? 0) + ease * 5.5;
    e.g.rotation.y += dt * 2.2;
    e.g.scale.multiplyScalar(Math.max(0.001, 1 - dt * 3.4));
    if (k >= 1) {
      disposeDeep(e.g);
      e.g.parent?.remove(e.g);
      eating.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
