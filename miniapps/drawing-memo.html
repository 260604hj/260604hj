<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그림 메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#15171c;
        --muted:#8a8f98;
        --line:#e4e6e9;
        --paper:#ffffff;
    }
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    [hidden]{ display:none !important; }

    body{
        font-family:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        color:var(--ink);
        background:var(--paper);
        -webkit-font-smoothing:antialiased;
        padding:48px 24px;
    }

    .wrap{ width:100%; max-width:520px; margin:0 auto; }

    .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
    .top a, .top button{ color:var(--muted); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; }
    .top a:hover, .top button:hover{ color:var(--ink); }
    .who{ display:flex; gap:10px; align-items:center; }

    h1{
        margin-top:14px;
        font-weight:300;
        font-size:34px;
        letter-spacing:-0.02em;
    }

    form, #board{ margin-top:28px; }
    form input{
        display:block; width:100%;
        border:1px solid var(--line); border-radius:0;
        padding:12px 16px;
        font:inherit; font-size:16px; line-height:1.6; color:inherit;
        outline:none;
    }
    form input + input{ border-top:0; }
    form input:focus{ border-color:var(--ink); }
    form input + input:focus{ border-top:1px solid var(--ink); margin-top:-1px; }

    .tools{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .tool{
        border:1px solid var(--line); background:var(--paper); color:var(--ink);
        padding:7px 14px; font:inherit; font-size:13px; cursor:pointer;
    }
    .tool[aria-pressed="true"]{ border-color:var(--ink); background:var(--ink); color:#fff; }
    #width{ flex:1; min-width:0; accent-color:var(--ink); }
    .dot-box{ flex:none; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
    #widthDot{ display:block; border-radius:50%; background:var(--ink); }

    canvas{
        display:block; width:100%; aspect-ratio:1 / 1;
        border:1px solid var(--line); background:#fff;
        touch-action:none; cursor:crosshair;
    }

    .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    .pri, .ghost{
        border:1px solid var(--ink); background:var(--ink); color:#fff;
        padding:10px 22px; font:inherit; font-size:14px; cursor:pointer;
    }
    .ghost{ background:var(--paper); color:var(--ink); }
    .pri:disabled, .ghost:disabled{ opacity:.4; cursor:default; }

    #status{ margin-top:14px; font-size:13px; color:#b3261e; }
    #status:empty{ display:none; }

    #list{ list-style:none; margin-top:28px; display:grid; grid-template-columns:repeat(2, 1fr); gap:18px 14px; }
    #list img{ display:block; width:100%; aspect-ratio:1 / 1; border:1px solid var(--line); }
    .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; min-height:22px; }
    .time{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .del{
        border:0; background:none; color:var(--muted);
        font-size:18px; line-height:1; padding:2px 6px; cursor:pointer;
    }
    .del:hover{ color:var(--ink); }
</style>
</head>
<body>
<main class="wrap">
    <div class="top">
        <a href="../index.html">←</a>
        <span class="who" id="who" hidden>
            <span id="email"></span>
            <button type="button" id="logout">로그아웃</button>
        </span>
    </div>

    <h1>그림 메모</h1>

    <form id="loginForm" hidden>
        <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" required>
        <div class="row"><button type="submit" class="pri" id="loginBtn">로그인</button></div>
    </form>

    <section id="board" hidden>
        <div class="tools">
            <button type="button" class="tool" id="pen" aria-pressed="true">펜</button>
            <button type="button" class="tool" id="eraser" aria-pressed="false">지우개</button>
            <input type="range" id="width" min="2" max="40" value="6" aria-label="굵기">
            <span class="dot-box"><span id="widthDot"></span></span>
        </div>
        <canvas id="canvas" width="720" height="720"></canvas>
        <div class="row">
            <button type="button" class="ghost" id="clear">비우기</button>
            <button type="button" class="pri" id="save" disabled>저장</button>
        </div>
    </section>

    <p id="status"></p>
    <ul id="list"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
    // Supabase 대시보드 > Connect 에서 복사
    // KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
    const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

    const INK = '#15171c';

    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm'), loginEmail = $('loginEmail'), loginPassword = $('loginPassword'), loginBtn = $('loginBtn');
    const who = $('who'), emailEl = $('email'), logout = $('logout');
    const board = $('board'), canvas = $('canvas'), clearBtn = $('clear'), saveBtn = $('save');
    const penBtn = $('pen'), eraserBtn = $('eraser'), widthInput = $('width'), widthDot = $('widthDot');
    const statusEl = $('status'), list = $('list');
    const ctx = canvas.getContext('2d');

    let db = null;
    let currentUser = null;

    // ── 그리기 (서버와 상관없이 브라우저 안에서만) ──
    // 획마다 굵기와 지나간 점들을 기억해 둬야 획 단위로 지울 수 있음. 저장할 때만 한 장의 그림(PNG)이 됨
    let strokes = [];        // [{ width, points: [{ x, y }, ...] }]
    let tool = 'pen';        // 'pen' | 'eraser'
    let current = null;      // 지금 긋고 있는 획
    let erasing = false, lastErase = null;

    // 남은 획들로 캔버스를 처음부터 다시 그림
    function redraw() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const s of strokes) drawStroke(s);
        saveBtn.disabled = strokes.length === 0;
    }

    function drawStroke(s) {
        ctx.strokeStyle = INK;
        ctx.fillStyle = INK;
        ctx.lineWidth = s.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const [first, ...rest] = s.points;
        ctx.beginPath();
        if (rest.length === 0) {
            ctx.arc(first.x, first.y, s.width / 2, 0, Math.PI * 2);
            ctx.fill();
            return;
        }
        ctx.moveTo(first.x, first.y);
        for (const p of rest) ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }

    function drawSegment(a, b, width) {
        ctx.strokeStyle = INK;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }

    function clearAll() {
        strokes = [];
        redraw();
    }

    // 화면 좌표 → 캔버스 좌표 (화면에 보이는 크기와 실제 캔버스 크기가 달라서)
    function point(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
    }

    // 점 p 와 선분 ab 사이의 거리
    function distToSegment(p, a, b) {
        const dx = b.x - a.x, dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    }

    function touches(s, p, reach) {
        const limit = s.width / 2 + reach;
        if (s.points.length === 1) return Math.hypot(p.x - s.points[0].x, p.y - s.points[0].y) <= limit;
        for (let i = 1; i < s.points.length; i++) {
            if (distToSegment(p, s.points[i - 1], s.points[i]) <= limit) return true;
        }
        return false;
    }

    // 지우개: 이 점에 닿은 획 중 가장 위에 있는 획을 통째로 삭제
    function eraseAt(p) {
        const reach = 10 * canvas.width / canvas.getBoundingClientRect().width;  // 화면에서 10px 정도 여유
        for (let i = strokes.length - 1; i >= 0; i--) {
            if (touches(strokes[i], p, reach)) {
                strokes.splice(i, 1);
                redraw();
                return;
            }
        }
    }

    // 빠르게 쓸어도 사이에 있는 획을 놓치지 않게 촘촘히 확인
    function eraseAlong(a, b) {
        const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 4));
        for (let i = 1; i <= steps; i++) {
            eraseAt({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps });
        }
    }

    function onDown(e) {
        canvas.setPointerCapture(e.pointerId);
        const p = point(e);
        if (tool === 'eraser') {
            erasing = true;
            lastErase = p;
            eraseAt(p);
            return;
        }
        current = { width: Number(widthInput.value), points: [p] };
        strokes.push(current);
        drawStroke(current);
        saveBtn.disabled = false;
    }

    function onMove(e) {
        if (!current && !erasing) return;
        const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        for (const ev of coalesced.length ? coalesced : [e]) {
            const p = point(ev);
            if (erasing) {
                eraseAlong(lastErase, p);
                lastErase = p;
            } else {
                drawSegment(current.points[current.points.length - 1], p, current.width);
                current.points.push(p);
            }
        }
    }

    function onUp() {
        current = null;
        erasing = false;
    }

    function setTool(name) {
        tool = name;
        penBtn.setAttribute('aria-pressed', name === 'pen');
        eraserBtn.setAttribute('aria-pressed', name === 'eraser');
        canvas.style.cursor = name === 'eraser' ? 'cell' : 'crosshair';
    }

    // 굵기 미리보기: 캔버스에 실제로 보일 크기의 점
    function showWidth() {
        const size = Math.max(2, Number(widthInput.value) * (canvas.clientWidth || 330) / canvas.width);
        widthDot.style.width = widthDot.style.height = size + 'px';
    }

    // ── 서버와 주고받기 ──

    // 읽기: 로그인한 사람만 (서버 규칙)
    async function load() {
        const { data, error } = await db
            .from('drawings')
            .select('id, image, user_id, author_email, created_at')
            .order('created_at', { ascending: false })
            .limit(60);
        if (error) return fail(error);
        render(data);
    }

    // 저장: 그림을 PNG 글자로 바꿔서 보냄. 작성자는 서버가 로그인 정보로 채움
    async function save() {
        saveBtn.disabled = true;
        const image = canvas.toDataURL('image/png');
        const { error } = await db.from('drawings').insert({ image });
        if (error) {
            saveBtn.disabled = false;
            return fail(error);
        }
        statusEl.textContent = '';
        clearAll();
        load();
    }

    // 지우기: 서버 규칙상 내 그림만 지워짐
    async function remove(id) {
        if (!confirm('삭제할까요?')) return;
        const { error } = await db.from('drawings').delete().eq('id', id);
        if (error) return fail(error);
        statusEl.textContent = '';
        load();
    }

    // 로그인: 성공하면 브라우저에 세션이 저장되고 onAuthStateChange 가 호출됨
    async function signIn(email, password) {
        loginBtn.disabled = true;
        const { error } = await db.auth.signInWithPassword({ email, password });
        loginBtn.disabled = false;
        loginPassword.value = '';
        if (error) return fail(error);
        statusEl.textContent = '';
    }

    // 로그인 안 했으면 로그인 칸만, 했으면 그림판과 목록
    function applyUser(user) {
        currentUser = user;
        loginForm.hidden = !!user;
        who.hidden = !user;
        emailEl.textContent = user ? user.email : '';
        board.hidden = !user;
        showWidth();

        if (user) load();
        else list.replaceChildren();
    }

    function render(rows) {
        list.replaceChildren(...rows.map(row => {
            const li = document.createElement('li');

            const img = document.createElement('img');
            img.src = row.image;
            img.alt = '그림';
            img.loading = 'lazy';

            const meta = document.createElement('div');
            meta.className = 'meta';

            const info = document.createElement('span');
            info.className = 'time';
            const name = (row.author_email || '').split('@')[0];
            info.textContent = (name ? name + ' · ' : '') + formatTime(row.created_at);
            meta.append(info);

            if (currentUser && row.user_id === currentUser.id) {
                const del = document.createElement('button');
                del.className = 'del';
                del.type = 'button';
                del.textContent = '×';
                del.setAttribute('aria-label', '삭제');
                del.onclick = () => remove(row.id);
                meta.append(del);
            }

            li.append(img, meta);
            return li;
        }));
    }

    function formatTime(iso) {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function fail(error) {
        console.error(error);
        statusEl.textContent = error.message || String(error);
    }

    function start() {
        redraw();
        canvas.addEventListener('pointerdown', onDown);
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', onUp);
        canvas.addEventListener('pointercancel', onUp);
        penBtn.onclick = () => setTool('pen');
        eraserBtn.onclick = () => setTool('eraser');
        widthInput.addEventListener('input', () => { setTool('pen'); showWidth(); });
        window.addEventListener('resize', showWidth);
        clearBtn.onclick = clearAll;
        saveBtn.onclick = save;

        loginForm.addEventListener('submit', e => {
            e.preventDefault();
            signIn(loginEmail.value.trim(), loginPassword.value);
        });
        logout.onclick = () => db.auth.signOut();

        // 페이지를 열 때(INITIAL_SESSION), 로그인·로그아웃 할 때 호출됨
        // setTimeout: 이 콜백 안에서 바로 다른 Supabase 요청을 기다리면 멈출 수 있어서 한 박자 뒤에 실행
        db.auth.onAuthStateChange((event, session) => {
            if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) {
                setTimeout(() => applyUser(session ? session.user : null), 0);
            }
        });

        // 누가 그림을 저장하거나 지우면 열려 있는 모든 화면에 반영
        db.channel('drawings')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'drawings' }, () => currentUser && load())
            .subscribe();
    }

    if (SUPABASE_URL && SUPABASE_KEY) {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        start();
    } else {
        statusEl.textContent = 'SUPABASE_URL, SUPABASE_KEY 미설정';
    }
</script>
</body>
</html>
