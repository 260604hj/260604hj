<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그림 메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#15171c;
        --muted:#8a8f98;
        --line:#e4e6e9;
        --paper:#ffffff;
    }
    *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
    [hidden]{ display:none !important; }

    body{
        font-family:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        color:var(--ink);
        background:var(--paper);
        -webkit-font-smoothing:antialiased;
        padding:48px 24px;
    }

    .wrap{ width:100%; max-width:520px; margin:0 auto; }

    .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
    .top a, .top button{ color:var(--muted); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; }
    .top a:hover, .top button:hover{ color:var(--ink); }
    .who{ display:flex; gap:10px; align-items:center; }

    h1{
        margin-top:14px;
        font-weight:300;
        font-size:34px;
        letter-spacing:-0.02em;
    }

    form, #board{ margin-top:28px; }
    input{
        display:block; width:100%;
        border:1px solid var(--line); border-radius:0;
        padding:12px 16px;
        font:inherit; font-size:16px; line-height:1.6; color:inherit;
        outline:none;
    }
    input + input{ border-top:0; }
    input:focus{ border-color:var(--ink); }
    input + input:focus{ border-top:1px solid var(--ink); margin-top:-1px; }

    canvas{
        display:block; width:100%; aspect-ratio:1 / 1;
        border:1px solid var(--line); background:#fff;
        touch-action:none; cursor:crosshair;
    }

    .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    .pri, .ghost{
        border:1px solid var(--ink); background:var(--ink); color:#fff;
        padding:10px 22px; font:inherit; font-size:14px; cursor:pointer;
    }
    .ghost{ background:var(--paper); color:var(--ink); }
    .pri:disabled, .ghost:disabled{ opacity:.4; cursor:default; }

    #status{ margin-top:14px; font-size:13px; color:#b3261e; }
    #status:empty{ display:none; }

    #list{ list-style:none; margin-top:28px; display:grid; grid-template-columns:repeat(2, 1fr); gap:18px 14px; }
    #list img{ display:block; width:100%; aspect-ratio:1 / 1; border:1px solid var(--line); }
    .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; min-height:22px; }
    .time{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .del{
        border:0; background:none; color:var(--muted);
        font-size:18px; line-height:1; padding:2px 6px; cursor:pointer;
    }
    .del:hover{ color:var(--ink); }
</style>
</head>
<body>
<main class="wrap">
    <div class="top">
        <a href="../index.html">←</a>
        <span class="who" id="who" hidden>
            <span id="email"></span>
            <button type="button" id="logout">로그아웃</button>
        </span>
    </div>

    <h1>그림 메모</h1>

    <form id="loginForm" hidden>
        <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" required>
        <div class="row"><button type="submit" class="pri" id="loginBtn">로그인</button></div>
    </form>

    <section id="board" hidden>
        <canvas id="canvas" width="720" height="720"></canvas>
        <div class="row">
            <button type="button" class="ghost" id="clear">지우기</button>
            <button type="button" class="pri" id="save" disabled>저장</button>
        </div>
    </section>

    <p id="status"></p>
    <ul id="list"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
    // Supabase 대시보드 > Connect 에서 복사
    // KEY 는 Publishable key (sb_publishable_...). Secret key 는 절대 넣지 말 것.
    const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";

    const INK = '#15171c';

    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm'), loginEmail = $('loginEmail'), loginPassword = $('loginPassword'), loginBtn = $('loginBtn');
    const who = $('who'), emailEl = $('email'), logout = $('logout');
    const board = $('board'), canvas = $('canvas'), clearBtn = $('clear'), saveBtn = $('save');
    const statusEl = $('status'), list = $('list');
    const ctx = canvas.getContext('2d');

    let db = null;
    let currentUser = null;

    // ── 그리기 (서버와 상관없이 브라우저 안에서만) ──
    let drawing = false, last = null;

    function resetCanvas() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = INK;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        saveBtn.disabled = true;
    }

    // 화면 좌표 → 캔버스 좌표 (화면에 보이는 크기와 실제 캔버스 크기가 달라서)
    function point(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
    }

    function startStroke(e) {
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        last = point(e);
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        saveBtn.disabled = false;
    }

    function moveStroke(e) {
        if (!drawing) return;
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
            const p = point(ev);
            ctx.beginPath();
            ctx.moveTo(last.x, last.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            last = p;
        }
    }

    function endStroke() { drawing = false; }

    // ── 서버와 주고받기 ──

    // 읽기: 로그인한 사람만 (서버 규칙)
    async function load() {
        const { data, error } = await db
            .from('drawings')
            .select('id, image, user_id, author_email, created_at')
            .order('created_at', { ascending: false })
            .limit(60);
        if (error) return fail(error);
        render(data);
    }

    // 저장: 그림을 PNG 글자로 바꿔서 보냄. 작성자는 서버가 로그인 정보로 채움
    async function save() {
        saveBtn.disabled = true;
        const image = canvas.toDataURL('image/png');
        const { error } = await db.from('drawings').insert({ image });
        if (error) {
            saveBtn.disabled = false;
            return fail(error);
        }
        statusEl.textContent = '';
        resetCanvas();
        load();
    }

    // 지우기: 서버 규칙상 내 그림만 지워짐
    async function remove(id) {
        if (!confirm('삭제할까요?')) return;
        const { error } = await db.from('drawings').delete().eq('id', id);
        if (error) return fail(error);
        statusEl.textContent = '';
        load();
    }

    // 로그인: 성공하면 브라우저에 세션이 저장되고 onAuthStateChange 가 호출됨
    async function signIn(email, password) {
        loginBtn.disabled = true;
        const { error } = await db.auth.signInWithPassword({ email, password });
        loginBtn.disabled = false;
        loginPassword.value = '';
        if (error) return fail(error);
        statusEl.textContent = '';
    }

    // 로그인 안 했으면 로그인 칸만, 했으면 그림판과 목록
    function applyUser(user) {
        currentUser = user;
        loginForm.hidden = !!user;
        who.hidden = !user;
        emailEl.textContent = user ? user.email : '';
        board.hidden = !user;

        if (user) load();
        else list.replaceChildren();
    }

    function render(rows) {
        list.replaceChildren(...rows.map(row => {
            const li = document.createElement('li');

            const img = document.createElement('img');
            img.src = row.image;
            img.alt = '그림';
            img.loading = 'lazy';

            const meta = document.createElement('div');
            meta.className = 'meta';

            const info = document.createElement('span');
            info.className = 'time';
            const name = (row.author_email || '').split('@')[0];
            info.textContent = (name ? name + ' · ' : '') + formatTime(row.created_at);
            meta.append(info);

            if (currentUser && row.user_id === currentUser.id) {
                const del = document.createElement('button');
                del.className = 'del';
                del.type = 'button';
                del.textContent = '×';
                del.setAttribute('aria-label', '삭제');
                del.onclick = () => remove(row.id);
                meta.append(del);
            }

            li.append(img, meta);
            return li;
        }));
    }

    function formatTime(iso) {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function fail(error) {
        console.error(error);
        statusEl.textContent = error.message || String(error);
    }

    function start() {
        resetCanvas();
        canvas.addEventListener('pointerdown', startStroke);
        canvas.addEventListener('pointermove', moveStroke);
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        clearBtn.onclick = resetCanvas;
        saveBtn.onclick = save;

        loginForm.addEventListener('submit', e => {
            e.preventDefault();
            signIn(loginEmail.value.trim(), loginPassword.value);
        });
        logout.onclick = () => db.auth.signOut();

        // 페이지를 열 때(INITIAL_SESSION), 로그인·로그아웃 할 때 호출됨
        // setTimeout: 이 콜백 안에서 바로 다른 Supabase 요청을 기다리면 멈출 수 있어서 한 박자 뒤에 실행
        db.auth.onAuthStateChange((event, session) => {
            if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) {
                setTimeout(() => applyUser(session ? session.user : null), 0);
            }
        });

        // 누가 그림을 저장하거나 지우면 열려 있는 모든 화면에 반영
        db.channel('drawings')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'drawings' }, () => currentUser && load())
            .subscribe();
    }

    if (SUPABASE_URL && SUPABASE_KEY) {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        start();
    } else {
        statusEl.textContent = 'SUPABASE_URL, SUPABASE_KEY 미설정';
    }
</script>
</body>
</html>
