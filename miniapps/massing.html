<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>VWORLD 건물 투명화 & 신축 건물 작성</title>
    <style>
        :root{
            --ink:#15171c; --muted:#8a8f98; --line:#e7e9ec;
            --soft:#f4f5f7; --danger:#e5484d;
        }
        *{ box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; overflow:hidden;
            font-family:'Pretendard','Noto Sans KR',-apple-system,'Segoe UI',sans-serif;
            color:var(--ink); -webkit-font-smoothing:antialiased; }
        #vmap { width:100%; height:100%; position:relative; background:#0b0d10; }

        /* VWorld 하단 남색 바 / 크레딧 숨김 */
        #footer3d, .apifooter, .cesium-viewer-bottom { display:none !important; }

        #panel {
            position:absolute; top:18px; left:18px; z-index:9999;
            width:340px; max-height:calc(100vh - 36px); overflow-y:auto;
            background:rgba(255,255,255,0.90);
            backdrop-filter:blur(16px) saturate(1.2);
            -webkit-backdrop-filter:blur(16px) saturate(1.2);
            border:1px solid var(--line); border-radius:18px;
            box-shadow:0 16px 48px rgba(16,18,22,0.20);
            padding:18px; font-size:13px; line-height:1.45;
        }
        #panel::-webkit-scrollbar{ width:8px; }
        #panel::-webkit-scrollbar-thumb{ background:#d7dade; border-radius:8px; }
        #panel::-webkit-scrollbar-track{ background:transparent; }

        .brand{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
        .brand .logo{ font-weight:800; letter-spacing:0.16em; font-size:15px;
            background:var(--ink); color:#fff; padding:5px 9px; border-radius:7px; }
        .brand .ttl{ font-size:11.5px; color:var(--muted); letter-spacing:0.01em; }

        .card{ border:1px solid var(--line); border-radius:13px; padding:13px;
            margin-top:12px; background:#fff; }
        .label{ font-size:10.5px; font-weight:700; letter-spacing:0.11em;
            text-transform:uppercase; color:var(--muted); margin-bottom:10px;
            display:flex; align-items:center; gap:8px; }
        .label .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink); }

        .row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
        .row:last-child{ margin-bottom:0; }
        .field{ font-size:12px; color:#4b5159; white-space:nowrap; }

        input[type="text"], input[type="number"]{
            width:100%; padding:8px 10px; border:1px solid var(--line);
            border-radius:9px; font-size:13px; color:var(--ink); background:#fff;
            outline:none; transition:border-color .15s; font-family:inherit; }
        input[type="text"]:focus, input[type="number"]:focus{ border-color:var(--ink); }
        input[readonly]{ background:var(--soft); color:#6b7077; }
        #address{ flex:1; width:auto; }
        .row > input[type="number"]{ flex:0 0 auto; }
        input[type="range"]{ flex:1; accent-color:var(--ink); }

        button{ font-family:inherit; cursor:pointer; border:none; border-radius:9px;
            padding:9px 12px; font-size:12.5px; font-weight:600; flex:1; transition:all .15s; }
        .btn-primary, .btn-search{ background:var(--ink); color:#fff; }
        .btn-primary:hover, .btn-search:hover{ background:#000; }
        .btn-ghost, .btn-reset, .btn-draw, .btn-edit, .btn-undo{
            background:#fff; color:var(--ink); border:1px solid var(--line); }
        .btn-ghost:hover, .btn-reset:hover, .btn-draw:hover, .btn-edit:hover, .btn-undo:hover{
            border-color:var(--ink); }
        .btn-draw.active, .btn-edit.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
        .btn-del{ background:#fff; color:var(--danger); border:1px solid #f1c9cb; }
        .btn-del:hover{ background:var(--danger); color:#fff; border-color:var(--danger); }

        .hint{ font-size:11px; color:var(--muted); margin:2px 0 0; }
        .check{ display:flex; align-items:center; gap:8px; font-size:12.5px;
            color:var(--ink); cursor:pointer; }
        .check input{ width:16px; height:16px; accent-color:var(--ink); margin:0; }
        #modThumb{ height:46px; border:1px solid var(--line); border-radius:8px;
            background:var(--soft); object-fit:contain; }
        #status{ margin-top:12px; font-size:11.5px; color:#6b7077; line-height:1.5;
            border-top:1px solid var(--line); padding-top:10px; }
    </style>
    <script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=B5CEDD7D-84D6-314E-875C-9B5BF7E1233A"></script>
    <!-- 입면 모듈 이미지(base64 data URI). file:// 에서도 CORS/taint 없이 WebGL 텍스처로 사용 가능 -->
    <script src="frame-hero-img.js"></script>
</head>
<body>

<div id="panel">
    <div class="brand">
        <span class="logo">FIT</span>
        <span class="ttl">FACADE STUDIO · 입면 모듈 스튜디오</span>
    </div>

    <div class="card">
        <div class="label"><span class="dot"></span>위치 검색</div>
        <div class="row">
            <input id="address" type="text" placeholder="주소 또는 장소 입력">
            <button class="btn-primary btn-search" style="flex:0 0 auto; padding:9px 16px;"
                    onclick="searchAddress()">검색</button>
        </div>
    </div>

    <div class="card">
        <div class="label"><span class="dot"></span>건물 선택 · 투명화</div>
        <input type="text" id="buildingId" placeholder="선택된 건물 ID" readonly>
        <div class="row" style="margin-top:8px;">
            <button class="btn-ghost btn-reset" onclick="resetTransparent()">투명 전체 복원</button>
        </div>
        <div class="hint">모드 — <span id="modeLabel">건물 선택(투명)</span></div>
    </div>

    <div class="card">
        <div class="label"><span class="dot"></span>신축 건물 그리기</div>
        <div class="row">
            <button id="drawBtn" class="btn-draw" onclick="toggleDraw()">① 점 찍기</button>
            <button id="editBtn" class="btn-edit" onclick="toggleEdit()">점 위치 조정</button>
        </div>
        <div class="hint">‘점 찍기’ 후 지면 클릭 → 정점 추가 · ‘점 위치 조정’ 후 정점 드래그 → 이동</div>
        <div class="row" style="margin-top:8px;">
            <button class="btn-ghost btn-undo" onclick="undoPoint()">마지막 점 취소</button>
        </div>
        <div class="row" style="margin-top:10px;">
            <span class="field">층고(m)</span>
            <input id="storyH" type="number" value="4" min="0.5" step="0.1" style="width:72px;"
                   oninput="onBuildingDims()">
            <span class="field">층수</span>
            <input id="floors" type="number" value="10" min="1" step="1" style="width:72px;"
                   oninput="onBuildingDims()">
        </div>
        <div class="row">
            <input id="floorsRange" type="range" min="1" max="60" value="10"
                   oninput="document.getElementById('floors').value=this.value; onBuildingDims();">
        </div>
        <div class="hint" id="heightHint">건물 높이 = 층고 × 층수</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot"></span>입면 모듈 패널링</div>
        <div class="row">
            <span class="field">모듈 가로(m)</span>
            <input id="modW" type="number" value="1.2" min="0.1" step="0.1" style="width:72px;"
                   oninput="onModuleInput()">
            <span class="hint" style="margin:0;">세로 = 층고 고정</span>
        </div>
        <div class="row" style="margin-top:8px;">
            <span class="field">모듈 이미지</span>
            <input type="file" id="modImg" accept="image/*" onchange="onPanelImageSelect(this)"
                   style="flex:1; width:auto; border:none; padding:0; margin:0; font-size:11px; background:none;">
        </div>
        <div class="row">
            <img id="modThumb" alt="" style="display:none;">
            <span id="modName" class="hint" style="margin:0;"></span>
        </div>
        <label class="check" style="margin-top:10px;">
            <input type="checkbox" id="panelOn" checked onchange="rebuildPaneling()">
            벽면에 입면 모듈 패널 표시
        </label>
        <div class="row" style="margin-top:10px;">
            <button class="btn-del" onclick="clearBuilding()">건물 삭제</button>
        </div>
    </div>

    <p id="status">건물을 클릭하면 투명해집니다. (새로고침 시 초기화)</p>
</div>

<div id="vmap"></div>

<script>
    var map;
    var viewer;                    // 내부 Cesium Viewer (map._wsViewer)

    // ===== 상태 =====
    var mode = "select";           // "select" | "draw" | "edit"
    var drawCoords = [];           // 현재 작성 중 건물(draft)의 정점 [{lon, lat}, ...]
    var draftHeight = 40;          // 현재 draft 전체 높이(m) = 층고 × 층수
    var draftEntities = [];        // draft 보조 엔티티(점/선/거리라벨)
    var draftPointEnts = [];       // 정점 점 엔티티 (인덱스 == 정점 순서, 드래그 식별용)
    var draftSolid = null;         // draft 실시간 extrude 솔리드 엔티티
    var draftBaseH = 0;            // draft 바닥 지면 고도
    var panelEntities = [];        // 입면 모듈 패널 그리드 선 엔티티
    var dragHandler = null;        // 정점 드래그용 ScreenSpaceEventHandler
    var dragIndex = -1;            // 드래그 중인 정점 인덱스
    var transparentList = [];      // 투명 처리된 건물 (세션 한정, 저장 안 함)
    var layerElements = {};        // layerId -> ThreeDTileLayerElement 캐시

    // __OID__ 가 타일 피처 고유 ID라 최우선. 그 외 숫자형 후보를 뒤에 둔다.
    var ID_PROP_CANDIDATES = ["__OID__", "OBJTID", "OBJECTID", "FID", "BLD_NUM", "BLDG_ID", "id"];

    window.onload = function() {
        map = new vw.Map();
        map.setOption({
            mapId: "vmap",
            initPosition: new vw.CameraPosition(
                new vw.CoordZ(126.970053, 37.513398, 5000),
                new vw.Direction(0, -60, 0)
            )
        });
        map.start();

        setTimeout(function() {
            map.onClick.addEventListener(onMapClick);
            viewer = map._wsViewer; // VWorld 내부 Cesium Viewer
            if (!viewer) console.warn("Cesium Viewer(map._wsViewer)를 찾지 못했습니다. 솔리드 생성이 동작하지 않을 수 있습니다.");
            // 기본 모듈 이미지 썸네일 표시
            var thumb = document.getElementById("modThumb");
            if (thumb && PANEL_IMG) { thumb.src = PANEL_IMG; thumb.style.display = "block"; document.getElementById("modName").textContent = "(기본)"; }
            hideVworldFooter();
            updateStatus();
        }, 1500);
    };

    // ====================================================================
    // 지도 클릭 통합 핸들러
    //  - draw 모드: 지면 좌표를 폴리곤 정점으로 수집
    //  - select 모드: 클릭한 건물을 투명/복원 토글
    // ====================================================================
    function onMapClick(windowPosition, ecefPosition, cartographic, modelObject) {
        if (mode === "draw") {
            var c = extractLonLat(cartographic);
            if (c) {
                drawCoords.push(c);
                rebuildDraft();
                updateStatus();
            } else {
                console.warn("좌표를 해석하지 못했습니다. cartographic:", cartographic);
            }
            return;
        }
        if (mode === "edit") {
            return; // 편집 모드의 클릭은 정점 드래그 핸들러가 처리
        }

        // select 모드
        if (modelObject) {
            toggleTransparent(modelObject);
        }
    }

    // ====================================================================
    // 1) 건물 투명화
    // ====================================================================

    // VWorld 하단 남색 바(국토교통부/브이월드 크레딧) 숨김 — 동적 생성 대비 JS로도 처리
    function hideVworldFooter() {
        var f = document.getElementById("footer3d"); if (f) f.style.display = "none";
        document.querySelectorAll(".apifooter, .cesium-viewer-bottom").forEach(function(el) {
            el.style.display = "none";
        });
    }

    function isNumeric(v) {
        return v != null && v !== "" && isFinite(Number(v));
    }

    function pickIdProp(attributes) {
        for (var i = 0; i < ID_PROP_CANDIDATES.length; i++) {
            if (isNumeric(attributes[ID_PROP_CANDIDATES[i]])) return ID_PROP_CANDIDATES[i];
        }
        var keys = Object.keys(attributes);
        for (var j = 0; j < keys.length; j++) {
            if (isNumeric(attributes[keys[j]])) return keys[j];
        }
        return null;
    }

    function toggleTransparent(modelObject) {
        var element = modelObject.element;
        var layerId = element.id;
        var attributes = modelObject.attributes;

        var idProp = pickIdProp(attributes);
        if (!idProp) {
            alert("이 건물에는 투명 처리에 쓸 숫자형 식별 속성이 없습니다.");
            console.log("attributes:", attributes);
            return;
        }
        var idValue = attributes[idProp];
        var key = layerId + "::" + idProp + "::" + idValue;

        layerElements[layerId] = element;
        document.getElementById("buildingId").value = attributes.MODEL_NAME || idValue;

        var idx = transparentList.findIndex(function(b) { return b.key === key; });
        if (idx === -1) {
            transparentList.push({ key: key, layerId: layerId, idProp: idProp, idValue: idValue });
        } else {
            transparentList.splice(idx, 1); // 같은 건물 재클릭 → 복원
        }

        applyStyleForLayer(layerId, element);
        updateStatus();
    }

    // 레이어에 속한 투명 건물 전체를 setStyle 로 한 번에 적용 (숫자 비교)
    function applyStyleForLayer(layerId, element) {
        var items = transparentList.filter(function(b) {
            return b.layerId === layerId && isNumeric(b.idValue);
        });
        try {
            if (items.length === 0) {
                element.setStyle({});
                return;
            }
            var conditions = items.map(function(b) {
                return ["${" + b.idProp + "} === " + Number(b.idValue), "color('white', 0)"];
            });
            conditions.push(["true", "color('white', 1)"]);
            element.setStyle({ color: { conditions: conditions } });
        } catch (e) {
            console.error("setStyle 오류 (layer=" + layerId + "):", e);
        }
    }

    function resetTransparent() {
        if (!transparentList.length) { alert("투명 처리된 건물이 없습니다."); return; }
        var layerIds = transparentList.map(function(b) { return b.layerId; })
            .filter(function(v, i, a) { return a.indexOf(v) === i; });
        transparentList = [];
        layerIds.forEach(function(layerId) {
            var el = layerElements[layerId];
            if (el) { try { el.setStyle({}); } catch (e) {} }
        });
        document.getElementById("buildingId").value = "";
        updateStatus();
    }

    // ====================================================================
    // 2) 폴리곤 그리기 / 점 위치 조정 / 높이 조절 / 변 길이 표시 / 3) extrude
    //   - draft(작성 중 건물)는 정점/높이를 실시간으로 편집할 수 있다.
    //   - 정점 3개 이상이면 extrude 솔리드가 실시간 미리보기로 보인다.
    // ====================================================================

    // "점 찍기" 모드 토글 (클릭으로 정점 추가)
    function toggleDraw() {
        if (mode === "draw") {
            mode = "select";
        } else {
            mode = "draw";
            disableVertexDrag();
        }
        refreshModeUI();
        updateStatus();
    }

    // "점 위치 조정" 모드 토글 (정점 드래그로 이동)
    function toggleEdit() {
        if (mode === "edit") {
            mode = "select";
            disableVertexDrag();
        } else {
            if (drawCoords.length === 0) { alert("먼저 '① 점 찍기'로 정점을 만든 뒤 조정하세요."); return; }
            mode = "edit";
            enableVertexDrag();
        }
        refreshModeUI();
        updateStatus();
    }

    function refreshModeUI() {
        var drawBtn = document.getElementById("drawBtn");
        var editBtn = document.getElementById("editBtn");
        drawBtn.classList.toggle("active", mode === "draw");
        editBtn.classList.toggle("active", mode === "edit");
        drawBtn.textContent = (mode === "draw") ? "① 점 찍는 중…" : "① 점 찍기";
        editBtn.textContent = (mode === "edit") ? "조정 중… (정점 드래그)" : "점 위치 조정";
        document.getElementById("modeLabel").textContent =
            mode === "draw" ? "점 찍기" : (mode === "edit" ? "점 위치 조정" : "건물 선택(투명)");
    }

    function undoPoint() {
        if (drawCoords.length > 0) {
            drawCoords.pop();
            rebuildDraft();
            updateStatus();
        }
    }

    // 층고/층수 → 건물 전체 높이 = 층고 × 층수
    function getStory() {
        var h = Number(document.getElementById("storyH").value);
        var n = Math.round(Number(document.getElementById("floors").value));
        if (!h || h <= 0) h = 4;
        if (!n || n < 1) n = 1;
        return { h: h, floors: n };
    }
    function currentHeight() {
        var s = getStory();
        return s.h * s.floors;
    }

    // 층고/층수 입력 변경 → 건물 높이 실시간 반영
    function onBuildingDims() {
        draftHeight = currentHeight();
        // 슬라이더 동기화(층수)
        var fr = document.getElementById("floorsRange");
        var fv = getStory().floors;
        if (fv <= Number(fr.max)) fr.value = fv;
        // 솔리드가 있으면 높이만 실시간 갱신 + 패널 재생성
        if (draftSolid) {
            draftSolid.polygon.extrudedHeight = draftBaseH + draftHeight;
            rebuildPaneling();
        } else {
            rebuildDraft();
        }
        updateStatus();
    }

    // 지면(지형) 고도 샘플링
    function sampleGroundHeight(lon, lat) {
        try {
            var h = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lon, lat));
            return (h == null || isNaN(h)) ? 0 : h;
        } catch (e) { return 0; }
    }

    // 두 경위도 점 사이 지표 거리(m)
    function geoDistance(a, b) {
        var pa = Cesium.Cartesian3.fromDegrees(a.lon, a.lat);
        var pb = Cesium.Cartesian3.fromDegrees(b.lon, b.lat);
        return Cesium.Cartesian3.distance(pa, pb);
    }

    // draft(정점/선/거리라벨/실시간 솔리드)를 모두 다시 그린다
    function rebuildDraft() {
        clearDraftHelpers();
        if (!viewer) return;

        // 1) 정점 점 (드래그 식별을 위해 draftPointEnts 인덱스 == 정점 순서)
        drawCoords.forEach(function(c) {
            var p = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat),
                point: {
                    pixelSize: 11,
                    color: (mode === "edit") ? Cesium.Color.ORANGE : Cesium.Color.YELLOW,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                }
            });
            draftPointEnts.push(p);
            draftEntities.push(p);
        });

        // 2) 연결선 + 3) 각 변 거리 라벨
        if (drawCoords.length >= 2) {
            var ring = drawCoords.slice();
            if (drawCoords.length >= 3) ring.push(drawCoords[0]); // 닫기
            var flat = [];
            ring.forEach(function(c) { flat.push(c.lon, c.lat); });
            draftEntities.push(viewer.entities.add({
                polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArray(flat),
                    width: 3, clampToGround: true, material: Cesium.Color.YELLOW
                }
            }));

            for (var i = 0; i < ring.length - 1; i++) {
                var a = ring[i], b = ring[i + 1];
                var d = geoDistance(a, b);
                var mid = { lon: (a.lon + b.lon) / 2, lat: (a.lat + b.lat) / 2 };
                draftEntities.push(viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(mid.lon, mid.lat),
                    label: {
                        text: d.toFixed(1) + " m",
                        font: "bold 14px sans-serif",
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 3,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        showBackground: true,
                        backgroundColor: Cesium.Color.fromBytes(0, 0, 0, 160),
                        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY,
                        pixelOffset: new Cesium.Cartesian2(0, -6)
                    }
                }));
            }
        }

        // 4) 실시간 extrude 솔리드 (3점 이상) — 높이 = 층고 × 층수
        draftHeight = currentHeight();
        draftSolid = null;
        if (drawCoords.length >= 3) {
            var pflat = [];
            var baseH = Infinity;
            drawCoords.forEach(function(c) {
                pflat.push(c.lon, c.lat);
                baseH = Math.min(baseH, sampleGroundHeight(c.lon, c.lat));
            });
            if (!isFinite(baseH)) baseH = 0;
            draftBaseH = baseH;
            draftSolid = viewer.entities.add({
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray(pflat),
                    height: baseH,
                    extrudedHeight: baseH + draftHeight,
                    material: Cesium.Color.fromBytes(255, 255, 255, 110),
                    outline: true,
                    outlineColor: Cesium.Color.fromBytes(130, 130, 130, 255)
                }
            });
            draftEntities.push(draftSolid);
        }

        // 5) 입면 모듈 패널 그리드
        rebuildPaneling();
    }

    // ---- 입면 모듈 패널링 ----
    // 타일 너비 = 모듈 가로(가변), 타일 높이 = 층고(한 층) 고정.
    function onModuleInput() { rebuildPaneling(); updateStatus(); }

    function getModuleW() {
        var w = Number(document.getElementById("modW").value);
        if (!w || w <= 0) w = 1.2;
        return w;
    }

    function clearPaneling() {
        if (viewer) {
            panelEntities.forEach(function(e) { try { viewer.entities.remove(e); } catch (x) {} });
        }
        panelEntities = [];
    }

    // 입면 모듈에 채울 이미지(한 모듈 = 이미지 1장).
    // 기본값은 내장 frame-hero(base64). 사용자가 '모듈 이미지'로 PNG를 올리면 교체된다.
    // 업로드 이미지는 FileReader 의 data URL 이라 file:// 에서도 taint 없이 텍스처로 사용 가능.
    var PANEL_IMG = (typeof PANEL_IMG_DATA !== "undefined") ? PANEL_IMG_DATA : "frame-hero.png";

    // 사용자가 올린 PNG를 읽어 입면 모듈 이미지로 적용
    function onPanelImageSelect(input) {
        var f = input.files && input.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            PANEL_IMG = ev.target.result; // data URL
            var thumb = document.getElementById("modThumb");
            thumb.src = PANEL_IMG;
            thumb.style.display = "block";
            document.getElementById("modName").textContent = f.name;
            rebuildPaneling();
            updateStatus();
        };
        reader.readAsDataURL(f);
    }

    // 점 P를 중심 바깥쪽으로 살짝 내밀어(z-파이팅 방지) 벽면 바로 바깥에 외피로 표시
    var PANEL_OUTSET = 0.0015;
    function outsetFrom(p, c) {
        return { lon: p.lon + (p.lon - c.lon) * PANEL_OUTSET, lat: p.lat + (p.lat - c.lat) * PANEL_OUTSET };
    }

    // 각 변을 '벽(wall)' 1장으로 만들고, 모듈 수만큼 이미지를 반복(타일링)시킨다.
    //  - wall 지오메트리는 길이(가로)·높이(세로) 기준으로 ST가 균일 → 모든 면에서 동일 모듈 크기.
    //  - 세로 반복 = 층수(정수): 한 층 = 타일 1개, 타일 높이 = 층고(정확히 한 층).
    //  - 가로 반복 = 변길이/모듈폭(실수): 너비는 가변, 끝단에 부분 타일 발생.
    function rebuildPaneling() {
        clearPaneling();
        if (!viewer) return;
        var panelOn = document.getElementById("panelOn");
        if (panelOn && !panelOn.checked) return;
        if (drawCoords.length < 3) return;

        var modW = getModuleW();
        var story = getStory();
        var base = draftBaseH;
        var top = base + story.h * story.floors; // 층고 × 층수
        var rows = story.floors;                 // 세로 반복 = 층수(정수) → 타일 높이 = 층고

        // 폴리곤 중심(외피 내밀기 기준)
        var cx = 0, cy = 0;
        drawCoords.forEach(function(p) { cx += p.lon; cy += p.lat; });
        var centroid = { lon: cx / drawCoords.length, lat: cy / drawCoords.length };

        var ring = drawCoords.slice();
        ring.push(drawCoords[0]); // 닫기

        for (var e = 0; e < ring.length - 1; e++) {
            var A = outsetFrom(ring[e], centroid);
            var B = outsetFrom(ring[e + 1], centroid);
            var L = geoDistance(ring[e], ring[e + 1]);
            var cols = L / modW; // 가로 반복(실수) → 모듈 폭 일정

            panelEntities.push(viewer.entities.add({
                wall: {
                    positions: Cesium.Cartesian3.fromDegreesArrayHeights([
                        A.lon, A.lat, top,
                        B.lon, B.lat, top
                    ]),
                    minimumHeights: [base, base],
                    maximumHeights: [top, top],
                    material: new Cesium.ImageMaterialProperty({
                        image: PANEL_IMG,
                        repeat: new Cesium.Cartesian2(cols, rows), // 가로·세로 모듈 수만큼 반복
                        transparent: false // 완전 불투명 (이미지 알파 무시)
                    })
                }
            }));
        }

        // 지붕(불투명) — 패널 표시 시 천장을 막아 내부가 비치지 않게 한다.
        var roofFlat = [];
        drawCoords.forEach(function(p) { roofFlat.push(p.lon, p.lat); });
        panelEntities.push(viewer.entities.add({
            polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray(roofFlat),
                height: top + 0.1, // 솔리드 천장과 z-파이팅 방지용 미세 상향
                material: Cesium.Color.fromBytes(200, 200, 205, 255), // 완전 불투명
                outline: true,
                outlineColor: Cesium.Color.fromBytes(120, 120, 120, 255)
            }
        }));
    }

    function clearDraftHelpers() {
        clearPaneling();
        if (viewer) {
            draftEntities.forEach(function(e) { try { viewer.entities.remove(e); } catch (x) {} });
        }
        draftEntities = [];
        draftPointEnts = [];
        draftSolid = null;
    }

    // ---- 정점 드래그(점 위치 조정) ----
    function enableVertexDrag() {
        rebuildDraft(); // 정점을 주황색으로 갱신
        if (!viewer || dragHandler) return;
        dragHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        dragHandler.setInputAction(function(e) {
            var picked = viewer.scene.pick(e.position);
            if (picked && picked.id) {
                var idx = draftPointEnts.indexOf(picked.id);
                if (idx !== -1) {
                    dragIndex = idx;
                    setCameraInteractions(false); // 드래그 중 지도 회전/이동 잠금
                }
            }
        }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

        dragHandler.setInputAction(function(e) {
            if (dragIndex < 0) return;
            var ll = pickGlobeLonLat(e.endPosition);
            if (ll) {
                drawCoords[dragIndex] = ll;
                rebuildDraft();
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        dragHandler.setInputAction(function() {
            dragIndex = -1;
            setCameraInteractions(true);
            updateStatus();
        }, Cesium.ScreenSpaceEventType.LEFT_UP);
    }

    function disableVertexDrag() {
        if (dragHandler) { dragHandler.destroy(); dragHandler = null; }
        dragIndex = -1;
        setCameraInteractions(true);
        if (mode !== "edit") rebuildDraft(); // 정점 색 원복
    }

    function setCameraInteractions(enabled) {
        if (!viewer) return;
        var c = viewer.scene.screenSpaceCameraController;
        c.enableRotate = enabled; c.enableTranslate = enabled;
        c.enableTilt = enabled; c.enableLook = enabled;
    }

    // 화면 좌표 → 지표 경위도
    function pickGlobeLonLat(winPos) {
        try {
            var ray = viewer.camera.getPickRay(winPos);
            var pos = viewer.scene.globe.pick(ray, viewer.scene);
            if (!pos) pos = viewer.camera.pickEllipsoid(winPos);
            if (!pos) return null;
            var carto = Cesium.Cartographic.fromCartesian(pos);
            return { lon: Cesium.Math.toDegrees(carto.longitude), lat: Cesium.Math.toDegrees(carto.latitude) };
        } catch (e) { return null; }
    }

    // 현재 건물(정점/솔리드/패널) 전체 삭제
    function clearBuilding() {
        if (drawCoords.length === 0 && !draftSolid) { alert("삭제할 건물이 없습니다."); return; }
        clearDraftHelpers();
        drawCoords = [];
        mode = "select";
        disableVertexDrag();
        refreshModeUI();
        updateStatus();
    }

    // ====================================================================
    // 좌표 해석 (degrees / radians 모두 대응)
    // ====================================================================
    function firstDefined() {
        for (var i = 0; i < arguments.length; i++) {
            if (arguments[i] != null) return arguments[i];
        }
        return null;
    }

    function extractLonLat(cartographic) {
        if (!cartographic) return null;
        var c = cartographic;
        var lon = firstDefined(c.longitudeDD, c.longitude, c.lon, c.x);
        var lat = firstDefined(c.latitudeDD, c.latitude, c.lat, c.y);
        if (lon == null || lat == null) { console.log("cartographic 구조:", c); return null; }
        lon = Number(lon); lat = Number(lat);
        // 한국 경위도(127, 37)는 degrees면 절댓값이 크고 radians면 작다 → radians 보정
        if (Math.abs(lon) <= 6.5 && Math.abs(lat) <= 6.5) {
            lon = lon * 180 / Math.PI;
            lat = lat * 180 / Math.PI;
        }
        return { lon: lon, lat: lat };
    }

    // ====================================================================
    // 주소 검색
    // ====================================================================
    async function searchAddress() {
        const address = document.getElementById("address").value.trim();
        if (!address) return;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`);
            const data = await res.json();
            if (data.length > 0) {
                map.moveTo(new vw.CameraPosition(
                    new vw.CoordZ(parseFloat(data[0].lon), parseFloat(data[0].lat), 3000),
                    new vw.Direction(0, -60, 0)
                ));
            } else {
                alert("검색 결과가 없습니다.");
            }
        } catch (err) {
            console.error(err);
        }
    }

    // ====================================================================
    // 상태 표시
    // ====================================================================
    function updateStatus() {
        var s = document.getElementById("status");
        var perim = 0;
        if (drawCoords.length >= 2) {
            var ring = drawCoords.slice();
            if (drawCoords.length >= 3) ring.push(drawCoords[0]);
            for (var i = 0; i < ring.length - 1; i++) perim += geoDistance(ring[i], ring[i + 1]);
        }
        if (mode === "draw") {
            s.textContent = "점 찍기: 지면 클릭으로 정점 추가 (현재 " + drawCoords.length +
                "개" + (perim ? ", 둘레 " + perim.toFixed(1) + "m" : "") +
                "). 3개 이상이면 솔리드가 미리보기로 보입니다.";
        } else if (mode === "edit") {
            var se = getStory();
            s.textContent = "점 위치 조정: 주황색 정점을 드래그해 이동 (정점 " + drawCoords.length +
                "개, 둘레 " + perim.toFixed(1) + "m, " + se.floors + "층 × " + se.h + "m).";
        } else {
            if (drawCoords.length >= 3) {
                var st = getStory();
                s.textContent = "건물: 정점 " + drawCoords.length + "개, " + st.floors + "층 × 층고 " +
                    st.h + "m = 높이 " + (st.h * st.floors).toFixed(1) + "m, 모듈 가로 " + getModuleW() +
                    "m · 투명 건물 " + transparentList.length + "개. 건물 클릭=투명/복원.";
            } else {
                s.textContent = "투명 건물 " + transparentList.length +
                    "개. 건물 클릭=투명/복원. ‘① 점 찍기’로 신축 건물을 그리세요.";
            }
        }
    }
</script>
