<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webtoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4F4F2; --ink:#161616; --dim:#77756F; --line:#DCDBD6; --card:#FFFFFF; --accent:#C2412D; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#111; --ink:#EEE; --dim:#8C8A84; --line:#2A2A28; --card:#1A1A19; } }
  :root[data-theme="dark"]{ --paper:#111; --ink:#EEE; --dim:#8C8A84; --line:#2A2A28; --card:#1A1A19; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter','Noto Sans KR',system-ui,sans-serif; font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  main{ max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .top a{ color:var(--ink); text-decoration:none; font-size:20px; }
  .who{ font-size:12px; color:var(--dim); display:flex; gap:10px; align-items:center; }
  .who button{ font:inherit; background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; padding:0; }
  h1{ font-size:24px; margin:0 0 4px; font-weight:600; }
  h2{ font-size:15px; margin:0 0 8px; font-weight:600; }
  .sub{ color:var(--dim); margin:0 0 16px; }
  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tabs button{ font:inherit; background:none; border:0; border-bottom:2px solid transparent; padding:8px 14px; color:var(--dim); cursor:pointer; }
  .tabs button.on{ color:var(--ink); border-color:var(--ink); font-weight:600; }
  button.b{ font:inherit; font-size:12px; background:var(--card); border:1px solid var(--line); color:var(--ink); padding:5px 12px; border-radius:999px; cursor:pointer; }
  button.b.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.b:disabled{ opacity:.4; cursor:default; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .status{ font-size:13px; color:var(--accent); min-height:1.5em; margin:6px 0; }
  canvas.view{ display:block; width:100%; background:#fff; border-radius:10px; }
  /* 웹툰 */
  .make{ display:flex; gap:8px; margin:0 0 6px; }
  .make textarea{ flex:1; min-width:0; font:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); resize:vertical; }
  .toon{ display:grid; grid-template-columns:minmax(0,720px) minmax(0,1fr); gap:28px; align-items:start; }
  @media (max-width:980px){ .toon{ grid-template-columns:1fr; } }
  .toon > *{ min-width:0; }
  .meta h2{ font-size:18px; margin:0; }
  .meta p{ color:var(--dim); margin:2px 0 12px; font-size:13px; }
  .castmap{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 14px; }
  .crow{ display:grid; grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto; gap:8px; align-items:center; margin:0 0 8px; font-size:13px; }
  @media (max-width:520px){ .crow{ grid-template-columns:minmax(0,1fr) auto; } .crow select{ grid-column:1 / -1; grid-row:2; } }
  .crow small{ display:block; color:var(--dim); font-size:11px; line-height:1.3; }
  .crow select{ min-width:0; width:100%; font:inherit; font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .strip{ background:#fff; border-radius:6px; padding:0 0 40px; }
  .page{ padding:30px 0 10px; }
  .page .no{ font-size:11px; letter-spacing:.12em; color:#999; text-align:center; margin:0 0 14px; font-family:system-ui; }
  .panel{ display:block; width:100%; margin:0 0 26px; }
  .side{ position:sticky; top:16px; }
  .list{ list-style:none; margin:0 0 20px; padding:0; }
  .list li{ display:flex; gap:8px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .list li.on .t{ color:var(--accent); }
  .list .main{ flex:1; min-width:0; cursor:pointer; }
  .list .t{ font-weight:600; font-size:13px; }
  .list .p{ color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list .m{ color:var(--dim); font-size:11px; }
  .pub{ flex:none; border:1px solid var(--line); background:none; color:var(--dim); font:inherit; font-size:11px; padding:2px 8px; cursor:pointer; border-radius:999px; }
  .pub.on{ border-color:var(--ink); color:var(--ink); }
  .del{ flex:none; border:0; background:none; color:var(--dim); font-size:16px; cursor:pointer; padding:0 4px; }
  .toc ol{ margin:0; padding:0 0 0 20px; font-size:12px; }
  .toc li{ margin:0 0 6px; color:var(--dim); }
  .toc li b{ color:var(--ink); }
  /* 인물 */
  .chars{ display:grid; grid-template-columns:230px minmax(0,1fr); gap:20px; }
  @media (max-width:820px){ .chars{ grid-template-columns:1fr; } }
  .chars > *, .editor > *, .bgstage > *{ min-width:0; }
  .clist{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .clist button{ text-align:left; font:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; color:var(--ink); }
  .clist button.on{ outline:2px solid var(--accent); }
  .clist small{ display:block; color:var(--dim); font-size:12px; }
  .editor{ display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; }
  @media (max-width:1000px){ .editor{ grid-template-columns:1fr; } }
  .field{ display:grid; grid-template-columns:78px minmax(0,1fr) 58px; gap:8px; align-items:center; font-size:13px; margin:0 0 8px; }
  .field output{ text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; }
  .field input[type=range]{ width:100%; min-width:0; }
  .field input[type=text], .field select{ grid-column:2 / span 2; min-width:0; font:inherit; font-size:13px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .stat, .note{ font-size:12px; color:var(--dim); margin:10px 0; }
  /* 배경 */
  .thumbs{ display:grid; grid-template-columns:repeat(9,minmax(104px,1fr)); gap:8px; overflow-x:auto; padding-bottom:6px; }
  .thumb{ background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; }
  .thumb.on{ outline:2px solid var(--accent); }
  .thumb canvas{ display:block; width:100%; aspect-ratio:16/10; }
  .thumb div{ padding:4px 7px 6px; font-size:12px; font-weight:600; }
  .thumb small{ color:var(--dim); font-weight:400; margin-left:3px; }
  .bgstage{ display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:18px; margin-top:14px; }
  @media (max-width:860px){ .bgstage{ grid-template-columns:1fr; } }
  .objs{ font-size:12px; color:var(--dim); }
  .objs ol{ margin:4px 0 12px; padding-left:20px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="../admin.html" id="back">←</a>
    <span class="who" id="who" hidden><span id="email"></span><button type="button" id="logout">로그아웃</button></span>
  </div>
  <h1>Webtoon</h1>
  <p class="sub" id="intro">줄거리 한두 문장을 넣으면 10페이지 막대 인형 웹툰이 됩니다. 인물 체형은 [인물]에 저장해 두고 배역마다 바꿔 끼웁니다.</p>

  <nav class="tabs" id="tabs">
    <button data-tab="toon" class="on">웹툰</button>
    <button data-tab="chars">인물</button>
    <button data-tab="sets">배경</button>
  </nav>

  <section id="tab-toon">
    <form class="make" id="form" hidden>
      <textarea id="plot" rows="2" maxlength="300" placeholder="줄거리 한두 문장 (예: 출근길에 전남자친구를 스쳐 지나갔고…)"></textarea>
      <button class="b primary" id="makeBtn" type="submit">만들기</button>
    </form>
    <p class="status" id="status"></p>
    <div class="toon">
      <div>
        <div class="meta" id="meta" hidden><h2 id="sTitle"></h2><p id="sPlot"></p></div>
        <div class="castmap" id="castBox" hidden>
          <h2>배역</h2>
          <div id="castRows"></div>
          <div class="row"><button class="b primary" id="redraw">다시 그리기</button><span class="note" id="progress"></span></div>
        </div>
        <div class="strip" id="strip" hidden></div>
      </div>
      <aside class="side">
        <h2 id="listTitle">지난 웹툰</h2>
        <ul class="list" id="storyList"></ul>
        <div class="toc" id="toc"></div>
      </aside>
    </div>
  </section>

  <section id="tab-chars" hidden>
    <div class="chars">
      <div>
        <div class="row">
          <button class="b" id="cNew">새 인물</button>
          <button class="b" id="cDup">복제</button>
          <button class="b" id="cDel">삭제</button>
        </div>
        <div class="clist" id="clist"></div>
        <button class="b" id="cSeed" hidden>기본 인물 4명 넣기</button>
        <div class="note" id="saveState"></div>
      </div>
      <div class="editor">
        <div>
          <canvas class="view" id="cPreview"></canvas>
          <div class="row" style="margin:8px 0 14px">
            <span style="font-size:12px;color:var(--dim)">미리보기 자세</span>
            <select id="cPose" style="font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)"></select>
          </div>
          <h2>키 비교</h2>
          <canvas class="view" id="cLineup"></canvas>
        </div>
        <div>
          <div class="note" id="ownerNote"></div>
          <div class="field"><span>이름</span><input type="text" id="fName" maxlength="20"></div>
          <div class="field"><span>설명</span><input type="text" id="fDesc" maxlength="60"></div>
          <div id="sliders"></div>
          <div class="field"><span>머리 모양</span><select id="fHair"></select></div>
          <div class="field"><span>머리 색</span><select id="fTone"></select></div>
          <div class="field"><span>안경</span><select id="fGlasses"><option value="">없음</option><option value="1">있음</option></select></div>
          <div class="stat" id="cStat"></div>
          <div class="row">
            <button class="b primary" id="cSave">저장</button>
            <button class="b" id="cRevert">되돌리기</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-sets" hidden>
    <div class="thumbs" id="thumbs"></div>
    <div class="bgstage">
      <div>
        <canvas class="view" id="setView" style="aspect-ratio:16/10;touch-action:none"></canvas>
        <div class="row" style="margin-top:8px">
          <button class="b" id="setWide">설정샷으로</button>
          <label style="font-size:12px;color:var(--dim)"><input type="checkbox" id="setCast" checked> 인물 올리기</label>
        </div>
      </div>
      <div>
        <h2 id="setTitle"></h2>
        <p class="sub" id="setDesc" style="font-size:13px"></p>
        <div class="objs" id="setObjs"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const PI = Math.PI;

// 막대 인형 웹툰 — Admin(로그인)에서 만들고, Visitor(?mode=visitor)는 공개된 것만 봄. ?demo 는 서버 없이 예시 한 편.
// 서버: supabase/functions/stick-toon (Gemini 가 스토리보드 JSON 을 짬) · 표: toon_characters, toon_stories (010_toons.sql)
// 그림은 저장하지 않고, 열 때마다 이 페이지가 3D 로 다시 찍음.

/* ══ 스틱맨 코어 (ref/stickman-poses.html에서 복사) ═══════════════════ */
const L = {
  hipHalf: 81.79,   // 골반선 0 ~ 163.58
  thigh:   454.33,  // 888 → 433.67
  shin:    433.67,  // 433.67 → 0
  lower:   218.10,  // ※추가: 골반 → 허리 (척추 545.26을 4:6으로 나눔)
  upper_t: 327.16,  // ※추가: 허리 → 가슴 (= 어깨 폭)
  shHalf:  163.58,  // 어깨선 -81.79 ~ 245.37
  upper:   342.74,  // 1433.26 → 1090.52
  fore:    327.15,  // 1090.52 → 763.37
  neck:    93.47,   // 1433.26 → 1526.73
  headOff: 77.89,   // 목 끝 → 머리 구 중심 (1604.62)
  headR:   93.47,   // 머리 구 반지름
};

/* ── 2. 감정 → 표정 프리셋 ──────────────────────────────────── */
const EMOS = [
  { id:'calm',  ko:'평이',     color:'#9A958C', face:{ eye:'dot',   brow:null,    mouth:'flat',  fx:[] },
    rule:['점','없음','일자','–','기본 자세 그대로'] },
  { id:'joy',   ko:'기쁨',     color:'#E0A030', face:{ eye:'happy', brow:'arch',  mouth:'grin',  fx:['blush'] },
    rule:['^ ^','둥글게','활짝(반달)','볼터치','가슴을 펴고 팔이 위·바깥으로, 몸이 가볍게 뜸'] },
  { id:'sad',   ko:'슬픔',     color:'#4A86C5', face:{ eye:'dot',   brow:'sad',   mouth:'frown', fx:['tear'] },
    rule:['점','안쪽이 올라감 (八)','∩','눈물','등이 굽고 고개가 떨어짐, 팔이 축 처짐'] },
  { id:'angry', ko:'화남',     color:'#C2412D', face:{ eye:'dot',   brow:'angry', mouth:'grit',  fx:['vein'] },
    rule:['점','안쪽이 내려감 (V)','이 악문 입','💢','상체가 앞으로, 주먹·팔짱, 보폭이 큼'] },
  { id:'fear',  ko:'겁에 질림', color:'#7A5BA8', face:{ eye:'big',   brow:'sad',   mouth:'wavy',  fx:['sweat'] },
    rule:['동그랗게, 작은 눈동자','안쪽이 올라감','물결','식은땀','몸을 웅크리고 뒤로 빠짐, 팔로 몸을 가림'] },
];
const EMO = Object.fromEntries(EMOS.map(e=>[e.id,e]));

/* ── 3. 자세 데이터 ───────────────────────────────────────────
   각 뼈의 "방향 벡터"만 적습니다 (몸 기준 좌표계, 길이는 위에서 고정).
   팔·다리: [바깥, 위, 앞]  → 바깥(+)이 왼쪽이면 +x, 오른쪽이면 -x로 뒤집힘.
   waist/spine/neck: [x, 위, 앞]. waist = 골반→허리, spine = 허리→가슴.
   몸 전체: yaw(좌우 회전) · tilt(앞뒤로 눕힘, -90 = 등을 대고 누움) · spin(옆으로 누울 때 몸통 축 회전)
   twist: 어깨선 회전, look: 고개 돌림, lift: 공중 높이, chair/mat: 소품.
   face: 감정 프리셋에서 바꿀 부분만.                                      */
const SIT_LEGS = { tL:[0.12,0,1], sL:[0.04,-1,0.12], tR:[0.12,0,1], sR:[0.04,-1,0.12] };
const RUN_LEGS = { tL:[0.04,-0.35,1], sL:[0,-1,-0.15], tR:[0.04,-1,-0.55], sR:[0,-0.45,-1] };

const CATS = [
  { id:'lie', ko:'눕기', en:'Lie', note:'바닥에 매트. 측면에서 위로 내려다보는 카메라.', poses:{
    calm:{ d:'등을 대고 누움. 한 손은 배 위, 한쪽 무릎을 세움.', cam:70, pitch:22, mat:true,
      tilt:-90, waist:[0,1,0], spine:[0,1,0.05], neck:[0,1,0.35],
      uL:[0.25,-1,0], fL:[0.1,-1,0.1], uR:[0.15,-1,0.25], fR:[-0.9,0.3,0.35],
      tL:[0.08,-1,0], sL:[0,-1,0], tR:[0.05,-0.75,0.65], sR:[0,-1,-0.6] },
    joy:{ d:'두 손을 머리 뒤로 깍지, 다리를 꼬고 느긋하게.', cam:60, pitch:22, mat:true,
      tilt:-90, waist:[0,1,0], spine:[0,1,0.08], neck:[0,1,0.45],
      uL:[0.9,0.6,0], fL:[-0.8,0.5,-0.35], uR:[0.9,0.6,0], fR:[-0.8,0.5,-0.35],
      tL:[0.02,-1,0.15], sL:[-0.25,-1,0.15], tR:[0.05,-0.75,0.65], sR:[0,-1,-0.6] },
    sad:{ d:'옆으로 돌아누워 웅크림. 무릎을 끌어안음.', cam:90, pitch:72, mat:true,
      tilt:-90, spin:90, waist:[0,1,0.15], spine:[0,1,0.4], neck:[0,1,0.5],
      uL:[0.1,-1,0.6], fL:[-0.2,-0.4,1], uR:[0.1,-1,0.6], fR:[-0.2,-0.3,1],
      tL:[0.05,-0.2,1], sL:[0,-1,0.1], tR:[0.05,-0.3,1], sR:[0,-1,0.05] },
    angry:{ d:'누워서 떼쓰기. 주먹으로 바닥을 치고 발을 버둥.', cam:55, pitch:22, mat:true,
      tilt:-90, waist:[0,1,0], spine:[0,1,0.1], neck:[0,1,0.45],
      uL:[0.7,-0.3,0.6], fL:[0,0.3,1], uR:[0.8,0.1,0.5], fR:[0.1,0.6,1],
      tL:[0.1,-0.4,0.9], sL:[0,-0.3,1], tR:[0.1,-1,0.3], sR:[0,-1,-0.1] },
    fear:{ d:'팔꿈치로 상체를 받치고 뒤로 물러남. 무릎은 세움.', cam:50, pitch:18, mat:true,
      tilt:-90, waist:[0,1,0.5], spine:[0,1,0.9], neck:[0,1,0.3],
      uL:[0.35,-0.4,-1], fL:[0.1,-1,-0.15], uR:[0.35,-0.4,-1], fR:[0.1,-1,-0.15],
      tL:[0.15,-0.6,0.8], sL:[0.05,-1,-0.7], tR:[0.15,-0.5,0.85], sR:[0.05,-1,-0.6] },
  }},
  { id:'sit', ko:'앉기', en:'Sit', note:'의자 좌판 높이를 고정해 골반을 올려놓음.', poses:{
    calm:{ d:'허벅지 수평, 정강이 수직, 손은 무릎 위.', cam:50, chair:true,
      waist:[0,1,-0.12], spine:[0,1,0.1], neck:[0,1,0.08],
      uL:[0.12,-1,0.3], fL:[-0.05,-0.25,1], uR:[0.12,-1,0.3], fR:[-0.05,-0.25,1], ...SIT_LEGS },
    joy:{ d:'몸을 뒤로 젖히고 두 주먹을 번쩍. 발을 앞으로 차올림.', cam:30, chair:true,
      waist:[0,1,-0.05], spine:[0,1,-0.15], neck:[0,1,-0.12],
      uL:[0.45,0.9,0.15], fL:[0.15,1,0.1], uR:[0.45,0.9,0.15], fR:[0.15,1,0.1],
      tL:[0.12,0.05,1], sL:[0.08,-0.5,1], tR:[0.12,0,1], sR:[0.06,-0.8,0.6] },

/* ── 4. FK: 자세 → 노드 좌표 ───────────────────────────────── */
const V = (a)=>new THREE.Vector3(a[0],a[1],a[2]).normalize();
const UP = new THREE.Vector3(0,1,0), XA = new THREE.Vector3(1,0,0);
const rad = THREE.MathUtils.degToRad;
const yawQ = (deg)=>new THREE.Quaternion().setFromAxisAngle(UP, rad(deg||0));
const SEAT_HIP = 452;  // 의자 포즈: 골반 높이 고정

function solve(p, B = L){   // B: 체형 (기본은 3dm 원본 치수)
  // 몸 기준 좌표계: 몸통 축 회전(spin) → 앞뒤로 눕힘(tilt) → 좌우 회전(yaw)
  const root = yawQ(p.yaw).multiply(new THREE.Quaternion().setFromAxisAngle(XA, rad(p.tilt||0))).multiply(yawQ(p.spin));
  const n = {};
  const at = (from, dir, len)=>from.clone().add(dir.clone().multiplyScalar(len));
  const limb = (a, side)=>{ const v = V(a); v.x *= side; return v.applyQuaternion(root); };
  const axis = (x)=>new THREE.Vector3(x,0,0).applyQuaternion(root);

  n.pelvis = new THREE.Vector3();
  n.hipL = at(n.pelvis, axis( 1), B.hipHalf);
  n.hipR = at(n.pelvis, axis(-1), B.hipHalf);
  n.kneeL  = at(n.hipL,  limb(p.tL, 1), B.thigh);
  n.ankleL = at(n.kneeL, limb(p.sL, 1), B.shin);
  n.kneeR  = at(n.hipR,  limb(p.tR,-1), B.thigh);
  n.ankleR = at(n.kneeR, limb(p.sR,-1), B.shin);

  n.waist = at(n.pelvis, V(p.waist || p.spine).applyQuaternion(root), B.lower);
  n.chest = at(n.waist,  V(p.spine).applyQuaternion(root), B.upper_t);
  const chestQ = root.clone().multiply(new THREE.Quaternion().setFromUnitVectors(UP, V(p.spine))).multiply(yawQ(p.twist));
  n.shoulderL = at(n.chest, new THREE.Vector3( 1,0,0).applyQuaternion(chestQ), B.shHalf);
  n.shoulderR = at(n.chest, new THREE.Vector3(-1,0,0).applyQuaternion(chestQ), B.shHalf);
  n.elbowL = at(n.shoulderL, limb(p.uL, 1), B.upper);
  n.wristL = at(n.elbowL,    limb(p.fL, 1), B.fore);
  n.elbowR = at(n.shoulderR, limb(p.uR,-1), B.upper);
  n.wristR = at(n.elbowR,    limb(p.fR,-1), B.fore);

  n.neckTop = at(n.chest, V(p.neck).applyQuaternion(root), B.neck);
  const headQ = root.clone().multiply(new THREE.Quaternion().setFromUnitVectors(UP, V(p.neck))).multiply(yawQ(p.look));
  n.head = at(n.neckTop, new THREE.Vector3(0,1,0).applyQuaternion(headQ), B.headOff);
  n.nose = at(n.head, new THREE.Vector3(0,0,1).applyQuaternion(headQ), B.headR);  // 얼굴 방향

  // 접지: 의자면 골반을 좌판에, 아니면 가장 낮은 점을 바닥(0)에 두고 lift만큼 띄움
  let minY = n.head.y - B.headR;
  for (const k in n) if (k !== 'nose') minY = Math.min(minY, n[k].y);
  // 의자면 골반을 좌판에 (정강이가 길면 발이 바닥을 뚫지 않게 조금 올림), 아니면 가장 낮은 점을 바닥에
  const dy = p.chair ? Math.max(SEAT_HIP - n.pelvis.y, -minY) : -minY + (p.lift||0);
  for (const k in n) n[k].y += dy;
  return { n, headQ };
}

  m.position.y = up ? -r*0.75 : r*0.75;
  return m;
};

  vein:  (put)=>{ const g = new THREE.Group();   // 💢: 네 귀퉁이 호가 가운데를 향함
                  [[1,1,Math.PI],[-1,1,-Math.PI/2],[-1,-1,0],[1,-1,Math.PI/2]].forEach(([x,y,rz])=>{
                    const m = new THREE.Mesh(new THREE.TorusGeometry(8,2.4,6,12,Math.PI/2), VEIN);

function makeFace(face){
  const f = new THREE.Group();
  const put = (obj, az, el, lift=0.6)=>{
    const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ';
    pivot.rotation.set(-el, az, 0);
    obj.position.z = L.headR + lift; pivot.add(obj); f.add(pivot);
  };
  const e = EYES[face.eye] || EYES.dot;
  for (const s of [1,-1]) put(e(s), 0.37*s, 0.1);
  if (face.brow) for (const s of [1,-1]){ const [m, el] = BROWS[face.brow](s); put(m, 0.37*s, el); }
  put(new THREE.Mesh(new THREE.SphereGeometry(5.5,10,8), INK), 0, -0.12);   // 코
  put((MOUTHS[face.mouth] || MOUTHS.flat)(), 0, -0.4);

/* ══ 체형 ══ */
/* ══ 1. 체형: 숫자 7개 → 뼈 길이 ════════════════════════════════
   height 키(cm) · heads 등신 · legs 다리 길이(키 대비) · shoulder/hip 어깨·골반 폭 배율
   arm 팔 길이 배율 · thick 선 굵기(체격). 3dm 원본 = 169.8cm, 9.08등신, 다리 0.523 */
const BODY_KEYS = [
  ['height',  '키',        100, 200, 1,    v=>`${v}cm`],
  ['heads',   '등신',      4,   9.5, 0.1,  v=>`${(+v).toFixed(1)}`],
  ['legs',    '다리 길이', 0.40,0.56,0.005,v=>`${Math.round(v*1000)/10}%`],
  ['shoulder','어깨 폭',   0.7, 1.4, 0.01, v=>`×${(+v).toFixed(2)}`],
  ['hip',     '골반 폭',   0.7, 1.4, 0.01, v=>`×${(+v).toFixed(2)}`],
  ['arm',     '팔 길이',   0.8, 1.2, 0.01, v=>`×${(+v).toFixed(2)}`],
  ['thick',   '체격(굵기)',0.6, 2.0, 0.05, v=>`×${(+v).toFixed(2)}`],
];
const HAIRS = { none:'없음', short:'짧은 머리', long:'긴 머리', bob:'단발', bun:'올림머리', ponytail:'포니테일' };
const TONES = { black:['검정', 0x1B1A18], gray:['회색', 0x6E6E6E], light:['밝은색', 0xC9C9C9] };

function deriveBody(b){
  const H = b.height*10, s = H/1698;
  const headR = H / b.heads / 2;
  const neck = Math.min(0.055*H, headR*0.95), headOff = headR*0.83;
  let leg = H*b.legs, spine = H - leg - neck - headOff - headR;
  const minSpine = 0.24*H;
  if (spine < minSpine){ leg -= minSpine - spine; spine = minSpine; }   // 머리가 아주 크면 다리를 줄여 키를 맞춤
  return {
    hipHalf:81.79*s*b.hip, thigh:leg*0.5116, shin:leg*0.4884,
    lower:spine*0.4, upper_t:spine*0.6, shHalf:163.58*s*b.shoulder,
    upper:spine*0.6286*b.arm, fore:spine*0.6*b.arm,
    neck, headOff, headR, thick:b.thick, legReal:leg,
  };
}

/* ══ 3. 인물 그리기: 체형 + 머리 모양 + 안경 + 소품 ═════════════════════ */
const HAIR_MAT = {}; for (const k in TONES) HAIR_MAT[k] = new THREE.MeshBasicMaterial({ color:TONES[k][1], side:THREE.DoubleSide });
function hair(face, kind, tone){
  const R = L.headR, mat = HAIR_MAT[tone] || HAIR_MAT.black;
  if (!kind || kind === 'none') return;
  const capLen = { long:1.5, bob:1.5, short:1.25, bun:1.3, ponytail:1.3 }[kind];
  const cap = new THREE.Mesh(new THREE.SphereGeometry(R*1.07, 28, 14, 0, PI*2, 0, capLen), mat);
  cap.rotation.x = -0.42; cap.position.set(0, 4, -6); face.add(cap);
  const back = (h, y)=>{ const m = new THREE.Mesh(new THREE.CylinderGeometry(R*1.03, R*1.12, h, 24, 1, true, PI/2, PI), mat); m.position.set(0, y, -12); face.add(m); };
  if (kind === 'long') back(270, -105);
  if (kind === 'bob') back(130, -40);
  if (kind === 'bun'){ const b = new THREE.Mesh(new THREE.SphereGeometry(42, 16, 12), mat); b.position.set(0, 72, -88); face.add(b); }
  if (kind === 'ponytail'){ const t = new THREE.Mesh(new THREE.CylinderGeometry(22, 34, 240, 12), mat); t.position.set(0, -40, -R - 30); t.rotation.x = 0.35; face.add(t); }
}
function glasses(face){
  const R = L.headR + 7, mat = new THREE.MeshBasicMaterial({ color:0x161616 });
  for (const s of [1,-1]){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(21, 2.8, 6, 24), mat);
    const az = 0.37*s, el = 0.1;
    ring.position.set(Math.sin(az)*Math.cos(el)*R, Math.sin(el)*R, Math.cos(az)*Math.cos(el)*R); ring.rotation.y = az; face.add(ring);
  }
  const br = new THREE.Mesh(new THREE.BoxGeometry(26, 4, 4), mat); br.position.set(0, Math.sin(0.12)*R, R*0.99); face.add(br);
}
function makeFigure(p, ch){
  const B = deriveBody(ch.body), t = B.thick;
  const { n, headQ } = solve(p, B);
  const g = new THREE.Group();
  for (const [a,b] of BONES){
    const m = new THREE.Mesh(boneGeo, INK);
    m.scale.set(t, n[a].distanceTo(n[b]), t);
    m.position.copy(n[a]).add(n[b]).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP, n[b].clone().sub(n[a]).normalize());
    m.castShadow = true; g.add(m);
  }
  for (const k of ['kneeL','kneeR','elbowL','elbowR','wristL','wristR','ankleL','ankleR','shoulderL','shoulderR','hipL','hipR','waist']){
    const j = new THREE.Mesh(jointGeo, INK); j.position.copy(n[k]); j.scale.setScalar(t); g.add(j);
  }
  const hs = B.headR / L.headR;
  const head = new THREE.Mesh(headGeo, PAPER); head.position.copy(n.head); head.scale.setScalar(hs); head.castShadow = true; g.add(head);
  const hull = new THREE.Mesh(headGeo, HULL); hull.position.copy(n.head); hull.scale.setScalar(hs*1.1); g.add(hull);
  const face = makeFace(p.face); face.position.copy(n.head); face.quaternion.copy(headQ); face.scale.setScalar(hs); g.add(face);
  hair(face, ch.hair, ch.tone);
  if (ch.glasses) glasses(face);
  return { g, n, B };
}
function addProp(g, n, kind){
  if (!kind) return;
  const mid = n.wristL.clone().lerp(n.wristR, 0.5).add(new THREE.Vector3(0, 25, 0));
  const m = kind === 'phone'
    ? new THREE.Mesh(new THREE.BoxGeometry(80, 150, 10), new THREE.MeshBasicMaterial({ color:0x222222 }))
    : new THREE.Mesh(new THREE.CylinderGeometry(45, 38, 100, 16), new THREE.MeshBasicMaterial({ color:0xF2F2F2 }));
  m.position.copy(kind === 'phone' ? mid : n.wristR);

}

/* ══ 4. 배경: 흑백 미니멀 세트 9곳 (객체 = O() 한 번) ═══════════════════ */
const G = { sky:0xF1F1F1, floor:0xDADADA, wall:0xF4F4F4, white:0xFBFBFB, light:0xE5E5E5, mid:0xC4C4C4, dim:0x9C9C9C, dark:0x6E6E6E, black:0x3E3E3E, glass:0xD3D3D3, ground:0xD0D0D0, road:0x8C8C8C };
const TONE = new THREE.DataTexture(new Uint8Array([120,195,255]), 3, 1, THREE.RedFormat);
TONE.minFilter = TONE.magFilter = THREE.NearestFilter; TONE.needsUpdate = true;
const EDGE = new THREE.LineBasicMaterial({ color:0x2A2A2A });
const mats = new Map();
function M(hex, o={}){
  const k = `${hex}|${o.opacity||1}|${!!o.flat}`;
  if (!mats.has(k)) mats.set(k, new THREE.MeshToonMaterial({ color:hex, gradientMap:TONE, transparent:o.opacity!=null, opacity:o.opacity??1, flatShading:!!o.flat, depthWrite:o.opacity==null }));
  return mats.get(k);
}
function finish(m, g, edge){ m.castShadow = m.receiveShadow = true; if (edge !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), EDGE)); return m; }
function box(par, w,h,d, x,y,z, col, o={}){
  const g = new THREE.BoxGeometry(w,h,d), m = new THREE.Mesh(g, M(col,o));
  m.position.set(x, y+h/2, z); if (o.ry) m.rotation.y = o.ry; if (o.rx) m.rotation.x = o.rx;
  par.add(finish(m, g, o.edge)); return m;
}
function cyl(par, r,h, x,y,z, col, o={}){
  const g = new THREE.CylinderGeometry(o.rt ?? r, r, h, o.seg || 24), m = new THREE.Mesh(g, M(col,{ flat:o.seg && o.seg < 12 }));
  m.position.set(x, y+h/2, z); par.add(finish(m, g, o.edge)); return m;
}
function blob(par, r, x,y,z, col, o={}){
  const g = new THREE.IcosahedronGeometry(r, o.detail ?? 1), m = new THREE.Mesh(g, M(col,{ flat:true }));
  m.position.set(x,y,z); if (o.sy) m.scale.y = o.sy; par.add(finish(m, g)); return m;
}
function grp(par, x,y,z, ry=0){ const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry; par.add(g); return g; }
function rng(seed){ return ()=>{ seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// 벽: 길이 방향 = 로컬 x. 창·문 구멍을 피해 조각으로
function wall(g, len, h, t, ops, col){
  let cur = -len/2;
  for (const o of [...ops].sort((a,b)=>a.x-b.x)){
    const l = o.x - o.w/2, r = o.x + o.w/2;
    if (l > cur) box(g, l-cur, h, t, (cur+l)/2, 0, 0, col);
    if (o.y > 0) box(g, o.w, o.y, t, o.x, 0, 0, col);
    if (o.y + o.h < h) box(g, o.w, h-o.y-o.h, t, o.x, o.y+o.h, 0, col);
    const f = 50, d = t + 20;
    box(g, f, o.h, d, l + f/2, o.y, 0, G.white); box(g, f, o.h, d, r - f/2, o.y, 0, G.white); box(g, o.w, f, d, o.x, o.y + o.h - f, 0, G.white);
    if (o.door) box(g, o.w - 2*f, o.h - f, 40, o.x, o.y, 0, o.panel ?? G.mid);
    else { box(g, o.w, f, d + 40, o.x, o.y, 0, G.white); box(g, o.w - 2*f, o.h - 2*f, 8, o.x, o.y + f, 0, G.glass, { opacity:0.3, edge:false }); }
    cur = r;
  }
  if (cur < len/2) box(g, len/2-cur, h, t, (cur+len/2)/2, 0, 0, col);
}

const LOCAL_POSES = {
  sitphone:{ ko:'앉아서 휴대폰', emo:'calm', chair:true, waist:[0,1,-0.05], spine:[0,1,0.12], neck:[0,1,0.55],
    uL:[0.1,-1,0.3], fL:[-0.5,0.8,1], uR:[0.1,-1,0.3], fR:[-0.5,0.85,1], ...SIT_LEGS },
  standphone:{ ko:'서서 휴대폰', emo:'calm', waist:[0.03,1,0], spine:[0,1,0.05], neck:[0,1,0.5],
    uL:[0.1,-1,0.25], fL:[-0.5,0.8,1], uR:[0.1,-1,0.25], fR:[-0.5,0.85,1], tL:[0.1,-1,0], sL:[0.02,-1,0], tR:[-0.03,-1,0.1], sR:[0.05,-1,-0.05] },
};
function poseFromKey(key, emo){
  const i = key.indexOf(':'), a = key.slice(0, i), b = key.slice(i + 1);
  const p = a === 'x' ? EXTRA.find(e=>e.ko === b) : a === 'p' ? LOCAL_POSES[b] : CATS.find(c=>c.id === a)?.poses[b];
  if (!p) throw new Error('자세 없음: ' + key);
  const base = a === 'x' || a === 'p' ? p.emo : b, e = emo || base;
  return { ...p, emo:e, face: e === base ? { ...EMO[e].face, ...(p.face||{}) } : { ...EMO[e].face } };
}
const TIME = {
  morning:{ sky:0xEDEDED, hemi:[0xffffff, 0xcfcfcf, 1.6], sun:[0xffffff, 1.9] },
  day:    { sky:null,     hemi:[0xffffff, 0xcfcfcf, 1.6], sun:[0xffffff, 1.9] },
  evening:{ sky:0xBEBEBE, hemi:[0xf2f2f2, 0xa6a6a6, 1.3], sun:[0xffffff, 1.3] },
  night:  { sky:0x3A3A3A, hemi:[0xdadada, 0x5c5c5c, 0.9], sun:[0xffffff, 0.8] },
};
function lights(scene, s, time){
  const t = TIME[time] || TIME.day;
  scene.background = new THREE.Color(t.sky ?? (s.bg || G.sky));
  scene.add(new THREE.HemisphereLight(...t.hemi));
  const sun = new THREE.DirectionalLight(...t.sun);
  sun.position.set(4000, 9000, 6000); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-s.shadow, right:s.shadow, top:s.shadow, bottom:-s.shadow, near:100, far:40000 });
  sun.shadow.bias = -0.0004; scene.add(sun, sun.target);
  if (time === 'night' || time === 'evening'){ const lamp = new THREE.PointLight(0xffffff, time === 'night' ? 2 : 1, 0, 0); lamp.position.set(-1000, 2300, 800); scene.add(lamp); }
}
function actor(spec, scene, s, chMap){
  const p = poseFromKey(spec.pose, spec.emo);
  const sl = s.slots.find(x=>x.id === spec.slot);
  if (!sl) throw new Error(`${s.ko}에 자리 ${spec.slot} 없음`);
  const ch = chMap[spec.who] || SEED[0];
  const { g, n, B } = makeFigure(p, ch);
  addProp(g, n, spec.prop);
  const ry = sl.ry + rad(spec.turn || 0);
  const fwd = new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry));
  g.position.set(sl.x, sl.y, sl.z).addScaledVector(fwd, spec.step || 0);
  g.rotation.y = ry;
  scene.add(g); g.updateMatrixWorld(true);
  const W = (v)=>v.clone().applyMatrix4(g.matrixWorld);
  return { who:spec.who, g, head:W(n.head), chest:W(n.chest), feet:Math.min(W(n.ankleL).y, W(n.ankleR).y), fwd, ry, hr:B.headR };
}

/* ── 6. 카메라: 샷 크기 × 각도 × 높이, 가리는 세트는 잘라냄 ────────────── */
function cameraFor(panel, s, actors, aspect){
  const cam = new THREE.PerspectiveCamera(35, aspect, 30, 300000);
  const c = panel.camera || {};
  const by = (id)=>actors.find(a=>a.who === id);
  let pos, tgt;
  if (panel.shot === 'wide' || !actors.length){
    cam.fov = s.fov || 40; pos = new THREE.Vector3(...s.cam.pos); tgt = new THREE.Vector3(...s.cam.tgt);
    if (aspect > 1.5){ pos.sub(tgt).multiplyScalar(0.92).add(tgt); }
  } else if (panel.shot === 'two'){
    const A = by(c.on) || actors[0], B = by(c.with) || actors.find(a=>a !== A) || A;
    tgt = A.head.clone().lerp(B.head, 0.5); tgt.y -= 380;
    const span = A.head.distanceTo(B.head);
    let side = new THREE.Vector3().subVectors(B.head, A.head).setY(0).normalize().cross(UP);
    if (side.lengthSq() < 0.5) side.set(0,0,1);
    const facing = A.fwd.clone().add(B.fwd), wide = new THREE.Vector3(...s.cam.pos).sub(tgt);
    if (side.dot(facing.lengthSq() > 0.2 ? facing : wide) < 0) side.negate();
    pos = tgt.clone().addScaledVector(side, Math.max(2600, span*1.25 + 1700)).add(new THREE.Vector3(0, 380, 0));
  } else {
    const A = by(c.on) || actors[0];
    const D = ({ full:3500, bust:1300, close:820 }[panel.shot] || 1300) * (panel.shot === 'full' ? 1 : Math.pow((A.hr || L.headR) / L.headR, 0.8));   // 머리가 크면 조금 물러남
    tgt = panel.shot === 'full' ? new THREE.Vector3(A.head.x, (A.head.y + A.feet)/2 + 80, A.head.z)
        : panel.shot === 'bust' ? A.chest.clone().lerp(A.head, 0.6) : A.head.clone().add(new THREE.Vector3(0, -15, 0));
    if (c.angle === 'ots'){
      const B = by(c.from) || actors.find(a=>a !== A);
      const toA = new THREE.Vector3().subVectors(A.head, B.head).setY(0).normalize();
      const right = new THREE.Vector3().crossVectors(toA, UP).normalize().multiplyScalar(c.side === 'left' ? -1 : 1);
      const back = { full:1500, bust:700, close:480 }[panel.shot] || 700;
      const off = { full:650, bust:430, close:330 }[panel.shot] || 430;
      pos = B.head.clone().addScaledVector(toA, -back).addScaledVector(right, off).add(new THREE.Vector3(0, 90, 0));
      tgt.addScaledVector(right, -off*0.35);
    } else {
      const deg = { front:0, three:35, side:90, back:180 }[c.angle || 'three'] * (c.side === 'left' ? -1 : 1);
      const dir = A.fwd.clone().applyAxisAngle(UP, rad(deg));
      pos = tgt.clone().addScaledVector(dir, D);
      if (c.height === 'high') pos.y += D*0.55;
      else if (c.height === 'low'){ pos.y = Math.max(A.feet + 250, tgt.y - D*0.4); }
      else pos.y += D*0.06;
    }
  }
  if (panel.shot !== 'wide' && panel.bubbles.some(b=>b.kind === 'text')){
    const right = new THREE.Vector3().subVectors(tgt, pos).cross(UP).normalize(), k = pos.distanceTo(tgt) * Math.tan(rad(cam.fov/2)) * aspect * 0.42;   // 인물을 화면 왼쪽 1/4쯤으로
    pos.addScaledVector(right, k); tgt.addScaledVector(right, k);
  }
  cam.position.copy(pos); cam.lookAt(tgt); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  return { cam, tgt };
}
// 카메라와 인물 사이를 막는 세트 조각은 감춤 (웹툰식 단면):
// 인물보다 카메라에 가깝고, 화면에서 인물이 차지하는 범위와 겹치는 조각
function cutaway(setGroup, cam, actors){
  const pts = actors.flatMap(a=>[a.head, a.chest, new THREE.Vector3(a.head.x, a.feet, a.head.z)]);
  if (!pts.length) return;
  let x0 = 1, x1 = -1, y0 = 1, y1 = -1, near = Infinity;
  for (const p of pts){
    const q = p.clone().project(cam);
    x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y);
    near = Math.min(near, p.distanceTo(cam.position));
  }
  x0 -= 0.12; x1 += 0.12; y0 -= 0.08; y1 += 0.18;
  const box = new THREE.Box3(), c = new THREE.Vector3();
  setGroup.traverse(o=>{
    if (!o.isMesh) return;
    box.setFromObject(o);
    if (box.max.y <= 12) return;                         // 바닥은 남김
    if (box.containsPoint(cam.position)){ o.visible = false; return; }
    if (box.distanceToPoint(cam.position) > near - 220) return;
    let a0 = 1, a1 = -1, b0 = 1, b1 = -1, behind = false;
    for (let i = 0; i < 8; i++){
      c.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z);
      if (c.clone().applyMatrix4(cam.matrixWorldInverse).z > -cam.near){ behind = true; break; }
      c.project(cam);
      a0 = Math.min(a0, c.x); a1 = Math.max(a1, c.x); b0 = Math.min(b0, c.y); b1 = Math.max(b1, c.y);
    }
    if (behind || (a1 > x0 && a0 < x1 && b1 > y0 && b0 < y1)) o.visible = false;
  });
}

/* ── 7. 2D 덧그림: 말풍선 · 내레이션 · 휴대폰 · 효과음 · 효과선 ────────── */
const FONT = '"Noto Sans KR", "Malgun Gothic", sans-serif';
function wrap(ctx, text, maxW){
  const lines = []; let line = '';
  for (const ch of text){
    if (ctx.measureText(line + ch).width > maxW && line){ lines.push(line.trim()); line = ch === ' ' ? '' : ch; }
    else line += ch;
  }
  if (line.trim()) lines.push(line.trim());
  // 문장부호만 남은 마지막 줄은 앞 줄에 붙임
  if (lines.length > 1 && /^[.,!?…~"')\]]{1,2}$/.test(lines[lines.length-1])) lines[lines.length-2] += lines.pop();
  return lines;
}
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function project(v, cam, W, H){ const p = v.clone().project(cam); return { x:(p.x+1)/2*W, y:(1-p.y)/2*H, vis:p.z < 1 && Math.abs(p.x) < 1.15 && Math.abs(p.y) < 1.15 }; }

function fxLayer(ctx, kind, W, H, focus){
  ctx.save();
  if (kind === 'focus'){
    const cx = focus?.x ?? W/2, cy = focus?.y ?? H/2, r = rngFx(3);
    ctx.fillStyle = 'rgba(20,20,20,0.85)';
    for (let i = 0; i < 140; i++){
      const a = r()*PI*2, inner = Math.min(W,H)*(0.32 + r()*0.12), outer = Math.hypot(W,H), wdt = 0.004 + r()*0.01;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*inner, cy + Math.sin(a)*inner);
      ctx.lineTo(cx + Math.cos(a-wdt)*outer, cy + Math.sin(a-wdt)*outer);
      ctx.lineTo(cx + Math.cos(a+wdt)*outer, cy + Math.sin(a+wdt)*outer);
      ctx.fill();
    }
  } else if (kind === 'gloom'){
    const r = rngFx(9);
    const grd = ctx.createLinearGradient(0,0,0,H*0.55); grd.addColorStop(0,'rgba(40,46,70,0.35)'); grd.addColorStop(1,'rgba(40,46,70,0)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H*0.55);
    ctx.strokeStyle = 'rgba(30,30,40,0.55)';
    for (let x = 6; x < W; x += 9 + r()*7){ ctx.lineWidth = 1 + r()*1.5; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, H*(0.18 + r()*0.3)); ctx.stroke(); }
  } else if (kind === 'sparkle'){
    const r = rngFx(5);
    for (let i = 0; i < 26; i++){
      const x = r()*W, y = r()*H, s = 6 + r()*16;
      if (focus && Math.hypot(x - focus.x, y - focus.y) < Math.min(W,H)*0.22) continue;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.95)' : 'rgba(255,214,120,0.95)';
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k < 8; k++){ const a = k*PI/4, rr = k % 2 ? s*0.28 : s; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}
function rngFx(seed){ return rng(seed); }

function overlay(ctx, panel, W, H, cam, actors, chars){
  const S = W / 720;                                     // 720px 폭 기준 크기
  const pad = 18*S;
  const head = {}; for (const a of actors) head[a.who] = project(a.head, cam, W, H);
  const headR = (a)=>{ const top = project(a.head.clone().add(new THREE.Vector3(0, a.hr || L.headR, 0)), cam, W, H); return Math.abs(head[a.who].y - top.y); };
  const focusAt = panel.camera?.on && head[panel.camera.on] || null;
  fxLayer(ctx, panel.fx, W, H, focusAt && { x:focusAt.x, y:focusAt.y });

  const placed = [];
  const free = (r)=>!placed.some(p=>r.x < p.x + p.w + 8*S && p.x < r.x + r.w + 8*S && r.y < p.y + p.h + 8*S && p.y < r.y + r.h + 8*S);
  const findSpot = (w, h, prefX, startY)=>{
    for (let y = startY; y < H - h - pad; y += 12*S){
      for (const dx of [0, 1, -1, 2, -2, 3, -3]){
        const x = Math.min(W - w - pad, Math.max(pad, prefX - w/2 + dx*70*S));
        const r = { x, y, w, h }; if (free(r)) return r;
      }
    }
    return { x:pad, y:startY, w, h };
  };

  // 내레이션: 왼쪽 위 사각 상자
  let topY = pad;
  for (const b of panel.bubbles.filter(b=>b.kind === 'narration')){
    ctx.font = `600 ${19*S}px ${FONT}`;
    const lines = wrap(ctx, b.text, W*0.62), lh = 27*S;
    const w = Math.max(...lines.map(l=>ctx.measureText(l).width)) + 28*S, h = lines.length*lh + 20*S;
    const r = { x:pad, y:topY, w, h };
    ctx.fillStyle = '#FFFDF6'; ctx.strokeStyle = '#151412'; ctx.lineWidth = 2*S;
    ctx.fillRect(r.x, r.y, w, h); ctx.strokeRect(r.x, r.y, w, h);
    ctx.fillStyle = '#151412'; ctx.textBaseline = 'top';
    lines.forEach((l,i)=>ctx.fillText(l, r.x + 14*S, r.y + 10*S + i*lh));
    placed.push(r); topY += h + 10*S;
  }

  // 휴대폰 화면: 메시지를 한 화면에 모아 오른쪽에 (자리를 먼저 잡고, 말풍선 뒤에 그림)
  const texts = panel.bubbles.filter(b=>b.kind === 'text');
  let drawPhone = ()=>{};
  if (texts.length){
    const pw = Math.min(W*0.46, 330*S), ph = Math.min(H*0.8, pw*1.75);
    const px = W - pw - pad*1.4, py = (H - ph)/2;
    placed.push({ x:px, y:py, w:pw, h:ph });
    drawPhone = ()=>{
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 18*S;
    ctx.fillStyle = '#1D1E22'; rrect(ctx, px, py, pw, ph, 34*S); ctx.fill(); ctx.restore();
    const sx = px + 12*S, sy = py + 44*S, sw = pw - 24*S, sh = ph - 70*S;
    ctx.fillStyle = '#F2F3F5'; rrect(ctx, sx, sy, sw, sh, 14*S); ctx.fill();
    const other = texts.find(t=>t.who !== texts[0].who)?.who || STORY.characters.find(c=>c.id !== texts[0].who)?.id;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(sx, sy, sw, 42*S);
    ctx.fillStyle = '#151412'; ctx.font = `600 ${16*S}px ${FONT}`; ctx.textBaseline = 'middle';
    ctx.fillText(chars[other]?.name || '', sx + 14*S, sy + 21*S);
    let y = sy + 58*S;
    ctx.font = `400 ${15*S}px ${FONT}`;
    const me = texts[0].who;
    for (const t of texts){
      const mine = t.who === me;
      const lines = wrap(ctx, t.text, sw*0.66), lh = 22*S;
      const bw = Math.max(...lines.map(l=>ctx.measureText(l).width)) + 22*S, bh = lines.length*lh + 14*S;
      const bx = mine ? sx + sw - bw - 10*S : sx + 10*S;
      ctx.fillStyle = mine ? '#FFE16B' : '#FFFFFF'; rrect(ctx, bx, y, bw, bh, 12*S); ctx.fill();
      ctx.fillStyle = '#151412'; ctx.textBaseline = 'top';
      lines.forEach((l,i)=>ctx.fillText(l, bx + 11*S, y + 7*S + i*lh));
      y += bh + 10*S;
    }
    };
  }

  // 말풍선 · 속마음
  for (const b of panel.bubbles.filter(b=>b.kind === 'speech' || b.kind === 'thought')){
    const a = actors.find(x=>x.who === b.who), h0 = a && head[b.who];
    const isT = b.kind === 'thought';
    ctx.font = `${isT ? 400 : 600} ${21*S}px ${FONT}`;
    const lines = wrap(ctx, b.text, W*0.36), lh = 29*S;
    const tw = Math.max(...lines.map(l=>ctx.measureText(l).width));
    const w = tw + 56*S, h = lines.length*lh + 34*S;
    const pref = h0 && h0.vis ? h0.x + (h0.x > W/2 ? -W*0.12 : W*0.12) : W*0.7;
    const r = findSpot(w, h, pref, topY);
    placed.push(r);
    const cx = r.x + w/2, cy = r.y + h/2;
    ctx.save();
    ctx.lineWidth = 2.2*S; ctx.strokeStyle = '#151412'; ctx.fillStyle = '#FFFFFF';
    if (isT){
      // 구름 테두리: 타원 둘레에 작은 원을 겹침
      ctx.beginPath();
      const n = Math.max(10, Math.round((w + h)/34/S));
      for (let i = 0; i < n; i++){ const t = i/n*PI*2; ctx.moveTo(cx + Math.cos(t)*w/2 + 15*S, cy + Math.sin(t)*h/2); ctx.arc(cx + Math.cos(t)*w/2, cy + Math.sin(t)*h/2, 15*S, 0, PI*2); }
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, w/2, h/2, 0, 0, PI*2); ctx.fill();
      if (h0 && h0.vis){
        const ty = h0.y - headR(a) - 14*S;
        for (const [t, rr] of [[0.45, 9], [0.72, 6]]){ ctx.beginPath(); ctx.arc(cx + (h0.x - cx)*t, cy + h/2 + (ty - cy - h/2)*t, rr*S, 0, PI*2); ctx.fill(); ctx.stroke(); }
      }
    } else {
      ctx.beginPath(); ctx.ellipse(cx, cy, w/2, h/2, 0, 0, PI*2);
      if (h0 && h0.vis){
        const tx = h0.x, ty = Math.max(cy + h/2 + 6*S, h0.y - headR(a) - 10*S);
        const bx = cx + Math.max(-w*0.25, Math.min(w*0.25, (tx - cx)*0.4));
        ctx.moveTo(bx - 14*S, cy + h*0.38); ctx.lineTo(tx, ty); ctx.lineTo(bx + 14*S, cy + h*0.38);
      }
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, w/2 - 1.2*S, h/2 - 1.2*S, 0, 0, PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = isT ? '#3A3936' : '#151412'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    lines.forEach((l,i)=>ctx.fillText(l, cx, cy - lines.length*lh/2 + i*lh + 2*S));
    ctx.textAlign = 'left';
  }

  drawPhone();

  // 효과음: 머리 옆, 다른 풍선·휴대폰과 겹치면 반대쪽으로
  for (const b of panel.bubbles.filter(b=>b.kind === 'sfx')){
    const a = actors.find(x=>x.who === b.who), h0 = head[b.who];
    const fs = (b.text.length <= 1 ? 82 : 54)*S, sw = fs*b.text.length;
    let x = W*0.75, y = H*0.3;
    if (h0?.vis){
      const off = headR(a)*1.25 + sw*0.6;
      y = Math.max(fs, h0.y - headR(a)*0.9);
      x = h0.x + off;
      const hitsAny = (xx)=>placed.some(p=>xx + sw/2 > p.x && xx - sw/2 < p.x + p.w && y + fs/2 > p.y && y - fs/2 < p.y + p.h) || xx + sw/2 > W;
      if (hitsAny(x)) x = h0.x - off;
      x = Math.max(sw/2 + pad, Math.min(W - sw/2 - pad, x));
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12);
    ctx.font = `800 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 12*S; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(b.text, 0, 0);
    ctx.fillStyle = '#151412'; ctx.fillText(b.text, 0, 0);
    ctx.restore();
  }
}

const off = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
off.shadowMap.enabled = true; off.shadowMap.type = THREE.PCFSoftShadowMap;
const SIZE = { wide:[720, 405], normal:[720, 540], tall:[720, 860] };
const DPR = 1.5;
const disposeScene = (scene)=>scene.traverse(o=>{ if (o.geometry && ![boneGeo, jointGeo, headGeo].includes(o.geometry)) o.geometry.dispose(); });

function renderPanel(panel, chMap, names){
  const s = SC[panel.location];
  if (!s) throw new Error('장소 없음: ' + panel.location);
  const [w, h] = SIZE[panel.size] || SIZE.normal;
  const scene = new THREE.Scene(); lights(scene, s, panel.time);
  const set = new THREE.Group(); s.make(set); scene.add(set);
  const actors = panel.cast.map(c=>actor(c, scene, s, chMap));
  const { cam } = cameraFor(panel, s, actors, w/h);
  scene.updateMatrixWorld(true);
  if (panel.shot !== 'wide') cutaway(set, cam, actors);
  off.setPixelRatio(DPR); off.setSize(w, h); off.render(scene, cam);
  const cv = document.createElement('canvas'); cv.width = w*DPR; cv.height = h*DPR; cv.className = 'panel';
  const ctx = cv.getContext('2d'); ctx.drawImage(off.domElement, 0, 0);
  overlay(ctx, panel, cv.width, cv.height, cam, actors, names);
  ctx.lineWidth = 3; ctx.strokeStyle = '#161616'; ctx.strokeRect(1.5, 1.5, cv.width - 3, cv.height - 3);
  disposeScene(scene);
  return cv;
}

    try { const body = await error.context.json(); if (body.error) message = body.error; } catch (_) {}
    return fail({ message });
  }
  say('');
  const story = { characters:data.characters, pages:data.pages };
  // 배역: 같은 이름의 저장된 인물이 있으면 그 체형, 없으면 Gemini 가 제안한 체형
  const cast = {};
  for (const c of story.characters){ const lib = CHARS.find(x=>x.name === c.name); cast[c.id] = lib ? snap(lib) : hintSnap(c); }
  const { data:row, error:e2 } = await db.from('toon_stories')
    .insert({ plot, title:data.title, story, cast, model:data.model }).select('id, plot, title, story, cast, model, user_id, is_public, created_at').single();
  if (e2) return fail({ message:`저장하지 못했습니다: ${e2.message}` });
  $('plot').value = '';
  await loadStories();
  openStory(row);
}

async function loadStories(){
  if (MODE === 'demo'){ STORIES = [{ id:DEMO_ID, plot:SAMPLE.plot, title:SAMPLE.title, mine:true, created_at:new Date().toISOString() }]; renderStoryList(); return STORIES; }
  let q = db.from('toon_stories');
  q = MODE === 'visitor' ? q.select('id, title, plot, created_at').eq('is_public', true)
                         : q.select('id, title, plot, user_id, author_email, is_public, created_at');
  const { data, error } = await q.order('created_at', { ascending:false }).limit(40);
  if (error){ fail(error); return []; }
  STORIES = data.map(r=>({ ...r, mine:!!me && r.user_id === me.id }));
  renderStoryList();
  return STORIES;
}
function renderStoryList(){
  $('storyList').innerHTML = STORIES.length ? STORIES.map(s=>`<li data-id="${s.id}" class="${current && String(current.id) === String(s.id) ? 'on' : ''}">
    <div class="main"><div class="t">${esc(s.title)}</div><div class="p">${esc(s.plot)}</div><div class="m">${MODE === 'admin' ? esc(s.author_email || '') + ' · ' : ''}${when(s.created_at)}</div></div>
    ${MODE === 'admin' && s.mine ? `<button class="pub ${s.is_public ? 'on' : ''}" data-pub="${s.id}">${s.is_public ? '공개' : '비공개'}</button><button class="del" data-del="${s.id}" aria-label="삭제">×</button>` : ''}
  </li>`).join('') : `<li class="m">${MODE === 'visitor' ? '공개된 웹툰이 아직 없습니다.' : '아직 만든 웹툰이 없습니다.'}</li>`;
  $('storyList').querySelectorAll('.main').forEach(el=>el.onclick=()=>openSaved(el.parentElement.dataset.id));
  $('storyList').querySelectorAll('[data-pub]').forEach(b=>b.onclick=async ()=>{
    const s = STORIES.find(x=>String(x.id) === b.dataset.pub);
    const { error } = await db.from('toon_stories').update({ is_public:!s.is_public }).eq('id', s.id);
    if (error) return fail(error); loadStories();
  });
  $('storyList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    const s = STORIES.find(x=>String(x.id) === b.dataset.del);
    if (!confirm(`'${s.title}'을(를) 삭제할까요?`)) return;
    const { error } = await db.from('toon_stories').delete().eq('id', s.id);
    if (error) return fail(error);
    if (current && String(current.id) === String(s.id)){ current = null; ['meta','castBox','strip'].forEach(id=>$(id).hidden = true); $('toc').innerHTML = ''; }
    loadStories();
  });
}
async function openSaved(id){
  if (MODE === 'demo'){
    const story = { characters:SAMPLE.characters.map(c=>({ ...c, body_hint:{ height:165, heads:7 } })), pages:SAMPLE.pages };
    const cast = {}; for (const c of story.characters){ const lib = CHARS.find(x=>x.name === c.name); cast[c.id] = lib ? snap(lib) : hintSnap(c); }
    return openStory({ id:DEMO_ID, plot:SAMPLE.plot, title:SAMPLE.title, story, cast, model:'예시 (서버 없이)', user_id:null });
  }
  const { data, error } = await db.from('toon_stories').select(MODE === 'visitor' ? 'id, plot, title, story, cast, model' : 'id, plot, title, story, cast, model, user_id').eq('id', id).single();
  if (error) return fail(error);
  openStory(data);
}
function openStory(row){
  current = { ...row, mine: MODE === 'demo' || (!!me && row.user_id === me.id) };
  for (const c of current.story.characters) if (!current.cast[c.id]) current.cast[c.id] = hintSnap(c);
  $('meta').hidden = false; $('sTitle').textContent = current.title; $('sPlot').textContent = current.plot + (current.model ? ` · ${current.model}` : '');
  $('toc').innerHTML = `<h2>페이지</h2><ol>${current.story.pages.map(p=>`<li><b>${esc(p.summary)}</b> · ${p.panels.length}컷 · ${[...new Set(p.panels.map(x=>SC[x.location]?.ko || x.location))].join(', ')}</li>`).join('')}</ol>`;
  renderCastRows(); renderStoryList();
  drawStory();
}
// 배역 줄: 역 이름 · 고른 인물 · (제안 체형이면) 인물로 저장
function renderCastRows(){
  if (!current) return;
  $('castBox').hidden = false;
  const canEdit = current.mine && MODE !== 'visitor';
  $('castRows').innerHTML = current.story.characters.map(c=>{
    const v = current.cast[c.id], val = v.from != null && charById(v.from) ? String(v.from) : 'hint';
    // 'hint' 칸: 라이브러리에 없는 체형(Gemini 제안, 또는 지워진 인물의 저장 당시 사본)
    const kept = val === 'hint' ? v : hintSnap(c), keptName = v.from != null && val === 'hint' ? esc(v.name) + ' (저장 당시 체형)' : '제안 체형';
    const opts = [`<option value="hint" ${val === 'hint' ? 'selected' : ''}>${keptName} · ${kept.body.height}cm ${(+kept.body.heads).toFixed(1)}등신</option>`]
      .concat(MODE === 'visitor' ? [] : CHARS.map(x=>`<option value="${x.id}" ${String(x.id) === val ? 'selected' : ''}>${esc(x.name)} · ${x.body.height}cm ${(+x.body.heads).toFixed(1)}등신</option>`));
    return `<div class="crow"><span><b>${esc(c.name)}</b><small>${esc(c.desc || '')}</small></span>
      <select data-who="${c.id}" ${canEdit ? '' : 'disabled'}>${opts.join('')}</select>
      ${canEdit && val === 'hint' && MODE === 'admin' ? `<button class="b" data-keep="${c.id}">인물로 저장</button>` : '<span></span>'}</div>`;
  }).join('');
  $('redraw').hidden = MODE === 'visitor';
  $('castRows').querySelectorAll('select').forEach(sel=>sel.onchange=async ()=>{
    const c = current.story.characters.find(x=>x.id === sel.dataset.who);
    current.cast[c.id] = sel.value === 'hint' ? hintSnap(c) : snap(charById(sel.value));
    await saveCast(); renderCastRows();
  });
  $('castRows').querySelectorAll('[data-keep]').forEach(b=>b.onclick=async ()=>{
    const c = current.story.characters.find(x=>x.id === b.dataset.keep), v = current.cast[c.id];
    const n = await insertChar({ name:c.name, desc:c.desc || '', body:v.body, hair:v.hair, tone:v.tone, glasses:v.glasses });
    if (!n) return;
    current.cast[c.id] = snap(n); await saveCast(); renderCastRows(); say(`'${n.name}'을(를) 인물에 저장했습니다. [인물] 탭에서 다듬을 수 있어요.`);
  });
}
async function saveCast(){
  if (MODE !== 'admin' || !current.mine) return;
  const { error } = await db.from('toon_stories').update({ cast:current.cast }).eq('id', current.id);
  if (error) fail(error);
}

let drawToken = 0;
async function drawStory(){
  const token = ++drawToken, st = current.story;
  const chMap = {}, names = {};
  for (const c of st.characters){ chMap[c.id] = current.cast[c.id]; names[c.id] = { name:c.name }; }
  STORY = { title:current.title, plot:current.plot, characters:st.characters, pages:st.pages };   // 휴대폰 화면의 상대 이름용
  const strip = $('strip'); strip.innerHTML = ''; strip.hidden = false;
  const total = st.pages.reduce((n,p)=>n + p.panels.length, 0); let done = 0;
  await document.fonts.load(`800 40px "Noto Sans KR"`).catch(()=>{});
  for (const [i, page] of st.pages.entries()){
    const el = document.createElement('section'); el.className = 'page';
    el.innerHTML = `<div class="no">PAGE ${String(i+1).padStart(2,'0')}</div>`; strip.appendChild(el);
    for (const panel of page.panels){
      if (token !== drawToken) return;            // 다른 웹툰을 열었으면 멈춤
      try { el.appendChild(renderPanel(panel, chMap, names)); }
      catch (e){ console.error(e); const d = document.createElement('div'); d.className = 'note'; d.textContent = '컷 오류: ' + e.message; el.appendChild(d); }
      $('progress').textContent = `${++done} / ${total}컷`;
      await new Promise(r=>requestAnimationFrame(r));
    }
  }
  $('progress').textContent = `${total}컷`;
}
$('redraw').onclick = ()=>current && drawStory();

/* ══ 탭 · 시작 ═══════════════════════════════════════════════ */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x === b));
  for (const t of ['toon','chars','sets']) $('tab-' + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === 'chars'){ if (!draft && CHARS[0]){ selId = CHARS[0].id; draft = structuredClone(CHARS[0]); } fillEditor(); refreshChar(); }
  if (b.dataset.tab === 'sets') openSets();
});
$('form').addEventListener('submit', e=>{ e.preventDefault(); const plot = $('plot').value.trim(); if (plot) make(plot); });
$('plot').addEventListener('keydown', e=>{ if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('form').requestSubmit(); });

async function applyUser(user){
  if (!user) return location.replace('../admin.html');
  me = user; $('who').hidden = false; $('email').textContent = user.email; $('form').hidden = false;
  await loadChars(); await loadStories();
}

async function start(){
  if (MODE === 'demo'){
    $('intro').textContent = '데모: 서버 없이 예시 한 편을 그립니다. [만들기]와 저장은 Admin에서 로그인한 뒤에 됩니다.';
    await loadChars(); await loadStories(); openSaved(DEMO_ID); return;
  }
  if (!db) return say('Supabase를 불러오지 못했습니다.');
  if (MODE === 'visitor'){
    $('back').href = '../visitor.html'; $('tabs').hidden = true; $('listTitle').textContent = '웹툰 목록';
    $('intro').textContent = '막대 인형으로 그린 10페이지 웹툰입니다.';
    db.channel('toon_stories').on('postgres_changes', { event:'*', schema:'public', table:'toon_stories' }, loadStories).subscribe();
    const rows = await loadStories(); if (rows.length) openSaved(rows[0].id);
    return;
  }
  $('logout').onclick = ()=>db.auth.signOut();
  db.auth.onAuthStateChange((event, session)=>{
    if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) setTimeout(()=>applyUser(session ? session.user : null), 0);
  });
  db.channel('toon_stories').on('postgres_changes', { event:'*', schema:'public', table:'toon_stories' }, ()=>me && loadStories()).subscribe();
  db.channel('toon_characters').on('postgres_changes', { event:'*', schema:'public', table:'toon_characters' }, ()=>me && loadChars()).subscribe();
}
start();
</script>
