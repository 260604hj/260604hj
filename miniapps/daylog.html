<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하루">
<meta name="theme-color" content="#F5EEDF">
<title>하루 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
    /* 팔레트 — 직물 견본 이미지에서 추출 */
    :root{
        --cream:#F5EEDF;      /* 바탕 */
        --card:#FFFDF8;
        --ink:#1A1714;        /* Meteorite */
        --muted:#8C8478;
        --line:rgba(26,23,20,.09);
        --fill:rgba(26,23,20,.05);

        --mulled:#3D8F3A;     /* 가계부 */
        --trip:#4B0E20;
        --pistachio:#A8A35E;
        --crepe:#7E2B46;      /* 생각 */
        --alderley:#D4AE88;
        --saffron:#A98E1A;    /* 배운 것 */
        --olive:#34361F;
        --sherbet:#E2A096;
        --postbox:#C21D1D;    /* 목표 · 오늘 */
        --cherry:#74131D;
        --sky:#5BA3C4;        /* 일정 */

        --radius:18px;
        --tabbar-h:64px;
    }
    *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body{ background:var(--cream); }
    body{
        font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo',sans-serif;
        color:var(--ink);
        -webkit-font-smoothing:antialiased;
        letter-spacing:-.01em;
        overscroll-behavior-y:none;
    }
    button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
    input,textarea{ font:inherit; color:inherit; }

    .app{
        max-width:480px; margin:0 auto; min-height:100vh;
        padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
    }

    /* ── 헤더 ───────────────────────────── */
    .top{ display:flex; align-items:flex-end; justify-content:space-between; margin:6px 2px 14px; }
    .top .eyebrow{ font-size:13px; font-weight:600; color:var(--postbox); letter-spacing:.02em; }
    .top h1{ font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1.1; }
    .top .nav{ display:flex; gap:6px; align-items:center; }
    .icon-btn{
        width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
        background:var(--fill); transition:transform .15s, background .15s;
    }
    .icon-btn:active{ transform:scale(.92); background:rgba(26,23,20,.1); }
    .icon-btn svg{ width:18px; height:18px; }
    /* 동기화 상태: 점 색으로 표시 */
    .icon-btn.sync{ position:relative; color:var(--muted); }
    .icon-btn.sync::after{ content:''; position:absolute; right:5px; bottom:6px; width:8px; height:8px; border-radius:50%; border:2px solid var(--cream); background:var(--muted); }
    .icon-btn.sync[data-s=ok]{ color:var(--ink); }
    .icon-btn.sync[data-s=ok]::after{ background:var(--mulled); }
    .icon-btn.sync[data-s=syncing]::after{ background:var(--saffron); animation:blink 1s infinite; }
    .icon-btn.sync[data-s=error]::after{ background:var(--postbox); }
    @keyframes blink{ 50%{ opacity:.3; } }
    .pill-btn{
        height:36px; padding:0 14px; border-radius:18px; background:var(--fill);
        font-size:14px; font-weight:600;
    }

    /* ── 캘린더 ───────────────────────────── */
    .cal{ background:var(--card); border-radius:22px; padding:14px 10px 10px; box-shadow:0 1px 0 var(--line), 0 8px 24px rgba(75,14,32,.05); }
    .cal-week, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
    .cal-week div{ text-align:center; font-size:11px; font-weight:600; color:var(--muted); padding-bottom:8px; }
    .cal-week div:first-child{ color:var(--postbox); }
    .cal-week div:last-child{ color:var(--sky); }
    .day{
        position:relative; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        padding-top:4px; border-radius:12px;
    }
    .day .num{
        width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
        font-size:16px; font-weight:500; transition:background .15s,color .15s;
    }
    .day.out .num{ color:rgba(26,23,20,.22); }
    .day.sun .num{ color:var(--postbox); }
    .day.today .num{ color:var(--postbox); font-weight:800; }
    .day.sel .num{ background:var(--ink); color:var(--cream); font-weight:700; }
    .day.sel.today .num{ background:var(--postbox); color:#fff; }
    .day .meta{ font-size:9.5px; font-weight:600; line-height:1; margin-top:3px; height:12px; color:var(--mulled); white-space:nowrap; }
    .day .meta.emoji{ font-size:12px; }
    .day .dots{ display:flex; gap:2.5px; margin-top:4px; height:5px; }
    .day .dots i{ width:5px; height:5px; border-radius:50%; display:block; }

    /* ── 날짜 섹션 ───────────────────────────── */
    .date-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 4px 12px; }
    .date-head h2{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
    .date-head .sub{ font-size:13px; color:var(--muted); font-weight:500; }

    .card{ background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:0 1px 0 var(--line); }
    .card + .card{ margin-top:12px; }
    .section-label{ font-size:13px; font-weight:600; color:var(--muted); margin:22px 6px 8px; display:flex; justify-content:space-between; align-items:center; }
    .section-label button{ color:var(--accent,var(--ink)); font-weight:600; font-size:13px; }

    /* 합계 카드 */
    .total{ display:flex; justify-content:space-between; align-items:flex-end; color:var(--cream); background:var(--trip); }
    .total .k{ font-size:13px; opacity:.7; font-weight:500; }
    .total .v{ font-size:30px; font-weight:800; letter-spacing:-.03em; margin-top:2px; }
    .total .v small{ font-size:17px; font-weight:600; margin-left:2px; }
    .total .month{ text-align:right; font-size:12px; opacity:.75; line-height:1.5; }
    .total .month b{ display:block; font-size:16px; opacity:1; color:var(--alderley); }
    .bar{ display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:14px; background:rgba(245,238,223,.15); }
    .bar i{ display:block; height:100%; }
    .legend{ display:flex; gap:12px; margin-top:8px; font-size:11px; opacity:.8; flex-wrap:wrap; }
    .legend span::before{ content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--c); margin-right:4px; vertical-align:1px; }

    /* 세그먼트 컨트롤 (iOS) */
    .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:rgba(26,23,20,.07); border-radius:10px; padding:2px; margin-top:16px; position:relative; }
    .seg button{ height:32px; border-radius:8px; font-size:13.5px; font-weight:500; position:relative; z-index:1; transition:color .2s; }
    .seg button.on{ font-weight:700; }
    .seg .thumb{ position:absolute; top:2px; bottom:2px; border-radius:8px; background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.04); transition:left .28s cubic-bezier(.3,.7,.2,1), width .28s; }

    /* 즐겨찾기 */
    .favs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    .fav{
        background:var(--card); border-radius:16px; padding:12px 6px 10px; text-align:center;
        box-shadow:0 1px 0 var(--line); transition:transform .12s; position:relative;
        display:flex; flex-direction:column; align-items:center; gap:6px;
    }
    .fav:active{ transform:scale(.95); }
    .fav .nm{ font-size:12.5px; font-weight:600; line-height:1.25; word-break:keep-all; }
    .fav .nm small{ display:block; font-weight:500; color:var(--muted); font-size:11px; }
    .fav .pr{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .fav .stepper{ margin-top:2px; }
    .fav.add{ justify-content:center; color:var(--muted); font-size:12.5px; font-weight:600; border:1.5px dashed rgba(26,23,20,.15); background:transparent; box-shadow:none; }
    .fav .del{ position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:var(--muted); color:#fff; font-size:13px; line-height:22px; }
    .flash{ animation:flash .5s; }
    @keyframes flash{ 0%{ box-shadow:0 0 0 0 var(--mulled);} 100%{ box-shadow:0 0 0 10px transparent;} }

    .logo{
        width:44px; height:44px; border-radius:12px; overflow:hidden; flex:none;
        display:grid; place-items:center; background:#fff; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);
        font-size:24px;
    }
    .logo img{ width:100%; height:100%; object-fit:contain; }
    .logo.small{ width:36px; height:36px; border-radius:10px; font-size:20px; }
    .logo.mono{ color:#fff; font-weight:800; font-size:12px; letter-spacing:-.04em; line-height:1.05; text-align:center; }
    .logo.small.mono{ font-size:10.5px; }
    .logo.tile{ background:var(--fill); box-shadow:none; }

    /* 메뉴 아이콘: 재료 이모지 2×2 */
    .micon{
        width:44px; height:44px; border-radius:12px; background:var(--fill); flex:none;
        display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; padding:4px;
    }
    .micon span{ display:grid; place-items:center; font-size:15px; line-height:1; }
    .micon.big{ width:64px; height:64px; border-radius:16px; padding:6px; background:var(--card); box-shadow:inset 0 0 0 .5px var(--line); }
    .micon.big span{ font-size:22px; }
    .micon.small{ width:36px; height:36px; border-radius:10px; padding:3px; margin-left:-8px; }
    .row .s{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .price-col{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none; }
    .price-col .amt{ min-width:0; }
    .stepper.sm{ height:24px; border-radius:8px; }
    .stepper.sm button{ width:28px; height:24px; font-size:15px; }
    .row .x{ margin-right:-6px; }
    .micon.small span{ font-size:12px; }
    .row:has(.micon.small) + .row::before{ left:96px; }

    /* 메뉴 순서 바꾸기: 손잡이를 잡고 위아래로 끌기 */
    .handle{ width:22px; height:36px; display:grid; place-items:center; color:var(--muted); flex:none; touch-action:none; cursor:grab; margin-right:-4px; }
    .handle svg{ width:18px; height:18px; }
    .menu-row.dragging{ background:var(--card); box-shadow:0 8px 24px rgba(26,23,20,.18); position:relative; z-index:2; border-radius:12px; transition:none; }
    .menu-row.dragging::before{ display:none; }

    /* 메뉴 팝업 */
    .menu-head{ display:flex; align-items:center; gap:12px; margin:0 2px 14px; }
    .menu-head .body{ flex:1; }
    .menu-head b{ display:block; font-size:20px; font-weight:800; letter-spacing:-.02em; }
    .menu-head span{ font-size:13px; color:var(--muted); }
    .menu-head button{ font-size:15px; font-weight:600; color:var(--mulled); padding:6px 4px; }
    .menu-row{ cursor:pointer; }
    .menu-row:active{ background:var(--fill); }
    .menu-row.editing{ background:rgba(61,143,58,.08); }
    .menu-row .t{ white-space:normal; line-height:1.3; font-size:15px; }
    .add-dot{ width:30px; height:30px; border-radius:50%; background:var(--mulled); color:#fff; display:grid; place-items:center; font-size:17px; font-weight:600; flex:none; }
    .sheet .row + .row::before{ left:70px; }
    .menu-new{ display:flex; gap:12px; padding:12px; align-items:center; }
    .menu-new .body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
    .menu-new input{ width:100%; border:0; outline:0; background:var(--fill); border-radius:10px; height:40px; padding:0 12px; font-size:15px; min-width:0; }
    .menu-new .two{ display:grid; grid-template-columns:1fr 1.3fr; gap:6px; }

    /* 리스트 (iOS grouped) */
    .list{ background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 0 var(--line); }
    .row{ display:flex; align-items:center; gap:12px; padding:11px 14px; position:relative; min-height:56px; }
    .row + .row::before{ content:''; position:absolute; top:0; right:0; left:62px; height:.5px; background:var(--line); }
    .row.plain + .row.plain::before{ left:14px; }
    .row .body{ flex:1; min-width:0; }
    .row .t{ font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .s{ font-size:12px; color:var(--muted); margin-top:1px; }
    .row .amt{ font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; }
    .row .x{ width:26px; height:26px; border-radius:50%; color:var(--muted); font-size:18px; display:grid; place-items:center; flex:none; }
    .row .x:active{ background:var(--fill); }
    .empty{ text-align:center; color:var(--muted); font-size:14px; padding:26px 12px; }

    .stepper{ display:flex; align-items:center; background:var(--fill); border-radius:9px; height:28px; flex:none; }
    .stepper button{ width:30px; height:28px; font-size:17px; font-weight:500; display:grid; place-items:center; }
    .stepper button:active{ background:rgba(26,23,20,.08); border-radius:9px; }
    .stepper i{ width:.5px; height:14px; background:rgba(26,23,20,.15); }

    /* 입력 */
    .composer{ display:flex; gap:8px; align-items:center; background:var(--card); border-radius:14px; padding:6px 6px 6px 14px; box-shadow:0 1px 0 var(--line); margin-top:12px; }
    .composer input{ flex:1; border:0; outline:0; background:transparent; font-size:15.5px; height:38px; min-width:0; }
    .composer input[type=time]{ flex:none; width:auto; font-weight:600; color:var(--accent); }
    .composer input.num{ flex:none; width:90px; text-align:right; font-variant-numeric:tabular-nums; }
    .composer .go{ height:36px; padding:0 14px; border-radius:11px; background:var(--accent,var(--ink)); color:#fff; font-weight:700; font-size:14px; flex:none; }
    .composer .go:active{ opacity:.8; }

    /* 목표 체크 */
    .check{ width:24px; height:24px; border-radius:50%; border:2px solid rgba(26,23,20,.22); flex:none; display:grid; place-items:center; transition:all .2s; }
    .check.on{ background:var(--postbox); border-color:var(--postbox); }
    .check.on::after{ content:''; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
    .row.done .t{ color:var(--muted); text-decoration:line-through; font-weight:500; }
    .progress{ height:6px; border-radius:3px; background:var(--fill); overflow:hidden; margin-top:10px; }
    .progress i{ display:block; height:100%; background:var(--postbox); border-radius:3px; transition:width .35s; }

    /* 일정 */
    .time{ font-size:14px; font-weight:700; color:var(--sky); font-variant-numeric:tabular-nums; width:48px; flex:none; }
    .ev-bar{ width:4px; align-self:stretch; border-radius:2px; background:var(--sky); flex:none; }

    /* 기분 */
    .moods{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .mood{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 0 10px; border-radius:16px; transition:transform .15s, background .2s; }
    .mood:active{ transform:scale(.92); }
    .mood .face{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:26px; background:var(--fill); transition:all .2s; }
    .mood span{ font-size:11.5px; font-weight:600; color:var(--muted); }
    .mood.on .face{ background:var(--mc); transform:scale(1.08); box-shadow:0 6px 16px -4px var(--mc); }
    .mood.on span{ color:var(--ink); }
    .mood-strip{ display:flex; gap:3px; margin-top:14px; }
    .mood-strip i{ flex:1; height:22px; border-radius:4px; background:var(--fill); }

    textarea.note{
        width:100%; border:0; outline:0; resize:none; background:transparent;
        font-size:16px; line-height:1.65; min-height:120px;
    }
    .thought textarea.note{ min-height:260px; }
    .saved{ font-size:12px; color:var(--muted); text-align:right; margin-top:6px; height:14px; }

    /* ── 탭바 ───────────────────────────── */
    .tabbar{
        position:fixed; left:0; right:0; bottom:0; z-index:20;
        padding-bottom:env(safe-area-inset-bottom);
        background:rgba(245,238,223,.82);
        -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
        border-top:.5px solid rgba(26,23,20,.14);
    }
    .tabbar .in{ max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); height:var(--tabbar-h); }
    .tab{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:rgba(26,23,20,.4); font-size:10.5px; font-weight:600; transition:color .2s; }
    .tab svg{ width:25px; height:25px; transition:transform .2s; }
    .tab.on{ color:var(--c); }
    .tab:active svg{ transform:scale(.88); }

    /* ── 시트 ───────────────────────────── */
    .scrim{ position:fixed; inset:0; background:rgba(26,23,20,.35); z-index:30; opacity:0; pointer-events:none; transition:opacity .25s; }
    .scrim.show{ opacity:1; pointer-events:auto; }
    .sheet{
        position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:480px; margin:0 auto;
        background:var(--cream); border-radius:22px 22px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
        transform:translateY(105%); transition:transform .35s cubic-bezier(.3,.8,.2,1); max-height:88vh; overflow:auto;
    }
    .sheet.show{ transform:none; }
    .sheet .grab{ width:36px; height:5px; border-radius:3px; background:rgba(26,23,20,.2); margin:0 auto 12px; }
    .sheet h3{ font-size:20px; font-weight:800; text-align:center; margin-bottom:16px; }
    .field{ background:var(--card); border-radius:14px; overflow:hidden; }
    .field label{ display:flex; align-items:center; gap:12px; padding:0 14px; min-height:50px; font-size:15.5px; }
    .field label + label{ border-top:.5px solid var(--line); }
    .field label span{ width:64px; color:var(--muted); flex:none; }
    .field input{ flex:1; border:0; outline:0; background:transparent; height:48px; font-size:15.5px; min-width:0; }
    .sheet .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .btn{ height:50px; border-radius:14px; font-weight:700; font-size:16px; background:var(--fill); }
    .btn.primary{ background:var(--ink); color:var(--cream); }
    .btn.danger{ color:var(--postbox); }
    .logo-pick{ display:flex; align-items:center; gap:12px; padding:12px 14px; }
    .logo-pick .logo{ width:52px; height:52px; }
    .logo-pick .opts{ display:flex; gap:8px; flex-wrap:wrap; }
    .logo-pick .opts button{ font-size:13px; font-weight:600; color:var(--sky); }

    .toast{
        position:fixed; left:50%; bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px); transform:translate(-50%,20px);
        background:rgba(26,23,20,.88); color:var(--cream); padding:10px 16px; border-radius:20px; font-size:13.5px; font-weight:600;
        opacity:0; transition:all .25s; z-index:40; pointer-events:none; white-space:nowrap;
        -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    }
    .toast.show{ opacity:1; transform:translate(-50%,0); }
    .toast button{ color:var(--alderley); font-weight:700; margin-left:10px; pointer-events:auto; }

    .pane{ animation:fade .3s; }
    @keyframes fade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

    .settings-link{ display:block; text-align:center; font-size:12.5px; color:var(--muted); margin-top:28px; }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <div>
            <div class="eyebrow" id="yearLabel">2026</div>
            <h1 id="monthLabel">10월</h1>
        </div>
        <div class="nav">
            <button class="icon-btn sync" id="syncBtn" data-s="off" aria-label="계정 · 동기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.5a4.5 4.5 0 0 0 0 9z"/></svg></button>
            <button class="pill-btn" id="todayBtn">오늘</button>

/* ── 메뉴 아이콘: 메뉴 이름 속 재료 → 이모지 4개 (2×2) ──
   위에 있는 재료일수록 먼저 들어감. 신메뉴도 이름만 넣으면 자동으로 만들어짐 */
const INGREDIENTS = [
    [/연어/, '🐟'], [/참치/, '🍣'], [/새우/, '🍤'], [/오리/, '🦆'], [/닭|치킨/, '🍗'],
    [/돼지|목살|삼겹|안심/, '🐷'], [/햄|베이컨/, '🥓'], [/소고기|소부채|부채살|비프|불고기|우삼겹/, '🥩'],
    [/계란|에그/, '🥚'], [/두부/, '🫘'], [/치즈/, '🧀'],
    [/아보카도/, '🥑'], [/토마토/, '🍅'], [/김치|양념|매콤|고추/, '🌶️'], [/차지키|오이/, '🥒'],
    [/블랙페퍼|후추/, '🧂'], [/버섯/, '🍄'], [/브로콜리/, '🥦'], [/당근/, '🥕'], [/옥수수|콘/, '🌽'],
    [/양파/, '🧅'], [/마늘/, '🧄'], [/레몬/, '🍋'], [/올리브/, '🫒'], [/감자/, '🥔'], [/고구마/, '🍠'],
    [/신선|채소|야채|그린/, '🥬'], [/통밀|곡물/, '🌾'], [/파스타/, '🍝'], [/수프|스프/, '🥣'],
];
const MENU_BASE = [
    [/랩|부리또/,      ['🌯','🥬','🍅','🧀']],
    [/샌드위치|버거/,  ['🥪','🥬','🍅','🧀']],
    [/샐러드/,         ['🥗','🥬','🍅','🥒']],
    [/포케/,           ['🍚','🥑','🥬','🌽']],
    [/박스|도시락|덮밥/, ['🍚','🥦','🥚','🥬']],
];
function menuIcons(m){
    if(m.icons?.length) return m.icons;
    const name = m.name || '';
    const found = INGREDIENTS.filter(([re]) => re.test(name)).map(([,e]) => e).slice(0,3);
    const base = (MENU_BASE.find(([re]) => re.test(name)) || [, ['🍽️','🥬','🍅','🍚']])[1];
    return [...new Set([...found, ...base])].slice(0,4);
}
function splitEmoji(s){
    const seg = window.Intl?.Segmenter ? [...new Intl.Segmenter().segment(s)].map(x => x.segment) : [...s];
    return seg.filter(x => x.trim()).slice(0,4);
}

const KEY = 'daylog.v1';

// 화면에서 무언가 바뀔 때마다 호출: 바뀐 날짜를 찾아 서버로 보낼 목록에 올리고, 이 기기에도 저장
function save(){

/* ════════════════════════════════════════════
   서버 동기화 (Supabase · 표: daylog)
   한 줄 = 하루치. 'settings' 줄 = 즐겨찾기·로고
   같은 날짜를 두 기기에서 고치면 나중에 고친 쪽이 남음
   ════════════════════════════════════════════ */
// Supabase 대시보드 > Connect 에서 복사. Publishable key 만 (Secret key 절대 금지)
const SUPABASE_URL = "https://tbvbumvwsjqjskwwycxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-KX_irHHRE1LQcu1I2uAoA_SIbLNg8y";
const db = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let user = null, pushT = null, pushing = false, channel = null;
let syncState = 'off';   // off · syncing · ok · error

store.meta ||= {};       // key → { at: 마지막 수정 시각(ms), dirty: 아직 서버에 안 올라감, h: 내용 지문 }

function docsNow(){
    const m = {};
    for(const k in store.days) m[k] = store.days[k];
    if(store.favs || Object.keys(store.customLogos||{}).length || store.meta.settings)
        m.settings = { favs: store.favs, customLogos: store.customLogos || {} };
    return m;
}
function hash(s){ let h = 5381; for(let i=0;i<s.length;i++) h = (h*33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + s.length; }

function markDirty(){
    const now = Date.now(), docs = docsNow();
    for(const k in docs){
        const h = hash(JSON.stringify(docs[k]));
        const m = store.meta[k];
        if(!m || m.h !== h) store.meta[k] = { at: now, dirty: true, h };
    }
}

function schedulePush(){
    if(!user) return;
    clearTimeout(pushT);
    pushT = setTimeout(push, 700);
}

async function push(){
    if(!user || pushing) return;
    const docs = docsNow();
    const keys = Object.keys(store.meta).filter(k => store.meta[k].dirty && docs[k]);
    if(!keys.length){ setSync('ok'); return; }
    pushing = true; setSync('syncing');
    const sent = keys.map(k => ({ k, at: store.meta[k].at }));
    const { error } = await db.from('daylog').upsert(
        keys.map(k => ({ user_id: user.id, key: k, data: docs[k], updated_at: new Date(store.meta[k].at).toISOString() })),
        { onConflict: 'user_id,key' }
    );
    pushing = false;
    if(error){ console.error(error); setSync('error'); return; }
    // 보내는 사이 또 고친 날짜는 dirty 로 남겨 다음 번에 다시 보냄
    sent.forEach(({k, at}) => { if(store.meta[k]?.at === at) store.meta[k].dirty = false; });
    persist();
    if(keys.some(k => store.meta[k].dirty)) schedulePush(); else setSync('ok');
}

// 서버 줄 하나를 이 기기에 반영 (이 기기 쪽이 더 새것이면 무시)
function applyRow(row){
    const at = Date.parse(row.updated_at);
    const m = store.meta[row.key];
    if(m && (m.dirty || m.at >= at)) return false;
    if(row.key === 'settings'){
        store.favs = row.data.favs || null;
        store.customLogos = row.data.customLogos || {};
    }else{
        store.days[row.key] = row.data;
    }
    store.meta[row.key] = { at, dirty:false, h: hash(JSON.stringify(row.key === 'settings' ? { favs: store.favs, customLogos: store.customLogos } : row.data)) };
    return true;
}

async function pull(){
    if(!user) return;
    setSync('syncing');
    const { data, error } = await db.from('daylog').select('key,data,updated_at');
    if(error){ console.error(error); setSync('error'); return; }
    let changed = false;
    data.forEach(r => { if(applyRow(r)) changed = true; });
    persist();
    if(changed) refresh();
    push();
}

// 입력 중인 칸이 있으면 캘린더만 새로 그려서 타이핑이 끊기지 않게
function refresh(){
    if(document.activeElement?.matches('#pane input, #pane textarea')) renderCalendar();
    else render();
}

function listen(){
    channel?.unsubscribe();
    channel = db.channel('daylog-' + user.id)
        .on('postgres_changes', { event:'*', schema:'public', table:'daylog', filter:`user_id=eq.${user.id}` }, p => {
            if(p.new?.key && applyRow(p.new)){ persist(); refresh(); }
        })
        .subscribe();
}

async function onUser(u){
    if(u?.id === user?.id) return;
    user = u;
    if(!user){ channel?.unsubscribe(); channel = null; setSync('off'); return; }
    // 다른 사람이 쓰던 기기면 그 기록이 내 계정에 섞이지 않게 비우고 시작
    if(store.owner && store.owner !== user.id) store = { days:{}, favs:null, customLogos:{}, meta:{} };
    store.owner = user.id;
    persist();
    listen();
    await pull();
}

function setSync(s){
    syncState = s;
    const b = $('syncBtn'); if(!b) return;
    b.dataset.s = s;
    b.title = { off:'로그인하면 서버에 저장돼요', syncing:'저장 중…', ok:'서버에 저장됨', error:'서버 연결 안 됨 · 나중에 다시 올려요' }[s];
}

const pad = n => String(n).padStart(2,'0');

function dayTotal(d){ return (d?.spend||[]).reduce((s,e)=>s+e.price,0); }

function renderCalendar(){
    $('yearLabel').textContent = view.getFullYear() + '년';
    $('monthLabel').textContent = (view.getMonth()+1) + '월';

    const first = new Date(view);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(view.getFullYear(), view.getMonth()+1, 0).getDate()) / 7);
    let html = '';
    for(let i=0; i<weeks*7; i++){
        const d = new Date(start); d.setDate(start.getDate()+i);
        const k = keyOf(d);
        const data = store.days[k];
        const cls = ['day'];
        if(d.getMonth() !== view.getMonth()) cls.push('out');
        if(d.getDay() === 0) cls.push('sun');
        if(+d === +today) cls.push('today');
        if(+d === +sel) cls.push('sel');

        let meta = '';
        if(tab === 'money'){
            const t = dayTotal(data);
            if(t) meta = `<div class="meta">${short(t)}</div>`;
        }else if(tab === 'mood' && data?.mood?.v){
            meta = `<div class="meta emoji">${MOODS[data.mood.v-1].emoji}</div>`;
        }
        if(!meta) meta = `<div class="dots">${dotsFor(data)}</div>`;

        html += `<button class="${cls.join(' ')}" data-k="${k}"><span class="num">${d.getDate()}</span>${meta}</button>`;
    }
    $('grid').innerHTML = html;
}

function dotsFor(d){
    if(!d) return '';
    const has = {
        money: d.spend?.length, goal: d.goals?.length, event: d.events?.length,
        mood: d.mood?.v, learn: d.learned?.length, thought: d.thought?.trim(),
    };
    return TABS.filter(t => has[t.id]).slice(0,4).map(t => `<i style="background:${t.color}"></i>`).join('');
}

    if(custom) return `<div class="logo${sz}"><img src="${custom}" alt=""></div>`;
    if(f.emoji) return `<div class="logo tile${sz}">${f.emoji}</div>`;
    // 예전에 저장된 즐겨찾기도 새 기본 로고를 쓰도록 id로 다시 찾음
    const lk = f.logo || DEFAULT_FAVS.find(d => d.id === f.id)?.logo;
    if(lk && LOGO[lk]) return `<div class="logo${sz}"><img src="${LOGO[lk]}" alt="${esc(f.name)}"></div>`;
    if(f.mono) return `<div class="logo mono${sz}" style="background:${f.mono[1]}">${f.mono[0]}</div>`;
    if(f.emoji) return `<div class="logo tile${sz}">${f.emoji}</div>`;
    const c = CATS.find(c => c.id === f.cat) || CATS[3];
    return `<div class="logo mono${sz}" style="background:${c.hex}">${esc((f.name||'?').slice(0,2))}</div>`;
}

function renderMoney(){
    const k = keyOf(sel);
    const d = day(k);
    const spend = d?.spend || [];
    const total = dayTotal(d);

    // 이번 달 합계
    const ym = k.slice(0,7);
    let month = 0;
    for(const key in store.days) if(key.startsWith(ym)) month += dayTotal(store.days[key]);

    const byCat = CATS.map(c => ({...c, sum: spend.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.price,0)}));
    const bar = total ? byCat.filter(c=>c.sum).map(c => `<i style="width:${c.sum/total*100}%;background:${c.color}"></i>`).join('') : '';
    const legend = byCat.filter(c=>c.sum).map(c => `<span style="--c:${c.color}">${c.label} ${won(c.sum)}</span>`).join('');

    const catIdx = CATS.findIndex(c => c.id === moneyCat);
    const list = favs().filter(f => f.cat === moneyCat);

    // 식사는 식당만 보이고, 누르면 메뉴 팝업. 간식·식료품은 누르면 바로 기록
    const isMeal = moneyCat === 'meal';
    const favHTML = list.map(f => `
        <div class="fav" data-fav="${f.id}" role="button">
            ${editFavs ? `<button class="del" data-delfav="${f.id}">×</button>` : ''}
            ${logoHTML(f)}
            <div class="nm">${esc(f.name)}${f.item ? `<small>${esc(f.item)}</small>` : ''}</div>
            ${f.menus
                ? `<div class="pr">메뉴 ${f.menus.length}개</div>`
                : editFavs
                ? `<div class="stepper"><button data-fstep="${f.id}" data-d="-100">−</button><i></i><button data-fstep="${f.id}" data-d="100">+</button></div><div class="pr">${won(f.price)}</div>`
                : `<div class="pr">${won(f.price)}원</div>`}
        </div>`).join('') +
        `<button class="fav add" id="addFav">＋<br>${isMeal ? '식당 추가' : '즐겨찾기 추가'}</button>`;

    const rows = spend.length ? spend.map(e => {
        const f = favs().find(x => x.id === e.favId) || { name:e.name, cat:e.cat };
        const c = CATS.find(c => c.id === e.cat);
        // 즐겨찾기 항목은 '식당 / 메뉴 · 분류' 두 줄로
        const title = e.favId && f.name ? f.name : e.name;
        const menu = e.menu || (e.favId && f.item);
        const sub = (menu ? esc(menu) + ' · ' : '') + c.label;
        // 식당 메뉴면 로고 옆에 메뉴 아이콘(2×2)도
        const mi = e.menu ? (f.menus?.find(m => m.id === e.menuId) || { name:e.menu }) : null;
        return `<div class="row">
            ${logoHTML({...f, cat:e.cat}, true)}${mi ? menuIconHTML(mi, false, true) : ''}
            <div class="body"><div class="t">${esc(title)}</div><div class="s" style="color:${c.color}">${sub}</div></div>
            <div class="price-col">
                <div class="amt">${won(e.price)}</div>
                <div class="stepper sm"><button data-step="${e.id}" data-d="-100">−</button><i></i><button data-step="${e.id}" data-d="100">+</button></div>
            </div>
            <button class="x" data-del="${e.id}" aria-label="삭제">×</button>
        </div>`;
    }).join('') : `<div class="empty">아래 즐겨찾기를 누르면 바로 기록돼요</div>`;

    $('pane').innerHTML = `<div class="pane" style="--accent:var(--mulled)">
        <div class="card total">
            <div>
                <div class="k">오늘 쓴 돈</div>
                <div class="v">${won(total)}<small>원</small></div>
            </div>
            <div class="month">${sel.getMonth()+1}월 누적<b>${won(month)}원</b></div>
        </div>
        ${total ? `<div style="padding:0 4px"><div class="bar" style="background:var(--fill)">${bar}</div><div class="legend" style="color:var(--ink)">${legend}</div></div>` : ''}

        <div class="section-label">내역 <span>${spend.length ? spend.length + '건' : ''}</span></div>
        <div class="list">${rows}</div>

        <div class="seg" id="seg">
            <div class="thumb" style="left:calc(${catIdx} * (100% - 4px) / 4 + 2px);width:calc((100% - 4px) / 4)"></div>
            ${CATS.map(c => `<button data-cat="${c.id}" class="${c.id===moneyCat?'on':''}">${c.label}</button>`).join('')}
        </div>

        <div class="section-label">즐겨찾기 <button id="editFavs">${editFavs ? '완료' : isMeal ? '식당 편집' : '가격 편집'}</button></div>
        <div class="favs">${favHTML}</div>

        <div class="composer" style="--accent:${CATS[catIdx].color}">
            <input id="mName" placeholder="${CATS[catIdx].label} 직접 입력" enterkeyhint="next">
            <input id="mPrice" class="num" inputmode="numeric" placeholder="금액">
            <button class="go" id="mAdd">추가</button>
        </div>
    </div>`;

    const p = $('pane');
    p.querySelector('#seg').onclick = e => { const b = e.target.closest('[data-cat]'); if(b){ moneyCat = b.dataset.cat; renderMoney(); } };
    p.querySelector('#editFavs').onclick = () => { editFavs = !editFavs; renderMoney(); };
    p.querySelector('#addFav').onclick = () => openFavSheet();

    p.querySelector('.favs').addEventListener('click', e => {
        const del = e.target.closest('[data-delfav]');
        if(del){ e.stopPropagation(); return deleteFav(del.dataset.delfav); }
        const st = e.target.closest('[data-fstep]');
        if(st){ e.stopPropagation(); const f = favs().find(x=>x.id===st.dataset.fstep); f.price = Math.max(0, f.price + +st.dataset.d); save(); renderMoney(); return; }
        const card = e.target.closest('[data-fav]'); if(!card) return;
        const f = favs().find(x => x.id === card.dataset.fav);
        if(editFavs) return openFavSheet(f);
        if(f.menus) return openMenuSheet(f);
        addSpend({ favId:f.id, cat:f.cat, name: f.item ? `${f.name} ${f.item}` : f.name, price:f.price });
        toast(`${f.name} ${won(f.price)}원 기록`, true);
    });

    p.querySelector('.list').addEventListener('click', e => {
        const st = e.target.closest('[data-step]');
        if(st){ const it = spend.find(x=>x.id===st.dataset.step); it.price = Math.max(0, it.price + +st.dataset.d); save(); renderMoney(); renderCalendar(); return; }
        const del = e.target.closest('[data-del]');
        if(del){ removeItem('spend', del.dataset.del); }
    });

    const priceIn = p.querySelector('#mPrice');
    priceIn.addEventListener('input', () => { const n = priceIn.value.replace(/\D/g,''); priceIn.value = n ? won(+n) : ''; });
    const addManual = () => {
        const name = p.querySelector('#mName').value.trim();
        const price = +priceIn.value.replace(/\D/g,'');
        if(!price) return priceIn.focus();
        addSpend({ cat:moneyCat, name: name || CATS[catIdx].label, price });
    };
    p.querySelector('#mAdd').onclick = addManual;
    priceIn.addEventListener('keydown', e => { if(e.key==='Enter') addManual(); });
    p.querySelector('#mName').addEventListener('keydown', e => { if(e.key==='Enter') priceIn.focus(); });
}

function addSpend(item){
    const d = day(keyOf(sel), true);
    (d.spend ||= []).push({ id:uid(), ...item });
    save(); renderMoney(); renderCalendar();
}

let lastRemoved = null;
function removeItem(field, id){
    const d = day(keyOf(sel)); if(!d?.[field]) return;
    const i = d[field].findIndex(x => x.id === id); if(i<0) return;
    lastRemoved = { key:keyOf(sel), field, i, item:d[field][i] };
    d[field].splice(i,1);
    save(); render();
    toast('삭제했어요', false, true);
}
function undo(){
    if(!lastRemoved) return;
    const d = day(lastRemoved.key, true);
    (d[lastRemoved.field] ||= []).splice(lastRemoved.i, 0, lastRemoved.item);
    lastRemoved = null; save(); render(); hideToast();
}

function deleteFav(id){
    const f = favs().find(x=>x.id===id);
    if(!confirm(`'${f.name}${f.item?' '+f.item:''}' 즐겨찾기를 지울까요?`)) return;
    store.favs = favs().filter(x => x.id !== id);
    save(); renderMoney();
}

/* 즐겨찾기 추가/수정 시트 */
let pendingLogo; // undefined=변경없음, null=지우기, string=새 이미지
function openFavSheet(f){
    const isNew = !f;
    f = f || (moneyCat === 'meal'
        ? { id:'fav-'+uid(), cat:'meal', name:'', menus:[] }
        : { id:'fav-'+uid(), cat:moneyCat, name:'', item:'', price:0 });
    const isShop = !!f.menus;   // 식당: 이름·로고만 (메뉴와 가격은 메뉴 팝업에서)
    pendingLogo = undefined;
    const sheet = $('sheet');
    sheet.innerHTML = `<div class="grab"></div>
        <h3>${isShop ? (isNew ? '식당 추가' : '식당 수정') : (isNew ? '즐겨찾기 추가' : '즐겨찾기 수정')}</h3>
        <div class="field">
            <div class="logo-pick">
                <div id="logoPreview">${logoHTML(f)}</div>
                <div>
                    <div style="font-size:13px;color:var(--muted);margin-bottom:4px">로고 · 이모지</div>
                    <div class="opts">
                        <button id="pickImg">사진 선택</button>
                        ${store.customLogos?.[f.id] ? '<button id="clearImg">기본으로</button>' : ''}
                    </div>
                </div>
            </div>
        </div>
        <div class="field" style="margin-top:12px">
            <label><span>이름</span><input id="fName" value="${esc(f.name)}" placeholder="${isShop ? '예: 샐러디' : '예: 스타벅스'}"></label>
            <div ${isShop ? 'hidden' : ''}>
            <label><span>메뉴</span><input id="fItem" value="${esc(f.item||'')}" placeholder="선택 · 예: 샌드위치"></label>
            <label><span>이모지</span><input id="fEmoji" value="${esc(f.emoji||'')}" placeholder="선택 · 예: 🍙" maxlength="4"></label>
            <label><span>가격</span><input id="fPrice" inputmode="numeric" value="${f.price?won(f.price):''}" placeholder="0"></label>
            </div>
        </div>
        <div class="actions">
            <button class="btn" id="fCancel">취소</button>
            <button class="btn primary" id="fSave">저장</button>
        </div>`;
    openSheet();

    const fp = $('fPrice');
    fp.addEventListener('input', () => { const n = fp.value.replace(/\D/g,''); fp.value = n ? won(+n) : ''; });
    $('pickImg').onclick = () => $('filePick').click();
    const clr = $('clearImg'); if(clr) clr.onclick = () => { pendingLogo = null; $('logoPreview').innerHTML = logoHTML({...f, id:'_'}); };
    $('filePick').onchange = async e => {
        const file = e.target.files[0]; e.target.value = ''; if(!file) return;
        pendingLogo = await resizeImage(file, 128);
        $('logoPreview').innerHTML = `<div class="logo"><img src="${pendingLogo}"></div>`;
    };
    $('fCancel').onclick = closeSheet;
    $('fSave').onclick = () => {
        const name = $('fName').value.trim();
        if(!name) return $('fName').focus();
        const next = isShop ? { ...f, name }
            : { ...f, name, item:$('fItem').value.trim(), emoji:$('fEmoji').value.trim(), price:+fp.value.replace(/\D/g,'') || 0 };
        if(!next.item) delete next.item;
        if(!next.emoji) delete next.emoji;
        if(next.emoji){ delete next.logo; delete next.mono; }
        store.customLogos ||= {};
        if(pendingLogo === null) delete store.customLogos[f.id];
        else if(pendingLogo) store.customLogos[f.id] = pendingLogo;
        const list = favs();
        const i = list.findIndex(x => x.id === f.id);
        if(i >= 0) list[i] = next; else list.push(next);
        save(); renderMoney();
        // 새 식당이면 바로 메뉴를 넣을 수 있게 메뉴 팝업으로
        if(isShop && isNew) openMenuSheet(next, true); else closeSheet();
    };
}

/* 메뉴 팝업: 식당을 누르면 열림. 메뉴를 누르면 기록, 편집에서 가격 ±100 · 삭제 · 메뉴 추가 */
function menuIconHTML(m, big, small){
    return `<div class="micon${big?' big':''}${small?' small':''}">${menuIcons(m).map(e => `<span>${e}</span>`).join('')}</div>`;
}
function openMenuSheet(shop, editing){
    let editId = null;   // 고치는 중인 메뉴 (없으면 새 메뉴 추가)
    const draw = () => {
        const em = shop.menus.find(m => m.id === editId);
        $('sheet').innerHTML = `<div class="grab"></div>
            <div class="menu-head">
                ${logoHTML(shop)}
                <div class="body"><b>${esc(shop.name)}</b><span>메뉴 ${shop.menus.length}개</span></div>
                <button id="mnEdit">${editing ? '완료' : '편집'}</button>
            </div>
            <div class="list">${shop.menus.length ? shop.menus.map(m => `
                <div class="row menu-row ${m.id===editId?'editing':''}" data-menu="${m.id}" role="button">
                    ${editing ? `<span class="handle" aria-label="순서 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></span>` : ''}
                    ${menuIconHTML(m)}
                    <div class="body"><div class="t">${esc(m.name)}</div><div class="s">${won(m.price)}원</div></div>
                    ${editing
                        ? `<div class="stepper"><button data-mstep="${m.id}" data-d="-100">−</button><i></i><button data-mstep="${m.id}" data-d="100">+</button></div>
                           <button class="x" data-mdel="${m.id}" aria-label="삭제">×</button>`
                        : `<span class="add-dot">＋</span>`}
                </div>`).join('') : '<div class="empty">아래에서 메뉴를 추가하세요</div>'}</div>

            <div class="section-label">${em ? '메뉴 수정' : '메뉴 추가'}</div>
            <div class="field">
                <div class="menu-new">
                    <div id="mnPreview">${menuIconHTML(em || { name:'' }, true)}</div>
                    <div class="body">
                        <input id="mnName" placeholder="메뉴 이름 · 예: 연어 샐러드" value="${esc(em?.name || '')}">
                        <div class="two">
                            <input id="mnPrice" inputmode="numeric" placeholder="가격" value="${em ? won(em.price) : ''}">
                            <input id="mnIcons" placeholder="이모지 (비우면 자동)" value="${em ? menuIcons(em).join('') : ''}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button class="btn" id="mnCancel">${em ? '취소' : '닫기'}</button>
                <button class="btn primary" id="mnSave">${em ? '저장' : '추가'}</button>
            </div>`;

        const nameIn = $('mnName'), priceIn = $('mnPrice'), iconIn = $('mnIcons');
        const preview = () => {
            const icons = splitEmoji(iconIn.value);
            $('mnPreview').innerHTML = menuIconHTML({ name:nameIn.value, icons: icons.length ? icons : null }, true);
        };
        nameIn.oninput = preview; iconIn.oninput = preview;
        priceIn.oninput = () => { const n = priceIn.value.replace(/\D/g,''); priceIn.value = n ? won(+n) : ''; };

        $('mnEdit').onclick = () => { editing = !editing; editId = null; draw(); };
        $('mnCancel').onclick = () => { if(em){ editId = null; draw(); } else closeSheet(); };
        $('mnSave').onclick = () => {
            const name = nameIn.value.trim(); if(!name) return nameIn.focus();
            const price = +priceIn.value.replace(/\D/g,''); if(!price) return priceIn.focus();
            const icons = splitEmoji(iconIn.value);
            const m = em || { id:'m-'+uid() };
            Object.assign(m, { name, price });
            // 자동으로 만든 것과 같으면 저장하지 않음 → 이름을 바꾸면 아이콘도 따라 바뀜
            const auto = menuIcons({ name });
            if(icons.length && icons.join('') !== auto.join('')) m.icons = icons; else delete m.icons;
            if(!em) shop.menus.push(m);
            editId = null;
            save(); renderMoney(); draw();
            toast(em ? '메뉴를 고쳤어요' : `${name} 추가했어요`);
        };

        // 끌어서 순서 바꾸기: 손잡이를 누른 채 위아래로 움직이면 지나가는 줄과 자리를 바꿈
        $('sheet').querySelectorAll('.handle').forEach(h => h.addEventListener('pointerdown', e => {
            e.preventDefault();
            const row = h.closest('.menu-row'), list = row.parentElement;
            h.setPointerCapture(e.pointerId);
            row.classList.add('dragging');
            const move = ev => {
                const rows = [...list.querySelectorAll('.menu-row')].filter(r => r !== row);
                const after = rows.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height/2; });
                list.insertBefore(row, after || null);
            };
            const up = () => {
                h.removeEventListener('pointermove', move);
                row.classList.remove('dragging');
                const order = [...list.querySelectorAll('.menu-row')].map(r => r.dataset.menu);
                shop.menus.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
                save(); renderMoney(); draw();
            };
            h.addEventListener('pointermove', move);
            h.addEventListener('pointerup', up, { once:true });
            h.addEventListener('pointercancel', up, { once:true });
        }));

        $('sheet').querySelector('.list').onclick = e => {
            if(e.target.closest('.handle')) return;
            const st = e.target.closest('[data-mstep]');
            if(st){ const m = shop.menus.find(x => x.id === st.dataset.mstep); m.price = Math.max(0, m.price + +st.dataset.d); save(); draw(); return; }
            const del = e.target.closest('[data-mdel]');
            if(del){
                const m = shop.menus.find(x => x.id === del.dataset.mdel);
                if(!confirm(`'${m.name}' 메뉴를 지울까요?`)) return;
                shop.menus = shop.menus.filter(x => x !== m);
                save(); renderMoney(); draw(); return;
            }
            const row = e.target.closest('[data-menu]'); if(!row) return;
            const m = shop.menus.find(x => x.id === row.dataset.menu);
            if(editing){ editId = m.id; draw(); $('mnName').focus(); return; }
            addSpend({ favId:shop.id, menuId:m.id, cat:shop.cat, name:`${shop.name} ${m.name}`, menu:m.name, price:m.price });
            closeSheet();
            toast(`${m.name} ${won(m.price)}원 기록`, true);
        };
    };
    draw();
    openSheet();
}

function resizeImage(file, size){
    return new Promise(res => {
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas'); c.width = c.height = size;
            const g = c.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0,0,size,size);
            const s = Math.min(size/img.width, size/img.height);
            const w = img.width*s, h = img.height*s;
            g.drawImage(img, (size-w)/2, (size-h)/2, w, h);
            res(c.toDataURL('image/jpeg', .85));
            URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
    });
}

function renderGoals(){
    const d = day(keyOf(sel));
    const goals = d?.goals || [];
    const done = goals.filter(g=>g.done).length;

    // 직전 기록 날짜의 미완료 목표 가져오기
    const prevKey = Object.keys(store.days).filter(k => k < keyOf(sel) && store.days[k].goals?.some(g=>!g.done)).sort().pop();

    $('pane').innerHTML = `<div class="pane" style="--accent:var(--postbox)">
        ${goals.length ? `<div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
                <b style="font-size:15px">오늘의 목표</b>
                <span style="font-size:22px;font-weight:800;color:var(--postbox)">${done}<span style="font-size:14px;color:var(--muted);font-weight:600"> / ${goals.length}</span></span>
            </div>
            <div class="progress"><i style="width:${goals.length?done/goals.length*100:0}%"></i></div>
        </div>` : ''}
        <div class="section-label">목표</div>
        <div class="list">${goals.length ? goals.map(g => `
            <div class="row plain ${g.done?'done':''}">
                <button class="check ${g.done?'on':''}" data-toggle="${g.id}" aria-label="완료"></button>
                <div class="body"><div class="t">${esc(g.text)}</div></div>
                <button class="x" data-del="${g.id}">×</button>
            </div>`).join('') : '<div class="empty">오늘 이루고 싶은 걸 적어보세요</div>'}</div>
        <div class="composer">
            <input id="gIn" placeholder="새 목표" enterkeyhint="done">
            <button class="go" id="gAdd">추가</button>
        </div>
        ${prevKey && !goals.length ? `<button class="pill-btn" id="carry" style="margin-top:12px;width:100%;height:44px;color:var(--postbox)">이전 미완료 목표 가져오기</button>` : ''}
    </div>`;

    const add = () => {
        const v = $('gIn').value.trim(); if(!v) return;
        const dd = day(keyOf(sel), true);
        (dd.goals ||= []).push({ id:uid(), text:v, done:false });
        save(); render(); $('gIn').focus();
    };
    $('gAdd').onclick = add;
    $('gIn').addEventListener('keydown', e => { if(e.key==='Enter') add(); });
    $('pane').querySelector('.list').addEventListener('click', e => {
        const t = e.target.closest('[data-toggle]');
        if(t){ const g = goals.find(x=>x.id===t.dataset.toggle); g.done = !g.done; save(); render(); return; }
        const del = e.target.closest('[data-del]'); if(del) removeItem('goals', del.dataset.del);
    });
    const carry = $('carry');
    if(carry) carry.onclick = () => {
        const dd = day(keyOf(sel), true);
        dd.goals = store.days[prevKey].goals.filter(g=>!g.done).map(g => ({ id:uid(), text:g.text, done:false }));
        save(); render();
    };
}

/* ════════════════════════════════════════════

function renderEvents(){
    const d = day(keyOf(sel));
    const evs = (d?.events || []).slice().sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));
    $('pane').innerHTML = `<div class="pane" style="--accent:var(--sky)">
        <div class="list">${evs.length ? evs.map(ev => `
            <div class="row plain">
                <div class="time">${ev.time || '종일'}</div>
                <div class="ev-bar"></div>
                <div class="body"><div class="t">${esc(ev.text)}</div></div>
                <button class="x" data-del="${ev.id}">×</button>
            </div>`).join('') : '<div class="empty">일정이 없어요</div>'}</div>
        <div class="composer">
            <input id="eTime" type="time">
            <input id="eIn" placeholder="일정 내용" enterkeyhint="done">
            <button class="go" id="eAdd">추가</button>
        </div>
    </div>`;
    const add = () => {
        const v = $('eIn').value.trim(); if(!v) return $('eIn').focus();
        const dd = day(keyOf(sel), true);
        (dd.events ||= []).push({ id:uid(), time:$('eTime').value, text:v });
        save(); render();
    };
    $('eAdd').onclick = add;
    $('eIn').addEventListener('keydown', e => { if(e.key==='Enter') add(); });
    $('pane').querySelector('.list').addEventListener('click', e => {
        const del = e.target.closest('[data-del]'); if(del) removeItem('events', del.dataset.del);
    });
}

/* ════════════════════════════════════════════
   기분
   ════════════════════════════════════════════ */
function renderMood(){
    const k = keyOf(sel);
    const m = day(k)?.mood || {};
    const ym = k.slice(0,7);
    const last = new Date(sel.getFullYear(), sel.getMonth()+1, 0).getDate();
    let strip = '';
    for(let i=1;i<=last;i++){
        const v = store.days[`${ym}-${pad(i)}`]?.mood?.v;
        strip += `<i style="${v?`background:${MOODS[v-1].color}`:''}${i===sel.getDate()?';outline:2px solid var(--ink);outline-offset:1px':''}"></i>`;
    }
    $('pane').innerHTML = `<div class="pane" style="--accent:var(--sherbet)">
        <div class="card">
            <div class="moods">${MOODS.map(o => `
                <button class="mood ${m.v===o.v?'on':''}" data-v="${o.v}" style="--mc:${o.color}">
                    <div class="face">${o.emoji}</div><span>${o.label}</span>
                </button>`).join('')}</div>
            <div class="mood-strip" title="${sel.getMonth()+1}월 기분 흐름">${strip}</div>
        </div>
        <div class="section-label">한 줄 메모</div>
        <div class="card"><textarea class="note" id="moodNote" rows="3" placeholder="왜 그런 기분이었나요?">${esc(m.note||'')}</textarea></div>
        <div class="saved" id="saved"></div>
    </div>`;
    $('pane').querySelector('.moods').onclick = e => {
        const b = e.target.closest('[data-v]'); if(!b) return;
        const dd = day(k, true); dd.mood ||= {};
        dd.mood.v = dd.mood.v === +b.dataset.v ? 0 : +b.dataset.v;
        save(); render();
    };
    autosave($('moodNote'), v => { const dd = day(k, true); (dd.mood ||= {}).note = v; });
}

/* ════════════════════════════════════════════
   배운 것
   ════════════════════════════════════════════ */
function renderLearn(){
    const d = day(keyOf(sel));
    const items = d?.learned || [];
    $('pane').innerHTML = `<div class="pane" style="--accent:var(--saffron)">
        <div class="list">${items.length ? items.map((it,i) => `
            <div class="row plain" style="align-items:flex-start">
                <div style="font-size:13px;font-weight:800;color:var(--saffron);width:18px;padding-top:2px">${i+1}</div>
                <div class="body"><div class="t" style="white-space:normal;font-weight:500;line-height:1.5">${esc(it.text)}</div></div>
                <button class="x" data-del="${it.id}">×</button>
            </div>`).join('') : '<div class="empty">오늘 새로 알게 된 것은?</div>'}</div>
        <div class="composer">
            <input id="lIn" placeholder="배운 것 한 줄" enterkeyhint="done">
            <button class="go" id="lAdd">추가</button>
        </div>
    </div>`;
    const add = () => {
        const v = $('lIn').value.trim(); if(!v) return;
        const dd = day(keyOf(sel), true);
        (dd.learned ||= []).push({ id:uid(), text:v });
        save(); render(); $('lIn').focus();
    };
    $('lAdd').onclick = add;
    $('lIn').addEventListener('keydown', e => { if(e.key==='Enter') add(); });
    $('pane').querySelector('.list').addEventListener('click', e => {
        const del = e.target.closest('[data-del]'); if(del) removeItem('learned', del.dataset.del);
    });
}

/* ════════════════════════════════════════════
   생각
   ════════════════════════════════════════════ */
function renderThought(){
    const k = keyOf(sel);
    $('pane').innerHTML = `<div class="pane thought" style="--accent:var(--crepe)">
        <div class="card"><textarea class="note" id="tIn" placeholder="떠오르는 생각을 자유롭게…">${esc(day(k)?.thought||'')}</textarea></div>
        <div class="saved" id="saved"></div>
    </div>`;
    const ta = $('tIn');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(260, ta.scrollHeight) + 'px'; };
    ta.addEventListener('input', grow); grow();
    autosave(ta, v => { day(k, true).thought = v; });
}

function autosave(el, apply){
    let t;
    el.addEventListener('input', () => {
        clearTimeout(t);
        $('saved').textContent = '';
        t = setTimeout(() => { apply(el.value); save(); renderCalendar(); $('saved').textContent = '저장됨'; }, 400);
    });
}

/* ════════════════════════════════════════════
   시트 · 토스트 · 백업
   ════════════════════════════════════════════ */
function openSheet(){ $('scrim').classList.add('show'); $('sheet').classList.add('show'); }
function closeSheet(){ $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
$('scrim').onclick = closeSheet;

let toastT;
function toast(msg, withUndoLast, isUndo){
    const t = $('toast');
    t.innerHTML = esc(msg) + (isUndo || withUndoLast ? '<button id="undoBtn">되돌리기</button>' : '');
    t.classList.add('show');
    const b = $('undoBtn');
    if(b) b.onclick = () => {
        if(isUndo) return undo();
        const d = day(keyOf(sel)); d?.spend?.pop(); save(); render(); hideToast();
    };
    clearTimeout(toastT); toastT = setTimeout(hideToast, 2600);
}
function hideToast(){ $('toast').classList.remove('show'); }

$('backupLink').onclick = e => {
    e.preventDefault();
    $('sheet').innerHTML = `<div class="grab"></div><h3>백업 · 복원</h3>
        <p style="font-size:14px;color:var(--muted);line-height:1.6;text-align:center;margin-bottom:16px">기록은 이 기기의 브라우저에만 저장돼요.<br>폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업하세요.</p>
        <div class="actions">
            <button class="btn" id="bExport">백업 파일 저장</button>
            <button class="btn" id="bImport">백업 불러오기</button>
        </div>
        <button class="btn danger" id="bReset" style="width:100%;margin-top:10px">즐겨찾기 기본값으로</button>`;
    openSheet();
    $('bExport').onclick = () => {
        const blob = new Blob([JSON.stringify(store)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `하루기록-${keyOf(today)}.json`; a.click();
        URL.revokeObjectURL(a.href);
    };
    $('bImport').onclick = () => $('jsonPick').click();
    $('bReset').onclick = () => {
        if(!confirm('즐겨찾기 목록과 기본 가격을 처음 상태로 되돌릴까요? (기록은 그대로예요)')) return;
        store.favs = null; store.customLogos = {}; save(); closeSheet(); render(); toast('즐겨찾기를 초기화했어요');
    };
};
/* 계정 시트: 로그인 · 로그아웃 */
$('syncBtn').onclick = () => {
    if(!db) return toast('서버에 연결할 수 없어요 (인터넷 확인)');
    if(!user){
        $('sheet').innerHTML = `<div class="grab"></div><h3>로그인</h3>
            <p style="font-size:14px;color:var(--muted);line-height:1.6;text-align:center;margin-bottom:16px">팀 계정으로 로그인하면 기록이 서버에 저장되고<br>폰과 PC에서 실시간으로 같이 보여요.</p>
            <form id="loginForm">
                <div class="field">
                    <label><span>이메일</span><input type="email" id="lEmail" autocomplete="username" required></label>
                    <label><span>비밀번호</span><input type="password" id="lPw" autocomplete="current-password" required></label>
                </div>
                <p id="lErr" style="color:var(--postbox);font-size:13px;text-align:center;margin-top:10px;min-height:16px"></p>
                <div class="actions" style="margin-top:6px">
                    <button type="button" class="btn" id="lCancel">취소</button>
                    <button type="submit" class="btn primary" id="lGo">로그인</button>
                </div>
            </form>`;
        openSheet();
        $('lCancel').onclick = closeSheet;
        $('loginForm').onsubmit = async e => {
            e.preventDefault();
            $('lGo').disabled = true; $('lErr').textContent = '';
            const { error } = await db.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPw').value });
            $('lGo').disabled = false;
            if(error){ $('lErr').textContent = '이메일 또는 비밀번호가 맞지 않아요'; return; }
            closeSheet(); toast('로그인했어요 · 서버와 맞추는 중');
        };
        return;
    }
    const pending = Object.values(store.meta).filter(m => m.dirty).length;
    $('sheet').innerHTML = `<div class="grab"></div><h3>계정</h3>
        <div class="field"><label><span>계정</span><b style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(user.email||'')}</b></label>
        <label><span>상태</span>${{ ok:'서버에 저장됨', syncing:'저장 중…', error:'서버 연결 안 됨', off:'' }[syncState]}${pending ? ` · 올릴 기록 ${pending}개` : ''}</label></div>
        <div class="actions">
            <button class="btn" id="aSync">지금 맞추기</button>
            <button class="btn danger" id="aOut">로그아웃</button>
        </div>`;
    openSheet();
    $('aSync').onclick = () => { closeSheet(); pull(); };
    $('aOut').onclick = async () => {
        const left = Object.values(store.meta).filter(m => m.dirty).length;
        if(left && !confirm(`아직 서버에 안 올라간 기록이 ${left}개 있어요. 그래도 로그아웃할까요?`)) return;
        await db.auth.signOut();
        // 서버에 다 있으니 이 기기 기록은 비움 (다른 사람이 이 기기를 쓸 수도 있어서)
        store = { days:{}, favs:null, customLogos:{}, meta:{} };
        persist(); closeSheet(); render(); toast('로그아웃했어요');
    };
};

$('jsonPick').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    try{
        const s = JSON.parse(await f.text());
        if(!s.days) throw 0;
        if(!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?')) return;
        s.meta ||= {}; s.owner = user?.id || s.owner; store = s; save(); closeSheet(); render(); toast('복원했어요');
    }catch(err){ toast('올바른 백업 파일이 아니에요'); }
};

/* ════════════════════════════════════════════ */
function render(){
    renderCalendar();
    renderHead();
    renderTabs();
    ({ money:renderMoney, goal:renderGoals, event:renderEvents, mood:renderMood, learn:renderLearn, thought:renderThought })[tab]();
}
markDirty(); persist();
render();
</script>
</body>
</html>
